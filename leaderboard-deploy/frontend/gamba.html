<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>NIKSI $1,500 LEADERBOARD</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body class="bg-[#0f172a] text-white">
<div id="root"></div>

<script type="text/babel">

function App() {
  const [players, setPlayers] = React.useState([]);
  const [prevPlayers, setPrevPlayers] = React.useState([]);
  const [timeLeft, setTimeLeft] = React.useState("");
  const [displayAmount, setDisplayAmount] = React.useState(0);

  const raceEnd = new Date("2026-04-03T01:00:00");

  // Prize animation
  React.useEffect(() => {
    const startTime = Date.now();
    const duration = 1500;
    const end = 1500;

    const timer = setInterval(() => {
      const now = Date.now();
      const progress = Math.min((now - startTime) / duration, 1);
      setDisplayAmount(Math.floor(progress * end));

      if (progress === 1) clearInterval(timer);
    }, 16);

    return () => clearInterval(timer);
  }, []);

  // Timer
  React.useEffect(() => {

  const updateTimer = () => {
    const now = Date.now();
    const diff = raceEnd - now;

    if (diff <= 0) {
      setTimeLeft("Race Ended");
      return;
    }

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    setTimeLeft(`${d}d ${h}h ${m}m ${s}s`);
  };

  // ✅ Run immediately
  updateTimer();

  // ✅ Then run every second
  const timer = setInterval(updateTimer, 1000);

  return () => clearInterval(timer);

}, []);

  // Fetch players
  const fetchPlayers = async () => {
    const res = await fetch("/players");
    const data = await res.json();
    setPrevPlayers(players);
    setPlayers(data);
  };

  React.useEffect(() => {
    fetchPlayers();
    const interval = setInterval(fetchPlayers, 10000);
    return () => clearInterval(interval);
  }, []);

  return (
    <div className="min-h-screen">

      {/* HERO */}
      <div className="py-20 px-6 bg-gradient-to-b from-[#111827] to-[#0f172a]">
        <div className="max-w-5xl mx-auto text-center">

          {/* MENU */}
          <div className="flex justify-center mb-8">
            <nav className="flex gap-10 px-8 py-4 bg-white/5 border border-white/10 rounded-2xl">
              <a href="/" className="text-sm text-white/70 hover:text-white">HOME</a>
              <a href="/giveaway.html" className="text-sm text-white/70 hover:text-white">GIVEAWAY</a>
            </nav>
          </div>

          {/* SOCIALS */}
          <div className="flex justify-center gap-6 mb-8">
            <a href="https://kick.com/niksi777" target="_blank">
              <img src="https://cdn.simpleicons.org/kick/22c55e" className="h-8" />
            </a>
            <a href="https://discord.gg/NU9b4xRMqD" target="_blank">
              <img src="https://cdn.simpleicons.org/discord/5865F2" className="h-8" />
            </a>
            <a href="https://x.com/code_niksi777" target="_blank">
              <img src="https://cdn.simpleicons.org/x/ffffff" className="h-8" />
            </a>
          </div>

          {/* LOGO */}
          <img src="/assets/gamba2.png" className="h-12 mx-auto opacity-90" />

          {/* TIMER */}
          <div className="mt-4 text-sm text-gray-400">
            ENDS IN <span className="text-green-400">{timeLeft}</span>
          </div>

        </div>
      </div>

      {/* CONTENT */}
      <div className="max-w-5xl mx-auto px-6 pb-24">

        <div className="bg-[#111827] border border-white/10 rounded-3xl p-10 shadow-2xl relative">

          {/* BUTTONS */}
          <div className="absolute top-6 left-6">
            <a href="https://gamba.com?c=niksi" target="_blank"
               className="bg-green-400 text-black px-4 py-2 rounded-xl text-sm">
              Sign Up
            </a>
          </div>

          <div className="absolute top-6 right-6">
            <a href="https://gamba.com/promotions/exclusive-leaderboards/9674" target="_blank"
               className="bg-white text-black px-4 py-2 rounded-xl text-sm">
              VIEW ON GAMBA
            </a>
          </div>

          {/* PRIZE */}
          <div className="mb-12 text-center">
            <div className="text-5xl font-bold text-green-400 font-mono min-w-[200px] mx-auto">
              ${displayAmount.toLocaleString("en-US")}
            </div>

            <div className="text-sm text-gray-400 tracking-widest mt-2">
              TOTAL PRIZEPOOL
            </div>
          </div>

          {/* TABLE */}
          <div className="space-y-4">

            <div className="grid grid-cols-3 text-gray-400 text-sm border-b pb-3">
              <div>PLAYER</div>
              <div className="text-center">PRIZE</div>
              <div className="text-right">WAGER</div>
            </div>

            {players.slice(0, 15).map((p, i) => {

              let glowClass = "bg-white/5";

              if (i === 0) glowClass = "bg-yellow-500/10";
              if (i === 1) glowClass = "bg-gray-400/10";
              if (i === 2) glowClass = "bg-orange-500/10";

              return (
                <div key={p.id}
                  className={`grid grid-cols-3 items-center ${glowClass} rounded-xl px-5 py-4`}>

                  <div className="flex gap-2">
                    {i === 0 ? "👑" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}.`}
                    {p.username}
                  </div>

                  <div className="text-center">
  {new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(Number(p.reward))}
</div>

<div className="text-right">
  {new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(Number(p.wager))}
</div>

                </div>
              );
            })}

          </div>

        </div>

      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
