<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>NIKSI $1,500 LEADERBOARD</title>

  <style>
    @keyframes gradientMove {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-30px, 30px); }
    }

    .animate-gradientMove {
      animation: gradientMove 12s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .animate-float {
      animation: float 8s ease-in-out infinite;
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body class="bg-[#020617] text-white min-h-screen flex flex-col relative overflow-x-hidden">

<!-- BACKGROUND -->
<div class="fixed inset-0 -z-10 animate-gradientMove
  bg-[radial-gradient(circle_at_20%_20%,rgba(34,197,94,0.15),transparent_40%),
      radial-gradient(circle_at_80%_0%,rgba(59,130,246,0.12),transparent_40%)]">
</div>

<!-- LOGO WATERMARK -->
<div class="fixed inset-0 -z-10 flex items-center justify-center pointer-events-none">
  <img src="/assets/niksi.png"
      class="w-[500px] opacity-[0.05] blur-[1px] animate-float"
      draggable="false" />
</div>

<div id="root" class="flex-grow relative z-10"></div>

<script type="text/babel">

function App() {
  const [players, setPlayers] = React.useState([]);
  const [timeLeft, setTimeLeft] = React.useState("");
  const [displayAmount, setDisplayAmount] = React.useState(0);

  const totalWager = players.reduce((sum, p) => {
    return sum + Number(p.wager || 0);
  }, 0);

  const raceEnd = new Date("2026-04-03T01:00:00");

  React.useEffect(() => {
    const startTime = Date.now();
    const duration = 1500;
    const end = 1500;

    const timer = setInterval(() => {
      const now = Date.now();
      const progress = Math.min((now - startTime) / duration, 1);
      setDisplayAmount(Math.floor(progress * end));
      if (progress === 1) clearInterval(timer);
    }, 16);

    return () => clearInterval(timer);
  }, []);

  React.useEffect(() => {
    const updateTimer = () => {
      const now = Date.now();
      const diff = raceEnd - now;

      if (diff <= 0) {
        setTimeLeft("Race Ended");
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const m = Math.floor((diff / (1000 * 60)) % 60);
      const s = Math.floor((diff / 1000) % 60);

      setTimeLeft(`${d}d ${h}h ${m}m ${s}s`);
    };

    updateTimer();
    const timer = setInterval(updateTimer, 1000);
    return () => clearInterval(timer);
  }, []);

  const fetchPlayers = async () => {
    const res = await fetch("/players");
    const data = await res.json();
    setPlayers(data);
  };

  React.useEffect(() => {
    fetchPlayers();
    const interval = setInterval(fetchPlayers, 10000);
    return () => clearInterval(interval);
  }, []);

  return (
    <div>

      {/* NAVBAR */}
      <div className="fixed top-0 left-0 w-full z-50 flex justify-center py-4">
        <div className="flex items-center gap-8 px-8 py-3
                        bg-white/5 backdrop-blur-xl
                        border border-white/10
                        rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.5)]">

          <a href="/" className="flex items-center">
            <img
              src="/assets/niksi.png"
              className="h-8 object-contain opacity-90 hover:opacity-100 transition"
            />
          </a>

          <a href="/" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
            HOME
          </a>

          <div className="relative group">
            <a href="/leaderboards.html"
              className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
              LEADERBOARDS
            </a>

            <div className="absolute left-1/2 -translate-x-1/2 mt-3 w-40
                            opacity-0 invisible group-hover:opacity-100 group-hover:visible
                            transition-all duration-200">

              <div className="bg-[#020617]/95 backdrop-blur-xl border border-white/10
                              rounded-xl shadow-lg p-2">
                <a href="/gamba.html"
                  className="block px-3 py-2 text-sm text-white/70 hover:text-white hover:bg-white/5 rounded-lg transition">
                  $1,500 GAMBA LEADERBOARD
                </a>

                <a href="/acebet.html"
                  className="block px-3 py-2 text-sm text-white/70 hover:text-white hover:bg-white/5 rounded-lg transition">
                  ACEBET
                </a>
              </div>
            </div>
          </div>

          <a href="/giveaway.html" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
            GIVEAWAY
          </a>

          <div className="flex items-center gap-4 ml-2">
            <a href="https://kick.com/niksi777" target="_blank">
              <img src="https://cdn.simpleicons.org/kick/22c55e"
                className="h-5 opacity-70 hover:opacity-100 transition" />
            </a>

            <a href="https://discord.com/invite/Gnyv25SHg7" target="_blank">
              <img src="https://cdn.simpleicons.org/discord/5865F2"
                className="h-5 opacity-70 hover:opacity-100 transition" />
            </a>

            <a href="https://x.com/code_niksi777" target="_blank">
              <img src="https://cdn.simpleicons.org/x/ffffff"
                className="h-5 opacity-70 hover:opacity-100 transition" />
            </a>
          </div>
        </div>
      </div>

      {/* HERO */}
      <div className="pt-28 pb-20 px-6">
        <div className="max-w-5xl mx-auto text-center">

          <img src="/assets/gamba2.png" className="h-12 mx-auto opacity-90" />

          <div className="mt-4 text-sm text-gray-400">
            ENDS IN <span className="text-green-400">{timeLeft}</span>
          </div>

        </div>
      </div>

      {/* CONTENT */}
      <div className="max-w-5xl mx-auto px-6 pb-10">

        <div className="bg-[#111827] border border-white/10 rounded-3xl p-10 shadow-2xl relative">

          <div className="absolute top-6 left-6">
            <a href="https://gamba.com?c=niksi" target="_blank"
               className="bg-green-400 text-black px-4 py-2 rounded-xl text-sm">
              Sign Up
            </a>
          </div>

          <div className="absolute top-6 right-6">
            <a href="https://gamba.com/promotions/exclusive-leaderboards/9674" target="_blank"
               className="bg-white text-black px-4 py-2 rounded-xl text-sm">
              VIEW ON GAMBA
            </a>
          </div>

          {/* PRIZE */}
          {/* PRIZE + WAGER */}
<div className="mb-12 text-center">

  {/* PRIZE */}
  <div className="text-sm text-gray-400 tracking-widest mb-2">
    TOTAL PRIZEPOOL
  </div>

  <div className="text-5xl font-bold text-green-400 font-mono">
    ${displayAmount.toLocaleString("en-US")}
  </div>

  {/* WAGER (restored) */}
  <div className="mt-6 opacity-80">

    <div className="text-xs text-gray-500 tracking-widest mb-1">
      TOTAL WAGER VOLUME
    </div>

    <div className="text-xl font-semibold text-blue-300 font-mono">
      {new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD"
      }).format(totalWager)}
    </div>

  </div>

</div>

          {/* TABLE */}
          <div className="space-y-4">

            <div className="grid grid-cols-3 text-gray-400 text-sm border-b pb-3">
              <div>PLAYER</div>
              <div className="text-center">PRIZE</div>
              <div className="text-right">WAGER</div>
            </div>

            {players.slice(0, 15).map((p, i) => {

              let glowClass = "bg-white/5";
              if (i === 0) glowClass = "bg-yellow-500/10";
              if (i === 1) glowClass = "bg-gray-400/10";
              if (i === 2) glowClass = "bg-orange-500/10";

              return (
                <div key={p.id}
                  className={`grid grid-cols-3 items-center ${glowClass} rounded-xl px-5 py-4`}>

                  <div className="flex gap-2">
                    {i === 0 ? "👑" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i+1}.`}
                    {p.username}
                  </div>

                  <div className="text-center">
                    {new Intl.NumberFormat("en-US", {
                      style: "currency",
                      currency: "USD"
                    }).format(Number(p.reward))}
                  </div>

                  <div className="text-right">
                    {new Intl.NumberFormat("en-US", {
                      style: "currency",
                      currency: "USD"
                    }).format(Number(p.wager))}
                  </div>

                </div>
              );
            })}

          </div>

        </div>

      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

<!-- FOOTER -->
<div class="border-t border-white/10 py-6 text-center px-6">

  <div class="max-w-4xl mx-auto mb-6 bg-[#062f2f]/60 border border-green-400/20 rounded-xl px-6 py-3 text-xs text-gray-300 flex items-center gap-4">

    <div class="text-green-400 text-lg">18+</div>

    <div class="text-left leading-relaxed">
      We are not responsible for any losses incurred from gambling on casino or betting platforms that may be linked or promoted on this website. All users participate at their own risk and are solely responsible for their actions and bets.
    </div>

  </div>

  <div class="text-gray-400 text-xs">
    © 2026 NIKSI777. All Rights Reserved.
  </div>

</div>

</body>
</html>
