<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIKSI777 - Gamba $1,500 Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#07080c;--s1:#0c0e14;--s2:#11131a;--s3:#151820;--b1:rgba(255,255,255,.05);--b2:rgba(255,255,255,.09);--b3:rgba(255,255,255,.16);--tx:#dde3ef;--mu:rgba(221,227,239,.75);--mu2:rgba(221,227,239,.85);--ac:#b8cce8;--rd:#d94f4f}
    html,body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 900px 600px at 0% 0%,rgba(140,170,210,.04),transparent 60%),radial-gradient(ellipse 600px 600px at 100% 100%,rgba(110,140,190,.03),transparent 60%)}
    @keyframes pu{0%,100%{opacity:1}50%{opacity:.15}}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .f1{animation:fu .5s ease both}.f2{animation:fu .5s .1s ease both}.f3{animation:fu .5s .22s ease both}.f4{animation:fu .5s .34s ease both}

    nav{background:rgba(7,8,12,.97);border-bottom:1px solid var(--b2);position:sticky;top:0;z-index:50}
    .ni{max-width:1020px;margin:0 auto;padding:0 28px;display:flex;align-items:center;height:56px}
    .nlogo{display:flex;align-items:center;gap:10px;padding-right:22px;border-right:1px solid var(--b2);margin-right:18px;flex-shrink:0;text-decoration:none}
    .nlogo img{height:28px;width:28px;border-radius:50%;object-fit:cover}
    .nname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.16em;color:#fff;text-transform:uppercase}
    .nlinks{display:flex;align-items:center;flex:1}
    .nlinks a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:0 13px;height:56px;display:flex;align-items:center;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;margin-bottom:-1px}
    .nlinks a:hover{color:rgba(255,255,255,.9)}
    .nlinks a.on{color:#fff;border-bottom-color:rgba(255,255,255,.5)}
    .nsoc{margin-left:auto;display:flex;align-items:center;gap:2px;padding-left:16px;border-left:1px solid var(--b2)}
    .nsoc a{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;opacity:.5;transition:opacity .15s}
    .nsoc a:hover{opacity:1;background:rgba(255,255,255,.05)}
    .nsoc svg{width:15px;height:15px}
    .nauth{display:flex;align-items:center;gap:8px;padding-left:12px;margin-left:auto}
    .nlogin-btn{display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:7px;background:#22c55e;color:#fff;border:none;cursor:pointer;transition:opacity .15s;text-decoration:none;white-space:nowrap;flex-shrink:0}
    .nlogin-btn:hover{opacity:.85}
    .nuser{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:7px;background:var(--s1);border:1px solid var(--b2)}

    .nuser-name{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--tx)}
    .nuser-pts{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#d4af5a}
    .ndrop{position:relative}
    .ndrop-menu{display:none;position:absolute;top:100%;right:0;padding-top:6px;z-index:200;min-width:150px}
    .ndrop:hover .ndrop-menu{display:block}
    .ndrop-box{background:rgba(7,8,12,.97);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
    .ndrop-item{display:block;width:100%;text-align:left;padding:9px 14px;font-size:12px;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(221,227,239,.75);text-decoration:none;background:none;border:none;cursor:pointer;border-radius:6px;transition:background .1s;box-sizing:border-box}

    .hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:32px;height:32px;cursor:pointer;margin-left:auto;padding:4px;background:none;border:none}
    .hamburger span{display:block;height:1.5px;background:rgba(255,255,255,.6);border-radius:2px;transition:all .2s}
    .drawer{display:none;flex-direction:column;background:rgba(7,8,12,.99);border-bottom:1px solid var(--b2);padding:10px 28px 18px}
    .drawer.open{display:flex}
    .drawer a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--b1);transition:color .15s}

    .phead-toprow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .phead-eyebrow{display:inline-flex;align-items:center;gap:7px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);border:1px solid rgba(184,204,232,.15);padding:4px 12px;border-radius:100px}

    .pbtns{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .pbtn{display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;border-radius:7px;text-decoration:none;white-space:nowrap;transition:opacity .15s}
    .pbtn:hover{opacity:.82}
    .pbtn-pri{background:#fff;color:#07080c}
    .pbtn-sec{background:transparent;color:var(--mu2);border:1px solid var(--b2)}

    .gamba-logo{max-height:60px;max-width:280px;object-fit:contain;display:block;margin:0 auto}
    .phead-sub{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}

    /* STATS */
    .statsbar{background:var(--s1);border:1px solid var(--b1);border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:28px}
    .stat{padding:20px 24px;border-right:1px solid var(--b1);text-align:center}
    .stat:last-child{border-right:none}
    .stat-lbl{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
    .stat-val{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:.01em;color:#fff;line-height:1}

    /* PODIUM */
    .podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;align-items:end}
    .pcard{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;position:relative;overflow:hidden}

    .pcard.p1{--pline:rgba(212,175,90,.6);border-color:rgba(212,175,90,.2);padding-top:24px;padding-bottom:24px}
    .pcard.p2{--pline:rgba(154,170,184,.4);border-color:rgba(154,170,184,.15)}
    .pcard.p3{--pline:rgba(160,113,74,.4);border-color:rgba(160,113,74,.15)}
    .prank{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
    .p1 .prank{color:#d4af5a}.p2 .prank{color:#9aaab8}.p3 .prank{color:#a0714a}
    .pavatar{border-radius:50%;object-fit:cover;border:2px solid var(--b2);flex-shrink:0;background:var(--s3);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;color:var(--mu)}
    .puname{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pstat{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:7px;padding:8px 10px;text-align:center}
    .pstat-lbl{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:3px}
    .pstat-val{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:#fff;letter-spacing:.02em}
    .p1 .pstat-val.rw{color:#d4af5a;font-size:20px}
    .p2 .pstat-val.rw{color:#9aaab8}.p3 .pstat-val.rw{color:#a0714a}

    .sdiv{display:flex;align-items:center;gap:14px;margin:28px 0 18px}
    .sdl{flex:1;height:1px;background:var(--b2)}
    .sdlbl{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);white-space:nowrap}

    .lbtable{border:1px solid var(--b1);border-radius:12px;overflow:hidden;margin-bottom:56px}
    .lbhead{display:grid;grid-template-columns:52px 36px 1fr auto auto;gap:14px;align-items:center;padding:10px 20px;background:var(--s2);border-bottom:1px solid var(--b1)}
    .lbh{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
    .lbrow{display:grid;grid-template-columns:52px 36px 1fr auto auto;gap:14px;align-items:center;padding:14px 20px;background:var(--s1);border-bottom:1px solid var(--b1);transition:background .15s}
    .lbrow:last-child{border-bottom:none}
    .lbrow:hover{background:var(--s2)}
    .lbrk{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em;text-align:center;color:var(--mu)}
    .lbav{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--b2);flex-shrink:0;background:var(--s3);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;color:var(--mu)}
    .lbnm{font-size:13px;font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .lbwg{font-family:'Inter',sans-serif;font-size:12px;font-weight:400;color:var(--mu);text-align:right;white-space:nowrap}
    .lbrw{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:#fff;text-align:right;white-space:nowrap;min-width:52px}

    footer{border-top:1px solid var(--b1);padding:22px 0}
    .ftw{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .ftd{font-size:12px;line-height:1.6;color:var(--mu);max-width:500px}
    .ftd strong{color:rgba(221,227,239,.9)}
    .ftc{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);white-space:nowrap}

    @media(max-width:700px){
      .nlinks,.nsoc{display:none}
      .hamburger{display:flex}
      .nlogo{border-right:none;margin-right:0;padding-right:0}
      .phead{padding:32px 0 24px}
      .pbtns{gap:6px}
      .pbtn{padding:8px 12px;font-size:10px}
      .statsbar{grid-template-columns:1fr}
      .stat{border-right:none;border-bottom:1px solid var(--b1)}
      .stat:last-child{border-bottom:none}
      .podium{gap:8px}
      .lbhead,.lbrow{grid-template-columns:40px 30px 1fr auto;gap:8px;padding:10px 14px}
      .lbwg{display:none}
      .ftw{flex-direction:column;align-items:flex-start}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

  const RACE_END   = new Date("2026-05-30T23:00:00Z");
  const RACE_START = new Date("2026-05-17T02:00:00Z");
  const PRIZE      = 1500;

  function fmtMoney(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(Number(n)||0)}
  function fmtCD(target){
    const ms=target-Date.now(); if(ms<=0)return"Race Ended";
    const d=Math.floor(ms/86400000),h=Math.floor(ms/3600000%24),m=Math.floor(ms/60000%60),s=Math.floor(ms/1000%60);
    return d>0?`${d}d ${h}h ${m}m ${s}s`:`${h}h ${m}m ${s}s`;
  }
  function useCountdown(target){
    const [v,setV]=React.useState(()=>fmtCD(target));
    React.useEffect(()=>{const id=setInterval(()=>setV(fmtCD(target)),1000);return()=>clearInterval(id);},[]);
    return v;
  }
  function useAnimNum(target,dur=1400){
    const [v,setV]=React.useState(0);
    React.useEffect(()=>{
      const t0=Date.now();
      const id=setInterval(()=>{const p=Math.min((Date.now()-t0)/dur,1);setV(Math.floor((1-Math.pow(1-p,3))*target));if(p>=1)clearInterval(id);},16);
      return()=>clearInterval(id);
    },[target]);
    return v;
  }
  function usePlayers(){
    const [players,setPlayers]=React.useState([]);
    React.useEffect(()=>{
      const go=async()=>{try{const r=await fetch("/players");setPlayers(await r.json());}catch(e){}};
      go(); const id=setInterval(go,60000); return()=>clearInterval(id);
    },[]);
    return players;
  }

  function Avatar({src,name,size=32}){
    const [err,setErr]=React.useState(false);
    const initials=(name||"?").slice(0,2).toUpperCase();
    if(!src||err) return <div className="lbav" style={{width:size,height:size}}>{initials}</div>;
    return <img className="lbav" src={src} alt={name} style={{width:size,height:size}} onError={()=>setErr(true)}/>;
  }

  const SOCIALS = <>
    <a href="https://kick.com/niksi777" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" fill="none"><path d="M3 3h4v5.5L11 3h5l-5.5 6.5L16 15h-5l-4-4.5V15H3V3z" fill="#22c55e"/></svg></a>
    <a href="https://discord.com/invite/Gnyv25SHg7" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.464-.674.86-1.339 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128c.126-.094.247-.192.372-.292a.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg></a>
    <a href="https://x.com/code_niksi777" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63z"/></svg></a>

  function useSession(){
    const [user,setUser]=React.useState(null);
    const [sessionId,setSessionId]=React.useState(null);
    React.useEffect(()=>{
      const params=new URLSearchParams(window.location.search);
      const sid=params.get('session')||localStorage.getItem('kick_session');
      if(sid){
        localStorage.setItem('kick_session',sid);
        setSessionId(sid);
        fetch('/auth/me?session='+sid).then(r=>r.ok?r.json():null).then(d=>{if(d)setUser(d);else localStorage.removeItem('kick_session');}).catch(()=>{});
        if(params.get('session'))window.history.replaceState({},'',window.location.pathname);
      }
    },[]);
    function logout(){const sid=localStorage.getItem('kick_session');if(sid)fetch('/auth/logout?session='+sid);localStorage.removeItem('kick_session');setUser(null);setSessionId(null);}
    return {user,sessionId,logout};
  }

  function Navbar(){

    const [open,setOpen]=React.useState(false);
        return (<>
      <nav>

                    <button onClick={logout} style={{display:'block',width:'100%',textAlign:'left',padding:'9px 14px',fontSize:12,fontFamily:"'Inter',sans-serif",fontWeight:500,letterSpacing:'.08em',textTransform:'uppercase',color:'rgba(217,79,79,.8)',background:'none',border:'none',cursor:'pointer',borderRadius:6}} onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,.06)'} onMouseLeave={e=>e.currentTarget.style.background='none'}>Logout</button>

                <svg viewBox="0 0 24 24" fill="none" style={{width:13,height:13}}><path d="M3 3h4v5.5L11 3h5l-5.5 6.5L16 15h-5l-4-4.5V15H3V3z" fill="#fff"/></svg>

      </nav>
      <div className={`drawer${open?' open':''}`}>

        <a href="/points">POINTS</a>

        {user && user.isAdmin && <a href="/giveaway">GIVEAWAY</a>}

        {user ? <a href="/settings">Settings</a> : <a href="/auth/login">Login with Kick</a>}
      </div>
    </>);
  }

  function App(){
    const players    = usePlayers();
    const timer      = useCountdown(RACE_END);
    const prizeAnim  = useAnimNum(PRIZE);
    const wagerAnim  = useAnimNum(players.reduce((s,p)=>s+Number(p.wager||0),0), 1600);
    const top3       = players.slice(0,3);
    const rest       = players.slice(3,15);
    const podium     = [1,0,2].map(i=>top3[i]?{...top3[i],rank:i+1}:null).filter(Boolean);
    const rankCls    = {1:"p1",2:"p2",3:"p3"};
    const rankLbls   = ["1st Place","2nd Place","3rd Place"];

    return (<>
      <Navbar/>
      <div className="wrap">

        <div className="phead f1">
          <div className="phead-toprow">
            <div className="phead-eyebrow"><span className="pdot"/>Gamba.com - Live Race</div>
            <div className="pbtns">
              <a href="https://gamba.com?c=niksi" target="_blank" rel="noreferrer" className="pbtn pbtn-sec">Sign Up</a>
              <a href="https://gamba.com/promotions/exclusive-leaderboards/12640" target="_blank" rel="noreferrer" className="pbtn pbtn-pri">
                View on Gamba
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{width:11,height:11}}><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
              </a>
            </div>
          </div>
          <img className="gamba-logo" src="/assets/gamba2.png" alt="Gamba"/>
          <div className="phead-sub">$1,500 Wager Race</div>
        </div>

        <div className="statsbar f2">
          <div className="stat"><div className="stat-lbl">Prize Pool</div><div className="stat-val">${prizeAnim.toLocaleString("en-US")}</div></div>
          <div className="stat"><div className="stat-lbl">Total Wagered</div><div className="stat-val">{fmtMoney(wagerAnim)}</div></div>
          <div className="stat"><div className="stat-lbl">Ends In</div><div className="stat-val">{timer}</div></div>
        </div>

        {podium.length>0 && (
          <div className="podium f3">
            {podium.map(p=>(
              <div key={p.id} className={`pcard ${rankCls[p.rank]}`}>
                <div className="prank">{rankLbls[p.rank-1]}</div>
                <Avatar src={p.avatar} name={p.username} size={p.rank===1?64:48}/>
                <div className="puname">{p.username}</div>
                <div className="pstat"><div className="pstat-lbl">Wagered</div><div className="pstat-val">{fmtMoney(p.wager)}</div></div>
                <div className="pstat"><div className="pstat-lbl">Prize</div><div className="pstat-val rw">{fmtMoney(p.reward)}</div></div>
              </div>
            ))}
          </div>
        )}

        {rest.length>0 && (<>
          <div className="sdiv f4"><div className="sdl"/><span className="sdlbl">Positions 4–15</span><div className="sdl"/></div>
          <div className="lbtable f4">
            <div className="lbhead">
              <div className="lbh" style={{textAlign:'center'}}>#</div>
              <div className="lbh"/>
              <div className="lbh">Player</div>
              <div className="lbh" style={{textAlign:'right'}}>Wagered</div>
              <div className="lbh" style={{textAlign:'right'}}>Prize</div>
            </div>
            {rest.map((p,i)=>(
              <div key={p.id} className="lbrow">
                <div className="lbrk">#{i+4}</div>
                <Avatar src={p.avatar} name={p.username} size={32}/>
                <div className="lbnm">{p.username}</div>
                <div className="lbwg">{fmtMoney(p.wager)}</div>
                <div className="lbrw">{fmtMoney(p.reward)}</div>
              </div>
            ))}
          </div>
        </>)}

        {players.length===0 && (
          <div className="f3" style={{textAlign:'center',padding:'64px 0',fontFamily:"'Inter',sans-serif",fontSize:12,fontWeight:500,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--mu)'}}>
            Loading leaderboard...
          </div>
        )}
      </div>

      <footer>
        <div className="wrap">
          <div className="ftw">
            <p className="ftd"><strong>18+</strong> - We are not responsible for any losses incurred from gambling on casino or betting platforms linked or promoted on this site. All users participate at their own risk.</p>
            <div style={{display:'flex',alignItems:'center',gap:4}}>
              <div className="nsoc" style={{border:'none',padding:0}}>{SOCIALS}</div>
              <span className="ftc" style={{marginLeft:8}}>© 2026 NIKSI777</span>
            </div>
          </div>
        </div>
      </footer>
    </>);
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
