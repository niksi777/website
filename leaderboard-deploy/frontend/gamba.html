<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Gamba Leaderboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body class="bg-black text-white">
<div id="root"></div>

<script type="text/babel">

function App() {

  const [players, setPlayers] = React.useState([]);
  const [endTime, setEndTime] = React.useState(null);
  const [timeLeft, setTimeLeft] = React.useState("");

  const fetchData = async () => {
    const res = await fetch("/players");
    const data = await res.json();
    setPlayers(data);
  };

  React.useEffect(() => {
    fetchData();
    const interval = setInterval(fetchData, 10000);
    return () => clearInterval(interval);
  }, []);

  // ⬇️ TIMER SYNC (using hardcoded end date for now — next we sync from backend)
  React.useEffect(() => {
    const raceEnd = new Date("2026-03-03T23:59:59Z").getTime();
    setEndTime(raceEnd);
  }, []);

  React.useEffect(() => {
    if (!endTime) return;

    const timer = setInterval(() => {
      const diff = endTime - Date.now();
      if (diff <= 0) {
        setTimeLeft("ENDED");
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const m = Math.floor((diff / (1000 * 60)) % 60);
      const s = Math.floor((diff / 1000) % 60);

      setTimeLeft(`${d}D ${h}H ${m}M ${s}S`);
    }, 1000);

    return () => clearInterval(timer);
  }, [endTime]);

  return (
    <div className="min-h-screen px-8 py-16">

      <div className="text-center mb-16">
        <h1 className="text-4xl font-light mb-4">
          $500 Gamba Leaderboard
        </h1>
        <div className="text-2xl font-semibold tracking-wide">
          {timeLeft}
        </div>
      </div>

      <div className="max-w-4xl mx-auto">

        <div className="grid grid-cols-3 text-sm uppercase tracking-widest opacity-40 mb-6">
          <div>Name</div>
          <div className="text-center">Reward</div>
          <div className="text-right">Wager</div>
        </div>

        {players.slice(0,10).map(p => (
          <div key={p.id}
               className="grid grid-cols-3 py-4 border-b border-white/10">

            <div>{p.position}. {p.username}</div>

            <div className="text-center font-semibold">
              ${Number(p.reward).toFixed(2)}
            </div>

            <div className="text-right font-semibold">
              {new Intl.NumberFormat("en-US", {
                style: "currency",
                currency: "USD",
                minimumFractionDigits: 0
              }).format(p.wager)}
            </div>

          </div>
        ))}

      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
