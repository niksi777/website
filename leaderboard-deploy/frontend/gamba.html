<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>NIKSI $1,500 LEADERBOARD</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body class="bg-[#0f172a] text-white min-h-screen flex flex-col">

<div id="root" class="flex-grow"></div>

<script type="text/babel">

function App() {
  const [players, setPlayers] = React.useState([]);
  const [timeLeft, setTimeLeft] = React.useState("");
  const [displayAmount, setDisplayAmount] = React.useState(0);

  const totalWager = players.reduce((sum, p) => {
    return sum + Number(p.wager || 0);
  }, 0);

  const raceEnd = new Date("2026-05-02T00:00:00Z");

  React.useEffect(() => {
    const startTime = Date.now();
    const duration = 1500;
    const end = 1500;

    const timer = setInterval(() => {
      const now = Date.now();
      const progress = Math.min((now - startTime) / duration, 1);
      setDisplayAmount(Math.floor(progress * end));
      if (progress === 1) clearInterval(timer);
    }, 16);

    return () => clearInterval(timer);
  }, []);

  React.useEffect(() => {
    const updateTimer = () => {
      const now = Date.now();
      const diff = raceEnd - now;

      if (diff <= 0) {
        setTimeLeft("Race Ended");
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const m = Math.floor((diff / (1000 * 60)) % 60);
      const s = Math.floor((diff / 1000) % 60);

      if (d > 0) {
        setTimeLeft(`${d}d ${h}h ${m}m ${s}s`);
      } else {
        setTimeLeft(`${h}h ${m}m ${s}s`);
}
    };

    updateTimer();
    const timer = setInterval(updateTimer, 1000);
    return () => clearInterval(timer);
  }, []);

  const fetchPlayers = async () => {
    const res = await fetch("/players");
    const data = await res.json();
    setPlayers(data);
  };

  React.useEffect(() => {
    fetchPlayers();
    const interval = setInterval(fetchPlayers, 60000);
    return () => clearInterval(interval);
  }, []);

  const topThree = players.slice(0, 3);
  const podiumOrder = [1, 0, 2]
    .map((index) => {
      const player = topThree[index];
      if (!player) return null;
      return { ...player, rank: index + 1 };
    })
    .filter(Boolean);
  const restPlayers = players.slice(3, 15);

  return (
    <div>

      {/* NAVBAR */}
<div className="fixed top-0 left-0 w-full z-50 flex justify-center py-4">
  <div className="flex items-center gap-8 px-8 py-3 
                  bg-white/5 backdrop-blur-xl
                  border border-white/10
                  rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.5)]">

    {/* LOGO */}
    <a href="/" className="flex items-center">
      <img 
        src="/assets/niksi.png"
        className="h-8 object-contain opacity-90 hover:opacity-100 transition"
      />
    </a>

    {/* LINKS */}
    <a href="/" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
      HOME
    </a>
    <a 
      href="/leaderboards.html" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">LEADERBOARDS
    </a>
    <a href="/giveaway.html" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
      GIVEAWAY
    </a>

    {/* SOCIAL ICONS */}
    <div className="flex items-center gap-4 ml-2">

      <a href="https://kick.com/niksi777" target="_blank" className="hover:scale-110 transition duration-300">
        <img src="https://cdn.simpleicons.org/kick/22c55e"
             className="h-5 opacity-70 hover:opacity-100" />
      </a>

      <a href="https://discord.com/invite/Gnyv25SHg7" target="_blank" className="hover:scale-110 transition duration-300">
        <img src="https://cdn.simpleicons.org/discord/5865F2"
             className="h-5 opacity-70 hover:opacity-100" />
      </a>

      <a href="https://x.com/code_niksi777" target="_blank" className="hover:scale-110 transition duration-300">
        <img src="https://cdn.simpleicons.org/x/ffffff"
             className="h-5 opacity-70 hover:opacity-100" />
      </a>

    </div>

  </div>
</div>

      {/* CONTENT */}
      <div className="max-w-5xl mx-auto px-6 pt-28 pb-10">

        <div className="bg-[#111827] border border-white/10 rounded-3xl p-10 shadow-2xl relative">
          {/* HEADER INSIDE BOX */}
          <div className="text-center mb-8">
            <img src="/assets/gamba2.png" className="h-12 mx-auto opacity-90" />
          </div>

          <div className="absolute top-5 left-5">
            <a href="https://gamba.com?c=niksi" target="_blank"
               className="bg-green-400 text-black px-4 py-2 rounded-xl text-sm">
              Sign Up
            </a>
          </div>

          <div className="absolute top-5 right-5">
            <a href="https://gamba.com/promotions/exclusive-leaderboards/11287" target="_blank"
               className="bg-white text-black px-4 py-2 rounded-xl text-sm">
              VIEW ON GAMBA
            </a>
          </div>

          {/* PRIZE */}
          {/* PRIZE + WAGER */}
<div className="mb-10 text-center">

  {/* PRIZE */}
  <div className="text-sm text-gray-400 tracking-widest mb-2">
    TOTAL PRIZEPOOL
  </div>

  <div className="text-5xl font-bold text-green-400 font-mono">
    ${displayAmount.toLocaleString("en-US")}
  </div>

  {/* WAGER (restored) */}
  <div className="mt-6 opacity-80">

    <div className="text-xs text-gray-500 tracking-widest mb-1">
      TOTAL WAGER VOLUME
    </div>

    <div className="text-xl font-semibold text-blue-300 font-mono">
      {new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD"
      }).format(totalWager)}
    </div>

  </div>

</div>

          {/* TOP 3 CARDS */}
          <div className="grid md:grid-cols-3 gap-4 mb-10 items-end">
            {podiumOrder.map((p) => {
              const rankText = p.rank === 1 ? "#1" : p.rank === 2 ? "#2" : "#3";
              const isFirst = p.rank === 1;
              const glow = p.rank === 1
                ? "border-yellow-400/60 shadow-[0_0_30px_rgba(250,204,21,0.25)]"
                : p.rank === 2
                ? "border-green-400/40 shadow-[0_0_24px_rgba(34,197,94,0.20)]"
                : "border-cyan-400/40 shadow-[0_0_24px_rgba(34,211,238,0.20)]";

              return (
                <div
                  key={p.id}
                  className={`bg-black/25 border rounded-2xl p-4 ${glow} ${isFirst ? "md:scale-[1.06] z-10" : "md:scale-[0.95]"}`}
                >
                  <div className={`text-center font-black italic text-green-400 mb-3 ${isFirst ? "text-4xl" : "text-3xl"}`}>
                    {rankText}
                  </div>

                  <img
                    src={p.avatar}
                    alt={p.username}
                    className={`${isFirst ? "w-20 h-20" : "w-16 h-16"} rounded-2xl mx-auto object-cover border border-white/20 mb-3`}
                  />

                  <div className={`text-center font-bold tracking-wide truncate mb-3 ${isFirst ? "text-base" : "text-sm"}`}>
                    {p.username}
                  </div>

                  <div className="rounded-xl bg-white/5 border border-white/10 p-3 text-center mb-2">
                    <div className="text-[10px] tracking-[0.2em] text-gray-400 mb-1">WAGERED</div>
                    <div className={`${isFirst ? "text-lg" : "text-base"} font-semibold`}>
                      {new Intl.NumberFormat("en-US", {
                        style: "currency",
                        currency: "USD"
                      }).format(Number(p.wager))}
                    </div>
                  </div>

                  <div className="rounded-xl bg-white/5 border border-white/10 p-3 text-center">
                    <div className="text-[10px] tracking-[0.2em] text-gray-500 mb-1">PRIZE</div>
                    <div className={`${isFirst ? "text-2xl" : "text-xl"} font-black text-green-400`}>
                      {new Intl.NumberFormat("en-US", {
                        style: "currency",
                        currency: "USD",
                        maximumFractionDigits: 0
                      }).format(Number(p.reward))}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* TIMER BETWEEN PODIUM AND TABLE */}
          <div className="mb-8 rounded-2xl bg-black/20 border border-white/10 p-4 text-center">
            <div className="text-xs tracking-[0.2em] text-gray-400 mb-1">ENDS IN</div>
            <div className="text-3xl font-black text-green-400 font-mono">
              {timeLeft}
            </div>
          </div>

          {/* REST OF TABLE */}
          <div className="space-y-3">
            <div className="grid grid-cols-3 text-gray-400 text-sm border-b border-white/10 pb-3">
              <div>USER</div>
              <div className="text-center">WAGERED</div>
              <div className="text-right">PRIZE</div>
            </div>

            {restPlayers.map((p, idx) => (
              <div
                key={p.id}
                className="grid grid-cols-3 items-center bg-black/20 border border-white/10 rounded-xl px-5 py-4"
              >
                <div className="flex items-center gap-3 min-w-0">
                  <div className="text-green-400 font-bold w-7 shrink-0">
                    #{idx + 4}
                  </div>

                  <img
                    src={p.avatar}
                    alt={p.username}
                    className="w-8 h-8 rounded-full object-cover border border-white/20 shrink-0"
                  />

                  <span className="truncate font-semibold">
                    {p.username}
                  </span>
                </div>

                <div className="text-center text-gray-200">
                  {new Intl.NumberFormat("en-US", {
                    style: "currency",
                    currency: "USD"
                  }).format(Number(p.wager))}
                </div>

                <div className="text-right text-green-400 font-bold">
                  {new Intl.NumberFormat("en-US", {
                    style: "currency",
                    currency: "USD",
                    maximumFractionDigits: 0
                  }).format(Number(p.reward))}
                </div>
              </div>
            ))}
          </div>

        </div>

      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

<!-- FOOTER -->
<div class="border-t border-white/10 py-6 text-center px-6">

  <div class="max-w-4xl mx-auto mb-6 bg-[#062f2f]/60 border border-green-400/20 rounded-xl px-6 py-3 text-xs text-gray-300 flex items-center gap-4">

    <div class="text-green-400 text-lg">18+</div>

    <div class="text-left leading-relaxed">
      We are not responsible for any losses incurred from gambling on casino or betting platforms that may be linked or promoted on this website. All users participate at their own risk and are solely responsible for their actions and bets.
    </div>

  </div>

  <div class="text-gray-400 text-xs">
    © 2026 NIKSI777. All Rights Reserved.
  </div>

</div>

</body>
</html>
