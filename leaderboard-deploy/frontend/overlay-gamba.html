<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

<style>
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseGlow {
  0%,100% { box-shadow: 0 0 10px rgba(250,204,21,0.4); }
  50% { box-shadow: 0 0 25px rgba(250,204,21,0.9); }
}

.fade-in {
  animation: fadeIn 0.6s ease forwards;
}

.pulse-gold {
  animation: pulseGlow 2s infinite;
}
</style>

</head>

<body class="bg-transparent text-white">
<div id="root"></div>

<script type="text/babel">

function App() {

  const [timeLeft, setTimeLeft] = React.useState("");

const raceEnd = new Date("2026-04-03T01:00:00");

React.useEffect(() => {

  const updateTimer = () => {
    const now = Date.now();
    const diff = raceEnd - now;

    if (diff <= 0) {
      setTimeLeft("ENDED");
      return;
    }

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    setTimeLeft(`${d}d ${h}h ${m}m ${s}s`);
  };

  updateTimer();
  const interval = setInterval(updateTimer, 1000);

  return () => clearInterval(interval);

}, []);

  const [players, setPlayers] = React.useState([]);

  React.useEffect(() => {
    const fetchData = () => {
      fetch("/players")
        .then(res => res.json())
        .then(data => setPlayers(data))
        .catch(err => console.log(err));
    };

    fetchData();
    const interval = setInterval(fetchData, 10000);
    return () => clearInterval(interval);
  }, []);

  const topFive = players.slice(0, 5);

  return (
    <div className="w-[820px] px-14 py-10 fade-in">


              {/* HEADER */}
        <div className="flex flex-col items-center mb-8">
        
          {/* LOGO + TITLE */}
          <div className="flex items-center gap-4">
        
            <img 
              src="assets/gamba.png" 
              className="h-10 object-contain opacity-95"
            />
        
            <div className="text-2xl tracking-wide font-semibold text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.7)]">
              $1,500 LEADERBOARD
            </div>
        
          </div>
        
          {/* TIMER */}
          <div className="mt-3 text-sm text-white/80 tracking-wider">
            ENDS IN{" "}
            <span className="text-green-400 font-bold text-lg">
              {timeLeft}
            </span>
          </div>
        
        </div>

      {/* BOARD */}
      <div className="bg-black/50 backdrop-blur-lg border border-white/20 rounded-2xl p-6">

        {/* HEADERS */}
        <div className="grid grid-cols-3 text-xs uppercase tracking-widest text-white/60 mb-4">
          <div>Name</div>
          <div className="text-center">Reward</div>
          <div className="text-right">Wager</div>
        </div>

        {topFive.map((p, i) => {

          let base = "bg-white/5";
          let nameStyle = "text-white";
          let rewardStyle = "text-white";
          let extra = "";

          if (i === 0) {
            base = "bg-yellow-400/10 border border-yellow-400/40";
            nameStyle = "text-yellow-300";
            rewardStyle = "text-yellow-300";
            extra = "pulse-gold";
          }

          if (i === 1) {
            base = "bg-gray-300/10";
            nameStyle = "text-gray-200";
          }

          if (i === 2) {
            base = "bg-orange-400/10";
            nameStyle = "text-orange-300";
          }

          return (
            <div
              key={p.id}
              className={`grid grid-cols-3 items-center py-3 px-3 rounded-xl mb-2 transition-all duration-500 ${base} ${extra}`}
            >

              {/* PLAYER */}
              <div className="flex items-center gap-3">
                <div className="text-white/60 w-5 text-sm">
                  {p.position}.
                </div>

                <img
                  src={p.avatar}
                  className="w-8 h-8 rounded-full object-cover border border-white/20"
                />

                <span className={`text-sm font-semibold drop-shadow ${nameStyle}`}>
                  {p.username}
                </span>
              </div>

              {/* REWARD */}
              <div className={`text-center text-lg font-bold drop-shadow ${rewardStyle}`}>
                ${Number(p.reward).toFixed(2)}
              </div>

              {/* WAGER */}
              <div className="text-right text-lg font-semibold text-white/90">
                {new Intl.NumberFormat("en-US", {
                  style: "currency",
                  currency: "USD",
                  maximumFractionDigits: 0
                }).format(p.wager)}
              </div>

            </div>
          );
        })}

      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
