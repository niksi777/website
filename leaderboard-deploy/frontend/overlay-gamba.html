<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body class="bg-transparent text-white">
<div id="root"></div>

<script type="text/babel">

function App() {

  const [players, setPlayers] = React.useState([]);

  // Fetch with auto refresh
  React.useEffect(() => {
    const fetchData = () => {
      fetch("/players")
        .then(res => res.json())
        .then(data => setPlayers(data))
        .catch(err => console.log(err));
    };

    fetchData();
    const interval = setInterval(fetchData, 10000);

    return () => clearInterval(interval);
  }, []);

  const topFive = players.slice(0, 5);

  // Total prize only
  const totalPrize = players.reduce((sum, p) => sum + Number(p.reward || 0), 0);

  return (
    <div className="w-[820px] px-14 py-10">

      {/* HEADER */}
      <div className="text-center mb-6">

        <img src="assets/gamba.png" className="h-14 mx-auto mb-3 object-contain opacity-90" />

        <div className="text-lg tracking-wide font-light mb-3">
          $1,500 LEADERBOARD
        </div>

        {/* ONLY PRIZE NOW */}
        <div className="flex justify-center text-xs opacity-80">

          <div>
            <div className="font-semibold">
              {new Intl.NumberFormat("en-US", {
                style: "currency",
                currency: "USD",
                maximumFractionDigits: 0
              }).format(totalPrize)}
            </div>
            <div className="text-white/40">PRIZE</div>
          </div>

        </div>

      </div>

      {/* LEADERBOARD */}
      <div className="bg-white/5 border border-white/10 rounded-2xl p-6">

        {/* TABLE HEADER */}
        <div className="grid grid-cols-3 text-xs uppercase tracking-widest opacity-40 mb-4">
          <div>Name</div>
          <div className="text-center">Reward</div>
          <div className="text-right">Wager</div>
        </div>

        {topFive.map((p, i) => {

          let highlight = "";

          if (i === 0) highlight = "bg-white/10";
          else if (i === 1) highlight = "bg-white/5";
          else if (i === 2) highlight = "bg-white/3";

          return (
            <div
              key={p.id}
              className={`grid grid-cols-3 items-center py-3 px-3 rounded-xl mb-2 ${highlight}`}
            >
              {/* PLAYER */}
              <div className="flex items-center gap-3">
                <div className="text-white/50 w-5 text-sm">
                  {p.position}.
                </div>

                <img
                  src={p.avatar}
                  className="w-8 h-8 rounded-full object-cover border border-white/10"
                />

                <span className="text-sm font-medium">
                  {p.username}
                </span>
              </div>

              {/* REWARD */}
              <div className="text-center text-lg font-semibold">
                ${Number(p.reward).toFixed(2)}
              </div>

              {/* WAGER */}
              <div className="text-right text-lg font-semibold">
                {new Intl.NumberFormat("en-US", {
                  style: "currency",
                  currency: "USD",
                  maximumFractionDigits: 0
                }).format(p.wager)}
              </div>

            </div>
          );
        })}

      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
