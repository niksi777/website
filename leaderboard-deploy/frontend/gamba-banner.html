<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:500px;height:110px;overflow:hidden;background:transparent}

    .banner{
      position:relative;width:500px;height:110px;
      border-radius:14px;background:#0a1f3d;overflow:hidden;
    }
    .banner::before{
      content:'';position:absolute;inset:0;border-radius:14px;padding:2px;
      background:linear-gradient(90deg,#06b6d4,#67e8f9,#0891b2,#06b6d4);
      background-size:250% 100%;
      animation:borderSweep 2.5s linear infinite;
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;
      z-index:30;pointer-events:none;
    }
    @keyframes borderSweep{0%{background-position:0% 50%}100%{background-position:200% 50%}}

    #bg{position:absolute;inset:0;z-index:1;pointer-events:none;will-change:transform;transform:translateZ(0)}

    /* rotating screens fill the whole banner */
    .screen-wrap{
      position:absolute;inset:0;z-index:10;overflow:hidden;
    }
    .screen{
      position:absolute;inset:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:2px;
    }
    .screen.slide-in {animation:slideIn 1s cubic-bezier(.22,.68,0,1.2) forwards}
    .screen.slide-out{animation:slideOut .75s cubic-bezier(.4,0,1,1) forwards}
    @keyframes slideIn{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes slideOut{from{transform:translateY(0);opacity:1}to{transform:translateY(-100%);opacity:0}}

    .sc-h,.sc-s{
      font-family:'Barlow Condensed',sans-serif;
      font-size:40px;font-weight:800;font-style:italic;
      letter-spacing:.06em;text-transform:uppercase;
      line-height:1;white-space:nowrap;
    }
    .sc-h,.sc-s,.sc-h.green{
      color:#fff;
      text-shadow:0 0 28px rgba(6,182,212,.5);
    }
    .sc-logo img{
      height:140px;width:140px;object-fit:contain;
      filter:drop-shadow(0 0 24px rgba(6,182,212,1)) drop-shadow(0 0 10px rgba(103,232,249,.6));
    }
  </style>
</head>
<body>
<div class="banner">
  <canvas id="bg" width="500" height="110"></canvas>
  <div class="screen-wrap" id="SW"></div>
</div>

<script>
const SCREENS = [
  { h:'$1.000 BI-WEEKLY',      s:'LEADERBOARD' },
  { h:'100% MATCH ON',          s:'WEEKLY REWARD' },
  { h:'10-20%',                s:'LOSSBACK', green:true },
  { h:'CUSTOM LOSSBACK',       s:'', green:true },
  { h:'USE CODE NIKSI',        s:'', green:true },
  { logo:true },
];
const INTERVAL = 8000;

/* --- particles (same system as stream overlays) --- */
const cnv = document.getElementById('bg');
const ctx = cnv.getContext('2d');

function rnd(min, max) { return min + Math.random() * (max - min); }

function makeParticle() {
  const angle = -Math.PI/2 + rnd(-0.9, 0.9);
  const spd   = rnd(0.05, 0.55);
  return {
    x: rnd(0, 500),
    y: rnd(0, 110),
    sz: rnd(0.3, 2.4),
    phase: rnd(0, Math.PI * 2),
    pulseSpeed: rnd(0.008, 0.06),
    vx: Math.cos(angle) * spd,
    vy: Math.sin(angle) * spd,
    maxA: rnd(0.25, 0.9),
    wobble: rnd(0, Math.PI * 2),
    wobbleSpeed: rnd(0.01, 0.04),
    wobbleAmp: rnd(0, 0.18),
  };
}

const SPARKS = Array.from({length: 70}, makeParticle);

function frame() {
  ctx.fillStyle = '#0a1f3d';
  ctx.fillRect(0, 0, 500, 110);

  for (const s of SPARKS) {
    s.phase  += s.pulseSpeed;
    s.wobble += s.wobbleSpeed;
    s.x += s.vx + Math.sin(s.wobble) * s.wobbleAmp;
    s.y += s.vy;
    if (s.x < -4 || s.x > 504 || s.y < -4 || s.y > 114) {
      Object.assign(s, makeParticle());
      continue;
    }
    const a = s.maxA * (0.25 + 0.75 * Math.abs(Math.sin(s.phase)));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.sz, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(6,182,212,${a.toFixed(2)})`;
    ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// keep OBS CEF renderer active - without this rAF gets throttled regardless of fps setting
setInterval(() => { document.title = ' '; }, 500);

/* --- screen rotation --- */
const sw = document.getElementById('SW');
let cur = 0;

function buildScreen(sc) {
  const d = document.createElement('div');
  d.className = 'screen';
  if (sc.logo) {
    d.innerHTML = `<div class="sc-logo"><img src="/assets/gamba2.png"/></div>`;
  } else {
    d.innerHTML = `
      <div class="sc-h${sc.green?' green':''}">${sc.h}</div>
      <div class="sc-s">${sc.s}</div>
    `;
  }
  return d;
}

function advance() {
  const next = (cur + 1) % SCREENS.length;
  const oldEl = sw.querySelector('.screen');
  cur = next;
  if (oldEl) {
    oldEl.classList.add('slide-out');
    setTimeout(() => {
      oldEl.remove();
      const newEl = buildScreen(SCREENS[next]);
      newEl.classList.add('slide-in');
      sw.appendChild(newEl);
    }, 750);
  } else {
    const newEl = buildScreen(SCREENS[next]);
    newEl.classList.add('slide-in');
    sw.appendChild(newEl);
  }
}

sw.appendChild(buildScreen(SCREENS[0]));
setInterval(advance, INTERVAL);
</script>
</body>
</html>
