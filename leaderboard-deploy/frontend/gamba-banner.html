<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:700px;height:110px;overflow:hidden;background:transparent}

    .banner{
      position:relative;width:700px;height:110px;
      border-radius:14px;background:#04100a;overflow:hidden;
    }
    .banner::before{
      content:'';position:absolute;inset:0;border-radius:14px;padding:2px;
      background:linear-gradient(90deg,#22c55e,#86efac,#16a34a,#22c55e);
      background-size:250% 100%;
      animation:borderSweep 2.5s linear infinite;
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;
      z-index:30;pointer-events:none;
    }
    @keyframes borderSweep{0%{background-position:0% 50%}100%{background-position:200% 50%}}

    #bg{position:absolute;inset:0;z-index:1;pointer-events:none}

    /* rotating screens fill the whole banner */
    .screen-wrap{
      position:absolute;inset:0;z-index:10;overflow:hidden;
    }
    .screen{
      position:absolute;inset:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:4px;
    }
    .screen.slide-in {animation:slideIn .55s cubic-bezier(.22,.68,0,1.2) forwards}
    .screen.slide-out{animation:slideOut .45s cubic-bezier(.4,0,1,1) forwards}
    @keyframes slideIn{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes slideOut{from{transform:translateY(0);opacity:1}to{transform:translateY(-100%);opacity:0}}

    .sc-h{
      font-family:'Barlow Condensed',sans-serif;
      font-size:46px;font-weight:800;font-style:italic;
      letter-spacing:.06em;text-transform:uppercase;
      color:#fff;line-height:1;
      text-shadow:0 0 28px rgba(34,197,94,.4);
    }
    .sc-s{
      font-size:11px;font-weight:700;letter-spacing:.24em;
      text-transform:uppercase;color:rgba(134,239,172,.5);
    }
    .sc-h.green{
      color:#86efac;
      text-shadow:0 0 22px rgba(34,197,94,.9),0 0 50px rgba(34,197,94,.45);
    }
    .sc-logo img{
      height:72px;width:72px;object-fit:contain;
      filter:drop-shadow(0 0 20px rgba(34,197,94,1)) drop-shadow(0 0 8px rgba(134,239,172,.5));
    }
  </style>
</head>
<body>
<div class="banner">
  <canvas id="bg" width="700" height="110"></canvas>
  <div class="screen-wrap" id="SW"></div>
</div>

<script>
const SCREENS = [
  { h:'$750 BI-WEEKLY',  s:'LEADERBOARD' },
  { h:'WEEKLY MATCH',    s:'REWARDS' },
  { h:'10-20%',          s:'LOSSBACK', green:true },
  { h:'CUSTOM LOSSBACK', s:'EXCLUSIVE DEAL', green:true },
  { h:'USE CODE',        s:'NIKSI', green:true },
  { logo:true },
];
const INTERVAL = 4800;

/* --- starfield --- */
const cnv = document.getElementById('bg');
const ctx = cnv.getContext('2d');
const CX = 350, CY = 55;

const STARS = Array.from({length:130}, () => resetStar({}));
function resetStar(s) {
  s.angle = Math.random() * Math.PI * 2;
  s.dist  = Math.random() * 8;
  s.speed = 0.04 + Math.random() * 0.12; // much slower
  s.base  = 0.2 + Math.random() * 0.6;
  return s;
}

function frame() {
  ctx.clearRect(0, 0, 700, 110);
  ctx.fillStyle = '#04100a';
  ctx.fillRect(0, 0, 700, 110);

  for (const s of STARS) {
    s.dist += s.speed * (1 + s.dist / 500); // very gentle acceleration
    const x = CX + Math.cos(s.angle) * s.dist;
    const y = CY + Math.sin(s.angle) * s.dist;
    if (x < -4 || x > 704 || y < -4 || y > 114) { resetStar(s); continue; }
    const alpha = Math.min(0.85, s.dist / 50);
    const sz    = Math.min(2, s.base + s.dist / 160);
    ctx.beginPath();
    ctx.arc(x, y, sz, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(134,239,172,${alpha})`;
    ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* --- screen rotation --- */
const sw = document.getElementById('SW');
let cur = 0;

function buildScreen(sc) {
  const d = document.createElement('div');
  d.className = 'screen';
  if (sc.logo) {
    d.innerHTML = `<div class="sc-logo"><img src="/assets/gamba2.png"/></div>`;
  } else {
    d.innerHTML = `
      <div class="sc-h${sc.green?' green':''}">${sc.h}</div>
      <div class="sc-s">${sc.s}</div>
    `;
  }
  return d;
}

function advance() {
  const next = (cur + 1) % SCREENS.length;
  const oldEl = sw.querySelector('.screen');
  const newEl = buildScreen(SCREENS[next]);
  newEl.classList.add('slide-in');
  sw.appendChild(newEl);
  if (oldEl) {
    oldEl.classList.add('slide-out');
    setTimeout(() => oldEl.remove(), 450);
  }
  cur = next;
}

sw.appendChild(buildScreen(SCREENS[0]));
setInterval(advance, INTERVAL);
</script>
</body>
</html>
