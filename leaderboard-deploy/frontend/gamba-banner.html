<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1200px;height:120px;overflow:hidden;background:transparent}

    .banner{
      position:relative;width:1200px;height:120px;
      border-radius:14px;background:#04100a;overflow:hidden;
    }

    /* sweeping green border */
    .banner::before{
      content:'';position:absolute;inset:0;border-radius:14px;padding:2px;
      background:linear-gradient(90deg,#22c55e,#86efac,#16a34a,#22c55e);
      background-size:250% 100%;
      animation:borderSweep 2s linear infinite;
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;
      z-index:30;pointer-events:none;
    }
    @keyframes borderSweep{0%{background-position:0% 50%}100%{background-position:200% 50%}}

    #bg{position:absolute;inset:0;z-index:1;pointer-events:none}

    .content{
      position:absolute;inset:0;z-index:10;
      display:flex;align-items:center;
      padding:0 20px;gap:18px;
    }

    /* logo */
    .logo-wrap{
      flex-shrink:0;display:flex;align-items:center;justify-content:center;
      animation:logoFloat 3s ease-in-out infinite;
    }
    @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

    /* separator */
    .sep{
      width:2px;height:60px;border-radius:2px;flex-shrink:0;
      animation:sepPulse 3s ease-in-out infinite;
    }
    @keyframes sepPulse{
      0%,100%{background:rgba(255,255,255,.08);box-shadow:none}
      50%{background:rgba(34,197,94,.7);box-shadow:0 0 12px rgba(34,197,94,.8)}
    }

    /* rotating screen area */
    .screen-wrap{
      flex:1;height:120px;overflow:hidden;position:relative;
    }

    .screen{
      position:absolute;inset:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:3px;
    }
    .screen.slide-in {animation:slideIn .55s cubic-bezier(.22,.68,0,1.2) forwards}
    .screen.slide-out{animation:slideOut .45s cubic-bezier(.4,0,1,1) forwards}
    @keyframes slideIn{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes slideOut{from{transform:translateY(0);opacity:1}to{transform:translateY(-100%);opacity:0}}

    .sc-h{
      font-family:'Barlow Condensed',sans-serif;
      font-size:42px;font-weight:800;font-style:italic;
      letter-spacing:.06em;text-transform:uppercase;
      color:#fff;line-height:1;
      text-shadow:0 0 30px rgba(34,197,94,.45);
    }
    .sc-s{
      font-size:11px;font-weight:700;letter-spacing:.22em;
      text-transform:uppercase;color:rgba(134,239,172,.55);
    }
    .sc-h.green{
      color:#86efac;
      text-shadow:0 0 22px rgba(34,197,94,.9),0 0 50px rgba(34,197,94,.45);
    }
    .sc-logo img{
      height:76px;width:76px;object-fit:contain;
      filter:drop-shadow(0 0 20px rgba(34,197,94,1)) drop-shadow(0 0 8px rgba(134,239,172,.6));
    }

    /* code box */
    .code-box{
      flex-shrink:0;border-radius:10px;padding:8px 22px;
      display:flex;flex-direction:column;align-items:center;gap:1px;
      border:2px solid #22c55e;background:rgba(34,197,94,.09);
      box-shadow:0 0 22px rgba(34,197,94,.45),inset 0 0 10px rgba(34,197,94,.09);
    }
    .code-lbl{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(134,239,172,.42)}
    .code-val{
      font-family:'Barlow Condensed',sans-serif;
      font-size:46px;font-weight:800;letter-spacing:.1em;line-height:1;
      color:#86efac;
      text-shadow:0 0 18px rgba(34,197,94,.95),0 0 40px rgba(34,197,94,.5);
    }
  </style>
</head>
<body>
<div class="banner">
  <canvas id="bg" width="1200" height="120"></canvas>
  <div class="content">
    <div class="logo-wrap">
      <img src="/assets/gamba2.png" style="height:88px;width:88px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(34,197,94,1)) drop-shadow(0 0 5px rgba(134,239,172,.5))"/>
    </div>
    <div class="sep"></div>
    <div class="screen-wrap" id="SW"></div>
    <div class="code-box">
      <div class="code-lbl">Use code</div>
      <div class="code-val">NIKSI</div>
    </div>
  </div>
</div>

<script>
/* ---------- screens ---------- */
const SCREENS = [
  { h:'$750 BI-WEEKLY',   s:'LEADERBOARD' },
  { h:'WEEKLY MATCH',     s:'REWARDS' },
  { h:'10-20%',           s:'LOSSBACK', greenH:true },
  { h:'CUSTOM LOSSBACK',  s:'EXCLUSIVE DEAL', greenH:true }, // ← fill in screen 4
  { h:'USE CODE',         s:'NIKSI', greenH:true },
  { logo:true },
];
const INTERVAL = 4800; // ms per screen

/* ---------- starfield canvas ---------- */
const cnv = document.getElementById('bg');
const ctx = cnv.getContext('2d');
const CX = 600, CY = 60;
const STARS = Array.from({length:160}, () => resetStar({}));

function resetStar(s) {
  s.angle = Math.random() * Math.PI * 2;
  s.dist  = Math.random() * 6;
  s.speed = 0.6 + Math.random() * 2.2;
  s.base  = 0.3 + Math.random() * 0.8;
  return s;
}

function frame() {
  ctx.clearRect(0, 0, 1200, 120);
  ctx.fillStyle = '#04100a';
  ctx.fillRect(0, 0, 1200, 120);

  for (const s of STARS) {
    s.dist += s.speed * (1 + s.dist / 90);
    const x = CX + Math.cos(s.angle) * s.dist;
    const y = CY + Math.sin(s.angle) * s.dist;
    if (x < -4 || x > 1204 || y < -4 || y > 124) { resetStar(s); continue; }
    const alpha = Math.min(0.9, s.dist / 35);
    const sz    = Math.min(2.2, s.base + s.dist / 100);
    ctx.beginPath();
    ctx.arc(x, y, sz, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(134,239,172,${alpha})`;
    ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- screen rotation ---------- */
const sw = document.getElementById('SW');
let cur = 0;

function buildScreen(sc) {
  const d = document.createElement('div');
  d.className = 'screen';
  if (sc.logo) {
    d.innerHTML = `<div class="sc-logo"><img src="/assets/gamba2.png"/></div>`;
  } else {
    d.innerHTML = `
      <div class="sc-h${sc.greenH ? ' green' : ''}">${sc.h}</div>
      <div class="sc-s">${sc.s}</div>
    `;
  }
  return d;
}

function advance() {
  const next = (cur + 1) % SCREENS.length;
  const oldEl = sw.querySelector('.screen');
  const newEl = buildScreen(SCREENS[next]);
  newEl.classList.add('slide-in');
  sw.appendChild(newEl);
  if (oldEl) {
    oldEl.classList.add('slide-out');
    setTimeout(() => oldEl.remove(), 450);
  }
  cur = next;
}

const init = buildScreen(SCREENS[0]);
sw.appendChild(init);
setInterval(advance, INTERVAL);
</script>
</body>
</html>
