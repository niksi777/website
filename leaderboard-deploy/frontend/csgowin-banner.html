<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 800px;
      height: 120px;
      overflow: hidden;
      background: transparent;
    }

    .banner {
      width: 800px;
      height: 120px;
      background: linear-gradient(135deg, #150e01 0%, #2a1800 60%, #100a00 100%);
      border: 3px solid rgba(245,158,11,0.9);
      border-radius: 18px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      animation: borderPulse 2.5s ease-in-out infinite;
    }
    @keyframes borderPulse {
      0%,100% { border-color: rgba(245,158,11,0.9); }
      50%      { border-color: rgba(245,158,11,1); }
    }

    .banner::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(245,158,11,0.45), rgba(245,158,11,0.5), transparent);
      pointer-events: none;
      z-index: 2;
    }

    .flash {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: radial-gradient(ellipse at center, rgba(245,158,11,0.18) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 6;
    }

    .logo-wrap {
      width: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      z-index: 1;
    }

    .logo-wrap img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(245,158,11,0.4));
    }

    .sep {
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, transparent, rgba(245,158,11,0.3), transparent);
      flex-shrink: 0;
      z-index: 1;
    }

    .slides {
      flex: 1;
      padding: 0 28px;
      height: 100%;
      position: relative;
      overflow: hidden;
      perspective: 520px;
      perspective-origin: center center;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateX(72deg);
      opacity: 0;
      transition: none;
      pointer-events: none;
    }

    .slide.active {
      transform: rotateX(0deg);
      opacity: 1;
      transition: transform 0.36s cubic-bezier(0.0, 0.6, 0.4, 1.0),
                  opacity 0.12s ease;
    }

    .slide.exit {
      transform: rotateX(-72deg);
      opacity: 0;
      transition: transform 0.28s cubic-bezier(0.6, 0.0, 1.0, 0.4),
                  opacity 0.28s ease;
    }

    .slide-label {
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #f59e0b;
      margin-bottom: 6px;
    }

    .slide-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 30px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.02em;
      line-height: 1;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .coin-icon {
      height: 0.85em;
      width: 0.85em;
      object-fit: contain;
    }

    .slide-sub {
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      color: rgba(235,210,160,0.6);
      margin-top: 6px;
      letter-spacing: 0.02em;
    }

    .amber { color: #f59e0b; }

    .brand {
      width: 120px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      border-left: 1px solid rgba(245,158,11,0.2);
      padding: 0 16px;
      z-index: 1;
    }

    .brand-label {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(245,158,11,0.65);
    }

    .brand-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .nav-dots {
      position: absolute;
      bottom: 9px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      align-items: center;
      z-index: 5;
    }

    .nav-dot {
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.14);
      width: 28px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .dot-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #d97706);
      border-radius: 2px;
    }
  </style>
</head>
<body>
<div class="banner">

  <div class="flash" id="flash"></div>

  <div class="logo-wrap">
    <img src="/assets/niksi.png" alt="NIKSI777"/>
  </div>

  <div class="sep"></div>

  <div class="slides">

    <div class="slide active">
      <div class="slide-label">CSGO.WIN</div>
      <div class="slide-title"><img class="coin-icon" src="/assets/csgowincoin.png" alt=""/> 500 Leaderboard</div>
      <div class="slide-sub">Compete with top wagerers for your share of 500 credits!</div>
    </div>

    <div class="slide">
      <div class="slide-label">CSGO.WIN</div>
      <div class="slide-title">Free <span class="amber">Promos</span></div>
      <div class="slide-sub">Exclusive promotions available for Niksi affiliates only</div>
    </div>

    <div class="slide">
      <div class="slide-label">CSGO.WIN</div>
      <div class="slide-title">Free <span class="amber">Battles</span> &amp; Cases</div>
    </div>

    <div class="slide">
      <div class="slide-label">Deposit Bonus</div>
      <div class="slide-title"><span class="amber">5%</span> With Code NIKSI</div>
      <div class="slide-sub">Get an extra 5% on every deposit at CSGO.WIN</div>
    </div>

  </div>

  <div class="brand">
    <div class="brand-label">Code</div>
    <div class="brand-code">NIKSI</div>
  </div>

  <div class="nav-dots">
    <div class="nav-dot on"><div class="dot-fill"></div></div>
    <div class="nav-dot"><div class="dot-fill"></div></div>
    <div class="nav-dot"><div class="dot-fill"></div></div>
    <div class="nav-dot"><div class="dot-fill"></div></div>
  </div>

</div>
<script>
  const slides   = Array.from(document.querySelectorAll('.slide'));
  const navDots  = Array.from(document.querySelectorAll('.nav-dot'));
  const fills    = Array.from(document.querySelectorAll('.dot-fill'));
  const flash    = document.getElementById('flash');
  const DURATION = 5500;
  let cur = 0, t0 = null, raf = null, busy = false;

  function glowFlash() {
    flash.style.transition = 'opacity 0.06s ease';
    flash.style.opacity = '1';
    setTimeout(() => {
      flash.style.transition = 'opacity 0.22s ease';
      flash.style.opacity = '0';
    }, 60);
  }

  function goTo(next) {
    if (busy) return;
    busy = true;

    const outIdx = cur;
    const inIdx  = next % slides.length;

    slides[outIdx].classList.remove('active');
    slides[outIdx].classList.add('exit');
    navDots[outIdx].classList.remove('on');
    fills[outIdx].style.transition = 'none';
    fills[outIdx].style.width = '0%';

    setTimeout(glowFlash, 140);

    setTimeout(() => {
      slides[outIdx].classList.remove('exit');
      cur = inIdx;
      navDots[inIdx].classList.add('on');
      fills[inIdx].style.transition = 'none';
      fills[inIdx].style.width = '0%';
      slides[inIdx].classList.add('active');

      t0 = null;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(tick);

      setTimeout(() => { busy = false; }, 380);
    }, 290);
  }

  function tick(ts) {
    if (!t0) t0 = ts;
    const pct = Math.min((ts - t0) / DURATION * 100, 100);
    fills[cur].style.width = pct + '%';
    if (pct < 100) {
      raf = requestAnimationFrame(tick);
    } else {
      goTo(cur + 1);
    }
  }

  raf = requestAnimationFrame(tick);
</script>
</body>
</html>
