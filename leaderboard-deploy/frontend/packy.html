<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    :root{--bg:#060f20;--s1:#0c1830;--s2:#101e3a;--s3:#141f3a;--b1:rgba(255,255,255,.05);--b2:rgba(255,255,255,.09);--b3:rgba(255,255,255,.16);--tx:#dde3ef;--mu:rgba(221,227,239,.75);--mu2:rgba(221,227,239,.85);--ac:#00b2f5;--rd:#e03535}
    html,body{background-color:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 1000px 700px at 0% 0%,rgba(74,158,255,.25),transparent 60%),radial-gradient(ellipse 800px 800px at 100% 100%,rgba(30,100,220,.18),transparent 60%),radial-gradient(ellipse 600px 500px at 50% 50%,rgba(40,100,255,.06),transparent 70%)}
    @keyframes pu{0%,100%{opacity:1}50%{opacity:.15}}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .f1{animation:fu .5s ease both}.f2{animation:fu .5s .1s ease both}.f3{animation:fu .5s .22s ease both}.f4{animation:fu .5s .34s ease both}

    nav{background:rgba(6,13,26,.97);border-bottom:1px solid var(--b2);position:sticky;top:0;z-index:50}
    .ni{max-width:1020px;margin:0 auto;padding:0 28px;display:flex;align-items:center;height:56px}
    .nlogo{display:flex;align-items:center;gap:10px;padding-right:22px;border-right:1px solid var(--b2);margin-right:18px;flex-shrink:0;text-decoration:none}
    .nlogo img{height:28px;width:28px;border-radius:50%;object-fit:cover}
    .nname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.16em;color:#fff;text-transform:uppercase}
    .nlinks{display:flex;align-items:center;flex:1}
    .nlinks a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:0 13px;height:56px;display:flex;align-items:center;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;margin-bottom:-1px}
    .nlinks a:hover{color:rgba(255,255,255,.9)}
    .nlinks a.on{color:#fff;border-bottom-color:rgba(255,255,255,.5)}
    .nsoc{margin-left:auto;display:flex;align-items:center;gap:2px;padding-left:16px;border-left:1px solid var(--b2)}
    .nsoc a{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;opacity:.5;transition:opacity .15s}
    .nsoc a:hover{opacity:1;background:rgba(255,255,255,.05)}
    .nsoc svg{width:15px;height:15px}
    .nauth{display:flex;align-items:center;gap:8px;padding-left:12px;margin-left:auto}
    .nlogin-btn{display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:7px;background:#22c55e;color:#fff;border:none;cursor:pointer;transition:opacity .15s;text-decoration:none;white-space:nowrap;flex-shrink:0}
    .nlogin-btn:hover{opacity:.85}
    .nuser{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:7px;background:var(--s1);border:1px solid var(--b2)}
    .nuser-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--s2)}
    .nuser-name{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--tx)}
    .nuser-NP{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#d4af5a}
    .ndrop{position:relative}
    .ndrop-menu{display:none;position:absolute;top:100%;right:0;padding-top:6px;z-index:200;min-width:150px}
    .ndrop:hover .ndrop-menu{display:block}
    .ndrop-box{background:rgba(7,8,12,.97);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5)}

    .hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:32px;height:32px;cursor:pointer;margin-left:auto;padding:4px;background:none;border:none}
    .hamburger span{display:block;height:1.5px;background:rgba(255,255,255,.6);border-radius:2px;transition:all .2s}

    .pcard{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;position:relative;overflow:hidden}

    .pcard.p3{--pline:rgba(160,113,74,.4);border-color:rgba(160,113,74,.15)}

    .p1 .prank{color:#00b2f5}.p2 .prank{color:#9aaab8}.p3 .prank{color:#a0714a}
    .pavatar{border-radius:50%;object-fit:cover;border:2px solid var(--b2);flex-shrink:0;background:var(--s3)}
    .puname{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .pstat-lbl{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:3px}

    .sdlbl{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);white-space:nowrap}

    .lbtable{border:1px solid var(--b1);border-radius:12px;overflow:hidden;margin-bottom:56px}
    .lbhead{display:grid;grid-template-columns:52px 36px 1fr 110px 80px;gap:14px;align-items:center;padding:10px 20px;background:var(--s2);border-bottom:1px solid var(--b1)}

    .lbrow:hover{background:var(--s2)}
    .lbrk{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em;text-align:center;color:var(--mu)}
    .lbav{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--b2);flex-shrink:0;background:var(--s3);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;color:var(--mu)}

    .lbwg{font-family:'Inter',sans-serif;font-size:12px;font-weight:400;color:var(--mu);text-align:right;white-space:nowrap}

    .lbnm-wrap{display:flex;flex-direction:column;gap:2px;overflow:hidden}

    .lb-mob-right{display:none;flex-direction:column;align-items:flex-end;gap:3px}
    .lb-mob-prize{font-size:12px;font-weight:600;color:#00b2f5}

    footer{border-top:1px solid var(--b1);padding:22px 0}
    .ftw{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .ftd{font-size:12px;line-height:1.6;color:var(--mu);max-width:500px}
    .ftd strong{color:rgba(221,227,239,.9)}
    .ftc{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);white-space:nowrap}

    @media(max-width:700px){
      .nlinks,.nsoc{display:none}
      .hamburger{display:flex}
      .nlogo{border-right:none;margin-right:0;padding-right:0}
      .wrap{padding:0 14px}
      .phead{padding:28px 0 20px}
      .phead-toprow{flex-direction:column;align-items:flex-start;gap:10px}
      .pbtns{flex-wrap:wrap}
      .statsbar{grid-template-columns:1fr}
      .stat{border-right:none;border-bottom:1px solid var(--b1);padding:14px 18px}
      .stat:last-child{border-bottom:none}
      .podium{grid-template-columns:1fr;gap:8px}
      .lbhead{grid-template-columns:36px 32px 1fr auto;gap:10px;padding:8px 14px}
      .lbrow{grid-template-columns:36px 32px 1fr auto;gap:10px;padding:11px 14px}
      .lbwg{display:none}
      .lbwg-sub{display:block}
      .lbnm{font-size:12px}
      .lbrk{font-size:15px}
      .lbrw{display:none}

      .ftw{flex-direction:column;align-items:flex-start}

    @media(max-width:480px){
      .pcard{padding:14px 10px}

      .p1 .pstat-val.rw{font-size:17px}

      .lbrow{grid-template-columns:30px 28px 1fr auto;gap:8px;padding:10px 12px}
      .lbav{width:28px;height:28px}
    }
  </style>
</head>

<script type="text/babel">

  const FALLBACK_TIERS = {1:400,2:200,3:125,4:75,5:50,6:40,7:35,8:30,9:25,10:20};

  function fmtMoney(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(Number(n)||0)}
  function fmtCD(target){
    if(!target) return "-";
    const ms=new Date(target)-Date.now(); if(ms<=0)return"Ended";
    const d=Math.floor(ms/86400000),h=Math.floor(ms/3600000%24),m=Math.floor(ms/60000%60),s=Math.floor(ms/1000%60);
    return d>0?`${d}d ${h}h ${m}m ${s}s`:`${h}h ${m}m ${s}s`;
  }
  function useCountdown(target){
    const [v,setV]=React.useState(()=>fmtCD(target));
    React.useEffect(()=>{if(!target)return;const id=setInterval(()=>setV(fmtCD(target)),1000);return()=>clearInterval(id);},[target]);
    return v;
  }
  function useAnimNum(target,dur=1400){
    const [v,setV]=React.useState(0);
    React.useEffect(()=>{
      const t0=Date.now();
      const id=setInterval(()=>{const p=Math.min((Date.now()-t0)/dur,1);setV(Math.floor((1-Math.pow(1-p,3))*target));if(p>=1)clearInterval(id);},16);
      return()=>clearInterval(id);
    },[target]);
    return v;
  }

  function usePackyData(){
    const [data,setData]=React.useState(null);
    const [loading,setLoading]=React.useState(true);
    React.useEffect(()=>{
      const go=async()=>{
        try{
          const r=await fetch("/packy-data");
          const j=await r.json();
          setData(j);
        }catch(e){}
        setLoading(false);
      };
      go(); const id=setInterval(go,300000); return()=>clearInterval(id);
    },[]);
    return {data,loading};
  }

    return <img className="lbav" src={src} alt={name} style={{width:size,height:size}} onError={()=>setErr(true)}/>;
  }

  function useSession(){
    const [user,setUser]=React.useState(null);
    React.useEffect(()=>{
      const params=new URLSearchParams(window.location.search);
      const sid=params.get('session')||localStorage.getItem('kick_session');
      if(sid){
        localStorage.setItem('kick_session',sid);
        fetch('/auth/me?session='+sid).then(r=>r.ok?r.json():null).then(d=>{if(d)setUser(d);else localStorage.removeItem('kick_session');}).catch(()=>{});
        if(params.get('session'))window.history.replaceState({},'',window.location.pathname);
      }
    },[]);
    function logout(){const sid=localStorage.getItem('kick_session');if(sid)fetch('/auth/logout?session='+sid);localStorage.removeItem('kick_session');setUser(null);}
    return {user,logout};

  function App(){
    const {data,loading} = usePackyData();

    const lb        = data || {};
    const entries   = lb.entries || [];
    const tiers     = lb.prize_tiers || [];
    const prize     = Number(lb.total_prize_usd || 1000);
    const timeStatus = lb.time_status || null;
    const endDate   = lb.end_date || null;
    const title     = lb.title || "Monthly Leaderboard";

    const tiersMap  = {};
    tiers.forEach(t=>{ tiersMap[t.position]=Number(t.prize_amount_usd||0); });
    function prizeForRank(rank){ return tiersMap[rank] ?? FALLBACK_TIERS[rank] ?? 0; }

    const prizeAnim = useAnimNum(prize);
    const timer     = useCountdown(endDate);

    const top3  = entries.slice(0,3);
    const rest  = entries.slice(3);
    const podium = [1,0,2].map(i=>top3[i]?{...top3[i],rank:i+1}:null).filter(Boolean);
    const rankCls = {1:"p1",2:"p2",3:"p3"};
    const rankLbls = ["1st Place","2nd Place","3rd Place"];

    const statusLabel = timeStatus==="active"?"Live Race" : timeStatus==="upcoming"?"Starting Soon" : timeStatus==="ended"?"Ended" : "Leaderboard";

    return (<>
      <Navbar/>
      <div className="wrap">

        <div className="phead f1">
          <div className="phead-toprow">
            <div className="phead-eyebrow"><span className="pdot"/>Packy.gg - {statusLabel}</div>
            <div className="pbtns">
              <a href="https://packy.gg/r/niksi" target="_blank" rel="noreferrer" className="pbtn pbtn-sec">Sign Up</a>
              <a href="https://packy.gg/r/niksi" target="_blank" rel="noreferrer" className="pbtn pbtn-pri">
                View on Packy
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{width:11,height:11}}><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
              </a>
            </div>
          </div>
          <img className="packy-logo" src="/assets/packy.png" alt="Packy" onError={e=>{e.target.style.display='none'}}/>
          <div className="phead-sub">${prize.toLocaleString("en-US")} {title}</div>
        </div>

        <div className="statsbar f2">
          <div className="stat"><div className="stat-lbl">Prize Pool</div><div className="stat-val">${prizeAnim.toLocaleString("en-US")}</div></div>
          <div className="stat"><div className="stat-lbl">Players</div><div className="stat-val">{entries.length || "-"}</div></div>
          <div className="stat"><div className="stat-lbl">{timeStatus==="ended"?"Status":"Ends In"}</div><div className="stat-val">{timeStatus==="ended"?"Ended":endDate?timer:"-"}</div></div>
        </div>

        {podium.length>0 && (
          <div className="podium f3">
            {podium.map(p=>(
              <div key={p.user_id} className={`pcard ${rankCls[p.rank]}`}>
                <div className="prank">{rankLbls[p.rank-1]}</div>
                <Avatar src={p.image_url} name={p.username} size={p.rank===1?64:48}/>
                <div className="puname">{p.username||"Anonymous"}</div>
                <div className="pstat"><div className="pstat-lbl">Wagered</div><div className="pstat-val">{fmtMoney(p.total_wagered_usd)}</div></div>
                <div className="pstat"><div className="pstat-lbl">Prize</div><div className="pstat-val rw">{fmtMoney(prizeForRank(p.rank))}</div></div>
              </div>
            ))}
          </div>
        )}

        {rest.length>0 && (<>
          <div className="sdiv f4"><div className="sdl"/><span className="sdlbl">Positions 4+</span><div className="sdl"/></div>
          <div className="lbtable f4">
            <div className="lbhead">
              <div className="lbh" style={{textAlign:'center'}}>#</div>
              <div className="lbh"/>
              <div className="lbh">Player</div>
              <div className="lbh" style={{textAlign:'right'}}>Wagered</div>
              <div className="lbh lbrw" style={{textAlign:'center'}}>Prize</div>
              <div className="lbh lb-mob-right" style={{fontSize:11}}>Prize</div>
            </div>
            {rest.map((p,i)=>(
              <div key={p.user_id} className="lbrow">
                <div className="lbrk">#{i+4}</div>
                <Avatar src={p.image_url} name={p.username} size={32}/>
                <div className="lbnm-wrap">
                  <div className="lbnm">{p.username||"Anonymous"}</div>
                  <div className="lbwg-sub">{fmtMoney(p.total_wagered_usd)} wagered</div>
                </div>
                <div className="lbwg" style={{textAlign:'right'}}>{fmtMoney(p.total_wagered_usd)}</div>
                <div className="lbrw" style={{textAlign:'center'}}>{prizeForRank(i+4)>0?fmtMoney(prizeForRank(i+4)):"-"}</div>
                <div className="lb-mob-right">
                  <span className="lb-mob-prize">{prizeForRank(i+4)>0?fmtMoney(prizeForRank(i+4)):"-"}</span>
                </div>
              </div>
            ))}
          </div>
        </>)}

        {!loading && entries.length===0 && (
          <div className="f3" style={{textAlign:'center',padding:'64px 0',fontFamily:"'Inter',sans-serif",fontSize:12,fontWeight:500,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--mu)'}}>
            {data===null ? "Could not reach Packy.gg - check back soon" : "No active leaderboard"}
          </div>
        )}

        {loading && (
          <div className="f3" style={{textAlign:'center',padding:'64px 0',fontFamily:"'Inter',sans-serif",fontSize:12,fontWeight:500,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--mu)'}}>
            Loading leaderboard...
          </div>
        )}

      </div>

      <footer>
        <div className="wrap">
          <div className="ftw">
            <p className="ftd"><strong>18+</strong> - We are not responsible for any losses incurred from gambling on casino or betting platforms linked or promoted on this site. All users participate at their own risk.</p>
            <div style={{display:'flex',alignItems:'center',gap:4}}>
              <div className="nsoc" style={{border:'none',padding:0}}>{SOCIALS}</div>
              <span className="ftc" style={{marginLeft:8}}>© 2026 NIKSI777</span>
            </div>
          </div>
        </div>
              <div style={{textAlign:"center",marginTop:10,paddingBottom:4,fontSize:11,color:"var(--mu)",letterSpacing:".08em",fontFamily:"'Inter',sans-serif"}}>Created by <strong style={{color:"var(--ac)"}}>@niksiii</strong> on Discord</div>
      </footer>
    </>);
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
