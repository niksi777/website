<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIKSI777</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#07080c;--s1:#0c0e14;--s2:#11131a;--b1:rgba(255,255,255,.05);--b2:rgba(255,255,255,.1);--b3:rgba(255,255,255,.18);--tx:#dde3ef;--mu:rgba(221,227,239,.75);--ac:#b8cce8;--rd:#d94f4f}
    html,body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 800px 500px at 0% 0%,rgba(140,170,210,.04),transparent 60%),radial-gradient(ellipse 600px 600px at 100% 100%,rgba(110,140,190,.03),transparent 60%)}
    @keyframes pu{0%,100%{opacity:1}50%{opacity:.15}}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .f1{animation:fu .5s ease both}.f2{animation:fu .5s .1s ease both}.f3{animation:fu .5s .2s ease both}

    nav{background:rgba(7,8,12,.97);border-bottom:1px solid var(--b2);position:sticky;top:0;z-index:50}
    .ni{max-width:1020px;margin:0 auto;padding:0 28px;display:flex;align-items:center;height:56px}
    .nlogo{display:flex;align-items:center;gap:10px;padding-right:22px;border-right:1px solid var(--b2);margin-right:18px;flex-shrink:0;text-decoration:none}
    .nlogo img{height:28px;width:28px;border-radius:50%;object-fit:cover}
    .nname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.16em;color:#fff;text-transform:uppercase}
    .nlinks{display:flex;align-items:center;flex:1}
    .nlinks a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:0 13px;height:56px;display:flex;align-items:center;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;margin-bottom:-1px}
    .nlinks a:hover{color:rgba(255,255,255,.9)}
    .nlinks a.on{color:#fff;border-bottom-color:rgba(255,255,255,.5)}
    .nsoc{margin-left:auto;display:flex;align-items:center;gap:2px;padding-left:16px;border-left:1px solid var(--b2)}
    .nsoc a{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;opacity:.5;transition:opacity .15s}
    .nsoc a:hover{opacity:1;background:rgba(255,255,255,.05)}
    .nsoc svg{width:15px;height:15px}
    .hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:32px;height:32px;cursor:pointer;margin-left:auto;padding:4px;background:none;border:none}
    .hamburger span{display:block;height:1.5px;background:rgba(255,255,255,.6);border-radius:2px;transition:all .2s}
    .drawer{display:none;flex-direction:column;background:rgba(7,8,12,.99);border-bottom:1px solid var(--b2);padding:10px 28px 18px}
    .drawer.open{display:flex}
    .drawer a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--b1);transition:color .15s}
    .drawer a:last-of-type{border-bottom:none}
    .drawer a.on,.drawer a:hover{color:#fff}
    .drawer-soc{display:flex;align-items:center;gap:8px;padding-top:14px}
    .drawer-soc a{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--s1);border:1px solid var(--b2);opacity:.7}
    .drawer-soc svg{width:15px;height:15px}

    .page{max-width:1020px;margin:0 auto;padding:0 28px}

    .hero{padding:56px 0 44px;text-align:center}
    .htag{display:inline-flex;align-items:center;gap:7px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);border:1px solid rgba(184,204,232,.15);padding:4px 14px;border-radius:100px;margin-bottom:20px}
    .pdot{width:5px;height:5px;border-radius:50%;background:var(--ac);animation:pu 2s ease-in-out infinite;flex-shrink:0}
    .htitle{font-family:'Barlow Condensed',sans-serif;font-size:clamp(42px,7vw,72px);font-weight:800;line-height:.92;letter-spacing:-.01em;text-transform:uppercase;color:#fff;margin-bottom:14px}
    .htitle em{font-style:normal;font-weight:300;color:rgba(255,255,255,.35)}
    .hsub{font-size:14px;line-height:1.7;color:var(--mu);max-width:440px;margin:0 auto}
    .hsub strong{color:rgba(221,227,239,.9);font-weight:600}

    /* Two cards side by side */
    .offers{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-bottom:56px}

    /* Base card */
    .ocard{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .2s;width:100%}
    .ocard:hover{transform:translateY(-3px)}

    .obanner{height:160px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;background:#0e1018;border:1px solid var(--b2);border-bottom:none;border-radius:14px 14px 0 0}
    .obanner img{max-height:200px;max-width:260px;object-fit:contain;opacity:.95}
    .obadge{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:100px;color:rgba(255,255,255,.8);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
    .olive{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--rd)}
    .olive::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--rd);animation:pu 1.5s ease-in-out infinite}

    .obody{padding:24px;display:flex;flex-direction:column;gap:18px;border:1px solid var(--b2);border-top:2px solid rgba(255,255,255,.28);border-radius:0 0 14px 14px;background:var(--s1);flex:1}

    /* Gamba card specifics */
    .oprize-lbl{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
    .oprize{font-family:'Barlow Condensed',sans-serif;font-size:clamp(48px,6vw,64px);font-weight:800;letter-spacing:.01em;line-height:1;color:#fff}
    .oprog-head{display:flex;justify-content:space-between;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--mu);margin-bottom:6px}
    .otrack{height:2px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
    .ofill{height:100%;border-radius:99px;background:rgba(255,255,255,.45);transition:width .9s ease}
    .ometa{display:flex;align-items:center;gap:10px}
    .otimer{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--mu)}
    .otimer span{color:var(--tx)}
    .octa{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:13px;border-radius:8px;background:#fff;color:#07080c;transition:opacity .15s;text-decoration:none}
    .octa:hover{opacity:.82}
    .octa svg{width:13px;height:13px;flex-shrink:0}

    /* Qzino card specifics — green accent */
    .qzino-banner{border-color:rgba(130,200,60,.2) !important}
    .qzino-body{border-color:rgba(130,200,60,.2) !important;border-top-color:rgba(130,200,60,.5) !important}
    .qzino-badge{color:rgba(150,220,80,.9) !important;background:rgba(130,200,60,.08) !important;border-color:rgba(130,200,60,.2) !important}
    .qzino-desc{font-size:14px;line-height:1.7;color:var(--mu);flex:1}
    .qzino-desc strong{color:rgba(221,227,239,.9);font-weight:600}
    .qzino-cta{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:13px;border-radius:8px;background:linear-gradient(135deg,#7ac832,#4a9e1a);color:#fff;transition:opacity .15s;text-decoration:none;margin-top:auto}
    .qzino-cta:hover{opacity:.85}
    .qzino-cta svg{width:13px;height:13px;flex-shrink:0}

    footer{border-top:1px solid var(--b1);padding:22px 0}
    .ftw{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .ftd{font-size:12px;line-height:1.6;color:var(--mu);max-width:500px}
    .ftd strong{color:rgba(221,227,239,.9)}
    .ftc{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);white-space:nowrap}

    @media(max-width:680px){
      .nlinks,.nsoc{display:none}
      .hamburger{display:flex}
      .nlogo{border-right:none;margin-right:0;padding-right:0}
      .hero{padding:36px 0 28px}
      .offers{grid-template-columns:1fr}
      .oprize{font-size:52px}
      .ftw{flex-direction:column;align-items:flex-start}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

  const RACES = {
    gamba:   { prize:1500, start:new Date("2026-05-17T02:00:00Z"), end:new Date("2026-05-30T23:00:00Z"), visible:true  },
    chancer: { prize:2000, start:new Date("2026-04-23T14:00:00Z"), end:new Date("2026-05-13T14:00:00Z"), visible:false },
  };
  const VISIBLE = Object.entries(RACES).filter(([,r])=>r.visible).map(([k])=>k);

  function fmtCD(target){
    const ms=target-Date.now(); if(ms<=0)return"Ended";
    const d=Math.floor(ms/86400000),h=Math.floor(ms/3600000%24),m=Math.floor(ms/60000%60),s=Math.floor(ms/1000%60);
    return d>0?`${d}d ${h}h ${m}m ${s}s`:`${h}h ${m}m ${s}s`;
  }
  function racePct(s,e){return Math.min(100,Math.max(0,Math.round((Date.now()-s)/(e-s)*100)))}
  function useCountdown(target){
    const [v,setV]=React.useState(()=>fmtCD(target));
    React.useEffect(()=>{const id=setInterval(()=>setV(fmtCD(target)),1000);return()=>clearInterval(id);},[]);
    return v;
  }
  function useAnimNum(target,dur=1400){
    const [v,setV]=React.useState(0);
    React.useEffect(()=>{
      const t0=Date.now();
      const id=setInterval(()=>{const p=Math.min((Date.now()-t0)/dur,1);setV(Math.floor((1-Math.pow(1-p,3))*target));if(p>=1)clearInterval(id);},16);
      return()=>clearInterval(id);
    },[target]);
    return v;
  }

  const SOCIALS = <>
    <a href="https://kick.com/niksi777" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" fill="none"><path d="M3 3h4v5.5L11 3h5l-5.5 6.5L16 15h-5l-4-4.5V15H3V3z" fill="#22c55e"/></svg></a>
    <a href="https://discord.com/invite/Gnyv25SHg7" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.464-.674.86-1.339 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128c.126-.094.247-.192.372-.292a.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg></a>
    <a href="https://x.com/code_niksi777" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63z"/></svg></a>
  </>;

  function Navbar(){
    const [open,setOpen]=React.useState(false);
    return (<>
      <nav>
        <div className="ni">
          <a href="/" className="nlogo"><img src="/assets/niksi.png" alt="NIKSI777"/><span className="nname">NIKSI777</span></a>
          <div className="nlinks">
            <a href="/" className="on">HOME</a>
            <a href="/leaderboards.html">LEADERBOARDS</a>
          </div>
          <div className="nsoc">{SOCIALS}</div>
          <button className="hamburger" onClick={()=>setOpen(o=>!o)}>
            <span style={open?{transform:'rotate(45deg) translate(5px,5px)'}:{}}/>
            <span style={open?{opacity:0}:{}}/>
            <span style={open?{transform:'rotate(-45deg) translate(5px,-5px)'}:{}}/>
          </button>
        </div>
      </nav>
      <div className={`drawer${open?' open':''}`}>
        <a href="/" className="on">HOME</a>
        <a href="/leaderboards.html">LEADERBOARDS</a>
        <div className="drawer-soc">{SOCIALS}</div>
      </div>
    </>);
  }

  function GambaCard(){
    const race   = RACES.gamba;
    const timer  = useCountdown(race.end);
    const amount = useAnimNum(race.prize);
    const pct    = racePct(race.start, race.end);
    return (
      <a href="/gamba.html" className="ocard">
        <div className="obanner">
          <span className="obadge">Gamba.com</span>
          <span className="olive">LIVE</span>
          <img src="/assets/gamba2.png" alt="Gamba" onError={e=>{e.target.style.display='none'}}/>
        </div>
        <div className="obody">
          <div>
            <div className="oprize-lbl">Prize Pool</div>
            <div className="oprize">${amount.toLocaleString("en-US")}</div>
          </div>
          <div>
            <div className="oprog-head"><span>Race Progress</span><span>{pct}%</span></div>
            <div className="otrack"><div className="ofill" style={{width:pct+"%"}}/></div>
          </div>
          <div className="ometa">
            <div className="otimer">ENDS IN <span>{timer}</span></div>
          </div>
          <div className="octa">
            View Leaderboard
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </div>
        </div>
      </a>
    );
  }

  function QzinoCard(){
    return (
      <div className="ocard">
        <div className="obanner qzino-banner">
          <span className="obadge qzino-badge">Qzino.com</span>
          <img src="/assets/qzino.png" alt="Qzino" onError={e=>{e.target.style.display='none'}}/>
        </div>
        <div className="obody qzino-body">
          <div>
            <div className="oprize-lbl">Affiliate Code</div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'clamp(32px,4vw,48px)',fontWeight:800,letterSpacing:'.04em',lineHeight:1,color:'#7ac832'}}>
              NIKSI
            </div>
          </div>
          <p className="qzino-desc">
            Sign up on Qzino using my link and use code <strong>NIKSI</strong> and enjoy exclusive perks. Deposit bonuses available in discord!
          </p>
          <a href="https://qzino-partners.com/tijrhrss5" target="_blank" rel="noreferrer" className="qzino-cta">
            Sign Up Now
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>
        </div>
      </div>
    );
  }

  function App(){
    const activeCount = VISIBLE.length + 1; // +1 for Qzino
    return (<>
      <Navbar/>
      <div className="page">
        <div className="hero f1">
          <div className="htag"><span className="pdot"/>{activeCount} Active Offers</div>
          <h1 className="htitle">Wager. <em>Win.</em><br/>Climb the Board.</h1>
          <p className="hsub">Use code <strong>NIKSI</strong> on our partner casinos and climb the leaderboard for your share of the prize pool.</p>
        </div>
        <div className="offers f2">
          <GambaCard/>
          <QzinoCard/>
        </div>
      </div>
      <footer>
        <div className="page">
          <div className="ftw">
            <p className="ftd"><strong>18+</strong> — We are not responsible for any losses incurred from gambling on casino or betting platforms linked or promoted on this site. All users participate at their own risk.</p>
            <span className="ftc">© 2026 NIKSI777</span>
          </div>
        </div>
      </footer>
    </>);
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
