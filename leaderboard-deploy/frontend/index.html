<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIKSI777</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#060d1a;--s1:#0a1424;--s2:#0e1a2e;--b1:rgba(255,255,255,.05);--b2:rgba(255,255,255,.09);--b3:rgba(255,255,255,.16);--tx:#dde3ef;--mu:rgba(221,227,239,.75);--ac:#4a9eff;--rd:#e03535;--gold:#d4af5a}
    html,body{background-color:var(--bg);background-image:radial-gradient(circle,rgba(100,160,255,.08) 1px,transparent 1px);background-size:28px 28px;color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 900px 600px at 0% 0%,rgba(74,158,255,.12),transparent 60%),radial-gradient(ellipse 700px 700px at 100% 100%,rgba(30,100,220,.08),transparent 60%)}
    @keyframes pu{0%,100%{opacity:1}50%{opacity:.15}}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .f1{animation:fu .5s ease both}.f2{animation:fu .5s .1s ease both}.f3{animation:fu .5s .2s ease both}

    nav{background:rgba(6,13,26,.97);border-bottom:1px solid var(--b2);position:sticky;top:0;z-index:50}
    .ni{max-width:1020px;margin:0 auto;padding:0 28px;display:flex;align-items:center;height:56px}
    .nlogo{display:flex;align-items:center;gap:10px;padding-right:22px;border-right:1px solid var(--b2);margin-right:18px;flex-shrink:0;text-decoration:none}
    .nlogo img{height:28px;width:28px;border-radius:50%;object-fit:cover}
    .nname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.16em;color:#fff;text-transform:uppercase}
    .nlinks{display:flex;align-items:center;flex:1}
    .nlinks a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:0 13px;height:56px;display:flex;align-items:center;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;margin-bottom:-1px}
    .nlinks a:hover{color:rgba(255,255,255,.9)}
    .nlinks a.on{color:#fff;border-bottom-color:rgba(255,255,255,.5)}
    .nsoc{margin-left:auto;display:flex;align-items:center;gap:2px;padding-left:16px;border-left:1px solid var(--b2)}
    .nsoc a{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;opacity:.5;transition:opacity .15s}
    .nsoc a:hover{opacity:1;background:rgba(255,255,255,.05)}
    .nsoc svg{width:15px;height:15px}
    .hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:32px;height:32px;cursor:pointer;margin-left:auto;padding:4px;background:none;border:none}
    .hamburger span{display:block;height:1.5px;background:rgba(255,255,255,.6);border-radius:2px;transition:all .2s}
    .drawer{display:none;flex-direction:column;background:rgba(7,8,12,.99);border-bottom:1px solid var(--b2);padding:10px 28px 18px}
    .drawer.open{display:flex}
    .drawer a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--b1);transition:color .15s}
    .drawer a:last-of-type{border-bottom:none}
    .drawer a.on,.drawer a:hover{color:#fff}
    .drawer-soc{display:flex;align-items:center;gap:8px;padding-top:14px}
    .drawer-soc a{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--s1);border:1px solid var(--b2);opacity:.7}
    .drawer-soc svg{width:15px;height:15px}

    .page{max-width:1020px;margin:0 auto;padding:0 28px}

    .hero{padding:56px 0 44px;text-align:center}
    .htag{display:inline-flex;align-items:center;gap:7px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);border:1px solid rgba(184,204,232,.15);padding:4px 14px;border-radius:100px;margin-bottom:20px}
    .pdot{width:5px;height:5px;border-radius:50%;background:var(--ac);animation:pu 2s ease-in-out infinite;flex-shrink:0}
    .benefits{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto 1fr;gap:10px;margin-bottom:8px;align-items:stretch}
    .bcard{border-radius:12px;padding:18px 14px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;background:var(--s1);border:1px solid rgba(255,255,255,.06);border-top:2px solid var(--bc-accent,rgba(255,255,255,.15));transition:transform .18s,border-color .18s}
    .bcard:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.1)}
    .bcard-val{font-family:'Barlow Condensed',sans-serif;font-size:clamp(22px,2.8vw,32px);font-weight:800;letter-spacing:.02em;line-height:1;text-align:center;color:var(--bc-color,#fff)}
    .bcard-lbl{font-family:'Inter',sans-serif;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(221,227,239,.45);text-align:center;line-height:1.5;margin-top:1px}
    .benefits-arrow{display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(255,255,255,.2);flex-shrink:0}
    .bfeature{display:flex;align-items:center;gap:24px;border-radius:12px;padding:20px 24px;background:var(--s1);border:1px solid rgba(255,255,255,.06);border-left:3px solid #e8a427;text-decoration:none;color:inherit;transition:transform .18s,border-color .18s;margin-bottom:0}
    .bfeature:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.1)}
    .bfeature-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(20px,2.5vw,28px);font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#e8a427;white-space:nowrap}
    .bfeature-desc{font-family:'Inter',sans-serif;font-size:12px;color:rgba(221,227,239,.5);line-height:1.6;flex:1}
    .bfeature-cta{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;white-space:nowrap;display:flex;align-items:center;gap:6px;opacity:.7}
    @media(max-width:600px){.bfeature{flex-direction:column;align-items:flex-start;gap:10px}.bfeature-title,.bfeature-cta{white-space:normal}}
    .bc-gold{--bc-accent:#e8a427;--bc-color:#e8a427}
    .bc-green{--bc-accent:#22c55e;--bc-color:#22c55e}
    .bc-blue{--bc-accent:#4a90d9;--bc-color:#4a90d9}
    .bc-purple{--bc-accent:#9b59d9;--bc-color:#b07ee0}
    .bc-white{--bc-accent:rgba(255,255,255,.5);--bc-color:#fff;border-top-width:2px}
    .bc-white .bcard-val{font-size:clamp(16px,2vw,22px);letter-spacing:.12em}
    @media(max-width:800px){.benefits{grid-template-columns:1fr 1fr 1fr}.benefits-arrow{display:none}.bc-white{grid-column:1/-1}}
    @media(max-width:500px){.benefits{grid-template-columns:1fr 1fr}}

    .ocard{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;color:inherit;transition:transform .2s;width:100%;text-decoration:none}
    .ocard:hover{transform:translateY(-3px)}
    .obanner{height:160px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;background:#0e1018;border:1px solid var(--b2);border-bottom:none;border-radius:14px 14px 0 0}
    .obanner img{max-height:200px;max-width:260px;object-fit:contain;opacity:.95}
    .obadge{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:100px;color:rgba(255,255,255,.8);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
    .olive{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--rd)}
    .olive::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--rd);animation:pu 1.5s ease-in-out infinite}
    .obody{padding:24px;display:flex;flex-direction:column;gap:18px;border:1px solid var(--b2);border-top:2px solid rgba(255,255,255,.28);border-radius:0 0 14px 14px;background:var(--s1);flex:1;text-align:center}
    .oprize-lbl{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
    .oprize{font-family:'Barlow Condensed',sans-serif;font-size:clamp(48px,6vw,64px);font-weight:800;letter-spacing:.01em;line-height:1;color:#fff}
    .oprog-head{display:flex;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--mu);margin-bottom:6px}
    .otrack{height:2px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
    .ofill{height:100%;border-radius:99px;background:rgba(255,255,255,.45);transition:width .9s ease}
    .ometa{display:flex;align-items:center;gap:10px}
    .otimer{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--mu)}
    .otimer span{color:var(--tx)}
    .obtn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .octa{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:13px;border-radius:8px;background:#fff;color:#07080c;transition:opacity .15s;text-decoration:none}
    .octa:hover{opacity:.82}
    .octa svg{width:13px;height:13px;flex-shrink:0}
    .octa-sec{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:13px;border-radius:8px;background:transparent;color:var(--mu);border:1px solid var(--b2);transition:all .15s;text-decoration:none}
    .octa-sec:hover{color:#fff;border-color:var(--b3)}
    .octa-sec svg{width:13px;height:13px;flex-shrink:0}
    .qzino-banner{border-color:rgba(130,200,60,.2) !important}
    .qzino-body{border-color:rgba(130,200,60,.2) !important;border-top-color:rgba(130,200,60,.5) !important}
    .qzino-badge{color:rgba(150,220,80,.9) !important;background:rgba(130,200,60,.08) !important;border-color:rgba(130,200,60,.2) !important}
    .qzino-desc{font-size:14px;line-height:1.7;color:var(--mu);flex:1}
    .qzino-desc strong{color:rgba(221,227,239,.9);font-weight:600}
    .qzino-cta{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:13px;border-radius:8px;background:linear-gradient(135deg,#7ac832,#4a9e1a);color:#fff;transition:opacity .15s;text-decoration:none;margin-top:auto}
    .qzino-cta:hover{opacity:.85}
    .qzino-cta svg{width:13px;height:13px;flex-shrink:0}

    .packy-banner{border-color:rgba(0,178,245,.2) !important}
    .packy-body{border-color:rgba(0,178,245,.2) !important;border-top-color:rgba(0,178,245,.5) !important}
    .packy-badge{color:rgba(0,200,255,.9) !important;background:rgba(0,178,245,.08) !important;border-color:rgba(0,178,245,.2) !important}
    .packy-prize{font-family:'Barlow Condensed',sans-serif;font-size:clamp(48px,6vw,64px);font-weight:800;letter-spacing:.01em;line-height:1;color:#00b2f5}
    .packy-cta{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:13px;border-radius:8px;background:linear-gradient(135deg,#00b2f5,#0080c8);color:#fff;transition:opacity .15s;text-decoration:none}
    .packy-cta:hover{opacity:.85}
    .packy-cta svg{width:13px;height:13px;flex-shrink:0}

    .offers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding-bottom:40px}
    @media(max-width:900px){.offers{grid-template-columns:1fr 1fr}}
    @media(max-width:600px){.offers{grid-template-columns:1fr}}

    footer{border-top:1px solid var(--b1);padding:22px 0}
    .ftw{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .ftd{font-size:12px;line-height:1.6;color:var(--mu);max-width:500px}
    .ftd strong{color:rgba(221,227,239,.9)}
    .ftc{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);white-space:nowrap}

    @media(max-width:680px){
      .nlinks,.nsoc{display:none}
      .hamburger{display:flex}
      .nlogo{border-right:none;margin-right:0;padding-right:0}
      .hero{padding:36px 0 28px}
      .offers{grid-template-columns:1fr}
      .oprize{font-size:52px}
      .ftw{flex-direction:column;align-items:flex-start}
    }

    .nauth{display:flex;align-items:center;gap:8px;padding-left:12px;flex-shrink:0}
    .ndrop{position:relative}
    .ndrop-menu{display:none;position:absolute;top:100%;right:0;padding-top:6px;z-index:200;min-width:150px}
    .ndrop:hover .ndrop-menu{display:block}
    .ndrop-box{background:rgba(7,8,12,.97);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
    .ndrop-item{display:block;width:100%;text-align:left;padding:9px 14px;font-size:12px;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(221,227,239,.75);text-decoration:none;background:none;border:none;cursor:pointer;border-radius:6px;transition:background .1s;box-sizing:border-box}
    .ndrop-item:hover{background:rgba(255,255,255,.06)}
    .ndrop-logout{color:rgba(217,79,79,.8)}
    .nlogin-btn{display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:7px;background:#22c55e;color:#fff;border:none;cursor:pointer;transition:opacity .15s;text-decoration:none;white-space:nowrap;flex-shrink:0}
    .nlogin-btn:hover{opacity:.85}
    .nuser{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:7px;background:var(--s1);border:1px solid var(--b2);cursor:pointer;transition:border-color .15s}
    .nuser:hover{border-color:var(--b3)}
    .nuser-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--s2)}
    .nuser-name{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--tx)}
    .nuser-NP{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#d4af5a}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

  const CASE_THEMES={
    starter:{lid:'#1a3a6a',body:'#0d1e38',accent:'#4a90d9',glow:'rgba(74,144,217,.5)',stars:1,stripe:'rgba(74,144,217,.15)'},
    mega:   {lid:'#3a2000',body:'#1e1000',accent:'#e8a427',glow:'rgba(232,164,39,.6)',stars:4,stripe:'rgba(232,164,39,.15)'},
  };
  function CaseGraphic({id,size=80}){
    const t=CASE_THEMES[id]||CASE_THEMES.mega;
    const FW=84,FH=70,LID=24,DX=26,DY=16,VW=FW+DX,VH=FH+DY;
    const cx=FW/2,lidY=DY+LID,logoR=13,logoCX=cx,logoCY=lidY+(FH-LID)/2,a=t.accent;
    
    function rr(ctx,x,y,w,h,r){return `M${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x+r},${y+h} Q${x},${y+h} ${x},${y+h-r} L${x},${y+r} Q${x},${y} ${x+r},${y} Z`;}
    return(
      <svg viewBox={`0 0 ${VW} ${VH}`} width={size} height={Math.round(size*VH/VW)} style={{display:'block',filter:`drop-shadow(0 8px 20px ${t.glow})`}}>
        <defs>
          <linearGradient id={`gfi-${id}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={t.lid}/><stop offset="100%" stopColor={t.body}/></linearGradient>
          <linearGradient id={`gli-${id}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={t.lid} stopOpacity=".9"/><stop offset="100%" stopColor={t.lid} stopOpacity=".6"/></linearGradient>
          <clipPath id={`lci-${id}`}><circle cx={logoCX} cy={logoCY} r={logoR}/></clipPath>
        </defs>
        <polygon points={`0,${DY} ${DX},0 ${VW},0 ${FW},${DY}`} fill={t.lid}/><polygon points={`0,${DY} ${DX},0 ${VW},0 ${FW},${DY}`} fill="rgba(255,255,255,.13)"/>
        <polygon points={`${FW},${DY} ${VW},0 ${VW},${LID} ${FW},${lidY}`} fill={t.body}/><polygon points={`${FW},${DY} ${VW},0 ${VW},${LID} ${FW},${lidY}`} fill="rgba(0,0,0,.4)"/>
        <polygon points={`${FW},${lidY} ${VW},${LID} ${VW},${FH} ${FW},${FH+DY}`} fill={t.body}/><polygon points={`${FW},${lidY} ${VW},${LID} ${VW},${FH} ${FW},${FH+DY}`} fill="rgba(0,0,0,.55)"/>
        <rect x="0" y={DY} width={FW} height={LID} fill={`url(#gli-${id})`}/>
        <rect x="0" y={lidY} width={FW} height={FH-LID} fill={`url(#gfi-${id})`}/>
        <rect x="0" y={lidY} width={FW} height={FH-LID} fill={t.stripe} opacity=".5"/>
        <line x1="0" y1={lidY} x2={FW} y2={lidY} stroke={a} strokeWidth="2" strokeOpacity=".8"/>
        <line x1={FW} y1={lidY} x2={VW} y2={LID} stroke={a} strokeWidth="1.5" strokeOpacity=".6"/>
        <polyline points={`0,${DY+11} 0,${DY} 11,${DY}`} fill="none" stroke={a} strokeWidth="3" strokeLinecap="square" strokeOpacity=".85"/>
        <polyline points={`${FW-11},${DY} ${FW},${DY} ${FW},${DY+11}`} fill="none" stroke={a} strokeWidth="3" strokeLinecap="square" strokeOpacity=".85"/>
        <polyline points={`0,${FH+DY-11} 0,${FH+DY} 11,${FH+DY}`} fill="none" stroke={a} strokeWidth="3" strokeLinecap="square" strokeOpacity=".85"/>
        <polyline points={`${FW-11},${FH+DY} ${FW},${FH+DY} ${FW},${FH+DY-11}`} fill="none" stroke={a} strokeWidth="3" strokeLinecap="square" strokeOpacity=".85"/>
        <line x1={FW} y1={DY} x2={VW} y2="0" stroke={a} strokeWidth="2.5" strokeLinecap="round" strokeOpacity=".7"/>
        <line x1={FW} y1={FH+DY} x2={VW} y2={FH} stroke={a} strokeWidth="2.5" strokeLinecap="round" strokeOpacity=".6"/>
        <rect x={cx-9} y={lidY-7} width="18" height="13" rx="3" fill={t.body} stroke={a} strokeWidth="1.5"/>
        <path d={`M ${cx-5} ${lidY-7} a5 5 0 0 1 10 0`} fill="none" stroke={a} strokeWidth="1.8" strokeLinecap="round"/>
        <circle cx={cx} cy={lidY} r="2.5" fill={a} opacity=".9"/>
        <circle cx={logoCX} cy={logoCY} r={logoR+3} fill="rgba(0,0,0,.3)" stroke={a} strokeWidth="1.5" strokeOpacity=".7"/>
        <image href="/assets/niksi.png" x={logoCX-logoR} y={logoCY-logoR} width={logoR*2} height={logoR*2} clipPath={`url(#lci-${id})`}/>
      </svg>
    );
  }

  const RACES = {
    gamba:   { prize:1500, start:new Date("2026-05-31T00:00:00Z"), end:new Date("2026-06-14T23:59:59Z"), visible:true  },
    chancer: { prize:2000, start:new Date("2026-04-23T14:00:00Z"), end:new Date("2026-05-13T14:00:00Z"), visible:false },
  };
  const VISIBLE = Object.entries(RACES).filter(([,r])=>r.visible).map(([k])=>k);
  const PACKY_PRIZE = 1000;
  const PACKY_START = new Date("2026-06-06T00:00:00Z");
  const PACKY_END   = new Date("2026-06-20T00:00:00Z");

  function fmtCD(target){
    const ms=target-Date.now(); if(ms<=0)return"Ended";
    const d=Math.floor(ms/86400000),h=Math.floor(ms/3600000%24),m=Math.floor(ms/60000%60),s=Math.floor(ms/1000%60);
    return d>0?`${d}d ${h}h ${m}m ${s}s`:`${h}h ${m}m ${s}s`;
  }
  function racePct(s,e){return Math.min(100,Math.max(0,Math.round((Date.now()-s)/(e-s)*100)))}
  function useCountdown(target){
    const [v,setV]=React.useState(()=>fmtCD(target));
    React.useEffect(()=>{const id=setInterval(()=>setV(fmtCD(target)),1000);return()=>clearInterval(id);},[]);
    return v;
  }
  function useAnimNum(target,dur=1400){
    const [v,setV]=React.useState(0);
    React.useEffect(()=>{
      const t0=Date.now();
      const id=setInterval(()=>{const p=Math.min((Date.now()-t0)/dur,1);setV(Math.floor((1-Math.pow(1-p,3))*target));if(p>=1)clearInterval(id);},16);
      return()=>clearInterval(id);
    },[target]);
    return v;
  }

      const sid = params.get('session') || localStorage.getItem('kick_session');
      if (sid) {
        localStorage.setItem('kick_session', sid);
        setSessionId(sid);
        fetch('/auth/me?session=' + sid)
          .then(r => r.ok ? r.json() : null)
          .then(d => { if (d) setUser(d); else localStorage.removeItem('kick_session'); })
          .catch(() => {});
        if (params.get('session')) window.history.replaceState({}, '', window.location.pathname);
      }
    }, []);
    function logout() {
      const sid = localStorage.getItem('kick_session');
      if (sid) fetch('/auth/logout?session=' + sid);
      localStorage.removeItem('kick_session');
      setUser(null);
    }
    return { user, sessionId, logout };
