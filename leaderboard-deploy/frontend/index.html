<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>NIKSI777</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body class="bg-[#0f172a] text-white">
<div id="root"></div>

<script type="text/babel">

function App() {
  const [timeLeft, setTimeLeft] = React.useState("");
  const [displayAmount, setDisplayAmount] = React.useState(0);
  const raceEnd = new Date("2026-04-03T01:00:00");

  React.useEffect(() => {

    const updateTimer = () => {
      const now = Date.now();
      const distance = raceEnd - now;

      if (distance <= 0) {
        setTimeLeft("Race Ended");
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / (1000 * 60)) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      setTimeLeft(`${days}d ${hours}h ${minutes}m ${seconds}s`);
    };

    updateTimer();
    const interval = setInterval(updateTimer, 1000);
    return () => clearInterval(interval);

  }, []);

  React.useEffect(() => {
    const startTime = Date.now();
    const duration = 1500;
    const end = 1500;

    const timer = setInterval(() => {
      const now = Date.now();
      const progress = Math.min((now - startTime) / duration, 1);

      const value = Math.floor(progress * end);
      setDisplayAmount(value);

      if (progress === 1) {
        clearInterval(timer);
      }
    }, 16);

    return () => clearInterval(timer);
  }, []);

  return (
    <div className="min-h-screen">

      {/* NAVBAR */}
      <div className="fixed top-0 left-0 w-full z-50 flex justify-center py-4">
        <div className="flex items-center gap-8 px-8 py-3 
                        bg-white/5 backdrop-blur-xl
                        border border-white/10
                        rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.5)]">

          {/* LOGO */}
          <a href="/" className="flex items-center">
            <img 
              src="/assets/niksi.png"
              className="h-8 object-contain opacity-90 hover:opacity-100 transition"
            />
          </a>

          {/* LINKS */}
          <a href="/" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
            HOME
          </a>

          <a href="/giveaway.html" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
            GIVEAWAY
          </a>

          {/* SOCIAL ICONS */}
          <div className="flex items-center gap-4 ml-2">

            <a href="https://kick.com/niksi777" target="_blank" className="hover:scale-110 transition duration-300">
              <img src="https://cdn.simpleicons.org/kick/22c55e"
                   className="h-5 opacity-70 hover:opacity-100" />
            </a>

            <a href="https://discord.com/invite/Gnyv25SHg7" target="_blank" className="hover:scale-110 transition duration-300">
              <img src="https://cdn.simpleicons.org/discord/5865F2"
                   className="h-5 opacity-70 hover:opacity-100" />
            </a>

            <a href="https://x.com/code_niksi777" target="_blank" className="hover:scale-110 transition duration-300">
              <img src="https://cdn.simpleicons.org/x/ffffff"
                   className="h-5 opacity-70 hover:opacity-100" />
            </a>

          </div>

        </div>
      </div>

      {/* HERO SECTION */}
      <div className="relative pt-28 pb-20 px-6 bg-gradient-to-b from-[#111827] to-[#0f172a]">
        <div className="max-w-6xl mx-auto">

          {/* TITLE */}
          <h1 className="text-5xl font-bold tracking-tight mt-6 text-center">
            WELCOME TO NIKSI777'S WEBSITE!
          </h1>

        </div>
      </div>

      {/* GAMBA CARD SECTION */}
      <div className="max-w-5xl mx-auto mb-20 px-6">

        <div className="flex justify-center">

          <a
            href="/gamba.html"
            className="group relative flex flex-col items-center justify-center 
               bg-[#111827] border border-white/10 
               rounded-3xl px-12 py-10 
               shadow-2xl 
               hover:bg-white/5 transition-all duration-300"
          >

            <div className="absolute top-4 left-4">
              <div className="px-3 py-1 text-[11px] font-semibold rounded-full 
                              bg-red-500/20 text-red-400 
                              shadow-[0_0_12px_rgba(239,68,68,0.7)] 
                              animate-pulse tracking-wide">
                LIVE
              </div>
            </div>

            <img
              src="/assets/gamba.png"
              alt="Gamba"
              className="h-14 object-contain mb-6 
                         group-hover:scale-105 
                         transition-transform duration-300"
            />

            <div className="text-center">

              <div className="flex justify-center">
                <div className="text-5xl font-bold text-green-400 
                                drop-shadow-[0_0_12px_rgba(34,197,94,0.9)] 
                                font-mono min-w-[200px] text-center">
                  ${displayAmount.toLocaleString("en-US")}
                </div>
              </div>

              <div className="text-base font-semibold tracking-widest text-white/90 mt-2">
                LEADERBOARD
              </div>

              <p className="mt-3 text-sm text-gray-400">
                ENDS IN: {timeLeft}
              </p>

            </div>

          </a>

        </div>

      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
<!-- FOOTER -->

  <!-- DISCLAIMER BOX -->
  <div class="max-w-4xl mx-auto mb-8 bg-[#062f2f]/60 border border-green-400/20 rounded-xl px-6 py-4 text-sm text-gray-300 flex items-start gap-4">

    <div class="text-green-400 text-lg mt-1">18+</div>

    <div class="text-left leading-relaxed">
      We do not take responsibility for any losses from gambling in casinos and betting sites which are linked or promoted on our website(s). As a player, you are responsible for your bets.
    </div>

  </div>

  <!-- COPYRIGHT -->
  <div class="text-gray-400 text-sm">
    © 2025 niksi777.com. All Rights Reserved.
  </div>

</div>
  
</body>
</html>
