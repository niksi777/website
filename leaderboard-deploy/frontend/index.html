<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIKSI777</title>

  <style>
    @keyframes gradientMove {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-30px, 30px); }
    }

    .animate-gradientMove {
      animation: gradientMove 12s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .animate-float {
      animation: float 8s ease-in-out infinite;
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-[#0f172a] text-white min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- BACKGROUND -->
  <div class="fixed inset-0 -z-10 animate-gradientMove
    bg-[radial-gradient(circle_at_20%_20%,rgba(255,255,255,0.06),transparent_40%),
        radial-gradient(circle_at_80%_0%,rgba(148,163,184,0.08),transparent_40%)]">
  </div>

  <!-- WATERMARK -->
  <div class="fixed inset-0 -z-10 flex items-center justify-center pointer-events-none">
    <img src="/assets/niksi.png"
         class="w-[500px] opacity-[0.05] blur-[1px] animate-float" />
  </div>

  <div id="root" class="flex-grow relative z-10"></div>

<script type="text/babel">
function App() {
  const [gambaTimeLeft, setGambaTimeLeft] = React.useState("");
  const [chancerTimeLeft, setChancerTimeLeft] = React.useState("");
  const [gambaAmount, setGambaAmount] = React.useState(0);
  const [chancerAmount, setChancerAmount] = React.useState(0);

  const showChancer = false; // 🔥 CHANGE TO TRUE WHEN READY

  const gambaRaceEnd = React.useMemo(() => new Date("2026-04-16T23:15:00Z"), []);
  const chancerRaceEnd = React.useMemo(() => new Date(Date.now() + 20 * 24 * 60 * 60 * 1000), []);

  const formatCountdown = (targetDate) => {
    const distance = targetDate.getTime() - Date.now();
    if (distance <= 0) return "Race Ended";

    const d = Math.floor(distance / (1000 * 60 * 60 * 24));
    const h = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const m = Math.floor((distance / (1000 * 60)) % 60);
    const s = Math.floor((distance / 1000) % 60);

    return `${d}d ${h}h ${m}m ${s}s`;
  };

  React.useEffect(() => {
    const update = () => {
      setGambaTimeLeft(formatCountdown(gambaRaceEnd));
      setChancerTimeLeft(formatCountdown(chancerRaceEnd));
    };
    update();
    const interval = setInterval(update, 1000);
    return () => clearInterval(interval);
  }, []);

  React.useEffect(() => {
    const start = Date.now();
    const duration = 1500;

    const timer = setInterval(() => {
      const progress = Math.min((Date.now() - start) / duration, 1);
      setGambaAmount(Math.floor(progress * 1500));
      setChancerAmount(Math.floor(progress * 2000));
      if (progress >= 1) clearInterval(timer);
    }, 16);

    return () => clearInterval(timer);
  }, []);

  return (
    <div>

      {/* NAVBAR */}
      <div className="fixed top-0 left-0 w-full z-50 flex justify-center py-4">
        <div className="flex items-center gap-8 px-8 py-3 bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.5)]">

          <a href="/">
            <img src="/assets/niksi.png" className="h-8" />
          </a>

          <a href="/" className="text-white/70 hover:text-white">HOME</a>

          <div className="relative group">
            <div className="text-white/70 hover:text-white cursor-pointer">
              LEADERBOARDS
            </div>

            <div className="absolute left-1/2 -translate-x-1/2 mt-3 w-56 bg-[#0b1220] border border-white/10 rounded-xl shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition">

              <a href="/gamba.html" className="block px-4 py-3 hover:bg-white/5">
                GAMBA $1,500
              </a>

              {showChancer && (
                <a href="/chancer.html" className="block px-4 py-3 hover:bg-white/5">
                  CHANCER $2,000
                </a>
              )}

            </div>
          </div>

          <a href="/giveaway.html" className="text-white/70 hover:text-white">
            GIVEAWAY
          </a>

        </div>
      </div>

      {/* MAIN */}
      <div className="max-w-6xl mx-auto px-6 pt-28 pb-16">

        <h1 className="text-2xl text-center mb-6">LIVE LEADERBOARD</h1>

        <div className="grid gap-6">

          {/* GAMBA */}
          <a href="/gamba.html" className="block bg-[#111827] p-10 rounded-3xl">
            <img src="/assets/gamba2.png" className="h-16 mx-auto mb-4" />

            <div className="text-center text-5xl mb-3">
              ${gambaAmount.toLocaleString()}
            </div>

            <div className="text-center text-sm">
              ENDS IN: {gambaTimeLeft}
            </div>
          </a>

          {/* CHANCER (HIDDEN) */}
          {showChancer && (
            <a href="/chancer.html" className="block bg-[#111827] p-10 rounded-3xl border border-yellow-400/20">
              <img src="/assets/chancer.png" className="h-32 mx-auto mb-4" />

              <div className="text-center text-5xl text-yellow-400 mb-3">
                ${chancerAmount.toLocaleString()}
              </div>

              <div className="text-center text-sm text-yellow-300">
                ENDS IN: {chancerTimeLeft}
              </div>
            </a>
          )}

        </div>

      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
