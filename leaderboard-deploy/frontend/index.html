<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>NIKSI777</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body class="bg-[#0f172a] text-white">
<div id="root"></div>

<script type="text/babel">

function App() {
  const [timeLeft, setTimeLeft] = React.useState("");
  const [displayAmount, setDisplayAmount] = React.useState(0);
  const raceEnd = new Date("2026-04-03T01:00:00");

  React.useEffect(() => {
    const timer = setInterval(() => {
      const now = Date.now();
      const diff = raceEnd - now;

      if (diff <= 0) {
        setTimeLeft("Race Ended");
        clearInterval(timer);
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const m = Math.floor((diff / (1000 * 60)) % 60);
      const s = Math.floor((diff / 1000) % 60);

      setTimeLeft(`${d}d ${h}h ${m}m ${s}s`);
    }, 1000);

    return () => clearInterval(timer);
  }, []);

  React.useEffect(() => {
  const startTime = Date.now();
  const duration = 1500;
  const end = 1500;

  const timer = setInterval(() => {
    const now = Date.now();
    const progress = Math.min((now - startTime) / duration, 1);

    const value = Math.floor(progress * end);
    setDisplayAmount(value);

    if (progress === 1) {
      clearInterval(timer);
    }
  }, 16);

  return () => clearInterval(timer);
}, []);

  return (
    <div className="min-h-screen">

      {/* HERO SECTION */}
      <div className="relative py-20 px-6 bg-gradient-to-b from-[#111827] to-[#0f172a]">
        <div className="max-w-5xl mx-auto text-center">

          {/* MENU */}
          <div className="flex justify-center mb-8">
            <nav className="flex items-center gap-10 px-8 py-4 
                            bg-white/5 backdrop-blur-md 
                            border border-white/10 
                            rounded-2xl shadow-lg">

              <a href="/" className="text-sm tracking-wide text-white/70 hover:text-white transition">
                HOME
              </a>

              <a href="/giveaway.html" className="text-sm tracking-wide text-white/70 hover:text-white transition">
                GIVEAWAY
              </a>

            </nav>
          </div>

          {/* SOCIAL ICONS */}
          <div className="flex justify-center gap-6 mb-8">

            <a href="https://kick.com/niksi777" target="_blank" className="hover:scale-110 transition duration-300">
              <img src="https://cdn.simpleicons.org/kick/22c55e"
                   className="h-8 opacity-80 hover:opacity-100 drop-shadow-[0_0_10px_rgba(34,197,94,0.8)]" />
            </a>

            <a href="https://discord.gg/YOUR_INVITE" target="_blank" className="hover:scale-110 transition duration-300">
              <img src="https://cdn.simpleicons.org/discord/5865F2"
                   className="h-8 opacity-80 hover:opacity-100 drop-shadow-[0_0_10px_rgba(88,101,242,0.8)]" />
            </a>

            <a href="https://twitter.com/YOUR_HANDLE" target="_blank" className="hover:scale-110 transition duration-300">
              <img src="https://cdn.simpleicons.org/x/ffffff"
                   className="h-8 opacity-80 hover:opacity-100 drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]" />
            </a>

          </div>

          {/* TITLE */}
          <h1 className="text-5xl font-bold tracking-tight mt-6">
            WELCOME TO NIKSI777'S WEBSITE!
          </h1>

          {/* LOGO */}
          <div className="mt-6">
            <img 
              src="/assets/niksi.png"
              className="h-36 mx-auto object-contain opacity-90"
            />
          </div>

        </div>
      </div>

      {/* GAMBA CARD SECTION */}
      <div className="max-w-5xl mx-auto mb-20 px-6">

        <div className="flex justify-center">

          <a
            href="/gamba.html"
            className="group relative flex flex-col items-center justify-center 
               bg-[#111827] border border-white/10 
               rounded-3xl px-12 py-10 
               shadow-2xl 
               hover:bg-white/5 transition-all duration-300"
          >
            {/* LIVE BADGE */}
<div className="absolute top-4 left-4">
  <div className="px-3 py-1 text-[11px] font-semibold rounded-full 
                  bg-red-500/20 text-red-400 
                  shadow-[0_0_12px_rgba(239,68,68,0.7)] 
                  animate-pulse tracking-wide">
    LIVE
  </div>
</div>
            <img
              src="/assets/gamba.png"
              alt="Gamba"
              className="h-14 object-contain mb-6 
                         group-hover:scale-105 
                         transition-transform duration-300"
            />

           <div className="text-center">

            {/* AMOUNT */}
            <div className="flex justify-center">
              <div className="text-5xl font-bold text-green-400 
                              drop-shadow-[0_0_12px_rgba(34,197,94,0.9)] 
                              font-mono min-w-[200px] text-center">
                ${displayAmount.toLocaleString("en-US")}
              </div>
            </div>
          
            {/* LEADERBOARD TEXT */}
            <div className="text-base font-semibold tracking-widest text-white/90 mt-2">
              LEADERBOARD
            </div>
          
          
            {/* TIMER */}
            <p className="mt-3 text-sm text-gray-400">
              ENDS IN: {timeLeft}
            </p>
          
          </div>

          </a>

        </div>

      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
