  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body class="bg-[#0f172a] text-white min-h-screen flex flex-col">

<div id="root" class="flex-grow"></div>

<script type="text/babel">

function App() {
  const [timeLeft, setTimeLeft] = React.useState("");
  const [displayAmount, setDisplayAmount] = React.useState(0);
  const raceEnd = new Date("2026-04-03T01:00:00");

  React.useEffect(() => {

    const updateTimer = () => {
      const now = Date.now();
      const distance = raceEnd - now;

      if (distance <= 0) {
        setTimeLeft("Race Ended");
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / (1000 * 60)) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      setTimeLeft(`${days}d ${hours}h ${minutes}m ${seconds}s`);
    };

    updateTimer();
    const interval = setInterval(updateTimer, 1000);
    return () => clearInterval(interval);

  }, []);

  React.useEffect(() => {
    const startTime = Date.now();
    const duration = 1500;
    const end = 1500;

    const timer = setInterval(() => {
      const now = Date.now();
      const progress = Math.min((now - startTime) / duration, 1);

      const value = Math.floor(progress * end);
      setDisplayAmount(value);

      if (progress === 1) {
        clearInterval(timer);
      }
    }, 16);

    return () => clearInterval(timer);
  }, []);

  return (
    <div>

      {/* NAVBAR */}
      <div className="fixed top-0 left-0 w-full z-50 flex justify-center py-4">
        <div className="flex items-center gap-8 px-8 py-3 
                        bg-white/5 backdrop-blur-xl
                        border border-white/10
                        rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.5)]">

          <a href="/" className="flex items-center">
            <img 
              src="/assets/niksi.png"
              className="h-8 object-contain opacity-90 hover:opacity-100 transition"
            />
          </a>

          <a href="/" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
            HOME
          </a>
          <a href="/leaderboards.html" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">LEADERBOARDS
          </a>
          <a href="/giveaway.html" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
            GIVEAWAY
          </a>

          <div className="flex items-center gap-4 ml-2">

            <a href="https://kick.com/niksi777" target="_blank">
              <img src="https://cdn.simpleicons.org/kick/22c55e"
                   className="h-5 opacity-70 hover:opacity-100" />
            </a>

            <a href="https://discord.com/invite/Gnyv25SHg7" target="_blank">
              <img src="https://cdn.simpleicons.org/discord/5865F2"
                   className="h-5 opacity-70 hover:opacity-100" />
            </a>

            <a href="https://x.com/code_niksi777" target="_blank">
              <img src="https://cdn.simpleicons.org/x/ffffff"
                   className="h-5 opacity-70 hover:opacity-100" />
            </a>

          </div>

        </div>
      </div>

      {/* HERO */}
      <div className="relative pt-28 pb-20 px-6 bg-gradient-to-b from-[#111827] to-[#0f172a]">
        <div className="max-w-6xl mx-auto">

          <h1 className="text-5xl font-bold tracking-tight mt-6 text-center">
            WELCOME TO NIKSI777'S WEBSITE!
          </h1>

        </div>
      </div>

      {/* SPLIT SECTION */}
<div className="max-w-6xl mx-auto px-6 pb-16 grid md:grid-cols-2 gap-10 items-center">

  {/* LEFT SIDE — LEADERBOARD */}
  <div className="flex justify-center md:justify-start">
    <a
      href="/gamba.html"
      className="group relative flex flex-col items-center justify-center 
         bg-[#111827] border border-white/10 
         rounded-3xl px-12 py-10 
         shadow-2xl 
         hover:bg-white/5 transition-all duration-300 w-full max-w-md"
    >

      {/* LIVE BADGE */}
      <div className="absolute top-4 left-4">
        <div className="px-3 py-1 text-[11px] font-semibold rounded-full 
                        bg-red-500/20 text-red-400 
                        shadow-[0_0_12px_rgba(239,68,68,0.7)] 
                        animate-pulse tracking-wide">
          LIVE
        </div>
      </div>

      <img
        src="/assets/gamba.png"
        className="h-14 object-contain mb-6"
      />

      <div className="text-center">

        <div className="text-5xl font-bold text-green-400 font-mono">
          ${displayAmount.toLocaleString("en-US")}
        </div>

        <div className="text-base font-semibold tracking-widest text-white/90 mt-2">
          LEADERBOARD
        </div>

        <p className="mt-3 text-sm text-gray-400">
          ENDS IN: {timeLeft}
        </p>

      </div>

    </a>
  </div>

 {/* RIGHT SIDE — BONUS CARD */}
<div className="flex justify-center md:justify-end">

  <div className="w-full max-w-md bg-[#020617] border border-green-400/20 
                  rounded-2xl p-6 shadow-[0_0_30px_rgba(34,197,94,0.15)]">

    {/* LOGO BOX */}
    <div className="bg-[#1e293b] rounded-xl p-6 flex justify-center mb-6">
      <img src="/assets/gamba.png" className="h-12 opacity-90" />
    </div>

    {/* LINK BOX */}
    <div className="bg-[#020617] border border-green-400/20 rounded-xl px-4 py-3 text-sm text-gray-400 mb-6 text-center">
      🔗 gamba.com/?c=niksi

    {/* FEATURES */}
    <div className="text-center text-green-400 font-bold tracking-wider text-sm mb-6 space-y-1">

      rel="noopener noreferrer"
      className="block text-center bg-green-400 text-black font-bold py-3 rounded-xl mb-4 
                 hover:opacity-90 transition"
    >
      CLAIM BONUS
    </a>

    {/* CODE */}
    <div className="border border-dashed border-green-400/30 rounded-xl py-3 text-center text-sm text-gray-300">
      USE CODE <span className="text-green-400 font-bold">"NIKSI"</span>
    </div>

  </div>

</div>

</div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
