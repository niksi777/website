  <script src="https://cdn.tailwindcss.com"></script>

<script type="text/babel">

function App() {
  const [timeLeft, setTimeLeft] = React.useState("");
  const [displayAmount, setDisplayAmount] = React.useState(0);
  const raceEnd = new Date("2026-04-16T23:15:00Z");

  React.useEffect(() => {
    const updateTimer = () => {
      const distance = raceEnd - Date.now();

      if (distance <= 0) {
        setTimeLeft("Race Ended");
        return;
      }

      const d = Math.floor(distance / (1000*60*60*24));
      const h = Math.floor((distance / (1000*60*60)) % 24);
      const m = Math.floor((distance / (1000*60)) % 60);
      const s = Math.floor((distance / 1000) % 60);

      setTimeLeft(`${d}d ${h}h ${m}m ${s}s`);
    };

    updateTimer();
    const interval = setInterval(updateTimer, 1000);
    return () => clearInterval(interval);
  }, []);

  React.useEffect(() => {
    const start = Date.now();
    const duration = 1500;

    const timer = setInterval(() => {
      const progress = Math.min((Date.now() - start) / duration, 1);
      setDisplayAmount(Math.floor(progress * 1500));
      if (progress === 1) clearInterval(timer);
    }, 16);

    return () => clearInterval(timer);
  }, []);

  return (
    <div>

        src="/assets/niksi.png"
        className="h-8 object-contain opacity-90 hover:opacity-100 transition"
      />

      HOME
    </a>

    <div className="relative group" tabIndex="0">

  {/* MAIN BUTTON */}
  <a href="/leaderboards.html"
     className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">

  </a>

  {/* DROPDOWN */}
  <div className="absolute left-1/2 -translate-x-1/2 mt-3 w-40
                  opacity-0 invisible
                  group-hover:opacity-100 group-hover:visible
                  group-focus-within:opacity-100 group-focus-within:visible

    <div className="bg-[#0f172a]/95 backdrop-blur-xl border border-white/10 
                    rounded-xl shadow-lg p-2">

      <a href="/gamba.html"
         className="block px-3 py-2 text-sm text-white/70 hover:text-white hover:bg-white/5 rounded-lg transition">
        $1,500 GAMBA LEADERBOARD
      </a>

      <a href="/acebet.html"
         className="block px-3 py-2 text-sm text-white/70 hover:text-white hover:bg-white/5 rounded-lg transition">
        ACEBET
      </a>

    </div>

  </div>

</div>

    <a href="/giveaway.html" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
      GIVEAWAY
    </a>

    {/* SOCIALS */}
    <div className="flex items-center gap-4 ml-2">

      <a href="https://kick.com/niksi777" target="_blank">
        <img src="https://cdn.simpleicons.org/kick/22c55e"
             className="h-5 opacity-70 hover:opacity-100 transition" />
      </a>

      <a href="https://discord.com/invite/Gnyv25SHg7" target="_blank">
        <img src="https://cdn.simpleicons.org/discord/5865F2"

      <a href="https://x.com/code_niksi777" target="_blank">

             className="h-5 opacity-70 hover:opacity-100 transition" />

</div>

              SIGN UP ON GAMBA

          </div>
        </div>

        <h1 className="text-2xl md:text-3xl font-semibold text-center mb-6">
          LIVE LEADERBOARD

          <div className="grid md:grid-cols-2 gap-8 items-center">
