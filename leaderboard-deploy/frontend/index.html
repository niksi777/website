<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIKSI777</title>

  <style>
    @keyframes gradientMove {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-30px, 30px); }
    }

    .animate-gradientMove {
      animation: gradientMove 12s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .animate-float {
      animation: float 8s ease-in-out infinite;
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-[#0f172a] text-white min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- BACKGROUND -->
  <div class="fixed inset-0 -z-10 animate-gradientMove
    bg-[radial-gradient(circle_at_20%_20%,rgba(255,255,255,0.06),transparent_40%),
        radial-gradient(circle_at_80%_0%,rgba(148,163,184,0.08),transparent_40%)]">
  </div>

  <!-- LOGO WATERMARK -->
  <div class="fixed inset-0 -z-10 flex items-center justify-center pointer-events-none">
    <img
      src="/assets/niksi.png"
      class="w-[500px] opacity-[0.05] blur-[1px] animate-float"
      draggable="false"
      alt="Niksi watermark"
    />
  </div>

  <div id="root" class="flex-grow relative z-10"></div>

  <script type="text/babel">
    function App() {
      const [gambaTimeLeft, setGambaTimeLeft] = React.useState("");
      const [chancerTimeLeft, setChancerTimeLeft] = React.useState("");
      const [gambaAmount, setGambaAmount] = React.useState(0);
      const [chancerAmount, setChancerAmount] = React.useState(0);

      const showChancer = true;

      const gambaRaceEnd = React.useMemo(() => new Date(Date.now() + ((14 * 60 + 12) * 60 * 1000)), []);
      const chancerRaceEnd = React.useMemo(() => new Date("2026-05-07T00:00:00Z"), []);
      
      const formatCountdown = (targetDate) => {
        const distance = targetDate.getTime() - Date.now();
      
        if (distance <= 0) {
          return "Race Ended";
        }
      
        const d = Math.floor(distance / (1000 * 60 * 60 * 24));
        const h = Math.floor((distance / (1000 * 60 * 60)) % 24);
        const m = Math.floor((distance / (1000 * 60)) % 60);
        const s = Math.floor((distance / 1000) % 60);
      
        if (d > 0) {
          return `${d}d ${h}h ${m}m ${s}s`;
        }
      
        return `${h}h ${m}m ${s}s`;
      };

      React.useEffect(() => {
        const updateTimers = () => {
          setGambaTimeLeft(formatCountdown(gambaRaceEnd));
          setChancerTimeLeft(formatCountdown(chancerRaceEnd));
        };

        updateTimers();
        const interval = setInterval(updateTimers, 1000);
        return () => clearInterval(interval);
      }, [gambaRaceEnd, chancerRaceEnd]);

      React.useEffect(() => {
        const start = Date.now();
        const duration = 1500;

        const timer = setInterval(() => {
          const progress = Math.min((Date.now() - start) / duration, 1);
          setGambaAmount(Math.floor(progress * 1500));
          setChancerAmount(Math.floor(progress * 2000));

          if (progress >= 1) {
            clearInterval(timer);
          }
        }, 16);

        return () => clearInterval(timer);
      }, []);

      return (
        <div className="min-h-screen flex flex-col">
          {/* NAVBAR */}
          <div className="fixed top-0 left-0 w-full z-50 flex justify-center py-4">
            <div className="flex items-center gap-8 px-8 py-3 bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.5)]">
              <a href="/" className="flex items-center">
                <img
                  src="/assets/niksi.png"
                  alt="Niksi logo"
                  className="h-8 object-contain opacity-90 hover:opacity-100 transition"
                />
              </a>

              <a href="/" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
                HOME
              </a>

              <div className="relative group">
                <div className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition cursor-pointer">
                  LEADERBOARDS
                </div>

                <div className="absolute left-1/2 -translate-x-1/2 mt-3 w-56 bg-[#0b1220] border border-white/10 rounded-xl shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition duration-200 z-50">
                  <a
                    href="/gamba.html"
                    className="block px-4 py-3 text-sm text-white/70 hover:text-white hover:bg-white/5 rounded-t-xl transition"
                  >
                    GAMBA $1,500 15-DAY
                  </a>

                  {showChancer && (
                    <a
                      href="/chancer.html"
                      className="block px-4 py-3 text-sm text-white/70 hover:text-white hover:bg-white/5 rounded-b-xl transition"
                    >
                      CHANCER $2,000 20-DAY
                    </a>
                  )}
                </div>
              </div>

              <a href="/giveaway.html" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
                GIVEAWAY
              </a>

              <div className="flex items-center gap-4 ml-2">
                <a href="https://kick.com/niksi777" target="_blank" rel="noreferrer">
                  <img
                    src="https://cdn.simpleicons.org/kick/22c55e"
                    alt="Kick"
                    className="h-5 opacity-70 hover:opacity-100 transition"
                  />
                </a>

                <a href="https://discord.com/invite/Gnyv25SHg7" target="_blank" rel="noreferrer">
                  <img
                    src="https://cdn.simpleicons.org/discord/5865F2"
                    alt="Discord"
                    className="h-5 opacity-70 hover:opacity-100 transition"
                  />
                </a>

                <a href="https://x.com/code_niksi777" target="_blank" rel="noreferrer">
                  <img
                    src="https://cdn.simpleicons.org/x/ffffff"
                    alt="X"
                    className="h-5 opacity-70 hover:opacity-100 transition"
                  />
                </a>
              </div>
            </div>
          </div>

          {/* MAIN */}
          <div className="max-w-6xl mx-auto px-6 pt-28 pb-16 flex-grow w-full">
            <div className="mb-5 flex items-center justify-center">
              <a
                href="https://gamba.com?c=niksi"
                target="_blank"
                rel="noreferrer"
                className="inline-block text-center bg-white text-black px-8 py-3 rounded-xl font-bold text-sm"
              >
                SIGN UP ON GAMBA
              </a>
            </div>

            <h1 className="text-2xl md:text-3xl font-semibold text-center mb-6">
              LIVE LEADERBOARD
            </h1>

            <div className="grid md:grid-cols-3 gap-6">
              {/* GAMBA BOX */}
              <a
                href="/gamba.html"
                className="group block bg-[#111827] border border-white/10 rounded-3xl p-8 md:p-10 shadow-[0_0_35px_rgba(255,255,255,0.08)] hover:shadow-[0_0_45px_rgba(255,255,255,0.12)] transition"
              >
                <div className="grid md:grid-cols-2 gap-8 items-center">
                  <div className="bg-[#1e293b] rounded-2xl p-8 flex justify-center relative">
                    <div className="absolute top-4 left-4 text-xs bg-red-500/20 text-red-400 px-2 py-1 rounded animate-pulse">
                      LIVE
                    </div>
                    <img src="/assets/gamba2.png" alt="Gamba logo" className="h-14 md:h-16" />
                  </div>

                  <div className="text-center">
                    <div className="text-xs text-gray-500 mb-2 tracking-widest">PRIZE POOL</div>
                    <div className="text-5xl md:text-6xl font-bold text-white mb-4">
                      ${gambaAmount.toLocaleString("en-US")}
                    </div>

                    <div className="text-sm mb-6">
                      ENDS IN: <span className="text-white">{gambaTimeLeft}</span>
                    </div>

                    <div className="inline-block bg-white text-black px-10 py-3 rounded-xl font-bold">
                      VIEW LEADERBOARD
                    </div>
                  </div>
                </div>
              </a>

              {/* CHANCER BOX */}
              {showChancer && (
                <a
                  href="/chancer.html"
                  className="group block bg-[#111827] border border-yellow-400/20 rounded-3xl p-8 md:p-10 shadow-[0_0_35px_rgba(250,204,21,0.08)] hover:shadow-[0_0_45px_rgba(250,204,21,0.16)] transition"
                >
                  <div className="grid md:grid-cols-2 gap-8 items-center">
                    <div className="bg-[#1a1a12] rounded-2xl p-8 flex justify-center relative border border-yellow-400/10">
                      <div className="absolute top-4 left-4 text-xs bg-yellow-400/20 text-yellow-300 px-2 py-1 rounded animate-pulse">
                        LIVE
                      </div>
                    
                      <img
                        src="/assets/chancer.png"
                        alt="Chancer logo"
                        className="h-28 md:h-32 object-contain"
                      />
                    </div>

                    <div className="text-center">
                      <div className="text-xs text-yellow-200/60 mb-2 tracking-widest">PRIZE POOL</div>
                      <div className="text-5xl md:text-6xl font-bold text-yellow-400 mb-4">
                        ${chancerAmount.toLocaleString("en-US")}
                      </div>

                      <div className="text-sm mb-6 text-yellow-100/80">
                        ENDS IN: <span className="text-yellow-400">{chancerTimeLeft}</span>
                      </div>

                      <div className="inline-block bg-yellow-400 text-black px-10 py-3 rounded-xl font-bold">
                        VIEW LEADERBOARD
                      </div>
                    </div>
                  </div>
                </a>

                        {/* RUNNIT BOX */}
              <a
                href="https://runnit.fun/r/niksi"
                target="_blank"
                rel="noreferrer"
                className="group block bg-[#111827] border border-purple-400/20 rounded-3xl p-8 md:p-10 shadow-[0_0_35px_rgba(168,85,247,0.08)] hover:shadow-[0_0_45px_rgba(168,85,247,0.16)] transition"
              >
                <div className="grid gap-8 items-center">
                  <div className="bg-[#1b1024] rounded-2xl p-8 flex justify-center relative border border-purple-400/10">
                    <div className="absolute top-4 left-4 text-xs bg-purple-400/20 text-purple-300 px-2 py-1 rounded animate-pulse">
                      LIVE
                    </div>
              
                    <div className="text-3xl font-black text-purple-300 tracking-widest">
                      RUNNIT.FUN
                    </div>
                  </div>
              
                  <div className="text-center">
                    <div className="text-xs text-purple-200/60 mb-2 tracking-widest">AFFILIATE</div>
              
                    <div className="text-3xl md:text-4xl font-bold text-purple-300 mb-4">
                      RUNNIT.FUN
                    </div>
              
                    <div className="inline-block bg-purple-400 text-black px-10 py-3 rounded-xl font-bold">
                      SIGN UP
                    </div>
                  </div>
                </div>
              </a>
              )}
            </div>
          </div>

          {/* FOOTER */}
          <div className="border-t border-white/10 py-6 text-center px-6">
            <div className="max-w-4xl mx-auto mb-6 bg-[#111827]/60 border border-white/10 rounded-xl px-6 py-3 text-xs text-gray-300 flex items-center gap-4">
              <div className="text-white text-lg">18+</div>

              <div className="text-left leading-relaxed">
                We are not responsible for any losses incurred from gambling on casino or betting platforms that may be linked or promoted on this website. All users participate at their own risk.
              </div>
            </div>

            <div className="text-gray-400 text-xs">
              © 2026 NIKSI777. All Rights Reserved.
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
