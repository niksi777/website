<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>NIKSI777</title>

  <style>
    @keyframes gradientMove {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-30px, 30px); }
    }

    .animate-gradientMove {
      animation: gradientMove 12s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .animate-float {
      animation: float 8s ease-in-out infinite;
    }
  </style>

  <script>
    let mouseX = 0;
    let mouseY = 0;

    document.addEventListener("mousemove", (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animateGlow() {
      const glow = document.getElementById("mouseGlow");
      if (glow) {
        glow.style.background = `
          radial-gradient(
            circle at ${mouseX}px ${mouseY}px,
            rgba(34,197,94,0.12),
            rgba(59,130,246,0.08),
            transparent 120px
          )
        `;
      }
      requestAnimationFrame(animateGlow);
    }

    window.onload = animateGlow;
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body class="bg-[#020617] text-white min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- BACKGROUND -->
  <div class="fixed inset-0 -z-10 animate-gradientMove
    bg-[radial-gradient(circle_at_20%_20%,rgba(34,197,94,0.15),transparent_40%),
        radial-gradient(circle_at_80%_0%,rgba(59,130,246,0.12),transparent_40%)]">
  </div>

  <!-- LOGO WATERMARK -->
  <div class="fixed inset-0 -z-10 flex items-center justify-center pointer-events-none">
    <img src="/assets/niksi.png"
         class="w-[500px] opacity-[0.05] blur-[1px] animate-float"
         draggable="false" />
  </div>

  <!-- MOUSE GLOW -->
  <div id="mouseGlow" class="fixed inset-0 -z-10 pointer-events-none"></div>

  <div id="root" class="flex-grow relative z-10"></div>

<script type="text/babel">

function App() {
  const [timeLeft, setTimeLeft] = React.useState("");
  const [displayAmount, setDisplayAmount] = React.useState(0);
  const raceEnd = new Date("2026-04-03T01:00:00");

  React.useEffect(() => {
    const updateTimer = () => {
      const distance = raceEnd - Date.now();

      if (distance <= 0) {
        setTimeLeft("Race Ended");
        return;
      }

      const d = Math.floor(distance / (1000*60*60*24));
      const h = Math.floor((distance / (1000*60*60)) % 24);
      const m = Math.floor((distance / (1000*60)) % 60);
      const s = Math.floor((distance / 1000) % 60);

      setTimeLeft(`${d}d ${h}h ${m}m ${s}s`);
    };

    updateTimer();
    const interval = setInterval(updateTimer, 1000);
    return () => clearInterval(interval);
  }, []);

  React.useEffect(() => {
    const start = Date.now();
    const duration = 1500;

    const timer = setInterval(() => {
      const progress = Math.min((Date.now() - start) / duration, 1);
      setDisplayAmount(Math.floor(progress * 1500));
      if (progress === 1) clearInterval(timer);
    }, 16);

    return () => clearInterval(timer);
  }, []);

  return (
    <div>

      {/* NAVBAR */}
      <div className="fixed top-0 left-0 w-full z-50 flex justify-center py-4">
        <div className="flex items-center gap-8 px-8 py-3 
          bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl">

          <a href="/">
            <img src="/assets/niksi.png" className="h-8 opacity-90" />
          </a>

          <a href="/" className="text-white/70 hover:text-white">HOME</a>
          <a href="/leaderboards.html" className="text-white/70 hover:text-white">LEADERBOARDS</a>
          <a href="/giveaway.html" className="text-white/70 hover:text-white">GIVEAWAY</a>

        </div>
      </div>

      {/* MAIN */}
      <div className="max-w-6xl mx-auto px-6 pt-28 pb-16 grid md:grid-cols-2 gap-12">

        {/* LEFT */}
        <div className="flex justify-center">
          <div className="w-full max-w-md">

            <h1 className="text-2xl md:text-3xl font-semibold text-center mb-5">
              All Active Leaderboards
            </h1>

            <a href="/gamba.html"
              className="group block bg-[#020617] border border-green-400/20 
              rounded-2xl p-6 shadow-[0_0_25px_rgba(34,197,94,0.15)]">

              <div className="bg-[#1e293b] rounded-xl p-6 flex justify-center mb-6 relative">
                <div className="absolute top-3 left-3 text-xs bg-red-500/20 text-red-400 px-2 py-1 rounded animate-pulse">
                  LIVE
                </div>
                <img src="/assets/gamba.png" className="h-12" />
              </div>

              <div className="text-center mb-6">
                <div className="text-xs text-gray-500 mb-2">PRIZE POOL</div>
                <div className="text-4xl font-bold text-green-400">
                  ${displayAmount}
                </div>
              </div>

              <div className="text-center text-sm mb-6">
                ENDS IN: <span className="text-green-400">{timeLeft}</span>
              </div>

              <div className="text-center bg-green-400 text-black py-3 rounded-xl font-bold">
                VIEW LEADERBOARD
              </div>

            </a>
          </div>
        </div>

        {/* RIGHT */}
        <div className="flex justify-center">
          <div className="w-full max-w-md">

            <h1 className="text-2xl md:text-3xl font-semibold text-center mb-5">
              All Active Bonuses
            </h1>

            <div className="bg-[#020617] border border-green-400/20 
              rounded-2xl p-6 shadow-[0_0_25px_rgba(34,197,94,0.15)]">

              <div className="bg-[#1e293b] rounded-xl p-6 flex justify-center mb-6">
                <img src="/assets/gamba2.png" className="h-12" />
              </div>

              <a href="https://gamba.com/?c=niksi" target="_blank"
                className="block text-center mb-6 text-gray-400 hover:text-white">
                gamba.com/?c=niksi
              </a>

              <div className="text-center text-green-400 mb-6">
                <div>LEADERBOARD ACCESS</div>
                <div>10-20% LOSSBACK</div>
              </div>

              <a href="https://gamba.com?c=niksi" target="_blank"
                className="block text-center bg-green-400 text-black py-3 rounded-xl font-bold mb-4">
                SIGN UP NOW
              </a>

              <div className="text-center text-sm">
                USE CODE <span className="text-green-400 font-bold">NIKSI</span>
              </div>

            </div>
          </div>
        </div>

      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

</body>
</html>
