  function useSession() {
    const [user, setUser] = React.useState(null);

      const params = new URLSearchParams(window.location.search);
      const sid = params.get('session') || localStorage.getItem('kick_session');
      if (sid) {
        localStorage.setItem('kick_session', sid);
        fetch('/auth/me?session=' + sid)
          .then(r => r.ok ? r.json() : null)
          .then(d => { if (d) setUser(d); else localStorage.removeItem('kick_session'); })
          .catch(() => {});
        if (params.get('session')) window.history.replaceState({}, '', window.location.pathname);
      }
    }, []);
    function logout() {
      const sid = localStorage.getItem('kick_session');
      if (sid) fetch('/auth/logout?session=' + sid);
      localStorage.removeItem('kick_session');
      setUser(null);
    }
    return { user, logout };

<script>
(function(){
  var canvas=document.getElementById('constellation');
  var ctx=canvas.getContext('2d');
  var N=110,DIST=140,W,H,pts=[];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  function mkPt(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.2+.4,o:Math.random()*.45+.1};}
  function init(){resize();pts=[];for(var i=0;i<N;i++)pts.push(mkPt());}
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<N;i++){var a=pts[i];for(var j=i+1;j<N;j++){var b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);if(d<DIST){ctx.beginPath();ctx.strokeStyle='rgba(130,170,255,'+((1-d/DIST)*.12)+')';ctx.lineWidth=.6;ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}}
    for(var i=0;i<N;i++){var p=pts[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(160,190,255,'+p.o+')';ctx.fill();}
    requestAnimationFrame(tick);
  }
  init();window.addEventListener('resize',resize);tick();
})();
</script>
