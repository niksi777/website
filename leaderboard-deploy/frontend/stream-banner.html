<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1200px;height:100px;overflow:hidden;background:transparent}

    .banner{
      position:relative;width:1200px;height:100px;
      border-radius:14px;background:#07050e;overflow:hidden;
    }

    /* sweeping gradient border */
    .banner::before{
      content:'';position:absolute;inset:0;border-radius:14px;padding:2.5px;
      background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c1));
      background-size:250% 100%;
      animation:borderSweep 1.8s linear infinite;
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;
      pointer-events:none;z-index:30;
    }
    @keyframes borderSweep{0%{background-position:0% 50%}100%{background-position:200% 50%}}

    /* bg canvas sits behind everything */
    #bg{position:absolute;inset:0;z-index:2;pointer-events:none}

    /* subtle grid */
    .grid{
      position:absolute;inset:0;z-index:1;pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
      background-size:40px 40px;
    }

    /* content row */
    .content{
      position:absolute;inset:0;z-index:10;
      display:flex;align-items:center;
      padding:0 18px;gap:18px;
    }

    /* logo - floats up and down, no box */
    .logo-wrap{
      flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      animation:logoFloat 3s ease-in-out infinite;
    }
    .logo-wrap img{object-fit:contain}
    @keyframes logoFloat{
      0%,100%{transform:translateY(0px)}
      50%{transform:translateY(-6px)}
    }

    /* platform name - shimmer sweep across text + glow pulse */
    .plat-name{
      font-family:'Barlow Condensed',sans-serif;
      font-size:58px;font-weight:800;font-style:italic;
      letter-spacing:.03em;text-transform:uppercase;
      line-height:1;flex-shrink:0;
      background:linear-gradient(90deg,#fff 25%,var(--al) 50%,#fff 75%);
      background-size:200% auto;
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;
      animation:nameShim 3s ease-in-out infinite;
    }
    @keyframes nameShim{
      0%,100%{
        background-position:200% center;
        filter:drop-shadow(0 0 10px rgba(var(--rgb),.55)) drop-shadow(0 0 25px rgba(var(--rgb),.28));
      }
      50%{
        background-position:-100% center;
        filter:drop-shadow(0 0 25px rgba(var(--rgb),.95)) drop-shadow(0 0 55px rgba(var(--rgb),.6));
      }
    }

    /* separator that pulses to the beat */
    .sep{
      width:2px;height:52px;border-radius:2px;flex-shrink:0;
      animation:sepPulse 3s ease-in-out infinite;
    }
    @keyframes sepPulse{
      0%,100%{background:rgba(255,255,255,.1);box-shadow:none}
      50%{background:rgba(var(--rgb),.7);box-shadow:0 0 12px rgba(var(--rgb),.8)}
    }

    .promo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
    .promo-h{
      font-family:'Barlow Condensed',sans-serif;
      font-size:25px;font-weight:800;font-style:italic;
      letter-spacing:.06em;text-transform:uppercase;color:#fff;white-space:nowrap;
    }
    .promo-s{
      font-size:12px;font-weight:600;letter-spacing:.1em;
      text-transform:uppercase;color:rgba(200,215,240,.5);
    }

    /* code box - smooth glow pulse */
    .code-box{
      flex-shrink:0;border-radius:10px;padding:7px 22px;
      display:flex;flex-direction:column;align-items:center;gap:1px;
      animation:codeGlow 2.5s ease-in-out infinite;
    }
    @keyframes codeGlow{
      0%,100%{box-shadow:0 0 14px rgba(var(--rgb),.45),inset 0 0 8px rgba(var(--rgb),.1)}
      50%    {box-shadow:0 0 36px rgba(var(--rgb),.95),0 0 70px rgba(var(--rgb),.45),0 0 110px rgba(var(--rgb),.2),inset 0 0 22px rgba(var(--rgb),.2)}
    }
    .code-lbl{
      font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
      color:rgba(200,215,240,.42);
    }
    .code-val{
      font-family:'Barlow Condensed',sans-serif;
      font-size:42px;font-weight:800;letter-spacing:.1em;line-height:1;
      animation:niksiFlash 2s ease-in-out infinite;
    }
    @keyframes niksiFlash{
      0%,100%{text-shadow:0 0 14px rgba(var(--rgb),.9),0 0 30px rgba(var(--rgb),.5)}
      50%    {text-shadow:0 0 32px var(--al),0 0 60px rgba(var(--rgb),.95),0 0 100px rgba(var(--rgb),.5)}
    }
  </style>
</head>
<body>
<div class="banner" id="B">
  <div class="grid"></div>
  <canvas id="bg" width="1200" height="100"></canvas>
  <div class="content" id="C"></div>
</div>

<script>
const PLATS = {
  cs2skin:{
    c1:'#7c3aed',c2:'#ec4899',c3:'#06b6d4',
    accent:'#7c3aed',al:'#c4b5fd',rgb:'124,58,237',
    logoW:'160px',logoH:'52px',
    logoSrc:'/assets/cs2skin.png',
    logoFilter:'brightness(0) invert(1) drop-shadow(0 0 14px rgba(124,58,237,1))',
    noLabel:true,
    promoH:'100% Deposit Bonus',
    promoS:'5% unlocked for every 1x of deposit wagered',
  },
  gamba:{
    c1:'#22c55e',c2:'#06b6d4',c3:'#16a34a',
    accent:'#22c55e',al:'#86efac',rgb:'34,197,94',
    logoW:'72px',logoH:'72px',
    logoSrc:'/assets/gamba2.png',
    logoFilter:'drop-shadow(0 0 14px rgba(34,197,94,1)) drop-shadow(0 0 5px rgba(134,239,172,.5))',
    noLabel:false,name:'GAMBA',
    promoH:'$750 Weekly Leaderboard',
    promoS:'10-20% Lossback',
  },
  chicken:{
    c1:'#f59e0b',c2:'#f97316',c3:'#fbbf24',
    accent:'#f59e0b',al:'#fde68a',rgb:'245,158,11',
    logoW:'72px',logoH:'72px',
    logoSrc:'/assets/chicken.png',
    logoFilter:'drop-shadow(0 0 14px rgba(245,158,11,1)) drop-shadow(0 0 5px rgba(253,230,138,.5))',
    noLabel:false,name:'CHICKEN.GG',
    promoH:'650 Coin Weekly Leaderboard',
    promoS:'0.5% Wagerback - Up to 15% Lossback',
  },
};

const key = new URLSearchParams(location.search).get('p') || 'cs2skin';
const P = PLATS[key] || PLATS.cs2skin;
const B = document.getElementById('B');

/* set CSS vars */
[['--c1',P.c1],['--c2',P.c2],['--c3',P.c3],
 ['--accent',P.accent],['--al',P.al],['--rgb',P.rgb]
].forEach(([k,v])=>B.style.setProperty(k,v));

/* build HTML */
document.getElementById('C').innerHTML = `
  <div class="logo-wrap">
    <img src="${P.logoSrc}" style="width:${P.logoW};height:${P.logoH};filter:${P.logoFilter}"/>
  </div>
  ${P.noLabel?'':'<div class="plat-name">'+P.name+'</div>'}
  <div class="sep"></div>
  <div class="promo">
    <div class="promo-h">${P.promoH}</div>
    <div class="promo-s">${P.promoS}</div>
  </div>
  <div class="code-box" style="border:2px solid ${P.accent};background:rgba(${P.rgb},.09)">
    <div class="code-lbl">Use code</div>
    <div class="code-val" style="color:${P.al}">NIKSI</div>
  </div>
`;

/* canvas animation */
const cnv = document.getElementById('bg');
const ctx = cnv.getContext('2d');
const [R,G,Bl] = P.rgb.split(',').map(Number);

/* particles drifting left to right */
const PCOUNT = 75;
const parts = Array.from({length:PCOUNT},()=>({
  x: Math.random()*1200,
  y: Math.random()*100,
  vx: 0.4 + Math.random()*1.8,
  vy: (Math.random()-.5)*0.3,
  sz: 0.6 + Math.random()*1.8,
  phase: Math.random()*Math.PI*2,
  phaseSpd: 0.015 + Math.random()*0.02,
  alpha: Math.random()*0.7,
}));

function frame(){
  ctx.clearRect(0,0,1200,100);

  /* faint central bloom */
  const bloom = ctx.createRadialGradient(600,50,0,600,50,650);
  bloom.addColorStop(0,`rgba(${R},${G},${Bl},0.045)`);
  bloom.addColorStop(1,`rgba(${R},${G},${Bl},0)`);
  ctx.fillStyle=bloom; ctx.fillRect(0,0,1200,100);

  /* particles */
  for(const p of parts){
    p.x += p.vx; p.y += p.vy; p.phase += p.phaseSpd;
    if(p.x>1210){p.x=-10;p.y=Math.random()*100;}
    const a = p.alpha * (0.5+0.5*Math.sin(p.phase));
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);
    ctx.fillStyle=`rgba(${R},${G},${Bl},${a})`; ctx.fill();
    if(p.sz>1){
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz*3,0,Math.PI*2);
      ctx.fillStyle=`rgba(${R},${G},${Bl},${a*0.15})`; ctx.fill();
    }
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
