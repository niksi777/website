<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1200px;height:100px;overflow:hidden;background:transparent}

    /* ── shell: overflow:hidden keeps ALL effects inside ── */
    .banner{
      position:relative;width:1200px;height:100px;
      border-radius:14px;background:#07050e;
      overflow:hidden;
      /* pulsing outer glow via box-shadow - stays contained to element */
      animation:glow 2s ease-in-out infinite;
    }

    /* ── animated gradient border ── */
    .banner::before{
      content:'';position:absolute;inset:0;
      border-radius:14px;padding:2.5px;
      background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c1));
      background-size:250% 100%;
      animation:sweep 2s linear infinite;
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;
      pointer-events:none;z-index:30;
    }
    @keyframes sweep{0%{background-position:0% 50%}100%{background-position:200% 50%}}

    /* ── grid lines bg ── */
    .grid{
      position:absolute;inset:0;z-index:1;pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
      background-size:38px 38px;
    }

    /* ── drifting color orb (stays inside via parent overflow:hidden) ── */
    .orb{
      position:absolute;top:50%;transform:translateY(-50%);
      width:240px;height:240px;border-radius:50%;
      filter:blur(60px);opacity:.16;pointer-events:none;z-index:2;
      background:var(--accent);
      animation:orbDrift 8s ease-in-out infinite alternate;
    }
    @keyframes orbDrift{0%{left:-50px}100%{left:400px}}

    /* ── light-beam shimmer across banner ── */
    .shimmer{
      position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;
    }
    .shimmer::after{
      content:'';
      position:absolute;top:0;bottom:0;width:80px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);
      animation:beam 4.5s ease-in-out infinite;
      transform:skewX(-15deg);
    }
    @keyframes beam{0%{left:-100px}100%{left:1280px}}

    /* ── content row ── */
    .content{
      position:absolute;inset:0;z-index:10;
      display:flex;align-items:center;
      padding:0 18px;gap:18px;
    }

    /* logo box */
    .logo-box{
      height:80px;flex-shrink:0;
      border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      animation:glow 2s ease-in-out infinite;
    }
    .logo-box img{max-height:58px;object-fit:contain}

    /* platform name */
    .plat-name{
      font-family:'Barlow Condensed',sans-serif;
      font-size:58px;font-weight:800;font-style:italic;
      letter-spacing:.03em;text-transform:uppercase;
      color:#fff;line-height:1;flex-shrink:0;
      animation:nameGlow 2s ease-in-out infinite;
    }

    /* separator */
    .sep{width:2px;height:52px;background:rgba(255,255,255,.1);flex-shrink:0;border-radius:2px}

    /* promo text */
    .promo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
    .promo-h{
      font-family:'Barlow Condensed',sans-serif;
      font-size:25px;font-weight:800;font-style:italic;
      letter-spacing:.06em;text-transform:uppercase;
      color:#fff;white-space:nowrap;
    }
    .promo-s{
      font-size:12px;font-weight:600;letter-spacing:.1em;
      text-transform:uppercase;color:rgba(200,215,240,.52);
    }

    /* single shared glow keyframe - everything pulses together at 2s */
    @keyframes glow{
      0%,100%{box-shadow:0 0 14px rgba(var(--rgb),.35),inset 0 0 8px rgba(var(--rgb),.06)}
      50%    {box-shadow:0 0 34px rgba(var(--rgb),.88),0 0 65px rgba(var(--rgb),.35),inset 0 0 18px rgba(var(--rgb),.16)}
    }
    @keyframes nameGlow{
      0%,100%{text-shadow:var(--glo)}
      50%    {text-shadow:var(--ghi)}
    }
    @keyframes codeTextGlow{
      0%,100%{text-shadow:0 0 14px rgba(var(--rgb),.9),0 0 35px rgba(var(--rgb),.5)}
      50%    {text-shadow:0 0 28px var(--al),0 0 55px rgba(var(--rgb),.95),0 0 95px rgba(var(--rgb),.45)}
    }

    /* code box */
    .code-box{
      flex-shrink:0;border-radius:10px;
      padding:7px 22px;
      display:flex;flex-direction:column;align-items:center;gap:1px;
      animation:glow 2s ease-in-out infinite;
    }
    .code-lbl{
      font-size:10px;font-weight:700;
      letter-spacing:.22em;text-transform:uppercase;
      color:rgba(200,215,240,.42);
    }
    .code-val{
      font-family:'Barlow Condensed',sans-serif;
      font-size:42px;font-weight:800;letter-spacing:.1em;line-height:1;
      animation:codeTextGlow 2s ease-in-out infinite;
    }
  </style>
</head>
<body>
<div class="banner" id="B">
  <div class="grid"></div>
  <div class="orb"     id="orb"></div>
  <div class="shimmer"></div>
  <div class="content" id="C"></div>
</div>

<script>
const PLATS = {
  cs2skin:{
    c1:'#7c3aed',c2:'#ec4899',c3:'#06b6d4',
    accent:'#7c3aed',al:'#a78bfa',rgb:'124,58,237',
    logoBg:'rgba(124,58,237,.2)',logoBdr:'rgba(124,58,237,.52)',
    logoSrc:'/assets/cs2skin.png',logoW:'160px',
    logoFilter:'brightness(0) invert(1) drop-shadow(0 0 14px rgba(124,58,237,1)) drop-shadow(0 0 4px #ddd8ff)',
    noLabel:true,
    promoH:'100% Deposit Bonus',
    promoS:'5% unlocked for every 1x of deposit wagered',
    glo:'',ghi:'',
  },
  gamba:{
    c1:'#22c55e',c2:'#06b6d4',c3:'#16a34a',
    accent:'#22c55e',al:'#4ade80',rgb:'34,197,94',
    logoBg:'rgba(34,197,94,.16)',logoBdr:'rgba(34,197,94,.48)',
    logoSrc:'/assets/gamba2.png',
    logoFilter:'drop-shadow(0 0 14px rgba(34,197,94,1)) drop-shadow(0 0 4px rgba(74,222,128,.6))',
    name:'GAMBA',
    promoH:'$750 Weekly Leaderboard',
    promoS:'10-20% Lossback',
    glo:'0 0 22px rgba(34,197,94,.55),0 0 55px rgba(34,197,94,.28)',
    ghi:'0 0 42px rgba(74,222,128,1),0 0 85px rgba(34,197,94,.8),0 0 150px rgba(34,197,94,.35)',
  },
  chicken:{
    c1:'#f59e0b',c2:'#f97316',c3:'#fbbf24',
    accent:'#f59e0b',al:'#fbbf24',rgb:'245,158,11',
    logoBg:'rgba(245,158,11,.14)',logoBdr:'rgba(245,158,11,.46)',
    logoSrc:'/assets/chicken.png',
    logoFilter:'drop-shadow(0 0 14px rgba(245,158,11,1)) drop-shadow(0 0 4px rgba(251,191,36,.7))',
    name:'CHICKEN.GG',
    promoH:'650 Coin Weekly Leaderboard',
    promoS:'0.5% Wagerback - Up to 15% Lossback',
    glo:'0 0 22px rgba(245,158,11,.55),0 0 55px rgba(245,158,11,.28)',
    ghi:'0 0 42px rgba(251,191,36,1),0 0 85px rgba(245,158,11,.8),0 0 150px rgba(245,158,11,.35)',
  },
};

const key = new URLSearchParams(location.search).get('p') || 'cs2skin';
const P   = PLATS[key] || PLATS.cs2skin;
const B   = document.getElementById('B');
const orb = document.getElementById('orb');

/* set CSS vars */
const vars = {
  '--c1':P.c1,'--c2':P.c2,'--c3':P.c3,
  '--accent':P.accent,'--al':P.al,
  '--rgb':P.rgb,
  '--glo':P.glo,'--ghi':P.ghi,
};
for(const [k,v] of Object.entries(vars)) B.style.setProperty(k,v);

orb.style.background = P.accent;

/* build content */
const logoW = P.logoW || '82px';
document.getElementById('C').innerHTML = `
  <div class="logo-box" style="width:${logoW};background:${P.logoBg};border:1px solid ${P.logoBdr}">
    <img src="${P.logoSrc}" style="max-width:calc(${logoW} - 16px);filter:${P.logoFilter}"/>
  </div>
  ${P.noLabel ? '' : `<div class="plat-name">${P.name}</div>`}
  <div class="sep"></div>
  <div class="promo">
    <div class="promo-h">${P.promoH}</div>
    <div class="promo-s">${P.promoS}</div>
  </div>
  <div class="code-box" style="border:2px solid ${P.accent};background:rgba(${P.rgb},.08)">
    <div class="code-lbl">Use code</div>
    <div class="code-val" style="color:${P.al}">NIKSI</div>
  </div>
`;
</script>
</body>
</html>
