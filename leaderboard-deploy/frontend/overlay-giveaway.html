<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{background:transparent;width:320px;height:auto;overflow:visible;display:block;font-family:'Inter',sans-serif;padding:0;margin:0}

    .card{
      width:320px;
      background:#0c0e14;
      border:1px solid rgba(255,255,255,.07);
      border-top:3px solid #e8a427;
      border-radius:12px;
      overflow:hidden;
      position:relative;
      text-align:center;
    }
    .card-body{
      padding:18px 20px 14px;
    }
    .card-label{
      font-size:10px;
      font-weight:600;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:rgba(221,227,239,.45);
      margin-bottom:6px;
    }
    .card-value{
      font-family:'Barlow Condensed',sans-serif;
      font-size:38px;
      font-weight:800;
      letter-spacing:.04em;
      line-height:1;
      color:#e8a427;
      text-transform:uppercase;
    }
    .card-entries{
      font-size:11px;
      font-weight:500;
      letter-spacing:.08em;
      color:rgba(221,227,239,.35);
      margin-top:5px;
    }
    .card-entries span{
      color:rgba(221,227,239,.65);
      font-weight:600;
    }

    /* Progress bar at very bottom */
    .bar-track{
      height:4px;
      background:rgba(255,255,255,.06);
      width:100%;
    }
    .bar-fill{
      height:100%;
      background:linear-gradient(90deg,#b06000,#e8a427,#ffe580);
      transition:width .8s linear;
      width:100%;
    }
    .bar-fill.urgent{
      background:linear-gradient(90deg,#7a0000,#d94f4f,#ff8080);
    }

    /* Idle state */
    .idle{
      padding:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .idle-dot{
      width:5px;height:5px;border-radius:50%;
      background:rgba(221,227,239,.25);
    }
    .idle-txt{
      font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
      color:rgba(221,227,239,.25);
    }
  
    #constellation{position:fixed;inset:0;z-index:0;pointer-events:none}
  </style>
</head>
<body>
<canvas id="constellation"></canvas>

<div class="card">
  <div id="active">
    <div class="card-body">
      <div class="card-label">Keyword</div>
      <div class="card-value" id="kw" style="color:rgba(232,164,39,.25)">Waiting...</div>
      <div class="card-entries" id="entries-row" style="display:none">Entries: <span id="entries">0</span></div>
    </div>
  </div>
  <div class="bar-track">
    <div class="bar-fill" id="bar" style="width:100%"></div>
  </div>
</div>

<script>
  let DURATION = 60;
  let secondsLeft = DURATION;
  let timerInterval = null;
  let lastKeyword = null;

  function startTimer(dur) {
    DURATION = dur;
    secondsLeft = dur;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      secondsLeft = Math.max(0, secondsLeft - 1);
      const pct = (secondsLeft / DURATION) * 100;
      const bar = document.getElementById('bar');
      bar.style.width = pct + '%';
      bar.className = 'bar-fill' + (secondsLeft <= 10 ? ' urgent' : '');
      if (secondsLeft === 0) clearInterval(timerInterval);
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    const bar = document.getElementById('bar');
    bar.style.width = '100%';
    bar.className = 'bar-fill';
  }

  async function pollTimer() {
    try {
      const r = await fetch('/giveaway/timer');
      const d = await r.json();
      if (d.signal === 'start') startTimer(d.duration || 60);
      else if (d.signal === 'stop') stopTimer();
    } catch(e) {}
  }

  async function pollState() {
    try {
      const r = await fetch('/giveaway/state');
      const d = await r.json();
      const kw = document.getElementById('kw');
      if (d.giveaway && !d.giveaway.winner) {
        kw.textContent = d.giveaway.keyword;
        kw.style.color = '#e8a427';
        document.getElementById('entries').textContent = d.entries ? d.entries.length : 0;
        document.getElementById('entries-row').style.display = 'block';
        lastKeyword = d.giveaway.keyword;
      } else {
        kw.textContent = 'Waiting...';
        kw.style.color = 'rgba(232,164,39,.25)';
        document.getElementById('entries-row').style.display = 'none';
        lastKeyword = null;
        stopTimer();
      }
    } catch(e) {}
  }

  pollState(); pollTimer();
  setInterval(pollState, 2000);
  setInterval(pollTimer, 1000);
</script>

<script>
(function(){
  var canvas = document.getElementById('constellation');
  var ctx = canvas.getContext('2d');
  var N = 110, DIST = 140;
  var W, H, pts = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  function mkPt(){ return { x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25, r:Math.random()*1.2+.4, o:Math.random()*.45+.1 }; }
  function init(){ resize(); pts=[]; for(var i=0;i<N;i++) pts.push(mkPt()); }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<N;i++){
      var a=pts[i];
      for(var j=i+1;j<N;j++){
        var b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<DIST){ ctx.beginPath(); ctx.strokeStyle='rgba(130,170,255,'+((1-d/DIST)*.12)+')'; ctx.lineWidth=.6; ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      }
    }
    for(var i=0;i<N;i++){
      var p=pts[i]; p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='rgba(160,190,255,'+p.o+')'; ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  init(); window.addEventListener('resize', resize); tick();
})();
</script>
</body>
</html>
