<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{background:transparent;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif}

    .card{
      width:320px;
      background:#0c0e14;
      border:1px solid rgba(255,255,255,.07);
      border-top:3px solid #e8a427;
      border-radius:12px;
      overflow:hidden;
      position:relative;
    }
    .card-body{
      padding:18px 20px 14px;
    }
    .card-label{
      font-size:10px;
      font-weight:600;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:rgba(221,227,239,.45);
      margin-bottom:6px;
    }
    .card-value{
      font-family:'Barlow Condensed',sans-serif;
      font-size:38px;
      font-weight:800;
      letter-spacing:.04em;
      line-height:1;
      color:#e8a427;
      text-transform:uppercase;
    }
    .card-entries{
      font-size:11px;
      font-weight:500;
      letter-spacing:.08em;
      color:rgba(221,227,239,.35);
      margin-top:5px;
    }
    .card-entries span{
      color:rgba(221,227,239,.65);
      font-weight:600;
    }

    /* Progress bar at very bottom */
    .bar-track{
      height:4px;
      background:rgba(255,255,255,.06);
      width:100%;
    }
    .bar-fill{
      height:100%;
      background:linear-gradient(90deg,#b06000,#e8a427,#ffe580);
      transition:width .8s linear;
      width:100%;
    }
    .bar-fill.urgent{
      background:linear-gradient(90deg,#7a0000,#d94f4f,#ff8080);
    }

    /* Idle state */
    .idle{
      padding:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .idle-dot{
      width:5px;height:5px;border-radius:50%;
      background:rgba(221,227,239,.25);
    }
    .idle-txt{
      font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
      color:rgba(221,227,239,.25);
    }
  </style>
</head>
<body>
<div class="card">
  <div id="idle" class="idle">
    <div class="idle-dot"></div>
    <div class="idle-txt">No active giveaway</div>
    <div class="idle-dot"></div>
  </div>
  <div id="active" style="display:none">
    <div class="card-body">
      <div class="card-label">Keyword</div>
      <div class="card-value" id="kw">-</div>
      <div class="card-entries">Entries: <span id="entries">0</span></div>
    </div>
  </div>
  <div class="bar-track">
    <div class="bar-fill" id="bar" style="width:100%"></div>
  </div>
</div>

<script>
  let DURATION = 60;
  let secondsLeft = DURATION;
  let timerInterval = null;
  let lastKeyword = null;

  function startTimer(dur) {
    DURATION = dur;
    secondsLeft = dur;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      secondsLeft = Math.max(0, secondsLeft - 1);
      const pct = (secondsLeft / DURATION) * 100;
      const bar = document.getElementById('bar');
      bar.style.width = pct + '%';
      bar.className = 'bar-fill' + (secondsLeft <= 10 ? ' urgent' : '');
      if (secondsLeft === 0) clearInterval(timerInterval);
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    const bar = document.getElementById('bar');
    bar.style.width = '100%';
    bar.className = 'bar-fill';
  }

  async function pollTimer() {
    try {
      const r = await fetch('/giveaway/timer');
      const d = await r.json();
      if (d.signal === 'start') startTimer(d.duration || 60);
      else if (d.signal === 'stop') stopTimer();
    } catch(e) {}
  }

  async function pollState() {
    try {
      const r = await fetch('/giveaway/state');
      const d = await r.json();
      const idle = document.getElementById('idle');
      const active = document.getElementById('active');
      if (d.giveaway && !d.giveaway.winner) {
        idle.style.display = 'none';
        active.style.display = 'block';
        document.getElementById('kw').textContent = d.giveaway.keyword;
        document.getElementById('entries').textContent = d.entries ? d.entries.length : 0;
        lastKeyword = d.giveaway.keyword;
      } else {
        idle.style.display = 'flex';
        active.style.display = 'none';
        lastKeyword = null;
        stopTimer();
      }
    } catch(e) {}
  }

  pollState(); pollTimer();
  setInterval(pollState, 2000);
  setInterval(pollTimer, 1000);
</script>
</body>
</html>
