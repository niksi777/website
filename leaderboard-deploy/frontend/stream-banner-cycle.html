<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:1200px;height:100px;
      overflow:hidden;
      background:transparent;
      font-family:'Inter',sans-serif;
    }

    /* ── outer glow ring ── */
    .outer{
      position:absolute;
      inset:-10px;
      border-radius:22px;
      background:linear-gradient(90deg,#6d28d9,#db2777,#0891b2,#6d28d9);
      background-size:250% 100%;
      animation:sweep 2.2s linear infinite;
      filter:blur(18px);
      opacity:.9;
    }
    @keyframes sweep{0%{background-position:0% 50%}100%{background-position:200% 50%}}

    /* ── shell ── */
    .banner{
      position:relative;
      width:1200px;height:100px;
      border-radius:14px;
      background:#07050e;
      overflow:hidden;
    }

    /* animated border */
    .banner::before{
      content:'';position:absolute;inset:0;
      border-radius:14px;padding:2.5px;
      background:linear-gradient(90deg,#7c3aed,#ec4899,#06b6d4,#7c3aed);
      background-size:250% 100%;
      animation:sweep 2.2s linear infinite;
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      pointer-events:none;z-index:20;
    }

    /* subtle hex bg pattern */
    .banner::after{
      content:'';position:absolute;inset:0;
      opacity:.06;
      background-image:
        repeating-linear-gradient(60deg,#fff 0,#fff 1px,transparent 1px,transparent 28px),
        repeating-linear-gradient(-60deg,#fff 0,#fff 1px,transparent 1px,transparent 28px),
        repeating-linear-gradient(0deg,#fff 0,#fff 1px,transparent 1px,transparent 28px);
      background-size:32px 32px;
      pointer-events:none;z-index:1;
    }

    /* ambient color blob that shifts with platform */
    .blob{
      position:absolute;
      width:400px;height:200px;
      border-radius:50%;
      filter:blur(60px);
      opacity:.18;
      pointer-events:none;z-index:2;
      transition:background 1s ease;
    }
    .blob-l{left:-60px;top:-60px}
    .blob-r{right:-60px;top:-60px}

    /* ── slides ── */
    .slide{
      position:absolute;
      left:0;top:0;right:0;bottom:0;
      display:flex;align-items:center;
      padding:0 18px 0 14px;
      gap:0;
      opacity:0;
      pointer-events:none;
      z-index:10;
    }
    .slide.active{opacity:1;pointer-events:auto}

    /* logo section */
    .logo-sect{
      width:88px;height:80px;flex-shrink:0;
      border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      position:relative;
      margin-right:18px;
    }
    .logo-sect img{max-width:68px;max-height:58px;object-fit:contain;position:relative;z-index:2}

    /* platform name */
    .plat{
      font-family:'Barlow Condensed',sans-serif;
      font-size:52px;font-weight:800;font-style:italic;
      letter-spacing:.03em;text-transform:uppercase;
      color:#fff;line-height:1;
      flex-shrink:0;margin-right:18px;
    }

    /* vertical sep */
    .sep{width:2px;height:54px;background:rgba(255,255,255,.12);flex-shrink:0;margin-right:18px;border-radius:2px}

    /* promo block */
    .promo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
    .promo-h{
      font-family:'Barlow Condensed',sans-serif;
      font-size:24px;font-weight:800;font-style:italic;
      letter-spacing:.06em;text-transform:uppercase;
      color:#fff;white-space:nowrap;
    }
    .promo-s{
      font-size:11.5px;font-weight:600;
      letter-spacing:.11em;text-transform:uppercase;
      color:rgba(200,210,235,.48);
    }

    /* code box */
    .code-box{
      flex-shrink:0;
      margin-left:18px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.1);
      border-radius:10px;
      padding:8px 20px;
      display:flex;flex-direction:column;align-items:center;gap:1px;
    }
    .code-lbl{
      font-size:10px;font-weight:700;
      letter-spacing:.24em;text-transform:uppercase;
      color:rgba(200,210,235,.38);
    }
    .code-val{
      font-family:'Barlow Condensed',sans-serif;
      font-size:38px;font-weight:800;
      letter-spacing:.1em;line-height:1;
    }
    @keyframes pulse{
      0%,100%{text-shadow:var(--ps1)}
      50%{text-shadow:var(--ps2)}
    }

    /* ── explosion canvas + flash ── */
    #fx{position:absolute;inset:0;pointer-events:none;z-index:50}
    #flash{
      position:absolute;inset:0;border-radius:14px;
      opacity:0;pointer-events:none;z-index:45;
    }
  </style>
</head>
<body>
<div class="outer"></div>
<div class="banner" id="banner">

  <!-- ── CS2SKIN ── -->
  <div class="slide active" id="s0">
    <div class="logo-sect" style="background:rgba(124,58,237,.2);border:1px solid rgba(124,58,237,.5)">
      <img src="/assets/cs2skin.png"
        style="filter:brightness(0) invert(1) drop-shadow(0 0 14px rgba(124,58,237,1)) drop-shadow(0 0 6px #fff)"/>
    </div>
    <div class="plat" style="text-shadow:0 0 40px rgba(124,58,237,.8),0 0 80px rgba(124,58,237,.4)">CS2SKIN</div>
    <div class="sep"></div>
    <div class="promo">
      <div class="promo-h">100% Deposit Bonus</div>
      <div class="promo-s">5% unlocked for every 1x of deposit wagered</div>
    </div>
    <div class="code-box" style="border-color:rgba(124,58,237,.4)">
      <div class="code-lbl">Use code</div>
      <div class="code-val" style="
        color:#a78bfa;
        --ps1:0 0 16px rgba(124,58,237,.9),0 0 40px rgba(124,58,237,.6);
        --ps2:0 0 30px rgba(167,139,250,1),0 0 70px rgba(124,58,237,.9),0 0 120px rgba(124,58,237,.4);
        animation:pulse 1.8s ease-in-out infinite;
      ">NIKSI</div>
    </div>
  </div>

  <!-- ── GAMBA ── -->
  <div class="slide" id="s1">
    <div class="logo-sect" style="background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.45)">
      <img src="/assets/gamba2.png"
        style="filter:drop-shadow(0 0 12px rgba(34,197,94,.9)) drop-shadow(0 0 4px rgba(34,197,94,.5))"/>
    </div>
    <div class="plat" style="text-shadow:0 0 40px rgba(34,197,94,.7),0 0 80px rgba(34,197,94,.35)">GAMBA</div>
    <div class="sep"></div>
    <div class="promo">
      <div class="promo-h">$750 Weekly Leaderboard</div>
      <div class="promo-s">10-20% Lossback</div>
    </div>
    <div class="code-box" style="border-color:rgba(34,197,94,.4)">
      <div class="code-lbl">Use code</div>
      <div class="code-val" style="
        color:#4ade80;
        --ps1:0 0 16px rgba(34,197,94,.9),0 0 40px rgba(34,197,94,.6);
        --ps2:0 0 30px rgba(74,222,128,1),0 0 70px rgba(34,197,94,.9),0 0 120px rgba(34,197,94,.4);
        animation:pulse 1.8s ease-in-out infinite;
      ">NIKSI</div>
    </div>
  </div>

  <!-- ── CHICKEN ── -->
  <div class="slide" id="s2">
    <div class="logo-sect" style="background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.42)">
      <img src="/assets/chicken.png"
        style="filter:drop-shadow(0 0 12px rgba(245,158,11,.85)) drop-shadow(0 0 4px rgba(245,158,11,.5))"/>
    </div>
    <div class="plat" style="text-shadow:0 0 40px rgba(245,158,11,.65),0 0 80px rgba(245,158,11,.3)">CHICKEN.GG</div>
    <div class="sep"></div>
    <div class="promo">
      <div class="promo-h">650 Coin Weekly Leaderboard</div>
      <div class="promo-s">0.5% Wagerback - Up to 15% Lossback</div>
    </div>
    <div class="code-box" style="border-color:rgba(245,158,11,.4)">
      <div class="code-lbl">Use code</div>
      <div class="code-val" style="
        color:#fbbf24;
        --ps1:0 0 16px rgba(245,158,11,.9),0 0 40px rgba(245,158,11,.6);
        --ps2:0 0 30px rgba(251,191,36,1),0 0 70px rgba(245,158,11,.9),0 0 120px rgba(245,158,11,.4);
        animation:pulse 1.8s ease-in-out infinite;
      ">NIKSI</div>
    </div>
  </div>

  <canvas id="fx" width="1200" height="100"></canvas>
  <div id="flash"></div>
</div>

<script>
const slides = document.querySelectorAll('.slide');
const flash  = document.getElementById('flash');
const cnv    = document.getElementById('fx');
const ctx    = cnv.getContext('2d');
const banner = document.getElementById('banner');

let cur = 0, busy = false, raf = null, particles = [];
const COLORS  = ['#7c3aed','#22c55e','#f59e0b'];
const BLOBCOL = ['#7c3aed','#22c55e','#f59e0b'];

function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}

/* update ambient blobs */
function setBlobs(idx){
  const c = BLOBCOL[idx];
  banner.querySelectorAll('.blob').forEach(b=>b.style.background=c);
}

/* inject blobs on first run */
['blob blob-l','blob blob-r'].forEach(cls=>{
  const d=document.createElement('div');
  d.className=cls;banner.prepend(d);
});
setBlobs(0);

/* ── particles ── */
function spawnBurst(color){
  const [r,g,b]=h2r(color);
  const cx=600,cy=50;
  particles=[];
  // dot particles
  for(let i=0;i<90;i++){
    const a=Math.PI*2*i/90+(Math.random()-.5)*.5;
    const spd=5+Math.random()*14;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      sz:1.5+Math.random()*5,life:1,decay:.03+Math.random()*.04,r,g,b,line:false});
  }
  // streak lines
  for(let i=0;i<35;i++){
    const a=Math.random()*Math.PI*2;
    const spd=12+Math.random()*22;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      sz:2,life:1,decay:.045+Math.random()*.04,r,g,b,line:true});
  }
}

function drawParticles(){
  ctx.clearRect(0,0,1200,100);
  let alive=false;
  for(const p of particles){
    if(p.life<=0)continue;
    alive=true;
    p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.life-=p.decay;
    const a=Math.max(0,p.life);
    if(p.line){
      ctx.beginPath();ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x-p.vx*2,p.y-p.vy*2);
      ctx.strokeStyle=`rgba(${p.r},${p.g},${p.b},${a})`;
      ctx.lineWidth=p.sz;ctx.stroke();
    } else {
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz*a,0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.r},${p.g},${p.b},${a})`;ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz*a*3,0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.r},${p.g},${p.b},${a*.2})`;ctx.fill();
    }
  }
  if(alive) raf=requestAnimationFrame(drawParticles);
  else ctx.clearRect(0,0,1200,100);
}

/* ── shockwave ring ── */
function ring(color,delay){
  setTimeout(()=>{
    const [r,g,b]=h2r(color);
    const el=document.createElement('div');
    Object.assign(el.style,{
      position:'absolute',left:'600px',top:'50px',
      width:'10px',height:'10px',
      border:`3px solid rgba(${r},${g},${b},1)`,
      boxShadow:`0 0 18px rgba(${r},${g},${b},.9),inset 0 0 8px rgba(${r},${g},${b},.4)`,
      borderRadius:'50%',pointerEvents:'none',zIndex:'48',
      transform:'translate(-50%,-50%) scale(0)',opacity:'1',
    });
    banner.appendChild(el);
    const t0=performance.now();
    (function go(now){
      const t=(now-t0)/420;
      if(t>=1){el.remove();return;}
      const ease=1-Math.pow(1-t,3);
      el.style.transform=`translate(-50%,-50%) scale(${ease*18})`;
      el.style.opacity=`${1-t}`;
      requestAnimationFrame(go);
    })(performance.now());
  },delay);
}

/* ── flash ── */
function doFlash(color,cb){
  const [r,g,b]=h2r(color);
  flash.style.background=`rgb(${r},${g},${b})`;
  flash.style.transition='opacity .06s';flash.style.opacity='.75';
  setTimeout(()=>{
    flash.style.transition='opacity .3s';flash.style.opacity='0';
    if(cb)setTimeout(cb,60);
  },60);
}

/* ── main transition ── */
function go(){
  if(busy)return;
  busy=true;
  const next=(cur+1)%slides.length;
  const outC=COLORS[cur], inC=COLORS[next];

  /* blast out */
  slides[cur].style.transition='opacity .15s ease-out, transform .15s ease-out';
  slides[cur].style.transform='scale(1.05)';
  slides[cur].style.opacity='0';

  doFlash(outC,()=>{
    ring(inC,0);ring(inC,120);ring(inC,240);
    if(raf)cancelAnimationFrame(raf);
    spawnBurst(inC);
    raf=requestAnimationFrame(drawParticles);
  });

  setTimeout(()=>{
    slides[cur].classList.remove('active');
    slides[cur].style.transform='';slides[cur].style.transition='';
    cur=next;
    slides[cur].style.opacity='0';
    slides[cur].style.transform='scale(.9)';
    slides[cur].classList.add('active');
    setBlobs(cur);

    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      slides[cur].style.transition='opacity .25s ease-out, transform .4s cubic-bezier(.34,1.56,.64,1)';
      slides[cur].style.opacity='1';
      slides[cur].style.transform='scale(1)';
      setTimeout(()=>{slides[cur].style.transition='';busy=false;},450);
    }));
  },160);
}

setInterval(go,6500);
</script>
</body>
</html>
