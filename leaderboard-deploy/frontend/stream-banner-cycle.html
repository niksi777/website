<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:1200px;height:90px;
      overflow:hidden;
      background:transparent;
      font-family:'Inter',sans-serif;
    }

    /* ── outer glow (blurred, behind everything) ── */
    .glow-outer{
      position:fixed;inset:-6px;
      border-radius:20px;
      background:linear-gradient(90deg,#7c3aed,#ec4899,#06b6d4,#7c3aed);
      background-size:200% 100%;
      animation:sweep 2.5s linear infinite;
      filter:blur(14px);
      opacity:.65;
      z-index:0;
      transition:opacity .4s;
    }

    /* ── banner shell ── */
    .banner{
      position:fixed;inset:0;
      border-radius:13px;
      background:#09070f;
      border:2px solid transparent;
      background-clip:padding-box;
      z-index:1;
      overflow:hidden;
    }

    /* ── animated border via pseudo ── */
    .border-line{
      position:absolute;inset:0;
      border-radius:13px;
      pointer-events:none;
      z-index:40;
    }
    .border-line::before{
      content:'';
      position:absolute;inset:0;
      border-radius:13px;
      padding:2px;
      background:linear-gradient(90deg,#7c3aed,#ec4899,#06b6d4,#7c3aed);
      background-size:200% 100%;
      animation:sweep 2.5s linear infinite;
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
    }

    @keyframes sweep{
      0%{background-position:0% 50%}
      100%{background-position:200% 50%}
    }

    /* ── slides ── */
    .slide{
      position:absolute;inset:0;
      display:flex;align-items:center;
      padding:0 22px;gap:18px;
      opacity:0;
      will-change:opacity,transform;
    }
    .slide.active{opacity:1}

    /* logo box */
    .logo-box{
      width:76px;height:68px;flex-shrink:0;
      border-radius:10px;
      display:flex;align-items:center;justify-content:center;
    }
    .logo-box img{
      max-width:60px;max-height:50px;
      object-fit:contain;
    }

    /* platform name */
    .plat-name{
      font-family:'Barlow Condensed',sans-serif;
      font-size:46px;font-weight:800;font-style:italic;
      letter-spacing:.04em;text-transform:uppercase;color:#fff;
      line-height:1;flex-shrink:0;
    }

    /* vertical divider */
    .vdiv{width:1px;height:48px;background:rgba(255,255,255,.14);flex-shrink:0}

    /* promo */
    .promo{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
    .promo-title{
      font-family:'Barlow Condensed',sans-serif;
      font-size:22px;font-weight:800;font-style:italic;
      letter-spacing:.06em;text-transform:uppercase;color:#fff;
      white-space:nowrap;
    }
    .promo-sub{
      font-size:11px;font-weight:600;letter-spacing:.12em;
      text-transform:uppercase;color:rgba(210,215,235,.5);
    }

    /* code */
    .code-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex-shrink:0}
    .code-lbl{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(200,210,235,.38)}
    .code-val{
      font-family:'Barlow Condensed',sans-serif;
      font-size:40px;font-weight:800;letter-spacing:.1em;line-height:1;
    }

    /* niksi logo */
    .niksi-mark{
      width:36px;height:36px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
    }
    .niksi-mark img{width:32px;height:32px;object-fit:contain;filter:brightness(0) invert(1) opacity(.7)}

    /* ── canvas + flash overlays ── */
    #expCanvas{
      position:absolute;inset:0;
      pointer-events:none;z-index:30;
    }
    #flash{
      position:absolute;inset:0;
      border-radius:13px;
      opacity:0;pointer-events:none;z-index:35;
    }

    /* ── shockwave ring ── */
    .shockwave{
      position:absolute;
      border-radius:50%;
      pointer-events:none;
      transform:translate(-50%,-50%) scale(0);
      opacity:0;z-index:32;
    }
  </style>
</head>
<body>

<div class="glow-outer" id="glowOuter"></div>

<div class="banner" id="banner">

  <!-- CS2SKIN -->
  <div class="slide active" id="s0">
    <div class="logo-box" style="background:rgba(124,58,237,.14);border:1px solid rgba(124,58,237,.35)">
      <img src="/assets/cs2skin.png" style="filter:brightness(0) invert(1) drop-shadow(0 0 10px rgba(124,58,237,.95))"/>
    </div>
    <div class="plat-name" style="text-shadow:0 0 28px rgba(124,58,237,.7)">CS2SKIN</div>
    <div class="vdiv"></div>
    <div class="promo">
      <div class="promo-title">100% Deposit Bonus</div>
      <div class="promo-sub">5% unlocked for every 1x of deposit wagered</div>
    </div>
    <div class="code-wrap">
      <div class="code-lbl">Use code</div>
      <div class="code-val" style="color:#7c3aed;text-shadow:0 0 18px rgba(124,58,237,.9),0 0 50px rgba(124,58,237,.5)">NIKSI</div>
    </div>
    <div class="niksi-mark"><img src="/assets/niksi.png" alt=""/></div>
  </div>

  <!-- GAMBA -->
  <div class="slide" id="s1">
    <div class="logo-box" style="background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.28)">
      <img src="/assets/gamba2.png" style="filter:drop-shadow(0 0 8px rgba(34,197,94,.75))"/>
    </div>
    <div class="plat-name" style="text-shadow:0 0 28px rgba(34,197,94,.6)">GAMBA</div>
    <div class="vdiv"></div>
    <div class="promo">
      <div class="promo-title">$750 Weekly Leaderboard</div>
      <div class="promo-sub">10-20% Lossback</div>
    </div>
    <div class="code-wrap">
      <div class="code-lbl">Use code</div>
      <div class="code-val" style="color:#22c55e;text-shadow:0 0 18px rgba(34,197,94,.9),0 0 50px rgba(34,197,94,.5)">NIKSI</div>
    </div>
    <div class="niksi-mark"><img src="/assets/niksi.png" alt=""/></div>
  </div>

  <!-- CHICKEN.GG -->
  <div class="slide" id="s2">
    <div class="logo-box" style="background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.28)">
      <img src="/assets/chicken.png" style="filter:drop-shadow(0 0 8px rgba(245,158,11,.75))"/>
    </div>
    <div class="plat-name" style="text-shadow:0 0 28px rgba(245,158,11,.6)">CHICKEN.GG</div>
    <div class="vdiv"></div>
    <div class="promo">
      <div class="promo-title">650 Coin Weekly Leaderboard</div>
      <div class="promo-sub">0.5% Wagerback - Up to 15% Lossback</div>
    </div>
    <div class="code-wrap">
      <div class="code-lbl">Use code</div>
      <div class="code-val" style="color:#f59e0b;text-shadow:0 0 18px rgba(245,158,11,.9),0 0 50px rgba(245,158,11,.5)">NIKSI</div>
    </div>
    <div class="niksi-mark"><img src="/assets/niksi.png" alt=""/></div>
  </div>

  <canvas id="expCanvas" width="1200" height="90"></canvas>
  <div id="flash"></div>
  <div class="border-line"></div>
</div>

<script>
const slides = document.querySelectorAll('.slide');
const flash  = document.getElementById('flash');
const canvas = document.getElementById('expCanvas');
const ctx    = canvas.getContext('2d');

let current   = 0;
let particles = [];
let raf       = null;
let busy      = false;

const COLORS = ['#7c3aed','#22c55e','#f59e0b'];

function hex2rgb(h){
  return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
}

/* ── particle burst ── */
function burst(color){
  const [r,g,b] = hex2rgb(color);
  const cx = 600, cy = 45;
  particles = [];

  // circle particles
  for(let i=0;i<70;i++){
    const ang = Math.PI*2*i/70 + (Math.random()-.5)*.4;
    const spd = 4 + Math.random()*10;
    const sz  = 2 + Math.random()*4;
    particles.push({x:cx,y:cy,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
      sz,life:1,decay:.035+Math.random()*.04,r,g,b,line:false});
  }
  // streak lines
  for(let i=0;i<28;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 10 + Math.random()*18;
    particles.push({x:cx,y:cy,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
      sz:1.5,life:1,decay:.05+Math.random()*.05,r,g,b,line:true});
  }
}

function drawBurst(){
  ctx.clearRect(0,0,1200,90);
  let alive = false;
  for(const p of particles){
    if(p.life<=0) continue;
    alive = true;
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += .08;
    p.life -= p.decay;
    const a = Math.max(0,p.life);
    if(p.line){
      const tx = p.x - p.vx*1.8, ty = p.y - p.vy*1.8;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(tx,ty);
      ctx.strokeStyle=`rgba(${p.r},${p.g},${p.b},${a})`;
      ctx.lineWidth=p.sz;ctx.stroke();
    } else {
      // core
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz*a,0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.r},${p.g},${p.b},${a})`;ctx.fill();
      // halo
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz*a*2.5,0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.r},${p.g},${p.b},${a*.25})`;ctx.fill();
    }
  }
  if(alive) raf=requestAnimationFrame(drawBurst);
  else ctx.clearRect(0,0,1200,90);
}

/* ── shockwave ring ── */
function shockwave(color){
  const [r,g,b] = hex2rgb(color);
  const ring = document.createElement('div');
  ring.className='shockwave';
  ring.style.cssText=`
    left:600px;top:45px;
    width:20px;height:20px;
    border:3px solid rgba(${r},${g},${b},.95);
    box-shadow:0 0 12px rgba(${r},${g},${b},.8);
  `;
  document.getElementById('banner').appendChild(ring);

  const start = performance.now();
  function animate(now){
    const t = (now-start)/350;
    if(t>=1){ring.remove();return;}
    const s = t*14;
    const a = 1-t;
    ring.style.transform=`translate(-50%,-50%) scale(${s})`;
    ring.style.opacity=a;
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
}

/* ── flash ── */
function doFlash(color, onHalf){
  const [r,g,b] = hex2rgb(color);
  flash.style.background=`rgb(${r},${g},${b})`;
  flash.style.transition='opacity .07s ease-out';
  flash.style.opacity='.65';
  setTimeout(()=>{
    if(onHalf) onHalf();
    flash.style.transition='opacity .28s ease-out';
    flash.style.opacity='0';
  },70);
}

/* ── main transition ── */
function transition(){
  if(busy) return;
  busy = true;

  const outColor  = COLORS[current];
  const next      = (current+1) % slides.length;
  const inColor   = COLORS[next];

  // blast out effect on current slide
  slides[current].style.transition='opacity .18s ease-out, transform .18s ease-out';
  slides[current].style.transform ='scale(1.06)';
  slides[current].style.opacity   ='0';

  doFlash(outColor, ()=>{
    shockwave(inColor);
    if(raf) cancelAnimationFrame(raf);
    burst(inColor);
    raf = requestAnimationFrame(drawBurst);
  });

  setTimeout(()=>{
    slides[current].classList.remove('active');
    slides[current].style.transform='';
    slides[current].style.transition='';

    current = next;

    // slam in
    slides[current].style.opacity   ='0';
    slides[current].style.transform ='scale(.92)';
    slides[current].classList.add('active');

    requestAnimationFrame(()=>{requestAnimationFrame(()=>{
      slides[current].style.transition='opacity .22s ease-out, transform .35s cubic-bezier(.34,1.56,.64,1)';
      slides[current].style.opacity   ='1';
      slides[current].style.transform ='scale(1)';
      setTimeout(()=>{slides[current].style.transition='';busy=false;},400);
    })});
  }, 190);
}

setInterval(transition, 6500);
</script>
</body>
</html>
