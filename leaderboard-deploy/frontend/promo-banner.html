<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,800;0,900;1,800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:680px;height:590px;overflow:hidden;background:#0a0e1a}

    .card{
      width:680px;height:590px;
      background:radial-gradient(ellipse at 50% -10%, #1a3a6e 0%, #0d1a35 40%, #080e1c 100%);
      position:relative;overflow:hidden;
      font-family:'Inter',sans-serif;
    }

    /* animated star particles */
    .stars{position:absolute;inset:0;pointer-events:none}
    .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s)}
    @keyframes twinkle{0%,100%{opacity:var(--lo,.1)}50%{opacity:var(--hi,.6)}}

    /* subtle grid lines */
    .card::before{
      content:'';position:absolute;inset:0;
      background:
        linear-gradient(rgba(74,158,255,.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(74,158,255,.04) 1px,transparent 1px);
      background-size:40px 40px;
    }

    /* blue glow orbs */
    .orb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
    .orb1{width:300px;height:200px;background:rgba(30,80,200,.35);top:-60px;left:50%;transform:translateX(-50%)}
    .orb2{width:200px;height:200px;background:rgba(20,60,160,.25);bottom:80px;left:-40px}
    .orb3{width:200px;height:200px;background:rgba(20,60,160,.25);bottom:80px;right:-40px}

    /* ─── HEADER ─── */
    .header{position:relative;z-index:2;text-align:center;padding-top:22px}
    .logos{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
    .logo-pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:5px 14px 5px 10px}
    .logo-icon{width:26px;height:26px;object-fit:contain;border-radius:4px}
    .logo-text{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;letter-spacing:.06em;color:#fff;text-transform:uppercase}
    .logo-x{font-size:15px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.05em}

    /* ─── PRIZE POOL ─── */
    .prize-pool{position:relative;z-index:2;text-align:center;margin-top:2px}
    .prize-amount{
      font-family:'Barlow Condensed',sans-serif;
      font-size:88px;font-weight:900;line-height:.95;
      background:linear-gradient(180deg,#ffffff 0%,#6ab4ff 55%,#3a8ae8 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 22px rgba(80,160,255,.55));
      letter-spacing:-.01em;
    }
    .prize-label{
      font-family:'Barlow Condensed',sans-serif;
      font-size:26px;font-weight:800;letter-spacing:.22em;
      color:rgba(255,255,255,.92);text-transform:uppercase;
      margin-top:1px;
    }
    .prize-label span{color:#4a9eff}

    /* ─── PODIUM ─── */
    .podium{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:0 40px;margin-top:16px}

    .pod{
      background:linear-gradient(145deg,rgba(20,45,100,.85),rgba(10,22,55,.9));
      border:1px solid rgba(74,140,255,.25);
      border-radius:14px;padding:14px 10px 12px;
      text-align:center;flex:1;max-width:160px;
      position:relative;
    }
    .pod::before{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(180deg,rgba(74,140,255,.06),transparent);pointer-events:none}

    .pod.first{
      max-width:200px;padding:18px 12px 14px;
      border-color:rgba(212,175,90,.45);
      background:linear-gradient(145deg,rgba(30,55,110,.9),rgba(12,25,60,.95));
    }
    .pod.first::before{background:linear-gradient(180deg,rgba(212,175,90,.08),transparent)}

    .crown{font-size:28px;line-height:1;display:block;margin-bottom:4px;filter:drop-shadow(0 0 8px rgba(212,175,90,.6))}
    .pod.first .crown{font-size:36px;filter:drop-shadow(0 0 12px rgba(212,175,90,.8))}
    .pod.second .crown,.pod.third .crown{filter:drop-shadow(0 0 6px rgba(180,190,210,.4))}

    .pod-amount{
      font-family:'Barlow Condensed',sans-serif;
      font-size:28px;font-weight:900;color:#fff;
      text-shadow:0 0 16px rgba(74,140,255,.6);
    }
    .pod.first .pod-amount{font-size:36px;color:#fff;text-shadow:0 0 20px rgba(212,175,90,.5)}

    .pod-rank{
      display:inline-flex;align-items:center;justify-content:center;
      width:26px;height:26px;border-radius:6px;
      font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;
      margin-top:6px;
    }
    .pod.first .pod-rank{background:#d4af5a;color:#1a0e00;width:28px;height:28px;font-size:16px;border-radius:7px}
    .pod.second .pod-rank,.pod.third .pod-rank{background:rgba(160,175,200,.15);border:1px solid rgba(160,175,200,.2);color:rgba(200,215,240,.7)}

    /* ─── INFO BOX ─── */
    .info-box{
      position:relative;z-index:2;
      margin:14px 36px 0;
      border:1.5px dashed rgba(74,140,255,.35);
      border-radius:12px;
      padding:12px 20px;
      text-align:center;
      background:rgba(10,22,55,.4);
    }
    .info-row{
      font-family:'Barlow Condensed',sans-serif;
      font-size:16px;font-weight:700;letter-spacing:.1em;
      color:rgba(210,225,255,.9);text-transform:uppercase;
      line-height:1.55;
    }
    .info-row.gold{color:#e8c96a}
    .info-row.blue{color:#6ab4ff}
    .info-row.small{font-size:12px;font-weight:600;letter-spacing:.14em;color:rgba(160,185,230,.55);margin-top:2px}

    /* ─── BOTTOM BAR ─── */
    .bottom-bar{
      position:absolute;bottom:0;left:0;right:0;
      background:linear-gradient(135deg,#0d1f4a,#0a1635);
      border-top:2px solid rgba(74,140,255,.3);
      padding:12px 0 14px;
      text-align:center;z-index:2;
    }
    .bottom-bar::before{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(90deg,transparent,#4a9eff,#3a7edd,transparent);
    }
    .code-label{
      font-family:'Barlow Condensed',sans-serif;
      font-size:14px;font-weight:700;letter-spacing:.22em;
      color:rgba(255,255,255,.55);text-transform:uppercase;margin-bottom:4px;
    }
    .code-value{
      font-family:'Barlow Condensed',sans-serif;
      font-size:34px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
      background:linear-gradient(90deg,#4a9eff,#a0d0ff,#4a9eff);
      background-size:200% auto;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      animation:shine 3s linear infinite;
      filter:drop-shadow(0 0 10px rgba(74,158,255,.45));
    }
    @keyframes shine{to{background-position:200% center}}
  </style>
</head>
<body>
<div class="card">

  <!-- glow orbs -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <!-- stars -->
  <div class="stars" id="stars"></div>

  <!-- HEADER -->
  <div class="header">
    <div class="logos">
      <div class="logo-pill">
        <img class="logo-icon" src="https://gamba.com/favicon.ico" onerror="this.style.display='none';this.nextSibling.style.display='block'" alt=""/>
        <span style="display:none;font-size:18px">🎰</span>
        <span class="logo-text">Gamba</span>
      </div>
      <div class="logo-x">×</div>
      <div class="logo-pill">
        <img class="logo-icon" src="/assets/niksi.png" onerror="this.style.display='none'" alt=""/>
        <span class="logo-text">NIKSI777</span>
      </div>
    </div>
  </div>

  <!-- PRIZE POOL -->
  <div class="prize-pool">
    <div class="prize-amount">$1,500</div>
    <div class="prize-label">BI-WEEKLY <span>LEADERBOARD</span> RACE</div>
  </div>

  <!-- PODIUM -->
  <div class="podium">
    <div class="pod second">
      <span class="crown">🥈</span>
      <div class="pod-amount">$375</div>
      <div class="pod-rank">2</div>
    </div>
    <div class="pod first">
      <span class="crown">👑</span>
      <div class="pod-amount">$750</div>
      <div class="pod-rank">1</div>
    </div>
    <div class="pod third">
      <span class="crown">🥉</span>
      <div class="pod-amount">$150</div>
      <div class="pod-rank">3</div>
    </div>
  </div>

  <!-- INFO BOX -->
  <div class="info-box">
    <div class="info-row gold">$1,500 BI-WEEKLY LEADERBOARD RACE</div>
    <div class="info-row blue">EXCLUSIVE RAKEBACK + VIP PERKS</div>
    <div class="info-row">2X WEEKLIE'S + WAGER REWARDS</div>
    <div class="info-row small">(SIGN UP WITH CODE NIKSI TO QUALIFY)</div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <div class="code-label">Sign up today using code</div>
    <div class="code-value">NIKSI</div>
  </div>

</div>
<script>
  // generate stars
  const stars = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.5;
    s.style.cssText = `
      width:${size}px;height:${size}px;
      left:${Math.random()*100}%;top:${Math.random()*100}%;
      --d:${2+Math.random()*4}s;
      --delay:${Math.random()*4}s;
      --lo:${0.05+Math.random()*0.1};
      --hi:${0.4+Math.random()*0.5};
    `;
    stars.appendChild(s);
  }
</script>
</body>
</html>
