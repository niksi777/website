<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,800;0,900;1,800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:3000px;height:1000px;overflow:hidden;background:#0a0e1a}

    .card{
      width:1500px;height:500px;
      background:radial-gradient(ellipse at 50% -10%, #1a3a6e 0%, #0d1a35 40%, #080e1c 100%);
      position:relative;overflow:hidden;
      font-family:'Inter',sans-serif;
      transform:scale(2);transform-origin:top left;
    }

    .stars{position:absolute;inset:0;pointer-events:none}
    .star{position:absolute;border-radius:50%;background:#fff}

    .card::before{
      content:'';position:absolute;inset:0;
      background:
        linear-gradient(rgba(74,158,255,.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(74,158,255,.04) 1px,transparent 1px);
      background-size:46px 46px;
    }

    .orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
    .orb1{width:520px;height:300px;background:rgba(30,80,200,.35);top:-90px;left:50%;transform:translateX(-50%)}
    .orb2{width:320px;height:320px;background:rgba(20,60,160,.25);bottom:-160px;left:80px}
    .orb3{width:320px;height:320px;background:rgba(20,60,160,.25);bottom:-160px;right:80px}

    .content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

    .brand{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
    .brand-logo{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid rgba(74,158,255,.45)}
    .brand-name{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:800;letter-spacing:.14em;color:#fff;text-transform:uppercase;line-height:1}

    .prize-amount{
      font-family:'Barlow Condensed',sans-serif;font-size:128px;font-weight:900;line-height:.92;
      background:linear-gradient(180deg,#ffffff 0%,#6ab4ff 55%,#3a8ae8 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 28px rgba(80,160,255,.55));
      letter-spacing:-.01em;
    }
    .prize-label{
      font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;letter-spacing:.24em;
      color:rgba(255,255,255,.92);text-transform:uppercase;margin-top:2px;
    }
    .prize-label span{color:#4a9eff}

    .tagline{
      font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.14em;
      text-transform:uppercase;color:rgba(210,225,255,.75);margin-top:20px;
    }
    .tagline span{color:#4a9eff}

    .perks{
      font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:.1em;
      text-transform:uppercase;color:#fff;margin-top:14px;
    }
    .perks span{color:#d4af5a}

    .pill-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px}
    .code-pill{
      display:flex;align-items:center;gap:10px;
      border:1.5px dashed rgba(74,140,255,.5);border-radius:10px;
      padding:9px 22px;background:rgba(10,22,55,.4);
    }
    .code-pill-lbl{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(200,215,240,.6)}
    .code-pill-val{
      font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;letter-spacing:.14em;
      background:linear-gradient(90deg,#4a9eff,#a0d0ff);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }

    .bottom-line{position:absolute;bottom:0;left:0;right:0;height:5px;background:linear-gradient(90deg,transparent,#4a9eff,#22c55e,#d4af5a,transparent);z-index:2}
  </style>
</head>
<body>
<div class="card">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="stars" id="stars"></div>

  <div class="content">
    <div class="brand">
      <img class="brand-logo" src="assets/niksi.png" onerror="this.style.display='none'" alt=""/>
      <div class="brand-name">NIKSI777</div>
    </div>

    <div class="prize-amount">$4,000</div>
    <div class="prize-label">Monthly <span>Leaderboard</span></div>

    <div class="tagline">Gambling streams - <span>exclusive</span> leaderboards - giveaways</div>
    <div class="perks">VIP Perks - <span>70% Commission</span> - Promo Codes!</div>

    <div class="pill-row">
      <div class="code-pill">
        <div class="code-pill-lbl">Use Code</div>
        <div class="code-pill-val">NIKSI</div>
      </div>
    </div>
  </div>

  <div class="bottom-line"></div>
</div>
<script>
  const stars = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${0.1+Math.random()*0.5};`;
    stars.appendChild(s);
  }
</script>
</body>
</html>
