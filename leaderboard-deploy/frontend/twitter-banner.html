<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,800;0,900;1,800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1500px;height:500px;overflow:hidden;background:#070a14}

    .card{
      width:1500px;height:500px;
      background:radial-gradient(ellipse at 78% 50%, #1a3a6e 0%, #0d1a35 38%, #060a16 78%);
      position:relative;overflow:hidden;
      font-family:'Inter',sans-serif;
    }

    .card::before{
      content:'';position:absolute;inset:0;
      background:
        linear-gradient(rgba(74,158,255,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(74,158,255,.05) 1px,transparent 1px);
      background-size:46px 46px;
    }

    .stars{position:absolute;inset:0;pointer-events:none}
    .star{position:absolute;border-radius:50%;background:#fff}

    .orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
    .orb1{width:420px;height:420px;background:rgba(74,140,255,.30);top:-140px;right:60px}
    .orb2{width:320px;height:320px;background:rgba(34,197,94,.10);bottom:-160px;left:120px}
    .orb3{width:260px;height:260px;background:rgba(212,175,90,.10);bottom:-100px;right:340px}

    .content{position:relative;z-index:2;height:100%;display:flex;align-items:center;padding:0 80px;justify-content:space-between}

    .left{display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:18px;margin-bottom:18px}
    .brand-logo{width:74px;height:74px;border-radius:50%;object-fit:cover;border:3px solid rgba(74,158,255,.45)}
    .brand-name{font-family:'Barlow Condensed',sans-serif;font-size:64px;font-weight:800;letter-spacing:.08em;color:#fff;text-transform:uppercase;line-height:1}

    .tagline{
      font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;letter-spacing:.12em;
      text-transform:uppercase;color:rgba(210,225,255,.85);margin-bottom:26px;
    }
    .tagline span{color:#4a9eff}

    .pill-row{display:flex;align-items:center;gap:14px}
    .code-pill{
      display:flex;align-items:center;gap:10px;
      border:1.5px dashed rgba(74,140,255,.5);border-radius:10px;
      padding:10px 22px;background:rgba(10,22,55,.4);
    }
    .code-pill-lbl{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(200,215,240,.6)}
    .code-pill-val{
      font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;letter-spacing:.14em;
      background:linear-gradient(90deg,#4a9eff,#a0d0ff);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }

    .social-row{display:flex;align-items:center;gap:10px}
    .soc{width:46px;height:46px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}

    .right{display:flex;flex-direction:column;align-items:center;text-align:center}
    .prize-amount{
      font-family:'Barlow Condensed',sans-serif;font-size:118px;font-weight:900;line-height:.95;
      background:linear-gradient(180deg,#ffffff 0%,#6ab4ff 55%,#3a8ae8 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 26px rgba(80,160,255,.55));
    }
    .prize-label{
      font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:.24em;
      color:rgba(255,255,255,.9);text-transform:uppercase;margin-top:2px;
    }
    .prize-label span{color:#d4af5a}

    .bottom-line{position:absolute;bottom:0;left:0;right:0;height:5px;background:linear-gradient(90deg,transparent,#4a9eff,#22c55e,#d4af5a,transparent);z-index:2}
  </style>
</head>
<body>
<div class="card">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="stars" id="stars"></div>

  <div class="content">
    <div class="left">
      <div class="brand">
        <img class="brand-logo" src="assets/niksi.png" onerror="this.style.display='none'" alt=""/>
        <div class="brand-name">NIKSI777</div>
      </div>
      <div class="tagline">Gambling streams - <span>exclusive</span> leaderboards - giveaways</div>
      <div class="pill-row">
        <div class="code-pill">
          <div class="code-pill-lbl">Use Code</div>
          <div class="code-pill-val">NIKSI</div>
        </div>
        <div class="social-row">
          <div class="soc"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 3h4v5.5L11 3h5l-5.5 6.5L16 15h-5l-4-4.5V15H3V3z" fill="#22c55e"/></svg></div>
          <div class="soc"><svg width="20" height="20" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.464-.674.86-1.339 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128c.126-.094.247-.192.372-.292a.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg></div>
          <div class="soc"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63z"/></svg></div>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="prize-amount">$1,500</div>
      <div class="prize-label">Bi-weekly <span>leaderboard</span> race</div>
    </div>
  </div>

  <div class="bottom-line"></div>
</div>
<script>
  const stars = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${0.1+Math.random()*0.5};`;
    stars.appendChild(s);
  }
</script>
</body>
</html>
