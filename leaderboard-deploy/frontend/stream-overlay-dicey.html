<script>
// Soft drifting dots outside the screen hole
const cnv = document.getElementById('sparks');
const ctx = cnv.getContext('2d');
const REGIONS = [
  { x1: 0, y1: 0, x2: 1496, y2: 54, w: 2 },
  { x1: 1500, y1: 0, x2: 1920, y2: 1080, w: 8 },
  { x1: 0, y1: 924, x2: 1500, y2: 1080, w: 5 },
];
const rnd = (a, b) => a + Math.random() * (b - a);

function pickRegion() {
  const total = REGIONS.reduce((s, r) => s + r.w, 0);
  let n = Math.random() * total;
  for (const r of REGIONS) { n -= r.w; if (n <= 0) return r; }
  return REGIONS[REGIONS.length - 1];
}

function makeDot() {
  const r = pickRegion();
  const a = -Math.PI / 2 + rnd(-0.8, 0.8);
  const spd = rnd(0.05, 0.35);
  return {
    r, x: rnd(r.x1, r.x2), y: rnd(r.y1, r.y2), sz: rnd(1, 3.4),
    vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
    phase: rnd(0, Math.PI * 2), ps: rnd(0.008, 0.03), maxA: rnd(0.2, 0.7),
  };
}

const DOTS = Array.from({ length: 90 }, makeDot);

function frame() {
  ctx.clearRect(0, 0, 1920, 1080);
  for (const d of DOTS) {
    d.phase += d.ps;
    d.x += d.vx;
    d.y += d.vy;
    if (d.y < d.r.y1 - 6 || d.y > d.r.y2 + 6 || d.x < d.r.x1 - 6 || d.x > d.r.x2 + 6) {
      Object.assign(d, makeDot());
      continue;
    }
    const alpha = d.maxA * (0.3 + 0.7 * Math.abs(Math.sin(d.phase)));
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.sz, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(201,214,234,${alpha.toFixed(2)})`;
    ctx.shadowColor = 'rgba(201,214,234,.6)';
    ctx.shadowBlur = 6;
    ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
