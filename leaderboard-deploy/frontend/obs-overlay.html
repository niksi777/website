<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{background:transparent;width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif}
    .overlay{position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(7,8,12,0.92);border-top:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;padding:0 20px;gap:20px;backdrop-filter:blur(10px)}
    .logo{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.16em;color:#fff;text-transform:uppercase;opacity:.5;flex-shrink:0}
    .divider{width:1px;height:28px;background:rgba(255,255,255,.1);flex-shrink:0}
    .block{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
    .block-label{font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(221,227,239,.5)}
    .block-value{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:.04em;color:#fff;line-height:1}
    .block-value.green{color:#22c55e}
    .block-value.accent{color:#b8cce8}
    .timer-block{display:flex;flex-direction:column;gap:5px;width:160px;flex-shrink:0}
    .timer-top{display:flex;align-items:center;justify-content:space-between}
    .timer-label{font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(221,227,239,.5)}
    .timer-val{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:#fff;line-height:1}
    .bar-track{height:2px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
    .bar-fill{height:100%;border-radius:99px;background:rgba(255,255,255,.5);transition:width .5s linear}
    .bar-fill.urgent{background:#d94f4f}
    .status-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;flex-shrink:0;animation:pu 1.5s ease-in-out infinite}
    @keyframes pu{0%,100%{opacity:1}50%{opacity:.2}}
    .idle-msg{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(221,227,239,.3);flex:1;text-align:center}
  
    #constellation{position:fixed;inset:0;z-index:0;pointer-events:none}
  </style>
</head>
<body>
<canvas id="constellation"></canvas>

<div class="overlay">
  <div class="logo">NIKSI777</div>
  <div class="divider"></div>
  <div id="content-idle" style="flex:1;display:flex;align-items:center;justify-content:center">
    <div class="idle-msg">No active giveaway</div>
  </div>
  <div id="content-active" style="flex:1;display:none;align-items:center;gap:20px">
    <div class="block">
      <div class="block-label">Keyword</div>
      <div class="block-value green" id="kw">-</div>
    </div>
    <div class="divider"></div>
    <div class="block">
      <div class="block-label">Entries</div>
      <div class="block-value accent" id="entries">0</div>
    </div>
    <div class="divider"></div>
    <div class="timer-block" id="timer-block" style="display:none">
      <div class="timer-top">
        <div style="display:flex;align-items:center;gap:5px">
          <div class="status-dot"></div>
          <div class="timer-label">Time Left</div>
        </div>
        <div class="timer-val" id="timer-val">1:00</div>
      </div>
      <div class="bar-track"><div class="bar-fill" id="bar" style="width:100%"></div></div>
    </div>
  </div>
</div>
<script>
  let DURATION=60;
  let timerInterval=null,secondsLeft=DURATION,lastKeyword=null,lastSignal=null;
  function fmt(s){return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60;}

  function startTimer(){
    secondsLeft=DURATION;clearInterval(timerInterval);
    document.getElementById('timer-block').style.display='flex';
    timerInterval=setInterval(()=>{
      secondsLeft=Math.max(0,secondsLeft-1);
      document.getElementById('timer-val').textContent=fmt(secondsLeft);
      const pct=(secondsLeft/DURATION)*100;
      const bar=document.getElementById('bar');
      bar.style.width=pct+'%';
      bar.className='bar-fill'+(secondsLeft<=10?' urgent':'');
      if(secondsLeft===0)clearInterval(timerInterval);
    },1000);
  }

  function stopTimer(){
    clearInterval(timerInterval);
    document.getElementById('timer-block').style.display='none';
    document.getElementById('timer-val').textContent=fmt(DURATION);
    document.getElementById('bar').style.width='100%';
  }

  async function pollTimer(){
    try{
      const r=await fetch('/giveaway/timer');
      const d=await r.json();
      if(d.signal && d.signal!==lastSignal){
        if(d.duration) DURATION=d.duration;
        if(d.duration) DURATION=d.duration;
        lastSignal=d.signal;
        if(d.signal==='start') startTimer();
        else if(d.signal==='stop') stopTimer();
      }
    }catch(e){}
  }

  async function pollState(){
    try{
      const r=await fetch('/giveaway/state');
      const d=await r.json();
      const idle=document.getElementById('content-idle');
      const active=document.getElementById('content-active');
      if(d.giveaway&&!d.giveaway.winner){
        idle.style.display='none';active.style.display='flex';
        document.getElementById('kw').textContent=d.giveaway.keyword;
        document.getElementById('entries').textContent=d.entries?d.entries.length:0;
        if(d.giveaway.keyword!==lastKeyword){lastKeyword=d.giveaway.keyword;}
      }else{
        idle.style.display='flex';active.style.display='none';
        lastKeyword=null;stopTimer();
      }
    }catch(e){}
  }

  pollState();pollTimer();
  setInterval(pollState,2000);
  setInterval(pollTimer,1000);
</script>

<script>
(function(){
  var canvas = document.getElementById('constellation');
  var ctx = canvas.getContext('2d');
  var N = 110, DIST = 140;
  var W, H, pts = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  function mkPt(){ return { x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25, r:Math.random()*1.2+.4, o:Math.random()*.45+.1 }; }
  function init(){ resize(); pts=[]; for(var i=0;i<N;i++) pts.push(mkPt()); }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<N;i++){
      var a=pts[i];
      for(var j=i+1;j<N;j++){
        var b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<DIST){ ctx.beginPath(); ctx.strokeStyle='rgba(130,170,255,'+((1-d/DIST)*.12)+')'; ctx.lineWidth=.6; ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      }
    }
    for(var i=0;i<N;i++){
      var p=pts[i]; p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='rgba(160,190,255,'+p.o+')'; ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  init(); window.addEventListener('resize', resize); tick();
})();
</script>
</body>
</html>
