<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 400px;
      height: 120px;
      overflow: hidden;
      background: transparent;
    }

    .banner {
      width: 400px;
      height: 120px;
      background: linear-gradient(135deg, #030f07, #071a0e, #030f07);
      background-size: 300% 300%;
      border: 3px solid rgba(34, 197, 94, 0.9);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      animation: bgShift 6s ease-in-out infinite, borderPulse 2.5s ease-in-out infinite;
    }
    @keyframes bgShift {
      0%,100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    @keyframes borderPulse {
      0%,100% { border-color: rgba(34,197,94,0.9); }
      50%      { border-color: rgba(34,197,94,1); }
    }

    /* Expanding rings */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(34,197,94,0.15);
      left: 50%; top: 50%;
      transform: translate(-50%,-50%) scale(0);
      animation: ringExpand 3.6s ease-out infinite;
    }
    .ring:nth-child(2) { animation-delay: 1.2s; }
    .ring:nth-child(3) { animation-delay: 2.4s; }
    @keyframes ringExpand {
      0%   { width: 40px; height: 40px; opacity: 0.6; transform: translate(-50%,-50%) scale(0); }
      100% { width: 500px; height: 500px; opacity: 0; transform: translate(-50%,-50%) scale(1); }
    }

    /* Top edge glow */
    .edge {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(34,197,94,0.6), transparent);
      animation: edgePulse 2.5s ease-in-out infinite;
      z-index: 4;
    }
    @keyframes edgePulse {
      0%,100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }

    /* Shimmer sweep */
    .shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(34,197,94,0.06) 50%, transparent 70%);
      background-size: 200% 100%;
      animation: sweep 3.5s ease-in-out infinite;
      pointer-events: none;
      z-index: 3;
    }
    @keyframes sweep {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Floating $ signs */
    .floats {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .f {
      position: absolute;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      color: rgba(34,197,94,0.18);
      animation: floatUp linear infinite;
      bottom: -20px;
    }
    .f:nth-child(1)  { left:  8%; font-size:14px; animation-duration:5.5s; animation-delay:0s; }
    .f:nth-child(2)  { left: 18%; font-size:10px; animation-duration:7s;   animation-delay:1.3s; }
    .f:nth-child(3)  { left: 30%; font-size:16px; animation-duration:6s;   animation-delay:2.1s; }
    .f:nth-child(4)  { left: 50%; font-size:11px; animation-duration:5s;   animation-delay:0.7s; }
    .f:nth-child(5)  { left: 65%; font-size:13px; animation-duration:6.5s; animation-delay:1.8s; }
    .f:nth-child(6)  { left: 80%; font-size:10px; animation-duration:7.5s; animation-delay:3s; }
    .f:nth-child(7)  { left: 92%; font-size:15px; animation-duration:5.8s; animation-delay:0.4s; }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(-8deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-140px) rotate(8deg); opacity: 0; }
    }

    /* Content */
    .content {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-align: center;
    }

    .logo {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      opacity: 0.55;
    }
    .logo img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(34,197,94,0.4));
    }

    .amount {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
      color: #22c55e;
      letter-spacing: 0.02em;
      text-shadow: 0 0 24px rgba(34,197,94,0.7), 0 0 60px rgba(34,197,94,0.3);
      animation: amountPulse 2.5s ease-in-out infinite;
    }
    @keyframes amountPulse {
      0%,100% { text-shadow: 0 0 24px rgba(34,197,94,0.7), 0 0 60px rgba(34,197,94,0.3); }
      50%      { text-shadow: 0 0 36px rgba(34,197,94,1),   0 0 80px rgba(34,197,94,0.5); }
    }

    .title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      background: linear-gradient(90deg, #fff 0%, #86efac 40%, #fff 60%, #86efac 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleShine 3s linear infinite;
    }
    @keyframes titleShine {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
  </style>
</head>
<body>
<div class="banner">
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="edge"></div>
  <div class="shimmer"></div>
  <div class="floats">
    <span class="f">$</span>
    <span class="f">$</span>
    <span class="f">$</span>
    <span class="f">$</span>
    <span class="f">$</span>
    <span class="f">$</span>
    <span class="f">$</span>
  </div>

  <div class="logo"><img src="/assets/gamba.png" alt="Gamba"/></div>

  <div class="content">
    <div class="amount">$750</div>
    <div class="title">Weekly Leaderboard!</div>
  </div>
</div>
</body>
</html>
