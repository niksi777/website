<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Giveaway</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body class="text-white" style="background-color: #0f1729;">
<div id="root"></div>

<script type="text/babel">

    

function Giveaway() {
  return (
    <div className="text-center py-20 px-6 bg-gradient-to-b from-[#111827] to-[#0f172a]">

        <div className="text-center mb-16">
        <h1 className="text-5xl font-bold tracking-tight">
          WEEKLY $100 GIVEAWAY
        </h1>
      </div>

     <div className="absolute top-8 left-8">
  <nav className="flex items-center space-x-6">

    <a
      href="/"
      className="text-white/70 hover:text-white transition tracking-wide"
    >
      Leaderboard
    </a>

    <a
      href="/giveaway.html"
      className="text-white/70 hover:text-white transition tracking-wide"
    >
      Giveaway
    </a>

  </nav>
</div>

<div className="flex justify-center mb-12">
    <a
      href="https://gamba.com?c=niksi"
      target="_blank"
      rel="noopener noreferrer"
      className="bg-white text-black px-10 py-4 rounded-2xl font-semibold tracking-wide hover:scale-105 transition-all duration-200 shadow-xl"
    >
      SIGN UP
    </a>
  </div>
      

      

      <div className="max-w-3xl mx-auto space-y-10">

        <div className="border border-white/10 p-8 rounded-xl shadow-lg shadow-black/40">
          <h2 className="text-2xl mb-4 font-semibold">
            Every friday 2 x $50 will be given out to TWO lucky winners!
          </h2>
          <p>NOTE: Only players with $500 wagered on the current LIVE leaderboard will be on the wheel!</p>
        </div>

        <div className="border border-white/10 p-8 rounded-xl shadow-lg shadow-black/40">
          <h2 className="text-2xl mb-4 font-semibold">
            Rules
          </h2>
          <ul className="space-y-2 opacity-80">
            <li>• Play using my link</li>
            <li>• Minimum wager required $500</li>
          </ul>
        </div>

      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Giveaway/>);

</script>
</body>
</html>
