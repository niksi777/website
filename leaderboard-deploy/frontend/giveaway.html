    .roller-stage{position:relative;height:120px;overflow:hidden;border-radius:12px;background:var(--s2);border:1px solid var(--b1)}

    .roller-stage::after{content:'';position:absolute;right:0;top:0;bottom:0;width:100px;background:linear-gradient(to left,var(--s2),transparent);z-index:2;pointer-events:none}

    .roller-track{display:flex;align-items:center;gap:12px;position:absolute;top:0;height:100%;will-change:transform;white-space:nowrap}

    .roller-card.winner-card{background:rgba(255,255,255,.12);border-color:#fff;box-shadow:0 0 30px rgba(255,255,255,.3);animation:glow 1.5s ease-in-out infinite}
    .roll-btn{width:100%;padding:16px;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border:none;background:#fff;color:#07080c;transition:opacity .15s}
    .roll-btn:hover{opacity:.85}
    .roll-btn:disabled{opacity:.4;cursor:not-allowed}
    .winner-box{background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:32px;text-align:center;animation:winner-pop .5s ease both;display:flex;flex-direction:column;align-items:center;gap:14px}
    .winner-label{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
    .winner-name{font-family:'Barlow Condensed',sans-serif;font-size:clamp(36px,6vw,64px);font-weight:800;text-transform:uppercase;color:#fff;letter-spacing:.02em;line-height:1}
    .winner-prize{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--ac)}
    .confetti{font-size:32px;letter-spacing:8px}
    footer{border-top:1px solid var(--b1);padding:22px 0}
    .ftw{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .ftd{font-size:12px;line-height:1.6;color:var(--mu);max-width:500px}
    .ftd strong{color:rgba(221,227,239,.9)}
    .ftc{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
    @media(max-width:680px){
      .nlinks,.nsoc{display:none}
      .hamburger{display:flex}
      .form-grid{grid-template-columns:1fr}
      .statusbar{grid-template-columns:1fr}
      .stat{border-right:none;border-bottom:1px solid var(--b1)}
      .stat:last-child{border-bottom:none}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const CORRECT_PASSWORD='niksi';
  const CARD_W=160;
  const CARD_GAP=12;
  const SOCIALS=<>
    <a href="https://kick.com/niksi777" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" fill="none"><path d="M3 3h4v5.5L11 3h5l-5.5 6.5L16 15h-5l-4-4.5V15H3V3z" fill="#22c55e"/></svg></a>
    <a href="https://discord.com/invite/Gnyv25SHg7" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.464-.674.86-1.339 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128c.126-.094.247-.192.372-.292a.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg></a>
    <a href="https://x.com/code_niksi777" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63z"/></svg></a>
  </>;
  function Navbar(){
    const [open,setOpen]=React.useState(false);
    return (<>
      <nav><div className="ni">
        <a href="/" className="nlogo"><img src="/assets/niksi.png" alt="NIKSI777"/><span className="nname">NIKSI777</span></a>
        <div className="nlinks"><a href="/">HOME</a><a href="/leaderboards.html">LEADERBOARDS</a><a href="/giveaway.html" className="on">GIVEAWAY</a></div>
        <div className="nsoc">{SOCIALS}</div>
        <button className="hamburger" onClick={()=>setOpen(o=>!o)}>
          <span style={open?{transform:'rotate(45deg) translate(5px,5px)'}:{}}/>
          <span style={open?{opacity:0}:{}}/>
          <span style={open?{transform:'rotate(-45deg) translate(5px,-5px)'}:{}}/>
        </button>
      </div></nav>
      <div className={'drawer'+(open?' open':'')}>
        <a href="/">HOME</a><a href="/leaderboards.html">LEADERBOARDS</a><a href="/giveaway.html" className="on">GIVEAWAY</a>
      </div>
    </>);
  }
  function fmt(s){return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60;}
  function CardRoller({entries,onWinner,forceWinner,onForceConsumed}){
    const trackRef=React.useRef(null);
    const stageRef=React.useRef(null);
    const [cards,setCards]=React.useState([]);
    const [rolling,setRolling]=React.useState(false);
    const [winnerIdx,setWinnerIdx]=React.useState(null);
    React.useEffect(()=>{
      if(forceWinner&&entries.length>0) rollWithWinner(forceWinner);
    },[forceWinner]);
    function rollWithWinner(forcedName){
      if(rolling||entries.length===0) return;
      const names=entries.map(e=>e.username);
      const deck=[];
      for(let i=0;i<25;i++) deck.push(...[...names].sort(()=>Math.random()-.5));
      const winnerCardIdx=Math.floor(deck.length*0.78)+Math.floor(Math.random()*8);
      deck[winnerCardIdx]=forcedName;
      const cardList=deck.map((name,i)=>({name,i,isWinner:i===winnerCardIdx}));
      setCards(cardList);setWinnerIdx(null);setRolling(true);
      requestAnimationFrame(()=>{
        const track=trackRef.current;const stage=stageRef.current;
        const stageW=stage.offsetWidth;
        const cardStep=CARD_W+CARD_GAP;
        const endX=(stageW/2)-(winnerCardIdx*cardStep)-(CARD_W/2);
        const startX=stageW;
        track.style.transition='none';
        track.style.transform='translateX('+startX+'px)';
        void track.offsetWidth;
        requestAnimationFrame(()=>{
          track.style.transition='transform 5s cubic-bezier(0.08,0.82,0.17,1)';
          track.style.transform='translateX('+endX+'px)';
        });
        setTimeout(()=>{setRolling(false);setWinnerIdx(winnerCardIdx);onWinner(forcedName);if(onForceConsumed)onForceConsumed();},5300);
      });
    }
    function roll(){
      if(rolling||entries.length===0) return;
      const names=entries.map(e=>e.username);
      const winnerName=names[Math.floor(Math.random()*names.length)];
      const deck=[];
      for(let i=0;i<25;i++) deck.push(...[...names].sort(()=>Math.random()-.5));
      const winnerCardIdx=Math.floor(deck.length*0.78)+Math.floor(Math.random()*8);
      deck[winnerCardIdx]=winnerName;
      const cardList=deck.map((name,i)=>({name,i,isWinner:i===winnerCardIdx}));
      setCards(cardList);setWinnerIdx(null);setRolling(true);
      requestAnimationFrame(()=>{
        const track=trackRef.current;const stage=stageRef.current;
        if(!track||!stage){setRolling(false);return;}
        const stageW=stage.offsetWidth;
        const cardStep=CARD_W+CARD_GAP;
        // Winner card's left edge within track = winnerCardIdx*cardStep
        // Its center = winnerCardIdx*cardStep + CARD_W/2
        // To put that center at stageW/2: translateX = stageW/2 - (winnerCardIdx*cardStep + CARD_W/2)
        const endX=(stageW/2)-(winnerCardIdx*cardStep)-(CARD_W/2);
        const startX=stageW;
        track.style.transition='none';
        track.style.transform='translateX('+startX+'px)';
        void track.offsetWidth;
        requestAnimationFrame(()=>{
          track.style.transition='transform 5s cubic-bezier(0.08,0.82,0.17,1)';
          track.style.transform='translateX('+endX+'px)';
        });
        setTimeout(()=>{setRolling(false);setWinnerIdx(winnerCardIdx);onWinner(winnerName);},5300);
      });
    }
    const hasRolled = cards.length>0;
    return (
      <div className="roller-wrap f2">
        <div className="roller-title">Roll Winner</div>
        {hasRolled&&(
          <div className="roller-stage" ref={stageRef}>
            <div className="roller-center-line"/>
            <div className="roller-track" ref={trackRef} style={{left:0}}>
              {cards.map((c,i)=>(
                <div key={i} className={'roller-card'+(winnerIdx===i?' winner-card':'')}>{c.name}</div>
              ))}
            </div>
          </div>
        )}
        <button className="roll-btn" onClick={roll} disabled={rolling||entries.length===0} style={{opacity:entries.length===0?0.4:1}}>
          {rolling?'Rolling...':(winnerIdx!==null?'Reroll':'Roll Winner')}
        </button>
      </div>
    );
  }
  function App(){
    const [authed,setAuthed]=React.useState(false);
    const [pw,setPw]=React.useState('');
    const [pwErr,setPwErr]=React.useState('');
    const [giveaway,setGiveaway]=React.useState(null);
    const [entries,setEntries]=React.useState([]);
    const [winner,setWinner]=React.useState(null);
    const [rerollTarget,setRerollTarget]=React.useState(null);
    const [keyword,setKeyword]=React.useState('');
    const [prize,setPrize]=React.useState('');
    const [starting,setStarting]=React.useState(false);
    const [timerMins,setTimerMins]=React.useState(1);
    const [timerSecs,setTimerSecs]=React.useState(0);
    const [useTimer,setUseTimer]=React.useState(false);
    const [timerRunning,setTimerRunning]=React.useState(false);
    const [secondsLeft,setSecondsLeft]=React.useState(60);
    const [duration,setDuration]=React.useState(60);
    const timerRef=React.useRef(null);
    function login(){if(pw===CORRECT_PASSWORD){setAuthed(true);setPwErr('');}else setPwErr('Incorrect password.');}
    async function fetchState(){
      try{
        const r=await fetch('/giveaway/state');const d=await r.json();
        setGiveaway(d.giveaway);setEntries(d.entries||[]);
        if(d.giveaway?.winner) setWinner(d.giveaway.winner);
      }catch(e){}
    }
    React.useEffect(()=>{if(!authed)return;fetchState();const id=setInterval(fetchState,3000);return()=>clearInterval(id);},[authed]);
    React.useEffect(()=>{
      const total=timerMins*60+timerSecs;
      setDuration(total);setSecondsLeft(total);
    },[timerMins,timerSecs]);
    function startTimer(dur){
      clearInterval(timerRef.current);
      const d=dur||duration;
      setSecondsLeft(d);setTimerRunning(true);
      fetch('/giveaway/timer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start', duration:dur||duration})});
      let s=d;
      timerRef.current=setInterval(()=>{s=Math.max(0,s-1);setSecondsLeft(s);if(s===0){clearInterval(timerRef.current);setTimerRunning(false);}},1000);
    }
    function stopTimer(){
      clearInterval(timerRef.current);setTimerRunning(false);setSecondsLeft(duration);
      fetch('/giveaway/timer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'stop'})});
    }
    async function startGiveaway(){
      if(!keyword.trim()||!prize.trim())return;
      setStarting(true);
      try{
        await fetch('/giveaway/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword:keyword.trim().toLowerCase(),prize:prize.trim()})});
        setKeyword('');setPrize('');if(useTimer&&timerMins*60+timerSecs>0) startTimer(timerMins*60+timerSecs);fetchState();
      }catch(e){}
      setStarting(false);
    }
    async function confirmWinner(name){
      try{await fetch('/giveaway/roll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({winner:name})});setWinner(name);}catch(e){}
    }
    async function rerollWinner(){
      try{
        const r=await fetch('/giveaway/reroll',{method:'POST'});
        const d=await r.json();
        if(d.winner){setRerollTarget(d.winner);}
      }catch(e){}
    }
    async function resetGiveaway(){
      if(!confirm('Reset and clear all entries?'))return;
      stopTimer();
      await fetch('/giveaway/reset',{method:'POST'});
      setWinner(null);fetchState();
    }
    if(!authed) return (<>
      <Navbar/>
      <div className="login-wrap">
        <div className="login-box f1">
          <div><div className="login-title">Giveaway Panel</div><div style={{fontSize:13,color:'var(--mu)',marginTop:6}}>Admin access only.</div></div>
          <input className="inp" type="password" placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()}/>
          {pwErr&&<div className="err">{pwErr}</div>}
          <button className="btn btn-pri" onClick={login}>Enter</button>
        </div>
      </div>
    </>);
    const isActive=giveaway&&!giveaway.winner&&!winner;
    const pct=(secondsLeft/Math.max(duration,1))*100;
    const urgent=secondsLeft<=10&&timerRunning;
    return (<>
      <Navbar/>
      <div className="page">
        <div className="dash">
          {giveaway&&<button className="btn btn-sec f1" style={{width:'auto',padding:'10px 20px',alignSelf:'flex-end'}} onClick={resetGiveaway}>Reset Giveaway</button>}

          <div className="statusbar f2">
            <div className="stat"><div className="stat-lbl">Status</div><div className={'stat-val '+(isActive?'green':'')}>{isActive?'LIVE':giveaway?.winner||winner?'ENDED':'IDLE'}</div></div>
            <div className="stat"><div className="stat-lbl">Entries</div><div className="stat-val">{entries.length}</div></div>
            <div className="stat"><div className="stat-lbl">Prize</div><div className="stat-val active">{giveaway?.prize||'—'}</div></div>
          </div>

          {!giveaway?(
            <div className="card f2">
              <div className="card-title">Start a New Giveaway</div>
              <div className="form-grid">
                <div className="form-group"><label className="lbl">Keyword</label><input className="inp-sm" value={keyword} onChange={e=>setKeyword(e.target.value)}/></div>
                <div className="form-group"><label className="lbl">Prize</label><input className="inp-sm" value={prize} onChange={e=>setPrize(e.target.value)}/></div>
              </div>
              <div className="divider-line"/>
              {!useTimer?(
                <button className="btn btn-sec" style={{width:'auto',alignSelf:'flex-start',padding:'10px 20px'}} onClick={()=>setUseTimer(true)}>Add Timer</button>
              ):(
                <div className="timer-setup">
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <div className="lbl">Timer</div>
                    <button className="btn btn-sec" style={{width:'auto',padding:'6px 14px',fontSize:10}} onClick={()=>setUseTimer(false)}>Remove Timer</button>
                  </div>
                  <div className="timer-setup-row">
                    <div className="timer-preview">{fmt(timerMins*60+timerSecs)}</div>
                    <div style={{display:'flex',gap:8,alignItems:'center'}}>
                      <div className="form-group" style={{gap:4}}>
                        <label className="lbl" style={{fontSize:10}}>Min</label>
                        <input className="inp-sm" type="number" min="0" max="59" style={{width:70}} value={timerMins} onChange={e=>setTimerMins(Math.max(0,parseInt(e.target.value)||0))}/>
                      </div>
                      <div style={{color:'var(--mu)',fontSize:20,fontWeight:700,marginTop:16}}>:</div>
                      <div className="form-group" style={{gap:4}}>
                        <label className="lbl" style={{fontSize:10}}>Sec</label>
                        <input className="inp-sm" type="number" min="0" max="59" style={{width:70}} value={timerSecs} onChange={e=>setTimerSecs(Math.min(59,Math.max(0,parseInt(e.target.value)||0)))}/>
                      </div>
                    </div>
                  </div>
                </div>
              )}
              <div className="divider-line"/>
              <button className="btn btn-pri" onClick={startGiveaway} disabled={starting||!keyword.trim()||!prize.trim()}>{starting?'Starting...':'Start Giveaway'}</button>
            </div>
          ):(
            <div className="card f2">
              <div className="card-title">Active Giveaway</div>
              <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
                <div><div className="lbl" style={{marginBottom:6}}>Keyword</div><div className="keyword-badge"><span>Keyword</span>{giveaway.keyword}</div></div>
                <div style={{flex:1,minWidth:160}}><div className="lbl" style={{marginBottom:6}}>Prize</div><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:24,fontWeight:700,color:'#fff'}}>{giveaway.prize}</div></div>
              </div>
              {timerRunning&&(<>
              <div className="divider-line"/>
              <div className="timer-setup">
                <div className="lbl">Timer</div>
                <div className="timer-setup-row">
                  <div className={'timer-preview'+(urgent?' urgent':'')}>{fmt(secondsLeft)}</div>
                  <button className="btn btn-sec" style={{width:'auto',padding:'8px 16px',marginLeft:'auto'}} onClick={stopTimer}>Stop</button>
                </div>
                <div className="bar-track"><div className={'bar-fill'+(urgent?' urgent':'')} style={{width:pct+'%'}}/></div>
              </div>
              </>)}
            </div>
          )}

          {isActive&&<CardRoller entries={entries} onWinner={confirmWinner} forceWinner={rerollTarget} onForceConsumed={()=>setRerollTarget(null)}/>}

          {(winner||(giveaway?.winner))&&(
            <div className="winner-box f2">
              <div className="confetti">🎉 🏆 🎉</div>
              <div className="winner-label">Winner</div>
              <div className="winner-name">{winner||giveaway?.winner}</div>
              {giveaway?.prize&&<div className="winner-prize">{giveaway.prize}</div>}
              <button className="btn btn-sec" style={{marginTop:8,padding:"10px 24px",width:"auto"}} onClick={rerollWinner}>Reroll</button>
            </div>
          )}

          <div className="f3">
            <div style={{fontFamily:"'Inter',sans-serif",fontSize:12,fontWeight:500,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--mu)',marginBottom:16}}>Entries — {entries.length}</div>
            {entries.length===0?(
              <div className="empty">No entries yet — waiting for Kick chat</div>
            ):(
              <div className="entries-grid">
                {entries.map((e,i)=>(
                  <div key={e.id||i} className="entry-chip">
                    <div className="entry-num">#{i+1}</div>
                    <div className="entry-name">{e.username}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
      <footer><div className="page"><div className="ftw"><p className="ftd"><strong>18+</strong> — We are not responsible for any losses incurred from gambling on casino or betting platforms linked or promoted on this site.</p><span className="ftc">© 2026 NIKSI777</span></div></div></footer>
    </>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
