<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIKSI777 - Giveaway</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#07080e;--s1:#0c1020;--s2:#101828;--b1:rgba(255,255,255,.04);--b2:rgba(255,255,255,.08);--b3:rgba(255,255,255,.14);--tx:#dde3ef;--mu:rgba(221,227,239,.65);--ac:#4a9eff;--rd:#e03535}
    html,body{background-color:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
    @keyframes pu{0%,100%{opacity:1}50%{opacity:.15}}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes winner-pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
    @keyframes glow{0%,100%{box-shadow:0 0 20px rgba(255,255,255,.15)}50%{box-shadow:0 0 40px rgba(255,255,255,.35)}}
    .f1{animation:fu .5s ease both}.f2{animation:fu .5s .1s ease both}.f3{animation:fu .5s .2s ease both}
    nav{background:rgba(6,13,26,.97);border-bottom:1px solid var(--b2);position:sticky;top:0;z-index:50}
    .ni{max-width:1020px;margin:0 auto;padding:0 28px;display:flex;align-items:center;height:56px}
    .nlogo{display:flex;align-items:center;gap:10px;padding-right:22px;border-right:1px solid var(--b2);margin-right:18px;flex-shrink:0;text-decoration:none}
    .nlogo img{height:28px;width:28px;border-radius:50%;object-fit:cover}
    .nname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.16em;color:#fff;text-transform:uppercase}
    .nlinks{display:flex;align-items:center;flex:1}
    .nlinks a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:0 13px;height:56px;display:flex;align-items:center;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;margin-bottom:-1px}
    .nlinks a:hover{color:rgba(255,255,255,.9)}
    .nlinks a.on{color:#fff;border-bottom-color:rgba(255,255,255,.5)}
    .nsoc{margin-left:auto;display:flex;align-items:center;gap:2px;padding-left:16px;border-left:1px solid var(--b2)}
    .nsoc a{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;opacity:.5;transition:opacity .15s}
    .nsoc a:hover{opacity:1;background:rgba(255,255,255,.05)}
    .nsoc svg{width:15px;height:15px}
    .nauth{display:flex;align-items:center;gap:8px;padding-left:12px;margin-left:auto}
    .nlogin-btn{display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:7px;background:#22c55e;color:#fff;border:none;cursor:pointer;transition:opacity .15s;text-decoration:none;white-space:nowrap;flex-shrink:0}
    .nlogin-btn:hover{opacity:.85}
    .nuser{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:7px;background:var(--s1);border:1px solid var(--b2)}
    .nuser-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--s2)}
    .nuser-name{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--tx)}
    .nuser-NP{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#d4af5a}
    .ndrop{position:relative}
    .ndrop-menu{display:none;position:absolute;top:100%;right:0;padding-top:6px;z-index:200;min-width:150px}
    .ndrop:hover .ndrop-menu{display:block}
    .ndrop-box{background:rgba(7,8,12,.97);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
    .ndrop-item{display:block;width:100%;text-align:left;padding:9px 14px;font-size:12px;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(221,227,239,.75);text-decoration:none;background:none;border:none;cursor:pointer;border-radius:6px;transition:background .1s;box-sizing:border-box}
    .ndrop-item:hover{background:rgba(255,255,255,.06)}
    .ndrop-logout{color:rgba(217,79,79,.8)}
    .hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:32px;height:32px;cursor:pointer;margin-left:auto;padding:4px;background:none;border:none}
    .hamburger span{display:block;height:1.5px;background:rgba(255,255,255,.6);border-radius:2px;transition:all .2s}
    .drawer{display:none;flex-direction:column;background:rgba(7,8,12,.99);border-bottom:1px solid var(--b2);padding:10px 28px 18px}
    .drawer.open{display:flex}
    .drawer a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--b1);transition:color .15s}
    .drawer a.on,.drawer a:hover{color:#fff}
    .page{width:100%;max-width:1020px;margin:0 auto;padding:0 28px}
    .login-wrap{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center}
    .login-box{background:var(--s1);border:1px solid var(--b2);border-radius:16px;padding:40px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px}
    .login-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;text-transform:uppercase;color:#fff;letter-spacing:.04em}
    .inp{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:12px 14px;font-size:13px;color:#fff;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s}
    .inp:focus{border-color:var(--b3)}
    .btn{width:100%;padding:13px;border-radius:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border:none;transition:opacity .15s}
    .btn:hover{opacity:.82}
    .btn-pri{background:#fff;color:#07080c}
    .btn-sec{background:transparent;color:var(--mu);border:1px solid var(--b2)}
    .btn-sec:hover{color:#fff;border-color:var(--b3)}
    .btn-green{background:#22c55e;color:#fff}
    .err{font-size:12px;color:var(--rd)}
    .dash{padding:44px 0 64px;display:flex;flex-direction:column;gap:28px}
    .dash-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(32px,5vw,52px);font-weight:800;text-transform:uppercase;color:#fff;letter-spacing:-.01em;line-height:1;text-align:center}
    .htag{display:inline-flex;align-items:center;gap:7px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);border:1px solid rgba(184,204,232,.15);padding:4px 14px;border-radius:100px;margin-bottom:10px}
    .pdot{width:5px;height:5px;border-radius:50%;background:var(--ac);animation:pu 2s ease-in-out infinite;flex-shrink:0}
    .pdot-green{width:5px;height:5px;border-radius:50%;background:#22c55e;animation:pu 1.5s ease-in-out infinite;flex-shrink:0}
    .card{background:var(--s1);border:1px solid var(--b2);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:18px}
    .card-title{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group.full{grid-column:1/-1}
    .lbl{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
    .inp-sm{background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:11px 14px;font-size:13px;color:#fff;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s;width:100%}
    .inp-sm:focus{border-color:var(--b3)}
    .divider-line{height:1px;background:var(--b1)}
    .timer-setup{display:flex;flex-direction:column;gap:12px}
    .timer-setup-row{display:flex;align-items:center;gap:12px}
    .timer-preview{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;color:#fff;line-height:1;min-width:72px}
    .timer-preview.urgent{color:var(--rd)}
    .bar-track{height:3px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;flex:1}
    .bar-fill{height:100%;border-radius:99px;background:rgba(255,255,255,.4);transition:width .5s linear}
    .bar-fill.urgent{background:var(--rd)}
    .timer-btns{display:flex;gap:8px}
    .statusbar{background:var(--s1);border:1px solid var(--b1);border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr)}
    .stat{padding:18px 22px;border-right:1px solid var(--b1);text-align:center}
    .stat:last-child{border-right:none}
    .stat-lbl{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:5px}
    .stat-val{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:#fff;line-height:1}
    .stat-val.green{color:#22c55e}
    .stat-val.active{color:var(--ac)}
    .keyword-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--b2);border-radius:8px;padding:10px 16px;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.06em;color:#fff}
    .keyword-badge span{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
    .entries-grid{display:flex;flex-wrap:wrap;gap:10px}
    .entry-chip{display:inline-flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--b2);border-radius:8px;padding:10px 16px;transition:background .15s,border-color .3s}@keyframes chipIn{0%{opacity:0;transform:scale(.85) translateY(6px)}60%{transform:scale(1.04) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}.entry-chip.new-entry{border-color:#e8a427;animation:chipIn .35s cubic-bezier(.34,1.56,.64,1) both}
    .entry-chip:hover{background:var(--s2)}
    .entry-num{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--mu)}
    .entry-name{font-size:13px;font-weight:500;color:var(--tx)}
    .entry-remove{display:flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;background:none;border:none;cursor:pointer;color:rgba(221,227,239,.3);padding:0;transition:color .12s,background .12s;flex-shrink:0}
    .entry-remove:hover{color:var(--rd);background:rgba(224,53,53,.12)}
    .empty{text-align:center;padding:48px 0;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
    .roller-wrap{background:var(--s1);border:1px solid var(--b2);border-radius:16px;padding:28px 28px 24px;display:flex;flex-direction:column;gap:24px}
    .roller-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mu)}
    .roller-stage-wrap{position:relative}
    .roller-stage{position:relative;height:168px;overflow:hidden;border-radius:12px;background:var(--s1);border:1px solid var(--b2)}
    .rfade{position:absolute;top:0;bottom:0;width:140px;z-index:5;pointer-events:none}
    .rfade.l{left:0;background:linear-gradient(to right,var(--bg),transparent)}
    .rfade.r{right:0;background:linear-gradient(to left,var(--bg),transparent)}
    .rind{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:#b8cce8;z-index:10;pointer-events:none;box-shadow:0 0 10px rgba(184,204,232,.5),0 0 28px rgba(184,204,232,.2)}
    .rind::before,.rind::after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent}
    .rind::before{top:-1px;border-top:11px solid #b8cce8}
    .rind::after{bottom:-1px;border-bottom:11px solid #b8cce8}
    .roller-track{display:flex;align-items:center;gap:4px;position:absolute;top:0;height:100%;will-change:transform;white-space:nowrap;padding:0 4px}
    .roller-card{flex-shrink:0;width:140px;height:150px;border-radius:10px;background:linear-gradient(160deg,var(--s2),#080b12);border:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;user-select:none;transition:border-color .3s;position:relative;overflow:hidden}
    .roller-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.08)}
    .roller-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;object-fit:cover;border:2px solid rgba(255,255,255,.15)}
    .roller-card-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#c8cdd8}
    .roller-card.rarity-blue{border-color:rgba(74,144,217,.25)}.roller-card.rarity-blue::after{background:#4a90d9}.roller-card.rarity-blue .roller-card-name{color:#9bbde0}
    .roller-card.rarity-purple{border-color:rgba(155,89,217,.25)}.roller-card.rarity-purple::after{background:#9b59d9}.roller-card.rarity-purple .roller-card-name{color:#c4a0e8}
    .roller-card.rarity-gold{border-color:rgba(232,164,39,.4);background:linear-gradient(160deg,#141006,#0d0c0a)}.roller-card.rarity-gold::after{background:#e8a427}.roller-card.rarity-gold .roller-card-name{color:#f0c060}
    @keyframes winnerPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,164,39,0)}40%{box-shadow:0 0 28px 4px rgba(232,164,39,.4)}}
    @keyframes winnerShine{0%{background-position:200% center}100%{background-position:-200% center}}
    .roller-card.winner-card{border-color:#e8a427 !important;animation:winnerPulse 1.8s ease-in-out infinite !important}
    .roller-card.winner-card::after{background:linear-gradient(90deg,#e8a427,#f5d080,#e8a427)!important;background-size:200% auto;animation:winnerShine 2s linear infinite}
    .roller-card.winner-card .roller-card-name{background:linear-gradient(90deg,#e8a427,#fff,#e8a427);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:winnerShine 2.5s linear infinite}
    .roll-btn{width:100%;padding:15px;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border:none;background:#fff;color:#07080c;transition:opacity .15s,transform .1s}
    .roll-btn:hover{opacity:.85;transform:translateY(-1px)}
    .roll-btn:active{transform:translateY(0)}
    .roll-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
    .winner-box{background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:32px;text-align:center;animation:winner-pop .5s ease both;display:flex;flex-direction:column;align-items:center;gap:14px}
    .winner-label{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
    .winner-name{font-family:'Barlow Condensed',sans-serif;font-size:clamp(36px,6vw,64px);font-weight:800;text-transform:uppercase;color:#fff;letter-spacing:.02em;line-height:1}
    .recent-winners{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
    .recent-winners-title{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
    .recent-winner-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .recent-winner-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;text-transform:uppercase;color:var(--tx);letter-spacing:.04em}
    .recent-winner-prize{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;color:var(--ac)}
    .recent-winner-time{font-size:11px;color:var(--mu)}
    .winner-prize{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--ac)}
    .confetti{font-size:32px;letter-spacing:8px}
    .winner-panel{background:var(--s1);border:1px solid rgba(232,164,39,.3);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:20px;animation:fu .4s ease both}
    .winner-panel-header{display:flex;align-items:center;gap:16px}
    .winner-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid rgba(232,164,39,.5);flex-shrink:0;background:var(--s2)}
    .winner-panel-name{font-family:'Barlow Condensed',sans-serif;font-size:clamp(28px,4vw,42px);font-weight:800;text-transform:uppercase;color:#fff;line-height:1}
    .winner-resp-timer{font-size:13px;color:var(--mu);margin-top:6px;display:flex;align-items:center;gap:6px}
    .winner-resp-t{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:#e8a427;line-height:1}
    .winner-resp-t.urgent{color:var(--rd)}
    .chat-section{background:var(--s2);border:1px solid var(--b1);border-radius:10px;overflow:hidden}
    .chat-header{padding:11px 16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
    .chat-header .cdot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pu 1.5s ease-in-out infinite;flex-shrink:0}
    .chat-feed{height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding:8px 10px}
    .chat-feed::-webkit-scrollbar{width:3px}.chat-feed::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
    .chat-msg{display:flex;gap:10px;padding:5px 6px;border-radius:5px}
    .chat-msg:hover{background:rgba(255,255,255,.03)}
    .chat-ts{font-size:10px;color:rgba(221,227,239,.25);white-space:nowrap;padding-top:2px;min-width:44px}
    .chat-user{font-size:12px;font-weight:600;color:#e8a427;white-space:nowrap}
    .chat-content{font-size:12px;color:var(--tx);line-height:1.5;word-break:break-word}
    .pf-section{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
    .pf-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
    .pf-label{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
    .pf-hash-val{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--ac);word-break:break-all;letter-spacing:.06em;margin-top:4px}
    .pf-btns{display:flex;gap:8px;flex-wrap:wrap}
    .pf-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px solid var(--b2);background:rgba(255,255,255,.05);color:var(--mu);transition:all .15s;white-space:nowrap}
    .pf-btn:hover{background:rgba(255,255,255,.1);color:#fff;border-color:var(--b3)}
    .pf-btn:disabled{opacity:.4;cursor:not-allowed}
    .pf-btn-roll{background:#fff;color:#07080c;border-color:#fff}
    .pf-btn-roll:hover{opacity:.85;background:#fff;color:#07080c}
    .pf-proof{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:14px;font-size:11px;font-family:'Inter',sans-serif;color:var(--mu);line-height:2;word-break:break-all}
    .pf-proof strong{color:var(--tx)}
    .status-bar{display:flex;align-items:center;border:1px solid var(--b2);border-radius:10px;overflow:hidden;background:var(--s1)}
    .status-chip{display:flex;align-items:center;gap:7px;padding:10px 18px;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);border-right:1px solid var(--b2)}
    .status-chip:last-child{border-right:none}
    .sdot-green{width:5px;height:5px;border-radius:50%;background:#22c55e;flex-shrink:0}
    .sdot-blue{width:5px;height:5px;border-radius:50%;background:var(--ac);flex-shrink:0}
    footer{border-top:1px solid var(--b1);padding:22px 0}
    .ftw{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .ftd{font-size:12px;line-height:1.6;color:var(--mu);max-width:500px}
    .ftd strong{color:rgba(221,227,239,.9)}
    .ftc{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
    @media(max-width:680px){
      .nlinks,.nsoc{display:none}
      .hamburger{display:flex}

      });
      const halfW=minTiles*TILE;

      const speed=0.4;

      function step(ts){
        if(!last) last=ts;
        const dt=Math.min(ts-last,50);last=ts;
        idleX.current-=speed*(dt/16.67);
        if(idleX.current<=-halfW) idleX.current+=halfW;
        track.style.transform='translateX('+idleX.current+'px)';
        idleRaf.current=requestAnimationFrame(step);
      }

  function App(){

          <input className="inp" type="password" placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()}/>

          <button className="btn btn-pri" onClick={login}>Enter</button>
        </div>
      </div>
    </>);
    const isActive=!!giveaway;
    const pct=(secondsLeft/Math.max(duration,1))*100;
    const urgent=secondsLeft<=10&&timerRunning;
    return (<>
      <Navbar/>
      <div className="page">

              <div className="stat-lbl">Keyword</div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:36,fontWeight:800,color:'#fff',letterSpacing:'.06em',textTransform:'uppercase',lineHeight:1,marginTop:2}}>
                {giveaway?.keyword||'-'}
              </div>
            </div>
            <div className="stat"><div className="stat-lbl">Prize</div><div className="stat-val active">{giveaway?.prize||'-'}</div></div>
          </div>

          {!giveaway?(
            <div className="card f2">
              <div className="form-grid">
                <div className="form-group"><label className="lbl">Keyword</label><input className="inp-sm" placeholder="" value={keyword} onChange={e=>setKeyword(e.target.value)} autoComplete="nope"/></div>
                <div className="form-group"><label className="lbl">Prize</label><input className="inp-sm" placeholder="" value={prize} onChange={e=>setPrize(e.target.value)} autoComplete="nope"/></div>
              </div>
              <div className="divider-line"/>
              {!useTimer?(
                <button className="btn btn-sec" style={{width:'auto',alignSelf:'flex-start',padding:'10px 20px'}} onClick={()=>setUseTimer(true)}>Add Timer</button>
              ):(
                <div className="timer-setup">
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <div className="lbl">Timer</div>
                    <button className="btn btn-sec" style={{width:'auto',padding:'6px 14px',fontSize:10}} onClick={()=>setUseTimer(false)}>Remove Timer</button>
                  </div>
                  <div className="timer-setup-row">
                    <div className="timer-preview">{fmt(timerMins*60+timerSecs)}</div>
                    <div style={{display:'flex',gap:8,alignItems:'center'}}>
                      <div className="form-group" style={{gap:4}}>
                        <label className="lbl" style={{fontSize:10}}>Min</label>
                        <input className="inp-sm" type="number" min="0" max="59" style={{width:70}} value={timerMins} onChange={e=>setTimerMins(Math.max(0,parseInt(e.target.value)||0))}/>
                      </div>
                      <div style={{color:'var(--mu)',fontSize:20,fontWeight:700,marginTop:16}}>:</div>
                      <div className="form-group" style={{gap:4}}>
                        <label className="lbl" style={{fontSize:10}}>Sec</label>
                        <input className="inp-sm" type="number" min="0" max="59" style={{width:70}} value={timerSecs} onChange={e=>setTimerSecs(Math.min(59,Math.max(0,parseInt(e.target.value)||0)))}/>
                      </div>
                    </div>
                  </div>
                </div>
              )}
              <div className="divider-line"/>
              <button className="btn btn-pri" onClick={startGiveaway} disabled={starting||!keyword.trim()}>{starting?'Starting...':'Start Giveaway'}</button>
            </div>
          ):(
            timerRunning&&(
              <div className="card f2">
                <div className="timer-setup-row">
                  <div className={'timer-preview'+(urgent?' urgent':'')}>{fmt(secondsLeft)}</div>
                  <button className="btn btn-sec" style={{width:'auto',padding:'8px 16px',marginLeft:'auto'}} onClick={stopTimer}>Stop</button>
                </div>
                <div className="bar-track"><div className={'bar-fill'+(urgent?' urgent':'')} style={{width:pct+'%'}}/></div>
              </div>
            )
          )}

          {/* Provably Fair - inline controls above roller */}
          {isActive&&(
            <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:pfProof?'#22c55e':'rgba(184,204,232,.5)',display:'inline-block',flexShrink:0}}/>
                <span style={{fontSize:11,fontWeight:500,letterSpacing:'.12em',textTransform:'uppercase',color:pfProof?'rgba(221,227,239,.9)':'var(--mu)'}}>
                  Provably Fair{pfProof?' ✓':''}
                </span>
              </div>
              {!pfHash&&<button className="pf-btn" onClick={prepareSeed} disabled={pfLoading}>Generate Seed</button>}
              {pfHash&&!pfProof&&<button className="pf-btn" onClick={prepareSeed} disabled={pfLoading}>New Seed</button>}
              {pfHash&&!pfProof&&(
                <button className="pf-btn pf-btn-roll" onClick={pfRoll} disabled={pfLoading||entries.length===0}>
                  {pfLoading?'Rolling...':'PF Roll'}
                </button>
              )}
              {pfProof&&(
                <button className="pf-btn" onClick={toggleProof}>
                  {showProof?'Hide Proof':'View Proof'}
                </button>
              )}
            </div>
          )}

          {isActive&&<CardRoller entries={entries} avatarMap={avatarMap} onWinner={handleWinner} forceWinner={pfForce||rerollTarget} onForceConsumed={()=>{setPfForce(null);setRerollTarget(null);}} onRollingChange={setRollerRolling} onReroll={rerollWinner} hasWinner={!!(winner||giveaway?.winner)} recentWinners={recentWinners} onReset={giveaway?resetGiveaway:null} onRemoveEntry={async(u)=>{await removeEntry(u);fetchState();}}/>}

          {/* Proof details - only visible when toggled */}
          {pfProof&&showProof&&(
            <div ref={proofRef} className="pf-proof" style={{animation:'fu .3s ease both'}}>
              <div><strong>Winner:</strong> {pfProof.winner}</div>
              <div><strong>Server Seed:</strong> {pfProof.serverSeed}</div>
              <div><strong>Seed Hash:</strong> {pfProof.serverSeedHash}</div>
              <div><strong>Result Hash:</strong> {pfProof.resultHash}</div>
              <div><strong>Index:</strong> {pfProof.index} of {pfProof.total} entries</div>
              <div style={{marginTop:6,fontSize:10,color:'rgba(221,227,239,.3)'}}>SHA256(serverSeed + ":" + entries) - winner = entries[hash mod {pfProof.total}]</div>
            </div>
          )}

          {/* Winner Response Panel */}
          {winner&&(
            <div className="winner-panel f3" ref={winnerPanelRef}>
              <div className="winner-panel-header" style={{flexDirection:'column',alignItems:'center',textAlign:'center',gap:12}}>
                {winnerAvatarUrl ? (
                  <img src={winnerAvatarUrl} className="winner-avatar" alt={winner}/>
                ) : (
                  <div className="winner-avatar" style={{display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,color:'#e8a427'}}>
                    {winner.slice(0,2).toUpperCase()}
                  </div>
                )}
                <div>
                  <div className="winner-panel-name">{winner}</div>
                  {respTimer!==null&&(
                    <div className="winner-resp-timer" style={{justifyContent:'center'}}>
                      <span className={'winner-resp-t'+(respTimer<=10?' urgent':'')}>
                        {respTimer}s
                      </span>
                      <span>{respTimer>0?'to respond':'- time up'}</span>
                    </div>
                  )}
                </div>
              </div>
              <div className="chat-section">
                <div className="chat-header">
                  <span className="cdot"/>
                  Winner Chat - {winner}
                </div>
                <div className="chat-feed" ref={chatFeedRef}>
                  {winnerChat.length===0?(
                    <div style={{textAlign:'center',padding:'32px 0',fontSize:11,letterSpacing:'.12em',textTransform:'uppercase',color:'rgba(221,227,239,.25)'}}>No messages from {winner} yet</div>
                  ):(
                    winnerChat.map((m,i)=>{
                      const d=new Date(m.ts);
                      const t=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
                      const renderMsg=(text)=>text.split(/(\[emote:\d+:[^\]]+\])/).map((part,j)=>{
                        const em=part.match(/\[emote:(\d+):([^\]]+)\]/);
                        if(em)return<img key={j} src={`https://files.kick.com/emotes/${em[1]}/fullsize`} alt={em[2]} title={em[2]} style={{width:20,height:20,verticalAlign:'middle',display:'inline-block',margin:'0 1px'}}/>;
                        return part;
                      });
                      return(
                        <div key={i} className="chat-msg">
                          <span className="chat-ts">{t}</span>
                          <span className="chat-user">{m.username}:</span>
                          <span className="chat-content">{renderMsg(m.content)}</span>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>
          )}


        </div>
      </div>
      <footer><div className="page"><div className="ftw"><p className="ftd"><strong>18+</strong> - We are not responsible for any losses incurred from gambling on casino or betting platforms linked or promoted on this site.</p><div style={{display:'flex',alignItems:'center',gap:4}}><div className="nsoc" style={{border:'none',padding:0}}>{SOCIALS}</div><span className="ftc" style={{marginLeft:8}}>© 2026 NIKSI777</span></div></div></div>        <div style={{textAlign:"center",marginTop:10,paddingBottom:4,fontSize:11,color:"var(--mu)",letterSpacing:".08em",fontFamily:"'Inter',sans-serif"}}>Created by <strong style={{color:"var(--ac)"}}>@niksiii</strong> on Discord</div>
      </footer>
    </>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
(function(){
  var canvas = document.getElementById('constellation');
  var ctx = canvas.getContext('2d');
  var N = 110, DIST = 140;
  var W, H, pts = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  function mkPt(){ return { x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25, r:Math.random()*1.2+.4, o:Math.random()*.45+.1 }; }
  function init(){ resize(); pts=[]; for(var i=0;i<N;i++) pts.push(mkPt()); }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<N;i++){
      var a=pts[i];
      for(var j=i+1;j<N;j++){
        var b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<DIST){ ctx.beginPath(); ctx.strokeStyle='rgba(130,170,255,'+((1-d/DIST)*.12)+')'; ctx.lineWidth=.6; ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      }
    }
    for(var i=0;i<N;i++){
      var p=pts[i]; p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='rgba(160,190,255,'+p.o+')'; ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  init(); window.addEventListener('resize', resize); tick();
})();
</script>
</body>
