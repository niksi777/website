<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:1920px;height:1080px;overflow:hidden;
      background:transparent;
      font-family:'Inter',sans-serif;
    }

    /* ═══════════════════════════════════════════════════
       LAYOUT
       Top bar:      y=0    h=58     full width
       Game + Side:  y=58   h=862    game transparent | sidebar solid
       Bottom strip: y=920  h=160    full width, dark — place banner here
    ═══════════════════════════════════════════════════ */

    /* ── Top bar ──────────────────────────────────── */
    .topbar{
      position:fixed;top:0;left:0;right:0;height:58px;
      background:#0d1f3c;
      border-bottom:1px solid rgba(0,216,255,0.35);
      display:flex;align-items:center;
      z-index:30;
    }
    .topbar::after{
      content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(0,216,255,0.9),rgba(120,60,255,0.6),transparent);
    }

    .tb-left{flex:1;display:flex;align-items:center;gap:14px;padding:0 22px}
    .tb-center{position:absolute;left:748px;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:18px}
    .tb-right{display:none}

    .live-badge{display:flex;align-items:center;gap:5px;background:rgba(239,68,68,0.18);border:1px solid rgba(239,68,68,0.5);border-radius:100px;padding:5px 12px;flex-shrink:0}
    .live-dot{width:7px;height:7px;border-radius:50%;background:#f87171;animation:blink 1.3s ease-in-out infinite;box-shadow:0 0 6px rgba(248,113,113,0.8)}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    .live-txt{font-size:11px;font-weight:600;letter-spacing:.13em;color:#f87171;text-transform:uppercase}

    .tb-logo{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(0,216,255,0.7))}
    .pipe{width:1px;height:28px;background:rgba(0,216,255,0.3);flex-shrink:0}

    .tb-soc{display:flex;align-items:center;gap:8px}
    .tb-soc svg{width:16px;height:16px;flex-shrink:0;opacity:.9}
    .tb-soc span{font-size:14px;font-weight:500;color:rgba(200,235,255,0.85);letter-spacing:.02em;white-space:nowrap}

    .tb-name{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#fff;white-space:nowrap}
    .tb-deco{font-size:22px;font-weight:300;color:rgba(0,216,255,0.55);line-height:1}

    /* ── Thin left edge ───────────────────────────── */
    .edge-left{
      position:fixed;top:58px;left:0;width:6px;height:862px;
      background:#0d1f3c;z-index:10;
    }

    /* ── Right sidebar ────────────────────────────── */
    .sidebar{
      position:fixed;
      top:58px;right:0;
      width:424px;height:862px;
      background:#0d1f3c;
      border-left:1px solid rgba(0,216,255,0.4);
      border-bottom:1px solid rgba(0,216,255,0.4);
      box-shadow:-4px 0 40px rgba(0,0,20,0.6),inset 1px 0 0 rgba(0,216,255,0.08);
      display:flex;flex-direction:column;
      z-index:20;
    }

    /* Panel shared */
    .panel{
      margin:12px 12px 0;
      border:1px solid rgba(0,216,255,0.3);
      border-radius:8px;
      background:rgba(12,30,60,0.8);
      display:flex;flex-direction:column;
      overflow:hidden;
      box-shadow:0 0 0 1px rgba(0,216,255,0.06),inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .panel-header{
      display:flex;align-items:center;justify-content:center;gap:8px;
      padding:9px 14px;
      border-bottom:1px solid rgba(0,216,255,0.18);
      background:rgba(0,216,255,0.08);
      flex-shrink:0;
    }
    .panel-label{
      font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
      color:rgba(160,230,255,0.7);
    }
    .panel-dot{width:5px;height:5px;border-radius:50%;background:#00d8ff;box-shadow:0 0 5px rgba(0,216,255,0.8);flex-shrink:0}

    /* ── Chat panel ───────────────────────────────── */
    .chat-panel{
      flex:1;
      margin-bottom:12px;
    }
    .chat-body{flex:1}

    /* ── Bottom strip ─────────────────────────────── */
    .bottom-strip{
      position:fixed;
      bottom:0;left:0;right:0;
      height:160px;
      background:#0d1f3c;
      border-top:1px solid rgba(0,216,255,0.35);
      z-index:20;
    }
    .bottom-strip::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(0,216,255,0.9),rgba(120,60,255,0.6),transparent);
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="tb-left">
    <div class="live-badge">
      <div class="live-dot"></div>
      <span class="live-txt">Live</span>
    </div>
  </div>

  <div class="tb-center">
    <div class="tb-soc">
      <svg viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.464-.674.86-1.339 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128c.126-.094.247-.192.372-.292a.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg>
      <span>discord.gg/Gnyv25SHg7</span>
    </div>
    <span class="tb-deco">|</span>
    <img class="tb-logo" src="/assets/niksi.png" alt="NIKSI777"/>
    <span class="tb-deco">|</span>
    <div class="tb-soc">
      <svg viewBox="0 0 24 24" fill="rgba(200,220,255,0.8)"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63z"/></svg>
      <span>@niksigamba</span>
    </div>
  </div>

  <div class="tb-right"></div>
</div>

<!-- Thin left edge -->
<div class="edge-left"></div>

<!-- RIGHT SIDEBAR -->
<div class="sidebar">

  <div class="panel chat-panel">
    <div class="panel-header">
      <div class="panel-dot"></div>
      <div class="panel-label">Live Chat</div>
      <div class="panel-dot"></div>
    </div>
    <div class="chat-body"></div>
  </div>

</div>

<!-- BOTTOM STRIP — place stream-banner.html browser source here in OBS -->
<div class="bottom-strip"></div>

</body>
</html>
