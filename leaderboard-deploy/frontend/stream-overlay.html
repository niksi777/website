<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:1920px;height:1080px;overflow:hidden;
      background:transparent;
      font-family:'Inter',sans-serif;
    }

    /* ─── LAYOUT ──────────────────────────────────────────────────
       Game area:      x=18   y=18   w=1430  h=875   (ends y=893)
       Gap:            20px between game and sidebar
       Sidebar:        x=1468 y=18   w=434   h=875
         - Branding:   80px top
         - Chat:       flex fill
         - Webcam:     260px bottom
       Bottom strip:   x=18   y=911  w=1884  h=151   (18+875+18=911, 911+151+18=1080)
    ──────────────────────────────────────────────────────────────── */

    /* Dark edge fills */
    .e{position:fixed;background:#060f20}
    .e-top   {top:0;left:0;right:0;height:18px}
    .e-bottom{bottom:0;left:0;right:0;height:18px}
    .e-left  {top:0;left:0;width:18px;height:1080px}
    .e-right {top:0;right:0;width:18px;height:1080px}
    .e-gap   {top:0;left:1448px;width:20px;height:1080px}
    /* Horizontal divider between top panels and bottom strip */
    .e-div   {top:893px;left:0;right:0;height:18px}

    /* Game frame — transparent inside, border + corners only */
    .game-frame{
      position:fixed;left:18px;top:18px;
      width:1430px;height:875px;
      border:1px solid rgba(255,255,255,.1);
      background:transparent;
      pointer-events:none;z-index:10;
    }
    .c{position:absolute;width:22px;height:22px}
    .c-tl{top:-1px;left:-1px;border-top:2px solid rgba(232,164,39,.5);border-left:2px solid rgba(232,164,39,.5);border-radius:12px 0 0 0}
    .c-tr{top:-1px;right:-1px;border-top:2px solid rgba(232,164,39,.5);border-right:2px solid rgba(232,164,39,.5);border-radius:0 12px 0 0}
    .c-bl{bottom:-1px;left:-1px;border-bottom:2px solid rgba(232,164,39,.5);border-left:2px solid rgba(232,164,39,.5);border-radius:0 0 0 12px}
    .c-br{bottom:-1px;right:-1px;border-bottom:2px solid rgba(232,164,39,.5);border-right:2px solid rgba(232,164,39,.5);border-radius:0 0 12px 0}

    /* ─── RIGHT SIDEBAR ────────────────────────────────────────── */
    .sidebar{
      position:fixed;left:1468px;top:18px;
      width:434px;height:875px;
      display:flex;flex-direction:column;
      border:1px solid rgba(255,255,255,.08);
      border-top:2px solid rgba(232,164,39,.35);
      overflow:hidden;
      background-color:#0c1830;
    }

    /* Branding */
    .brand{
      height:80px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;gap:10px;
      border-bottom:1px solid rgba(255,255,255,.06);
      padding:0 20px;
      text-align:center;
    }
    .brand-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(232,164,39,.45);box-shadow:0 0 12px rgba(232,164,39,.3)}
    .brand-name{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fff}
    .live-badge{display:flex;align-items:center;gap:4px;background:rgba(217,79,79,.12);border:1px solid rgba(217,79,79,.2);border-radius:100px;padding:3px 8px;flex-shrink:0}
    .live-dot{width:5px;height:5px;border-radius:50%;background:#d94f4f;animation:pu 1.2s ease-in-out infinite}
    .live-txt{font-size:9px;font-weight:600;letter-spacing:.12em;color:#d94f4f;text-transform:uppercase}
    @keyframes pu{0%,100%{opacity:1}50%{opacity:.2}}

    /* Chat area */
    .chat-wrap{flex:1;display:flex;flex-direction:column;min-height:0;border-bottom:1px solid rgba(255,255,255,.06)}
    .sec-label{padding:8px 16px;font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(221,227,239,.28);text-align:center;border-bottom:1px solid rgba(255,255,255,.04);flex-shrink:0}
    .chat-inner{flex:1}

    /* Webcam area */
    .webcam-wrap{
      height:260px;flex-shrink:0;
      border-top:1px solid rgba(255,255,255,.06);
      display:flex;flex-direction:column;
      position:relative;overflow:hidden;
    }
    /* Soft vignette edges on webcam */
    .webcam-wrap::after{
      content:'';position:absolute;inset:0;pointer-events:none;
      box-shadow:inset 0 0 28px 14px #060f20;
      z-index:2;
    }
    .webcam-inner{
      flex:1;
      display:flex;align-items:center;justify-content:center;
    }
    .webcam-hint{font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(221,227,239,.15);text-align:center;position:relative;z-index:3}

    /* ─── BOTTOM STRIP ──────────────────────────────────────────── */
    .bottom-strip{
      position:fixed;left:18px;top:911px;
      width:1884px;height:151px;
      background-color:#0c1830;
    }

    /* Giveaway idle */
    .gw-idle{
      font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
      color:rgba(221,227,239,.18);text-align:center;
    }

    /* Giveaway active */
    .gw-active{
      display:none;flex-direction:column;align-items:center;justify-content:center;
      gap:8px;width:100%;padding:0 60px;text-align:center;
    }
    .gw-row{display:flex;align-items:center;justify-content:center;gap:10px}
    .gw-label{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(221,227,239,.4)}
    .gw-dot{width:6px;height:6px;border-radius:50%;background:#e8a427;animation:pu 1s ease-in-out infinite;flex-shrink:0}
    .gw-keyword{
      font-family:'Barlow Condensed',sans-serif;
      font-size:52px;font-weight:800;letter-spacing:.06em;
      text-transform:uppercase;color:#e8a427;line-height:1;
    }
    .gw-entries{font-size:12px;color:rgba(221,227,239,.4);letter-spacing:.06em;text-align:center}
    .gw-entries span{color:rgba(221,227,239,.65);font-weight:600}
    .bar-track{height:4px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;width:600px;max-width:80%}
    .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#b06000,#e8a427,#ffe580);transition:width .9s linear;width:100%}
    .bar-fill.urgent{background:linear-gradient(90deg,#7a0000,#d94f4f,#ff8080)}
  
    #constellation{position:fixed;inset:0;z-index:0;pointer-events:none}
  </style>
</head>
<body>
<canvas id="constellation"></canvas>


  <!-- Edge fills -->
  <div class="e e-top"></div>
  <div class="e e-bottom"></div>
  <div class="e e-left"></div>
  <div class="e e-right"></div>
  <div class="e e-gap"></div>
  <div class="e e-div"></div>

  <!-- Game frame (transparent cutout for game capture) -->
  <div class="game-frame"></div>

  <!-- Right sidebar -->
  <div class="sidebar">
    <div class="brand">
      <img class="brand-logo" src="/assets/niksi.png" alt=""/>
      <div class="brand-name">Niksi777</div>
      <div class="live-badge"><div class="live-dot"></div><div class="live-txt">Live</div></div>
    </div>
    <div class="chat-wrap">
      <div class="sec-label">Live Chat</div>
      <div class="chat-inner"></div>
    </div>
    <div class="webcam-wrap">
      <div class="sec-label">Webcam</div>
      <div class="webcam-inner">
        <div class="webcam-hint">Position webcam<br/>source here</div>
      </div>
    </div>
  </div>

  <!-- Bottom strip - background only -->
  <div class="bottom-strip"></div>

<script>
  let DURATION=60,secondsLeft=60,timerInterval=null;
  function startTimer(dur){
    DURATION=dur;secondsLeft=dur;clearInterval(timerInterval);
    timerInterval=setInterval(()=>{
      secondsLeft=Math.max(0,secondsLeft-1);
      const pct=(secondsLeft/DURATION)*100;
      const bar=document.getElementById('gw-bar');
      bar.style.width=pct+'%';
      bar.className='bar-fill'+(secondsLeft<=10?' urgent':'');
      if(secondsLeft===0)clearInterval(timerInterval);
    },1000);
  }
  function stopTimer(){clearInterval(timerInterval);const b=document.getElementById('gw-bar');b.style.width='100%';b.className='bar-fill';}
  async function pollTimer(){
    try{const d=await fetch('/giveaway/timer').then(r=>r.json());
      if(d.signal==='start')startTimer(d.duration||60);
      else if(d.signal==='stop')stopTimer();
    }catch(e){}
  }
  async function pollState(){
    try{const d=await fetch('/giveaway/state').then(r=>r.json());
      if(d.giveaway&&!d.giveaway.winner){
        document.getElementById('gw-idle').style.display='none';
        const a=document.getElementById('gw-active');a.style.display='flex';
        document.getElementById('gw-keyword').textContent=d.giveaway.keyword;
        document.getElementById('gw-entries').textContent=d.entries?d.entries.length:0;
      }else{
        document.getElementById('gw-idle').style.display='block';
        document.getElementById('gw-active').style.display='none';
        stopTimer();
      }
    }catch(e){}
  }
  pollState();pollTimer();
  setInterval(pollState,2000);setInterval(pollTimer,1000);
</script>

<script>
(function(){
  var canvas = document.getElementById('constellation');
  var ctx = canvas.getContext('2d');
  var N = 110, DIST = 140;
  var W, H, pts = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  function mkPt(){ return { x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25, r:Math.random()*1.2+.4, o:Math.random()*.45+.1 }; }
  function init(){ resize(); pts=[]; for(var i=0;i<N;i++) pts.push(mkPt()); }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<N;i++){
      var a=pts[i];
      for(var j=i+1;j<N;j++){
        var b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<DIST){ ctx.beginPath(); ctx.strokeStyle='rgba(130,170,255,'+((1-d/DIST)*.12)+')'; ctx.lineWidth=.6; ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      }
    }
    for(var i=0;i<N;i++){
      var p=pts[i]; p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='rgba(160,190,255,'+p.o+')'; ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  init(); window.addEventListener('resize', resize); tick();
})();
</script>
</body>
</html>
