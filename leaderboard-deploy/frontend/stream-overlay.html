<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:1920px;height:1080px;overflow:hidden;
      background:transparent;
      font-family:'Inter',sans-serif;
    }

    /* ─── RIGHT SIDEBAR ─────────────────────────────────── */
    .sidebar{
      position:fixed;right:0;top:0;
      width:320px;height:1080px;
      background-color:#07080c;
      background-image:radial-gradient(circle,rgba(255,255,255,.055) 1px,transparent 1px);
      background-size:28px 28px;
      border-left:1px solid rgba(255,255,255,.08);
      display:flex;flex-direction:column;
    }

    /* ─── BRANDING ──────────────────────────────────────── */
    .brand{
      padding:22px 20px 18px;
      border-bottom:1px solid rgba(255,255,255,.06);
      display:flex;align-items:center;justify-content:center;gap:10px;
      text-align:center;
    }
    .brand-logo{
      width:36px;height:36px;border-radius:50%;object-fit:cover;
      border:2px solid rgba(232,164,39,.5);
      box-shadow:0 0 12px rgba(232,164,39,.3);
    }
    .brand-name{
      font-family:'Barlow Condensed',sans-serif;
      font-size:22px;font-weight:800;letter-spacing:.16em;
      text-transform:uppercase;color:#fff;
    }
    .brand-dot{
      width:6px;height:6px;border-radius:50%;
      background:#22c55e;
      box-shadow:0 0 6px rgba(34,197,94,.8);
      animation:pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

    /* ─── CHAT AREA ─────────────────────────────────────── */
    .chat-section{
      flex:1;display:flex;flex-direction:column;
      border-bottom:1px solid rgba(255,255,255,.06);
      min-height:0;
    }
    .section-label{
      padding:10px 16px;
      font-size:9px;font-weight:600;letter-spacing:.18em;
      text-transform:uppercase;color:rgba(221,227,239,.35);
      border-bottom:1px solid rgba(255,255,255,.04);
      text-align:center;
    }
    .chat-placeholder{
      flex:1;
      /* OBS: position a Chat widget browser source over this area */
    }

    /* ─── GIVEAWAY SECTION ──────────────────────────────── */
    .giveaway-section{
      padding:14px 16px 16px;
      border-top:1px solid rgba(255,255,255,.06);
    }
    /* Hidden when no giveaway */
    .giveaway-idle{
      text-align:center;
      padding:12px 0;
    }
    .giveaway-idle-txt{
      font-size:10px;font-weight:500;letter-spacing:.12em;
      text-transform:uppercase;color:rgba(221,227,239,.2);
    }
    /* Active giveaway */
    .giveaway-active{display:none;flex-direction:column;gap:8px;text-align:center;}
    .giveaway-header{
      display:flex;align-items:center;justify-content:center;gap:6px;
    }
    .giveaway-label{
      font-size:9px;font-weight:600;letter-spacing:.18em;
      text-transform:uppercase;color:rgba(221,227,239,.4);
    }
    .giveaway-dot{
      width:5px;height:5px;border-radius:50%;
      background:#e8a427;animation:pulse 1s ease-in-out infinite;
    }
    .giveaway-keyword{
      font-family:'Barlow Condensed',sans-serif;
      font-size:32px;font-weight:800;letter-spacing:.06em;
      text-transform:uppercase;color:#e8a427;line-height:1;
    }
    .giveaway-entries{
      font-size:11px;color:rgba(221,227,239,.4);
      letter-spacing:.06em;
    }
    .giveaway-entries span{color:rgba(221,227,239,.7);font-weight:600;}
    .bar-track{
      height:3px;background:rgba(255,255,255,.06);
      border-radius:99px;overflow:hidden;margin-top:4px;
    }
    .bar-fill{
      height:100%;border-radius:99px;
      background:linear-gradient(90deg,#b06000,#e8a427,#ffe580);
      transition:width .9s linear;width:100%;
    }
    .bar-fill.urgent{background:linear-gradient(90deg,#7a0000,#d94f4f,#ff8080);}

    /* ─── GAME FRAME ────────────────────────────────────── */
    .game-frame{
      position:fixed;left:18px;top:18px;
      width:1564px;height:1044px;
      border:1px solid rgba(255,255,255,.07);
      border-radius:16px;
      /* transparent - game capture goes here */
      pointer-events:none;
    }
    /* Corner accents */
    .game-frame::before,.game-frame::after{
      content:'';position:absolute;
      width:28px;height:28px;
    }
    .game-frame::before{
      top:-1px;left:-1px;
      border-top:2px solid rgba(232,164,39,.4);
      border-left:2px solid rgba(232,164,39,.4);
      border-radius:16px 0 0 0;
    }
    .game-frame::after{
      top:-1px;right:-1px;
      border-top:2px solid rgba(232,164,39,.4);
      border-right:2px solid rgba(232,164,39,.4);
      border-radius:0 16px 0 0;
    }

    /* ─── BOTTOM CORNERS ON GAME FRAME ─────────────────── */
    .corner-bl,.corner-br{
      position:fixed;
      width:28px;height:28px;
    }
    .corner-bl{
      left:18px;bottom:18px;
      border-bottom:2px solid rgba(232,164,39,.4);
      border-left:2px solid rgba(232,164,39,.4);
      border-radius:0 0 0 16px;
    }
    .corner-br{
      left:1564px;bottom:18px;
      border-bottom:2px solid rgba(232,164,39,.4);
      border-right:2px solid rgba(232,164,39,.4);
      border-radius:0 0 16px 0;
    }
  </style>
</head>
<body>

  <!-- Game frame border (transparent inside) -->
  <div class="game-frame"></div>
  <div class="corner-bl"></div>
  <div class="corner-br"></div>

  <!-- Right sidebar -->
  <div class="sidebar">

    <!-- Branding -->
    <div class="brand">
      <img class="brand-logo" src="/assets/niksi.png" alt="niksi"/>
      <div class="brand-name">Niksi777</div>
      <div class="brand-dot"></div>
    </div>

    <!-- Chat area (OBS adds chat widget browser source positioned here) -->
    <div class="chat-section">
      <div class="section-label">Live Chat</div>
      <div class="chat-placeholder"></div>
    </div>

    <!-- Giveaway -->
    <div class="giveaway-section">
      <div class="giveaway-idle" id="giveaway-idle">
        <div class="giveaway-idle-txt">No active giveaway</div>
      </div>
      <div class="giveaway-active" id="giveaway-active">
        <div class="giveaway-header">
          <div class="giveaway-dot"></div>
          <div class="giveaway-label">Giveaway - type to enter</div>
          <div class="giveaway-dot"></div>
        </div>
        <div class="giveaway-keyword" id="gw-keyword">-</div>
        <div class="giveaway-entries">Entries: <span id="gw-entries">0</span></div>
        <div class="bar-track"><div class="bar-fill" id="gw-bar"></div></div>
      </div>
    </div>

  </div>

<script>
  let DURATION=60, secondsLeft=60, timerInterval=null;

  function startTimer(dur){
    DURATION=dur; secondsLeft=dur; clearInterval(timerInterval);
    timerInterval=setInterval(()=>{
      secondsLeft=Math.max(0,secondsLeft-1);
      const pct=(secondsLeft/DURATION)*100;
      const bar=document.getElementById('gw-bar');
      bar.style.width=pct+'%';
      bar.className='bar-fill'+(secondsLeft<=10?' urgent':'');
      if(secondsLeft===0) clearInterval(timerInterval);
    },1000);
  }

  function stopTimer(){
    clearInterval(timerInterval);
    const bar=document.getElementById('gw-bar');
    bar.style.width='100%';
    bar.className='bar-fill';
  }

  async function pollTimer(){
    try{
      const d=await fetch('/giveaway/timer').then(r=>r.json());
      if(d.signal==='start') startTimer(d.duration||60);
      else if(d.signal==='stop') stopTimer();
    }catch(e){}
  }

  async function pollState(){
    try{
      const d=await fetch('/giveaway/state').then(r=>r.json());
      const idle=document.getElementById('giveaway-idle');
      const active=document.getElementById('giveaway-active');
      if(d.giveaway&&!d.giveaway.winner){
        idle.style.display='none';
        active.style.display='flex';
        document.getElementById('gw-keyword').textContent=d.giveaway.keyword;
        document.getElementById('gw-entries').textContent=d.entries?d.entries.length:0;
      }else{
        idle.style.display='block';
        active.style.display='none';
        stopTimer();
      }
    }catch(e){}
  }

  pollState(); pollTimer();
  setInterval(pollState,2000);
  setInterval(pollTimer,1000);
</script>
</body>
</html>
