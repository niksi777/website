<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:1920px;height:1080px;overflow:hidden;
      background:transparent;
      font-family:'Inter',sans-serif;
    }

    /* ══════════════════════════════════════════
       TOP BAR  —  full width, 58px tall
    ══════════════════════════════════════════ */
    .topbar{
      position:fixed;top:0;left:0;right:0;
      height:58px;
      background:#07101f;
      border-bottom:1px solid rgba(56,120,220,0.3);
      display:flex;align-items:center;
      z-index:30;
    }
    .topbar::after{
      content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(70,130,255,0.5),rgba(100,70,255,0.35),transparent);
    }

    /* Left third */
    .tb-left{
      flex:1;display:flex;align-items:center;gap:12px;
      padding:0 20px;
    }
    /* Center */
    .tb-center{
      display:flex;align-items:center;gap:16px;
      flex-shrink:0;
    }
    /* Right third */
    .tb-right{
      flex:1;display:flex;align-items:center;justify-content:flex-end;gap:16px;
      padding:0 20px;
    }

    /* LIVE badge */
    .live-badge{
      display:flex;align-items:center;gap:5px;
      background:rgba(220,50,50,0.13);
      border:1px solid rgba(220,50,50,0.28);
      border-radius:100px;padding:4px 10px;
      flex-shrink:0;
    }
    .live-dot{width:6px;height:6px;border-radius:50%;background:#e05555;animation:blink 1.3s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    .live-txt{font-size:9px;font-weight:600;letter-spacing:.13em;color:#e05555;text-transform:uppercase}

    /* Logo */
    .tb-logo{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 7px rgba(70,130,255,0.4))}

    /* Vertical pipe */
    .pipe{
      width:1px;height:28px;
      background:rgba(80,130,255,0.25);
      flex-shrink:0;
    }

    /* Social row */
    .tb-soc{display:flex;align-items:center;gap:7px}
    .tb-soc svg{width:13px;height:13px;flex-shrink:0;opacity:.8}
    .tb-soc span{font-size:11px;font-weight:500;color:rgba(190,215,255,0.6);letter-spacing:.02em;white-space:nowrap}

    /* Center name */
    .tb-name{
      font-family:'Barlow Condensed',sans-serif;
      font-size:26px;font-weight:800;
      letter-spacing:.18em;text-transform:uppercase;
      color:#fff;white-space:nowrap;
    }
    /* Decorative pipes beside name */
    .tb-deco{
      font-size:22px;font-weight:300;
      color:rgba(80,130,255,0.4);
      line-height:1;
    }

    /* ══════════════════════════════════════════
       RIGHT SIDEBAR  —  420px, starts below top bar
    ══════════════════════════════════════════ */
    .sidebar{
      position:fixed;
      top:58px;right:0;
      width:420px;bottom:0;
      background:#07101f;
      border-left:1px solid rgba(56,120,220,0.2);
      display:flex;flex-direction:column;
      z-index:20;
    }

    /* ── Giveaway / timer section ── */
    .gw-section{
      flex-shrink:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:22px 16px 20px;
      border-bottom:1px solid rgba(56,120,220,0.18);
      gap:4px;
    }
    .gw-label{
      font-size:9.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
      color:rgba(150,190,255,0.4);
    }
    .gw-timer{
      font-family:'Barlow Condensed',sans-serif;
      font-size:74px;font-weight:800;letter-spacing:.03em;
      color:#fff;line-height:1;
    }

    /* ── Chat section ── */
    .chat-section{
      flex:1;display:flex;flex-direction:column;min-height:0;
    }
    .chat-label{
      flex-shrink:0;
      display:flex;align-items:center;justify-content:center;gap:8px;
      padding:9px 16px;
      border-bottom:1px solid rgba(56,120,220,0.12);
      font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
      color:rgba(150,190,255,0.38);
    }
    /* Chat dot indicator */
    .chat-dot{width:5px;height:5px;border-radius:50%;background:#3b82f6;opacity:.6}
    .chat-inner{flex:1}

    /* ══════════════════════════════════════════
       GAME AREA — transparent, thin border
    ══════════════════════════════════════════ */
    .game-border{
      position:fixed;
      top:58px;left:0;
      right:420px;bottom:0;
      border-right:1px solid rgba(56,120,220,0.14);
      pointer-events:none;
      z-index:10;
    }
  </style>
</head>
<body>

<!-- ══ TOP BAR ═══════════════════════════════════════════════ -->
<div class="topbar">

  <div class="tb-left">
    <div class="live-badge">
      <div class="live-dot"></div>
      <span class="live-txt">Live</span>
    </div>
    <img class="tb-logo" src="/assets/niksi.png" alt="NIKSI777"/>
    <div class="pipe"></div>
    <div class="tb-soc">
      <svg viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.464-.674.86-1.339 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128c.126-.094.247-.192.372-.292a.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg>
      <span>discord.gg/Gnyv25SHg7</span>
    </div>
  </div>

  <div class="tb-center">
    <span class="tb-deco">|</span>
    <span class="tb-name">NIKSI777</span>
    <span class="tb-deco">|</span>
  </div>

  <div class="tb-right">
    <div class="tb-soc">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 3h4v5.5L11 3h5l-5.5 6.5L16 15h-5l-4-4.5V15H3V3z" fill="#22c55e"/></svg>
      <span>kick.com/niksi777</span>
    </div>
    <div class="pipe"></div>
    <div class="tb-soc">
      <svg viewBox="0 0 24 24" fill="rgba(200,220,255,0.75)"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63z"/></svg>
      <span>@code_niksi777</span>
    </div>
  </div>

</div>

<!-- ══ RIGHT SIDEBAR ══════════════════════════════════════════ -->
<div class="sidebar">

  <div class="gw-section">
    <div class="gw-label" id="gw-label">Giveaway In</div>
    <div class="gw-timer" id="gw-timer">--:--</div>
  </div>

  <div class="chat-section">
    <div class="chat-label">
      <div class="chat-dot"></div>
      Niksi Chat
      <div class="chat-dot"></div>
    </div>
    <div class="chat-inner"></div>
  </div>

</div>

<!-- ══ GAME AREA BORDER ═══════════════════════════════════════ -->
<div class="game-border"></div>

<script>
  let DURATION = 60, secondsLeft = 60, timerInterval = null;

  function fmt(s) {
    const m = Math.floor(s / 60), sec = s % 60;
    return m + ':' + String(sec).padStart(2, '0');
  }

  function startTimer(dur) {
    DURATION = dur; secondsLeft = dur;
    clearInterval(timerInterval);
    document.getElementById('gw-label').textContent = 'Giveaway In';
    timerInterval = setInterval(() => {
      secondsLeft = Math.max(0, secondsLeft - 1);
      document.getElementById('gw-timer').textContent = fmt(secondsLeft);
      if (secondsLeft === 0) clearInterval(timerInterval);
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    document.getElementById('gw-timer').textContent = '--:--';
  }

  async function pollTimer() {
    try {
      const d = await fetch('/giveaway/timer').then(r => r.json());
      if (d.signal === 'start') startTimer(d.duration || 60);
      else if (d.signal === 'stop') stopTimer();
    } catch(e) {}
  }

  async function pollState() {
    try {
      const d = await fetch('/giveaway/state').then(r => r.json());
      if (d.giveaway && !d.giveaway.winner) {
        document.getElementById('gw-label').textContent = 'Type to Enter';
        document.getElementById('gw-timer').textContent = d.giveaway.keyword || '!';
      }
    } catch(e) {}
  }

  pollState(); pollTimer();
  setInterval(pollState, 2000);
  setInterval(pollTimer, 1000);
</script>

</body>
</html>
