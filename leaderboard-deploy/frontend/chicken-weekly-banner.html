<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 400px;
      height: 120px;
      overflow: hidden;
      background: transparent;
    }

    .banner {
      width: 400px;
      height: 120px;
      border-radius: 18px;
      border: 3px solid rgba(252, 154, 14, 0.9);
      box-shadow: 0 0 12px rgba(252,154,14,0.4), 0 0 32px rgba(252,154,14,0.15), inset 0 0 12px rgba(252,154,14,0.06);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: borderPulse 2.5s ease-in-out infinite;
    }
    @keyframes borderPulse {
      0%,100% { box-shadow: 0 0 12px rgba(252,154,14,0.5), 0 0 32px rgba(252,154,14,0.2), inset 0 0 12px rgba(252,154,14,0.06); border-color: rgba(252,154,14,0.9); }
      50%      { box-shadow: 0 0 24px rgba(252,154,14,0.9), 0 0 56px rgba(252,154,14,0.4), inset 0 0 18px rgba(252,154,14,0.1); border-color: rgba(252,154,14,1); }
    }

    /* Animated background */
    .bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #0e0a03, #0c1830, #0e0a03);
      background-size: 300% 300%;
      animation: bgShift 6s ease-in-out infinite;
    }
    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Sweeping shimmer */
    .shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 35%, rgba(252,154,14,0.07) 50%, transparent 65%);
      background-size: 200% 100%;
      animation: sweep 3s ease-in-out infinite;
      pointer-events: none;
      z-index: 3;
    }
    @keyframes sweep {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Top edge glow line */
    .edge {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(252,154,14,0.6), rgba(100,160,255,0.4), transparent);
      animation: edgePulse 3s ease-in-out infinite;
      z-index: 4;
    }
    @keyframes edgePulse {
      0%,100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }

    /* Radial glow behind content */
    .radial {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 120%, rgba(252,154,14,0.18) 0%, transparent 65%);
      animation: radialPulse 2.5s ease-in-out infinite;
      z-index: 1;
    }
    @keyframes radialPulse {
      0%,100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }

    /* Canvas for particles */
    canvas {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* Content */
    .content {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-align: center;
    }

    .amount {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
      color: #fc9a0e;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 0 24px rgba(252,154,14,0.7), 0 0 60px rgba(252,154,14,0.3);
      animation: amountPulse 2.5s ease-in-out infinite;
    }
    @keyframes amountPulse {
      0%,100% { text-shadow: 0 0 24px rgba(252,154,14,0.7), 0 0 60px rgba(252,154,14,0.3); }
      50%      { text-shadow: 0 0 36px rgba(252,154,14,1),   0 0 80px rgba(252,154,14,0.5); }
    }

    .coin {
      width: 42px;
      height: 42px;
      object-fit: contain;
      animation: coinSpin 4s ease-in-out infinite;
      filter: drop-shadow(0 0 10px rgba(252,154,14,0.8));
    }
    @keyframes coinSpin {
      0%,100% { transform: rotateY(0deg) scale(1); }
      40%      { transform: rotateY(180deg) scale(1.1); }
      80%      { transform: rotateY(360deg) scale(1); }
    }

    .title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffffff;
      white-space: nowrap;
      background: linear-gradient(90deg, #fff 0%, #ffd080 40%, #fff 60%, #ffd080 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleShine 3s linear infinite;
    }
    @keyframes titleShine {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
  </style>
</head>
<body>
<div class="banner">
  <div class="bg"></div>
  <div class="radial"></div>
  <canvas id="px"></canvas>
  <div class="shimmer"></div>
  <div class="edge"></div>

  <div class="content">
    <div class="amount">500 <img class="coin" src="/assets/coin.png" alt=""/></div>
    <div class="title">Weekly Leaderboard!</div>
  </div>
</div>

<script>
  const c = document.getElementById('px');
  c.width = 400; c.height = 120;
  const ctx = c.getContext('2d');

  const particles = [];
  function spawn() {
    particles.push({
      x: Math.random() * 400,
      y: 120 + 6,
      vx: (Math.random() - 0.5) * 0.6,
      vy: -(0.5 + Math.random() * 1.0),
      size: 1.2 + Math.random() * 2,
      alpha: 0.7 + Math.random() * 0.3,
      col: Math.random() > 0.4 ? '#fc9a0e' : '#ffd080',
    });
  }

  let frame = 0;
  function tick() {
    ctx.clearRect(0, 0, 400, 120);
    if (frame % 4 === 0) spawn();
    frame++;

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.alpha -= 0.008;
      if (p.alpha <= 0) { particles.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.col;
      ctx.shadowBlur = 6; ctx.shadowColor = p.col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
