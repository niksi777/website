<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* ─── Nav ─── */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center;
  padding: 0 24px; height: 56px; gap: 8px;
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; margin-right: 16px; flex-shrink: 0;
}
.nav-logo img { height: 28px; width: auto; }
.nav-logo-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 1.2rem; letter-spacing: 0.06em;
  color: #fff; text-transform: uppercase;
}
.nav-links { display: flex; align-items: center; gap: 2px; flex: 1; }
.nav-links a {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 0.95rem; letter-spacing: 0.08em;
  text-transform: uppercase; text-decoration: none;
  color: rgba(255,255,255,0.45); padding: 6px 12px; border-radius: 6px;
  transition: color 0.15s, background 0.15s;
}
.nav-links a:hover { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.06); }
.nav-links a.active { color: #fff; }
.nav-socials { display: flex; align-items: center; gap: 8px; }
.nav-socials a { display: flex; align-items: center; opacity: 0.5; transition: opacity 0.15s; }
.nav-socials a:hover { opacity: 1; }
.nav-socials svg { width: 20px; height: 20px; }

:root {
  --bg: #07091c;
  --surface: #0d1430;
  --surface2: #131c3e;
  --border: #1c2a50;
  --accent: #3d8eff;
  --accent-dim: rgba(61,142,255,0.12);
  --text: #d8e8ff;
  --text-dim: #5a7090;
  --gold: #f5a623;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', system-ui, sans-serif;
  min-height: 100vh;
  padding: 0 0 48px;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 55% 40% at 18% 55%, rgba(30,80,200,0.13) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 82% 70%, rgba(20,60,180,0.11) 0%, transparent 55%),
    repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(61,142,255,0.022) 60px, rgba(61,142,255,0.022) 61px),
    repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(61,142,255,0.022) 60px, rgba(61,142,255,0.022) 61px);
  pointer-events: none;
  z-index: 0;
}

.page { max-width: 780px; margin: 0 auto; position: relative; z-index: 1; padding: 32px 16px 0; }

.header {
  text-align: center;
  padding: 40px 24px 32px;
  background: none;
  border-radius: 16px 16px 0 0;
}
.title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: clamp(2.4rem, 8vw, 4rem);
  letter-spacing: 0.02em;
  line-height: 1;
  color: #fff;
  text-shadow: 0 0 40px rgba(80,160,255,0.5), 0 2px 0 rgba(0,0,20,0.6);
}
.subtitle {
  margin-top: 10px;
  color: var(--text-dim);
  font-size: 0.88rem;
}
.subtitle .code { color: var(--accent); font-weight: 600; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 0 0 14px 14px;
  overflow: hidden;
}

/* ─── Tabs ─── */
.tabs {
  display: flex;
  justify-content: center;
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 16px 8px;
  cursor: pointer;
  transition: border-color 0.15s, opacity 0.15s;
  opacity: 0.4;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.tab:hover { opacity: 0.7; }
.tab.active { border-bottom-color: var(--accent); opacity: 1; }
.tab img { height: 28px; width: auto; object-fit: contain; display: block; max-width: 90px; }

/* ─── Race meta row ─── */
.race-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.meta-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 0.9rem; letter-spacing: 0.1em;
  text-transform: uppercase; text-decoration: none;
  padding: 8px 16px; border-radius: 8px; white-space: nowrap;
  transition: opacity 0.15s, transform 0.1s;
  display: flex; align-items: center; gap: 6px;
}
.meta-btn:hover { opacity: 0.85; transform: translateY(-1px); }
.meta-btn-signup {
  background: linear-gradient(90deg, #1a4eb5, #2d7aff);
  color: #fff;
  box-shadow: 0 2px 12px rgba(45,122,255,0.3);
}
.meta-btn-rewards {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
}
.meta-btn-rewards:hover { color: var(--text); border-color: var(--accent); }
.timer {
  display: flex;
  gap: 6px;
  align-items: flex-start;
}
.timer-seg {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 64px;
}
.timer-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 1.6rem;
  line-height: 1;
  color: var(--text);
  width: 100%;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.timer-unit {
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 3px;
}
.timer-sep {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--text-dim);
  padding-top: 2px;
  line-height: 1;
}

/* ─── Table ─── */
.tbl-head {
  display: grid;
  grid-template-columns: 70px 1fr 130px 100px;
  padding: 8px 20px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
}
.tbl-head span:nth-child(3),
.tbl-head span:nth-child(4) { text-align: right; }

.rows { max-height: 440px; overflow-y: auto; }
.rows::-webkit-scrollbar { width: 4px; }
.rows::-webkit-scrollbar-track { background: transparent; }
.rows::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.row {
  display: grid;
  grid-template-columns: 70px 1fr 130px 100px;
  align-items: center;
  padding: 11px 20px;
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
  font-variant-numeric: tabular-nums;
}
.row:last-child { border-bottom: none; }
.row:hover { background: var(--surface2); }
.row.top3 { background: rgba(255,255,255,0.025); }
.row.top3:hover { background: rgba(255,255,255,0.04); }
.row.rank-1 { box-shadow: inset 3px 0 0 #f5a623; }
.row.rank-2 { box-shadow: inset 3px 0 0 #b8c5d0; }
.row.rank-3 { box-shadow: inset 3px 0 0 #cd7941; }

.rank-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  overflow: visible;
}
.crown-icon { width: 16px; height: auto; display: block; }
.rank-badge {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 1rem;
  flex-shrink: 0;
}
.rank-badge.gold   { background: linear-gradient(145deg, #ffe066, #f5a623 50%, #c97f00); color: #2a1500; }
.rank-badge.silver { background: linear-gradient(145deg, #e8edf2, #b8c5d0 50%, #7890a5); color: #182030; }
.rank-badge.bronze { background: linear-gradient(145deg, #e8924a, #cd7941 50%, #8a4010); color: #fff; }
.rank-num { color: var(--text-dim); font-size: 0.85rem; font-weight: 500; }

.user-cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
}
.avatar-placeholder {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--text-dim);
  flex-shrink: 0;
  text-transform: uppercase;
}
.avatar.medal-1, .avatar-placeholder.medal-1 { border: 2px solid #f5a623; }
.avatar.medal-2, .avatar-placeholder.medal-2 { border: 2px solid #b8c5d0; }
.avatar.medal-3, .avatar-placeholder.medal-3 { border: 2px solid #cd7941; }
.username { font-weight: 600; font-size: 0.92rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row.top3 .username { color: #fff; }
.wagered { text-align: right; font-size: 0.88rem; color: var(--text-dim); font-weight: 500; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.row.top3 .wagered { color: var(--text); }
.prize { text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1rem; letter-spacing: 0.02em; color: var(--accent); display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.row.top3 .prize { color: var(--gold); font-size: 1.1rem; }
.cur-icon { height: 1em; width: auto; object-fit: contain; vertical-align: middle; flex-shrink: 0; }

.loading { padding: 40px; text-align: center; color: var(--text-dim); font-size: 0.9rem; }

</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <img src="/assets/niksi.png" alt="NIKSI777">
      <span class="nav-logo-name">NIKSI777</span>
    </a>
    <div class="nav-links">
      <a href="/">HOME</a>
      <a href="/leaderboards" class="active">LEADERBOARDS</a>
      <a href="/store">STORE</a>
      <a href="/cases">CASES</a>
      <a href="/predict">PREDICT</a>
    </div>
    <div class="nav-socials">
      <a href="https://kick.com/niksi777" target="_blank" rel="noreferrer">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 3h4v5.5L11 3h5l-5.5 6.5L16 15h-5l-4-4.5V15H3V3z" fill="#22c55e"/></svg>
      </a>
      <a href="https://discord.com/invite/Gnyv25SHg7" target="_blank" rel="noreferrer">
        <svg viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.464-.674.86-1.339 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128c.126-.094.247-.192.372-.292a.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg>
      </a>
      <a href="https://x.com/niksigamba" target="_blank" rel="noreferrer">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63z"/></svg>
      </a>
    </div>
  </div>
</nav>
<div class="page">
  <div class="header">
    <h1 class="title">LEADERBOARDS</h1>
    <p class="subtitle">Wager using code <span class="code">NIKSI</span> to compete for prizes</p>
  </div>

  <div class="card">
    <div class="tabs" id="tabs"></div>

    <div class="race-meta">
      <a class="meta-btn meta-btn-signup" id="signup-btn" href="#" target="_blank" rel="noreferrer">SIGN UP</a>
      <div class="timer">
        <div class="timer-seg">
          <span class="timer-num" id="t-days">–</span>
          <span class="timer-unit">DAYS</span>
        </div>
        <span class="timer-sep">:</span>
        <div class="timer-seg">
          <span class="timer-num" id="t-hours">–</span>
          <span class="timer-unit">HOURS</span>
        </div>
        <span class="timer-sep">:</span>
        <div class="timer-seg">
          <span class="timer-num" id="t-mins">–</span>
          <span class="timer-unit">MINUTES</span>
        </div>
      </div>
      <a class="meta-btn meta-btn-rewards" href="/store">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
        REWARDS
      </a>
    </div>

    <div class="tbl-head">
      <span>RANK</span>
      <span>USERNAME</span>
      <span>WAGERED</span>
      <span>PRIZE</span>
    </div>

    <div id="rows-container">
      <div class="loading">Loading leaderboard...</div>
    </div>

  </div>
</div>

<script>
// currency: { type:'coin', icon:'/assets/x.png' } or { type:'usd' }
const PLATFORMS = [
  {
    id: 'chicken',
    logo: '/assets/chicken.png',
    alt: 'Chicken.gg',
    lbUrl: '/chicken-leaderboard',
    metaUrl: '/chicken-meta',
    prizeField: 'prize',
    wagerField: 'wager',
    endField: 'end',
    currency: { type: 'coin', icon: '/assets/coin.png' },
    signupUrl: 'https://chicken.gg?ref=niksi',
    btnLabel: 'SIGN UP ON CHICKEN.GG',
  },
  {
    id: 'dicey',
    logo: '/assets/dicey.png',
    alt: 'Dicey',
    lbUrl: '/dicey-leaderboard',
    metaUrl: '/dicey-meta',
    prizeField: 'prize',
    wagerField: 'wager',
    endField: 'end',
    currency: { type: 'usd' },
    signupUrl: 'https://dicey.com/signup?ref=Niksi',
    btnLabel: 'SIGN UP ON DICEY',
  },
  {
    id: 'gamba',
    logo: '/assets/gamba2.png',
    alt: 'Gamba',
    lbUrl: '/players',
    metaUrl: '/gamba-meta',
    prizeField: 'reward',
    wagerField: 'wager',
    endField: 'endDate',
    currency: { type: 'usd' },
    signupUrl: 'https://gamba.com?c=niksi',
    btnLabel: 'SIGN UP ON GAMBA',
  },
  {
    id: 'cs2skin',
    logo: '/assets/cs2skin.png',
    alt: 'CS2Skin',
    lbUrl: '/cs2skin-leaderboard',
    metaUrl: '/cs2skin-meta',
    prizeField: 'prize',
    wagerField: 'wager',
    endField: 'end',
    currency: { type: 'coin', icon: '/assets/cs2skincoin.png' },
    signupUrl: 'https://cs2skin.com/r/NIKSI',
    btnLabel: 'SIGN UP ON CS2SKIN',
  },
];

let currentId = 'chicken';
let cache = {};
let endTimes = {};

function fmt(n) {
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

const BADGES = ['gold', 'silver', 'bronze'];

function currencyHtml(value, currency, decimals = 2) {
  const num = Number(value || 0).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  if (currency.type === 'coin') {
    return `<img class="cur-icon" src="${currency.icon}" alt="">${num}`;
  }
  return `$${num}`;
}

function renderRows(entries, prizeField, wagerField, currency) {
  const container = document.getElementById('rows-container');
  if (!entries || !entries.length) {
    container.innerHTML = '<div class="loading">No entries yet.</div>';
    return;
  }
  container.innerHTML = entries.map((e, i) => {
    const rank = e.position || e.rank || (i + 1);
    const badge = rank <= 3
      ? `<span class="rank-badge ${BADGES[rank-1]}">${rank}</span>`
      : `<span class="rank-num">#${rank}</span>`;
    const medalClass = rank <= 3 ? ` medal-${rank}` : '';
    const rankCls = rank <= 3 ? `row top3 rank-${rank}` : 'row';
    const name = e.username || '?';
    const badgeEl = rank <= 3
      ? `<div class="rank-wrap">${rank === 1
          ? `<svg class="crown-icon" viewBox="0 0 20 12" xmlns="http://www.w3.org/2000/svg"><path d="M1 11 L4 3.5 L8 7.5 L10 0 L12 7.5 L16 3.5 L19 11 Z" fill="#f5a623"/><rect x="1" y="10" width="18" height="2" rx="1" fill="#f5a623"/></svg>`
          : ''
        }<span class="rank-badge ${BADGES[rank-1]}">${rank}</span></div>`
      : `<span class="rank-num">#${rank}</span>`;
    const avatarHtml = e.avatar
      ? `<img class="avatar${medalClass}" src="${e.avatar}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        + `<div class="avatar-placeholder${medalClass}" style="display:none">${name[0]}</div>`
      : `<div class="avatar-placeholder${medalClass}">${name[0]}</div>`;
    return `<div class="${rankCls}">
      <div>${badgeEl}</div>
      <div class="user-cell">${avatarHtml}<span class="username">${name}</span></div>
      <div class="wagered">${currencyHtml(e[wagerField], currency)}</div>
      <div class="prize">${currencyHtml(e[prizeField], currency)}</div>
    </div>`;
  }).join('');
}

function pad(n) { return String(n).padStart(2, '0'); }

function updateCountdown() {
  const end = endTimes[currentId];
  const dEl = document.getElementById('t-days');
  const hEl = document.getElementById('t-hours');
  const mEl = document.getElementById('t-mins');
  if (!end) { dEl.textContent = '–'; hEl.textContent = '–'; mEl.textContent = '–'; return; }
  const diff = new Date(end).getTime() - Date.now();
  if (diff <= 0) { dEl.textContent = '0'; hEl.textContent = '00'; mEl.textContent = '00'; return; }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  dEl.textContent = d;
  hEl.textContent = pad(h);
  mEl.textContent = pad(m);
}

function switchTab(id) {
  currentId = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === id));
  const p = PLATFORMS.find(p => p.id === id);
  if (!p) return;
  document.getElementById('signup-btn').textContent = p.btnLabel;
  document.getElementById('signup-btn').href = p.signupUrl;
  const entries = cache[id] || [];
  renderRows(entries, p.prizeField, p.wagerField, p.currency);
  updateCountdown();
}

function buildTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = PLATFORMS.map(p =>
    `<button class="tab${p.id === currentId ? ' active' : ''}" data-id="${p.id}" onclick="switchTab('${p.id}')">
      <img src="${p.logo}" alt="${p.alt}">
    </button>`
  ).join('');
}

async function loadAll() {
  buildTabs();
  await Promise.all(PLATFORMS.map(async p => {
    try {
      const [lbRes, metaRes] = await Promise.all([
        fetch(p.lbUrl).then(r => r.json()),
        fetch(p.metaUrl).then(r => r.json()).catch(() => null),
      ]);
      // Leaderboard entries
      if (Array.isArray(lbRes)) {
        cache[p.id] = lbRes;
      } else {
        cache[p.id] = lbRes.leaderboard || lbRes.entries || [];
      }
      // End time
      if (metaRes) {
        const endVal = metaRes[p.endField];
        if (endVal) endTimes[p.id] = endVal;
      }
    } catch(e) {
      cache[p.id] = [];
    }
  }));
  // Render current tab
  const p = PLATFORMS.find(p => p.id === currentId);
  if (p) {
    renderRows(cache[currentId], p.prizeField, p.wagerField, p.currency);
    document.getElementById('signup-btn').textContent = p.btnLabel;
    document.getElementById('signup-btn').href = p.signupUrl;
  }
  updateCountdown();
}

loadAll();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
