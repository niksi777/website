<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #07091c;
  --surface: #0d1430;
  --surface2: #131c3e;
  --border: #1c2a50;
  --accent: #3d8eff;
  --accent-dim: rgba(61,142,255,0.12);
  --text: #d8e8ff;
  --text-dim: #5a7090;
  --gold: #f5a623;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', system-ui, sans-serif;
  min-height: 100vh;
  padding: 32px 16px 48px;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 55% 40% at 18% 55%, rgba(30,80,200,0.13) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 82% 70%, rgba(20,60,180,0.11) 0%, transparent 55%),
    repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(61,142,255,0.022) 60px, rgba(61,142,255,0.022) 61px),
    repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(61,142,255,0.022) 60px, rgba(61,142,255,0.022) 61px);
  pointer-events: none;
  z-index: 0;
}

.page { max-width: 780px; margin: 0 auto; position: relative; z-index: 1; }

.header {
  text-align: center;
  padding: 40px 24px 32px;
  background: none;
  border-radius: 16px 16px 0 0;
}
.title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: clamp(2.4rem, 8vw, 4rem);
  letter-spacing: 0.02em;
  line-height: 1;
  color: #fff;
  text-shadow: 0 0 40px rgba(80,160,255,0.5), 0 2px 0 rgba(0,0,20,0.6);
}
.subtitle {
  margin-top: 10px;
  color: var(--text-dim);
  font-size: 0.88rem;
}
.subtitle .code { color: var(--accent); font-weight: 600; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 0 0 14px 14px;
  overflow: hidden;
}

/* ─── Tabs ─── */
.tabs {
  display: flex;
  justify-content: center;
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 16px 8px;
  cursor: pointer;
  transition: border-color 0.15s, opacity 0.15s;
  opacity: 0.4;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.tab:hover { opacity: 0.7; }
.tab.active { border-bottom-color: var(--accent); opacity: 1; }
.tab img { height: 28px; width: auto; object-fit: contain; display: block; max-width: 90px; }

/* ─── Timer ─── */
.race-meta {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.timer {
  display: flex;
  gap: 6px;
  align-items: flex-start;
}
.timer-seg {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 64px;
}
.timer-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 1.6rem;
  line-height: 1;
  color: var(--text);
  width: 100%;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.timer-unit {
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 3px;
}
.timer-sep {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--text-dim);
  padding-top: 2px;
  line-height: 1;
}

/* ─── Table ─── */
.tbl-head {
  display: grid;
  grid-template-columns: 70px 1fr 130px 100px;
  padding: 8px 20px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
}
.tbl-head span:nth-child(3),
.tbl-head span:nth-child(4) { text-align: right; }

.rows { max-height: 440px; overflow-y: auto; }
.rows::-webkit-scrollbar { width: 4px; }
.rows::-webkit-scrollbar-track { background: transparent; }
.rows::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.row {
  display: grid;
  grid-template-columns: 70px 1fr 130px 100px;
  align-items: center;
  padding: 11px 20px;
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
  font-variant-numeric: tabular-nums;
}
.row:last-child { border-bottom: none; }
.row:hover { background: var(--surface2); }
.row.top3 { background: rgba(255,255,255,0.025); }
.row.top3:hover { background: rgba(255,255,255,0.04); }

.rank-badge {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 1rem;
  flex-shrink: 0;
}
.rank-badge.gold   { background: linear-gradient(135deg, #f5a623, #c97f00); color: #1a0e00; box-shadow: 0 0 12px rgba(245,166,35,0.4); }
.rank-badge.silver { background: linear-gradient(135deg, #c8d0d8, #8090a0); color: #1a1a1a; }
.rank-badge.bronze { background: linear-gradient(135deg, #cd7941, #904f1a); color: #fff; box-shadow: 0 0 10px rgba(200,120,60,0.3); }
.rank-num { color: var(--text-dim); font-size: 0.85rem; font-weight: 500; }

.username { font-weight: 600; font-size: 0.92rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row.top3 .username { color: #fff; }
.wagered { text-align: right; font-size: 0.88rem; color: var(--text-dim); font-weight: 500; }
.row.top3 .wagered { color: var(--text); }
.prize { text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1rem; letter-spacing: 0.02em; color: var(--accent); }
.row.top3 .prize { color: var(--gold); font-size: 1.1rem; }

.loading { padding: 40px; text-align: center; color: var(--text-dim); font-size: 0.9rem; }

.footer { padding: 20px; border-top: 1px solid var(--border); }
.join-btn {
  display: block; width: 100%; padding: 16px;
  background: linear-gradient(90deg, #1a4eb5, #2d7aff);
  border: none; border-radius: 10px; color: #fff;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 1.2rem; letter-spacing: 0.14em;
  text-transform: uppercase; cursor: pointer;
  transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
  text-decoration: none; text-align: center;
  box-shadow: 0 4px 20px rgba(45,122,255,0.35);
}
.join-btn:hover { opacity: 0.92; transform: translateY(-2px); box-shadow: 0 6px 28px rgba(45,122,255,0.5); }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1 class="title">LEADERBOARDS</h1>
    <p class="subtitle">Wager using code <span class="code">NIKSI</span> to compete for prizes</p>
  </div>

  <div class="card">
    <div class="tabs" id="tabs"></div>

    <div class="race-meta">
      <div class="timer">
        <div class="timer-seg">
          <span class="timer-num" id="t-days">–</span>
          <span class="timer-unit">DAYS</span>
        </div>
        <span class="timer-sep">:</span>
        <div class="timer-seg">
          <span class="timer-num" id="t-hours">–</span>
          <span class="timer-unit">HOURS</span>
        </div>
        <span class="timer-sep">:</span>
        <div class="timer-seg">
          <span class="timer-num" id="t-mins">–</span>
          <span class="timer-unit">MINUTES</span>
        </div>
      </div>
    </div>

    <div class="tbl-head">
      <span>RANK</span>
      <span>USERNAME</span>
      <span>WAGERED</span>
      <span>PRIZE</span>
    </div>

    <div id="rows-container">
      <div class="loading">Loading leaderboard...</div>
    </div>

    <div class="footer">
      <a class="join-btn" id="join-btn" href="#" target="_blank" rel="noreferrer">SIGN UP &amp; JOIN RACE</a>
    </div>
  </div>
</div>

<script>
const PLATFORMS = [
  {
    id: 'chicken',
    logo: '/assets/chicken.png',
    alt: 'Chicken.gg',
    lbUrl: '/chicken-leaderboard',
    metaUrl: '/chicken-meta',
    prizeField: 'prize',
    wagerField: 'wager',
    endField: 'end',
    signupUrl: 'https://chicken.gg?ref=niksi',
    btnLabel: 'SIGN UP ON CHICKEN.GG',
  },
  {
    id: 'dicey',
    logo: '/assets/dicey.png',
    alt: 'Dicey',
    lbUrl: '/dicey-leaderboard',
    metaUrl: '/dicey-meta',
    prizeField: 'prize',
    wagerField: 'wager',
    endField: 'end',
    signupUrl: 'https://dicey.com/signup?ref=Niksi',
    btnLabel: 'SIGN UP ON DICEY',
  },
  {
    id: 'gamba',
    logo: '/assets/gamba2.png',
    alt: 'Gamba',
    lbUrl: '/players',
    metaUrl: '/gamba-meta',
    prizeField: 'reward',
    wagerField: 'wager',
    endField: 'endDate',
    listKey: null,
    signupUrl: 'https://gamba.com?c=niksi',
    btnLabel: 'SIGN UP ON GAMBA',
  },
  {
    id: 'cs2skin',
    logo: '/assets/cs2skin.png',
    alt: 'CS2Skin',
    lbUrl: '/cs2skin-leaderboard',
    metaUrl: '/cs2skin-meta',
    prizeField: 'prize',
    wagerField: 'wager',
    endField: 'end',
    signupUrl: 'https://cs2skin.com/r/NIKSI',
    btnLabel: 'SIGN UP ON CS2SKIN',
  },
];

let currentId = 'chicken';
let cache = {};
let endTimes = {};

function fmt(n) {
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

const BADGES = ['gold', 'silver', 'bronze'];

function renderRows(entries, prizeField, wagerField) {
  const container = document.getElementById('rows-container');
  if (!entries || !entries.length) {
    container.innerHTML = '<div class="loading">No entries yet.</div>';
    return;
  }
  container.innerHTML = entries.map((e, i) => {
    const rank = e.position || e.rank || (i + 1);
    const badge = rank <= 3
      ? `<span class="rank-badge ${BADGES[rank-1]}">${rank}</span>`
      : `<span class="rank-num">#${rank}</span>`;
    const cls = rank <= 3 ? 'row top3' : 'row';
    const prize = e[prizeField] != null ? Number(e[prizeField]).toFixed(2) : '–';
    return `<div class="${cls}">
      <div>${badge}</div>
      <div class="username">${e.username || '?'}</div>
      <div class="wagered">${fmt(e[wagerField] || 0)}</div>
      <div class="prize">${prize}</div>
    </div>`;
  }).join('');
}

function pad(n) { return String(n).padStart(2, '0'); }

function updateCountdown() {
  const end = endTimes[currentId];
  const dEl = document.getElementById('t-days');
  const hEl = document.getElementById('t-hours');
  const mEl = document.getElementById('t-mins');
  if (!end) { dEl.textContent = '–'; hEl.textContent = '–'; mEl.textContent = '–'; return; }
  const diff = new Date(end).getTime() - Date.now();
  if (diff <= 0) { dEl.textContent = '0'; hEl.textContent = '00'; mEl.textContent = '00'; return; }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  dEl.textContent = d;
  hEl.textContent = pad(h);
  mEl.textContent = pad(m);
}

function switchTab(id) {
  currentId = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === id));
  const p = PLATFORMS.find(p => p.id === id);
  if (!p) return;
  document.getElementById('join-btn').textContent = p.btnLabel;
  document.getElementById('join-btn').href = p.signupUrl;
  const entries = cache[id] || [];
  renderRows(entries, p.prizeField, p.wagerField);
  updateCountdown();
}

function buildTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = PLATFORMS.map(p =>
    `<button class="tab${p.id === currentId ? ' active' : ''}" data-id="${p.id}" onclick="switchTab('${p.id}')">
      <img src="${p.logo}" alt="${p.alt}">
    </button>`
  ).join('');
}

async function loadAll() {
  buildTabs();
  await Promise.all(PLATFORMS.map(async p => {
    try {
      const [lbRes, metaRes] = await Promise.all([
        fetch(p.lbUrl).then(r => r.json()),
        fetch(p.metaUrl).then(r => r.json()).catch(() => null),
      ]);
      // Leaderboard entries
      if (Array.isArray(lbRes)) {
        cache[p.id] = lbRes;
      } else {
        cache[p.id] = lbRes.leaderboard || lbRes.entries || [];
      }
      // End time
      if (metaRes) {
        const endVal = metaRes[p.endField];
        if (endVal) endTimes[p.id] = endVal;
      }
    } catch(e) {
      cache[p.id] = [];
    }
  }));
  // Render current tab
  const p = PLATFORMS.find(p => p.id === currentId);
  if (p) {
    renderRows(cache[currentId], p.prizeField, p.wagerField);
    document.getElementById('join-btn').textContent = p.btnLabel;
    document.getElementById('join-btn').href = p.signupUrl;
  }
  updateCountdown();
}

loadAll();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
