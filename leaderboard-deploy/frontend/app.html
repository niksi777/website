  function CardRoller({entries,avatarMap,onWinner,forceWinner,onForceConsumed,onRollingChange,onReroll,hasWinner,recentWinners,onReset,onRemoveEntry}){
    const trackRef=React.useRef(null);
    const stageRef=React.useRef(null);
    const [rolling,setRolling]=React.useState(false);
    const [winnerIdx,setWinnerIdx]=React.useState(null);
    const idleRaf=React.useRef(null);
    const idleX=React.useRef(0);
    const entriesRef=React.useRef(entries);
    const CARD_W=140,TILE=144,TOTAL=60;
    const RARITIES=['blue','blue','blue','purple','purple','gold'];
    const AVATAR_COLORS=['#e05c5c','#e07c3a','#d4a017','#4caf7d','#3a9bd4','#7c5ce4','#d44a8a','#38b2b2'];

    React.useEffect(()=>{ entriesRef.current=entries; },[entries]);

    function getRarity(name){
      let h=0;for(let i=0;i<name.length;i++){h=((h<<5)-h)+name.charCodeAt(i);h|=0;}
      return RARITIES[Math.abs(h)%RARITIES.length];
    }
    function getAvatarColor(name){
      let h=0;for(let i=0;i<name.length;i++){h=((h<<5)-h)+name.charCodeAt(i);h|=0;}
      return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length];
    }
    function makeCard(name){
      const realAvatar=(avatarMap||{})[name.toLowerCase()];
      const seed=encodeURIComponent(name);
      const src=realAvatar||'https://api.dicebear.com/7.x/big-ears/svg?seed='+seed;
      return '<img class="roller-avatar" src="'+src+'" width="38" height="38" style="border-radius:50%;object-fit:cover"/><div class="roller-card-name">'+name+'</div>';
    }

    function startIdle(pool){
      const track=trackRef.current;
      if(!track||!pool||pool.length===0) return;
      cancelAnimationFrame(idleRaf.current);
      track.style.transition='none';
      track.innerHTML='';
      const minTiles=40;
      const repeated=[];
      while(repeated.length<minTiles) repeated.push(...pool);
      const half=repeated.slice(0,minTiles);
      const full=[...half,...half];
      full.forEach(e=>{
        const d=document.createElement('div');
        d.className='roller-card rarity-'+getRarity(e.username);
        d.innerHTML=makeCard(e.username);
        track.appendChild(d);
      });
      const halfW=minTiles*TILE;
      idleX.current=-(halfW/2);
      const speed=0.4;
      let last=null;
      function step(ts){
        if(!last) last=ts;
        const dt=Math.min(ts-last,50);last=ts;
        idleX.current-=speed*(dt/16.67);
        if(idleX.current<=-halfW) idleX.current+=halfW;
        track.style.transform='translateX('+idleX.current+'px)';
        idleRaf.current=requestAnimationFrame(step);
      }
      idleRaf.current=requestAnimationFrame(step);
    }

    const idleKeyRef=React.useRef('');
    React.useEffect(()=>{
      if(entries.length===0) return;
      if(rolling) return;
      const key=entries.map(e=>e.username).join(',');
      if(key===idleKeyRef.current) return;
      idleKeyRef.current=key;
      startIdle(entries);
    },[entries,rolling]);

    React.useEffect(()=>{
      if(forceWinner&&entries.length>0) doRoll(forceWinner);
    },[forceWinner]);

    function buildDeck(winnerName){
      const pool=entries.length>0?entries:[{username:'???'}];
      const cards=[];
      for(let i=0;i<TOTAL;i++){
        const n=pool[Math.floor(Math.random()*pool.length)].username;
        cards.push({name:n,r:getRarity(n)});
      }
      const landIdx=Math.floor(TOTAL*0.75);
      cards[landIdx]={name:winnerName,r:getRarity(winnerName)};
      return{cards,landIdx};
    }

    function animate(winner,forced,landIdx){
      const track=trackRef.current;const stage=stageRef.current;
      if(!track||!stage){setRolling(false);return;}
      const stageW=stage.offsetWidth;
      const trackPad=6;
      // Land anywhere in the card biased right — winner stops left-of-center so next card peeks in
      const randomNudge=(Math.random()-0.25)*TILE*0.75;
      const centerOffset=stageW/2-CARD_W/2-trackPad+randomNudge;
      const finalX=-(landIdx*TILE-centerOffset);
      track.style.transition='none';
      track.style.transform='translateX(0px)';
      void track.offsetWidth;
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          track.style.transition='transform 6200ms cubic-bezier(0.12,0,0.1,1)';
          track.style.transform='translateX('+finalX+'px)';
        });
      });
      setTimeout(()=>{
        setWinnerIdx(landIdx);
        if(onRollingChange)onRollingChange(false);
        onWinner(winner);
        if(forced&&onForceConsumed)onForceConsumed();
        setTimeout(()=>{
          setRolling(false);
          startIdle(entriesRef.current);
        },2500);
      },6300);
    }

    function doRoll(forcedName){
      if(rolling)return;
      cancelAnimationFrame(idleRaf.current);
      const winner=forcedName||entries[Math.floor(Math.random()*entries.length)].username;
      const{cards,landIdx}=buildDeck(winner);
      setWinnerIdx(null);setRolling(true);
      if(onRollingChange)onRollingChange(true);
      const track=trackRef.current;
      if(track){
        track.style.transition='none';
        track.innerHTML='';
        cards.forEach((c,i)=>{
          const d=document.createElement('div');
          d.className='roller-card rarity-'+c.r;
          d.innerHTML=makeCard(c.name);
          track.appendChild(d);
        });
      }
      requestAnimationFrame(()=>animate(winner,forcedName,landIdx));
    }

    function roll(){
      if(rolling||entries.length===0)return;
      doRoll(null);
    }

    function onTransitionEnd(){
      if(winnerIdx===null)return;
      const track=trackRef.current;
      if(!track)return;
      const card=track.children[winnerIdx];
      if(card){card.classList.add('winner-card');}
    }

    return(
      <div className="roller-wrap f2">
        <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',alignItems:'center'}}>
          <div className="roller-title">Roll Winner</div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:700,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--mu)',textAlign:'center'}}>{entries.length} ENTERED</div>
          <div style={{display:'flex',gap:10,alignItems:'center',justifyContent:'flex-end',flexWrap:'wrap'}}>
            {recentWinners&&recentWinners.length>0&&<>
              <div style={{fontSize:10,fontWeight:500,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--mu)'}}>Recent</div>
              {recentWinners.slice(0,3).map((w,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:6,background:'var(--s2)',border:'1px solid var(--b2)',borderRadius:8,padding:'5px 10px'}}>
                  <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:700,textTransform:'uppercase',color:'var(--tx)',letterSpacing:'.04em'}}>{w.name}</span>
                  <span style={{width:1,height:12,background:'var(--b2)',display:'inline-block'}}/>
                  <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:700,color:'var(--ac)',letterSpacing:'.02em'}}>{w.prize}</span>
                </div>
              ))}
            </>}
          </div>
        </div>
        <div className="roller-stage-wrap">
          <div className="roller-pointer-top"/>
          <div className="roller-pointer-bot"/>
          <div className="roller-stage" ref={stageRef}>
            <div className="roller-win-zone"/>
            <div className="roller-track" ref={trackRef} style={{transform:'translateX(0px)',left:0,top:0}} onTransitionEnd={onTransitionEnd}/>
          </div>
        </div>
        <button className="roll-btn" onClick={winnerIdx!==null&&!rolling?onReroll:roll} disabled={rolling||entries.length===0}>
          {rolling?'Rolling...':(winnerIdx!==null?'Reroll':'Roll Winner')}
        </button>
        <div style={{borderTop:'1px solid var(--b1)',paddingTop:16,marginTop:4}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
            <div style={{fontFamily:"'Inter',sans-serif",fontSize:11,fontWeight:500,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--mu)'}}>Entries - {entries.length}</div>
            {onReset&&<button className="btn btn-sec" style={{width:'auto',padding:'4px 12px',fontSize:11}} onClick={onReset}>Reset</button>}
          </div>
          {entries.length===0?(
            <div className="empty">No entries yet</div>
          ):(
            <div className="entries-grid">
              {entries.map((e,i)=>(
                <div key={e.id||i} className="entry-chip">

        </div>
      </div>
    );
  }

                <span style={{width:6,height:6,borderRadius:'50%',background:pfProof?'#22c55e':'rgba(184,204,232,.5)',display:'inline-block',flexShrink:0}}/>
                <span style={{fontSize:11,fontWeight:500,letterSpacing:'.12em',textTransform:'uppercase',color:pfProof?'rgba(221,227,239,.9)':'var(--mu)'}}>
                  Provably Fair{pfProof?' ✓':''}
                </span>
              </div>
              {!pfHash&&<button className="pf-btn" onClick={prepareSeed} disabled={pfLoading}>Generate Seed</button>}
              {pfHash&&!pfProof&&<button className="pf-btn" onClick={prepareSeed} disabled={pfLoading}>New Seed</button>}
              {pfHash&&!pfProof&&(
                <button className="pf-btn pf-btn-roll" onClick={pfRoll} disabled={pfLoading||entries.length===0}>
                  {pfLoading?'Rolling...':'PF Roll'}
                </button>
              )}
              {pfProof&&(
                <button className="pf-btn" onClick={toggleProof}>
                  {showProof?'Hide Proof':'View Proof'}
                </button>
              )}
            </div>
          )}

          {isActive&&<CardRoller entries={entries} avatarMap={avatarMap} onWinner={handleWinner} forceWinner={pfForce||rerollTarget} onForceConsumed={()=>{setPfForce(null);setRerollTarget(null);}} onRollingChange={setRollerRolling} onReroll={rerollWinner} hasWinner={!!(winner||giveaway?.winner)} recentWinners={recentWinners} onReset={giveaway?resetGiveaway:null} onRemoveEntry={async(u)=>{await removeEntry(u);fetchState();}}/>}

          {/* Proof details - only visible when toggled */}
          {pfProof&&showProof&&(
            <div ref={proofRef} className="pf-proof" style={{animation:'fu .3s ease both'}}>
              <div><strong>Winner:</strong> {pfProof.winner}</div>
              <div><strong>Server Seed:</strong> {pfProof.serverSeed}</div>
              <div><strong>Seed Hash:</strong> {pfProof.serverSeedHash}</div>
              <div><strong>Result Hash:</strong> {pfProof.resultHash}</div>
              <div><strong>Index:</strong> {pfProof.index} of {pfProof.total} entries</div>
              <div style={{marginTop:6,fontSize:10,color:'rgba(221,227,239,.3)'}}>SHA256(serverSeed + ":" + entries) - winner = entries[hash mod {pfProof.total}]</div>
            </div>
          )}

          {/* Winner Response Panel */}
          {winner&&(
            <div className="winner-panel f3" ref={winnerPanelRef}>
              <div className="winner-panel-header" style={{flexDirection:'column',alignItems:'center',textAlign:'center',gap:12}}>
                {winnerAvatarUrl ? (
                  <img src={winnerAvatarUrl} className="winner-avatar" alt={winner}/>
                ) : (
                  <div className="winner-avatar" style={{display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,color:'#e8a427'}}>
                    {winner.slice(0,2).toUpperCase()}
                  </div>
                )}
                <div>
                  <div className="winner-panel-name">{winner}</div>
                  {respTimer!==null&&(
                    <div className="winner-resp-timer" style={{justifyContent:'center'}}>
                      <span className={'winner-resp-t'+(respTimer<=10?' urgent':'')}>
                        {respTimer}s
                      </span>
                      <span>{respTimer>0?'to respond':'- time up'}</span>
                    </div>
                  )}
                </div>
              </div>
              <div className="chat-section">
                <div className="chat-header">
                  <span className="cdot"/>
                  Winner Chat - {winner}
                </div>
                <div className="chat-feed" ref={chatFeedRef}>
                  {winnerChat.length===0?(
                    <div style={{textAlign:'center',padding:'32px 0',fontSize:11,letterSpacing:'.12em',textTransform:'uppercase',color:'rgba(221,227,239,.25)'}}>No messages from {winner} yet</div>
                  ):(
                    winnerChat.map((m,i)=>{
                      const d=new Date(m.ts);
                      const t=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
                      const renderMsg=(text)=>text.split(/(\[emote:\d+:[^\]]+\])/).map((part,j)=>{
                        const em=part.match(/\[emote:(\d+):([^\]]+)\]/);
                        if(em)return<img key={j} src={`https://files.kick.com/emotes/${em[1]}/fullsize`} alt={em[2]} title={em[2]} style={{width:20,height:20,verticalAlign:'middle',display:'inline-block',margin:'0 1px'}}/>;
                        return part;
                      });
                      return(
                        <div key={i} className="chat-msg">
                          <span className="chat-ts">{t}</span>
                          <span className="chat-user">{m.username}:</span>
                          <span className="chat-content">{renderMsg(m.content)}</span>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>
          )}


        </div>
      </div>
      <footer><div className="page"><div className="ftw"><p className="ftd"><strong>18+</strong> - We are not responsible for any losses incurred from gambling on casino or betting platforms linked or promoted on this site.</p><div style={{display:'flex',alignItems:'center',gap:4}}><div className="nsoc" style={{border:'none',padding:0}}>{SOCIALS}</div><span className="ftc" style={{marginLeft:8}}>© 2026 NIKSI777</span></div></div></div>        <div style={{textAlign:"center",marginTop:10,paddingBottom:4,fontSize:11,color:"var(--mu)",letterSpacing:".08em",fontFamily:"'Inter',sans-serif"}}>Created by <strong style={{color:"var(--ac)"}}>@niksiii</strong> on Discord</div>
      </footer>
    </>);
  }

// ====== APP ROUTER ======
function AppInner() {
  const session = useSession();
  const path    = usePath();
  const pathname = path.split('?')[0].split('#')[0];
  let Page;
  if      (pathname === '/')                                     Page = <HomePage/>;
  else if (pathname === '/leaderboards')                         Page = <LeaderboardsPage/>;
  else if (pathname === '/store')                                Page = <StorePage/>;
  else if (pathname === '/predict' || pathname === '/predictor') Page = <PredictorPage/>;
  else if (pathname === '/settings')                             Page = <SettingsPage/>;
  else if (pathname === '/giveaway')                             Page = <GiveawayPage/>;
  else if (pathname === '/admin')                                Page = <AdminPage/>;
  else                                                            Page = <HomePage/>;

  return (
    <SessionCtx.Provider value={session}>
      <Navbar/>
      <div key={path} className="_spa">{Page}</div>
    </SessionCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <RouterProvider><AppInner/></RouterProvider>
);

</script>
<script>
(function(){
  document.addEventListener('click', function(e) {
    var el = e.target;
    while (el && el.tagName !== 'A') el = el.parentElement;
    if (!el || !window.__spaNavigate) return;
    var href = el.getAttribute('href');
    if (!href) return;
    if (href.indexOf('http')===0||href.indexOf('//')===0||href.indexOf('mailto:')===0||href.indexOf('tel:')===0||href.indexOf('#')===0) return;
    if (href.indexOf('/auth')===0) return;
    if (href.indexOf('/cases')===0) return;
    if (el.target && el.target !== '_self') return;
    e.preventDefault();
    window.__spaNavigate(href);
  }, true);
})();
</script>
<script>
(function(){
  var canvas=document.getElementById('constellation');
  var ctx=canvas.getContext('2d');
  var N=110,DIST=140,W,H,pts=[];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  function mkPt(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.2+.4,o:Math.random()*.45+.1};}
  function init(){resize();pts=[];for(var i=0;i<N;i++)pts.push(mkPt());}
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<N;i++){var a=pts[i];for(var j=i+1;j<N;j++){var b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);if(d<DIST){ctx.beginPath();ctx.strokeStyle='rgba(130,170,255,'+((1-d/DIST)*.12)+')';ctx.lineWidth=.6;ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}}
    for(var i=0;i<N;i++){var p=pts[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(160,190,255,'+p.o+')';ctx.fill();}
    requestAnimationFrame(tick);
  }
  init();window.addEventListener('resize',resize);tick();
})();
</script>
