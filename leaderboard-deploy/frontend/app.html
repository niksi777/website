<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NIKSI777</title>
  <link rel="icon" href="/assets/niksi.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <style>

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#080808;--s1:#0e0e0e;--s2:#131313;--b1:rgba(255,255,255,.04);--b2:rgba(255,255,255,.08);--b3:rgba(255,255,255,.14);--tx:#dde3ef;--mu:rgba(221,227,239,.65);--ac:#4a9eff;--rd:#e03535;--gold:#d4af5a}
    html,body{background-color:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;scrollbar-gutter:stable}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:linear-gradient(to bottom,transparent 18%,black 27%,black 73%,transparent 82%);mask-image:linear-gradient(to bottom,transparent 18%,black 27%,black 73%,transparent 82%);pointer-events:none;z-index:0}
    @keyframes pu{0%,100%{opacity:1}50%{opacity:.15}}
    @keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .f1{animation:fu .5s ease both}.f2{animation:fu .5s .15s ease both}.f3{animation:fu .5s .3s ease both}

    nav{background:rgba(8,8,8,.96);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:50}
    .ni{max-width:1020px;margin:0 auto;padding:0 28px;display:flex;align-items:center;height:68px;position:relative}
    .nlogo{display:flex;align-items:center;gap:10px;padding-right:22px;border-right:1px solid var(--b2);margin-right:18px;flex-shrink:0;text-decoration:none}
    .nlogo img{height:28px;width:28px;border-radius:50%;object-fit:cover}
    .nname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.16em;color:#fff;text-transform:uppercase}
    .nlinks{display:flex;align-items:center;position:absolute;left:50%;transform:translateX(-50%)}
    .nlinks a{font-family:'Inter',sans-serif;font-size:14px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:0 13px;height:68px;display:flex;align-items:center;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;margin-bottom:-1px}
    .nlinks a:hover{color:rgba(255,255,255,.9)}
    .nlinks a.on{color:#fff;border-bottom-color:rgba(255,255,255,.5)}
    .nsoc{margin-left:auto;display:flex;align-items:center;gap:2px;padding-left:16px;border-left:1px solid var(--b2)}
    .nsoc a{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;opacity:.5;transition:opacity .15s}
    .nsoc a:hover{opacity:1;background:rgba(255,255,255,.05)}
    .nsoc svg{width:15px;height:15px}
    .hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:32px;height:32px;cursor:pointer;margin-left:auto;padding:4px;background:none;border:none}
    .hamburger span{display:block;height:1.5px;background:rgba(255,255,255,.6);border-radius:2px;transition:all .2s}
    .drawer{display:none;flex-direction:column;background:rgba(6,7,13,.99);border-bottom:1px solid var(--b2);padding:10px 28px 18px}
    .drawer.open{display:flex}
    .drawer a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--b1);transition:color .15s}
    .drawer a:last-of-type{border-bottom:none}
    .drawer a.on,.drawer a:hover{color:#fff}
    .nauth{display:flex;align-items:center;gap:8px;padding-left:12px;flex-shrink:0}
    .ndrop{position:relative}
    .ndrop-menu{display:none;position:absolute;top:100%;right:0;padding-top:6px;z-index:200;min-width:150px}
    .ndrop:hover .ndrop-menu{display:block}
    .ndrop-box{background:rgba(6,7,13,.97);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
    .ndrop-item{display:block;width:100%;text-align:left;padding:9px 14px;font-size:12px;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(221,227,239,.75);text-decoration:none;background:none;border:none;cursor:pointer;border-radius:6px;transition:background .1s;box-sizing:border-box}
    .ndrop-item:hover{background:rgba(255,255,255,.06)}
    .ndrop-logout{color:rgba(217,79,79,.8)}
    .nlogin-btn{display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:7px;background:#22c55e;color:#fff;border:none;cursor:pointer;transition:opacity .15s;text-decoration:none;white-space:nowrap;flex-shrink:0}
    .nlogin-btn:hover{opacity:.85}
    .nuser{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:7px;background:var(--s1);border:1px solid var(--b2);cursor:pointer;transition:border-color .15s}
    .nuser:hover{border-color:var(--b3)}
    .nuser-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--s2)}
    .nuser-name{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--tx)}
    .nuser-NP{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#d4af5a}

    .page{width:100%;max-width:1020px;margin:0 auto;padding:0 28px}

    /* Carousel */
    .carousel-wrap{position:relative;border-radius:16px;overflow:hidden;height:290px;margin:28px 0 32px;box-shadow:0 8px 48px rgba(0,0,0,.55),0 2px 12px rgba(0,0,0,.35)}
    .c-track{display:flex;height:100%;transition:transform .52s cubic-bezier(.4,0,.2,1)}
    .c-slide{min-width:100%;height:100%;flex-shrink:0;position:relative;display:flex;align-items:center;padding:40px 52px}
    .c-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px}
    .c-dot{border:none;cursor:pointer;border-radius:2px;height:3px;width:64px;padding:0;background:rgba(255,255,255,.18);background-image:linear-gradient(to right,rgba(255,255,255,.82),rgba(255,255,255,.82));background-repeat:no-repeat;background-size:0% 100%;background-position:left center;transition:background-color .3s}
    .c-dot.on{background-color:rgba(255,255,255,.18);animation:dot-fill 5.5s linear forwards}
    @keyframes dot-fill{from{background-size:0% 100%}to{background-size:100% 100%}}


    /* Predictor banner */
    .pred-banner{background:rgba(255,255,255,.03);border:1px solid rgba(74,158,255,.18);border-top:2px solid rgba(74,158,255,.35);border-radius:12px;padding:20px 24px;margin-bottom:28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;text-decoration:none;transition:border-color .2s,transform .15s}
    .pred-banner:hover{border-color:rgba(74,158,255,.35);transform:translateY(-2px)}
    .pred-banner-icon{width:44px;height:44px;border-radius:10px;background:rgba(74,158,255,.1);border:1px solid rgba(74,158,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
    .pred-banner-info{flex:1;min-width:0}
    .pred-banner-title{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;margin-bottom:3px}
    .pred-banner-sub{font-size:12px;color:var(--mu);line-height:1.5}
    .pred-split{flex:1;min-width:180px;max-width:260px}
    .pred-split-bar{height:7px;border-radius:99px;background:rgba(239,68,68,.2);overflow:hidden;margin:5px 0}
    .pred-split-fill{height:100%;border-radius:99px;background:#22c55e;transition:width .6s ease}
    .pred-split-lbl{display:flex;justify-content:space-between;font-size:11px}
    .pred-cta{display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:8px 16px;border-radius:8px;background:var(--ac);color:#fff;white-space:nowrap;flex-shrink:0;text-decoration:none}
    .pred-badge-open{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:100px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#22c55e;margin-bottom:4px}
    .pred-badge-dot{width:4px;height:4px;border-radius:50%;background:currentColor;animation:pu 1.2s ease-in-out infinite}
    

    /* Platform cards */
    .plat-section{margin-top:44px;margin-bottom:56px}
    .plat-title{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;text-align:center;margin-bottom:4px}
    .plat-sub{font-size:13px;color:var(--mu);text-align:center;margin-bottom:28px}
    .plat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,300px));gap:16px;justify-content:center}
    .plat-card{background:#0d0c12;border:1px solid rgba(255,255,255,.08);border-radius:14px;display:flex;flex-direction:column;align-items:center;padding:30px 24px 24px;position:relative;transition:border-color .2s,box-shadow .2s}
    .plat-card:hover{border-color:rgba(255,255,255,.15);box-shadow:0 8px 40px rgba(0,0,0,.45)}
    .plat-card-logo-wrap{height:64px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;width:100%}
    .plat-card-logo{max-height:58px;max-width:180px;width:auto;object-fit:contain;filter:drop-shadow(0 0 10px rgba(255,255,255,.15))}
    .plat-card-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;font-style:italic;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.1;min-height:66px;display:flex;flex-direction:column;justify-content:center;margin-bottom:10px}
    .plat-card-prize{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:800;font-style:italic;letter-spacing:.04em;line-height:1;display:flex;align-items:center;justify-content:center;gap:6px}
    .plat-card-lbtype{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;font-style:italic;letter-spacing:.1em;text-transform:uppercase;text-align:center;opacity:.72;margin-top:5px;white-space:nowrap}
    .plat-card-title-wrap{height:80px;display:flex;flex-direction:column;justify-content:center;margin-bottom:0;text-align:center;flex-shrink:0}
    .plat-divider{width:100%;height:1px;border:none;margin:12px 0;flex-shrink:0}
    .plat-card-perks{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;justify-content:center}
    .plat-card-perk{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;font-style:italic;letter-spacing:.05em;text-transform:uppercase;text-align:center;opacity:.72}
    .plat-card-spacer{flex:1}
    .plat-card-code{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(220,225,240,.45);margin-top:12px;margin-bottom:0;text-align:center}
    .plat-card-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px 0;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:opacity .15s;border:none;color:#fff}
    .plat-card-btn:hover{opacity:.82}
    .plat-card-btn2{margin-top:10px;background:transparent;border:1px solid;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:10px 0;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:opacity .15s}
    .plat-card-btn2:hover{opacity:.72}

    .bf-overlay{position:fixed;inset:0;background:rgba(2,3,8,.8);backdrop-filter:blur(4px);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;animation:fu .18s ease both}
    .bf-modal{background:#0e0204;border:1px solid rgba(210,30,45,.3);border-top:3px solid #d21e2d;border-radius:16px;width:100%;max-width:460px;padding:36px 28px 28px;position:relative;text-align:center}
    .bf-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:7px;border:1px solid var(--b2);background:rgba(255,255,255,.04);color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .bf-close:hover{color:#fff;border-color:var(--b3)}
    .bf-link{display:block;font-size:12px;color:rgba(221,227,239,.55);background:rgba(255,255,255,.04);border:1px solid var(--b2);border-radius:8px;padding:10px 14px;margin:18px 0;word-break:break-all;font-family:'Inter',sans-serif;letter-spacing:.02em}
    .bf-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 32px;background:#d21e2d;color:#fff;border-radius:9px;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:opacity .15s}
    .bf-btn:hover{opacity:.85}

    footer{border-top:1px solid var(--b1);padding:22px 0}
    .ftw{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .ftd{font-size:12px;line-height:1.6;color:var(--mu);max-width:500px}
    .ftd strong{color:rgba(221,227,239,.9)}
    .ftc{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);white-space:nowrap}

    #constellation{position:fixed;inset:0;z-index:0;pointer-events:none}

    }}

    /* Platform tabs */

    .ptab-coin{height:14px;width:14px;object-fit:contain}

    /* NiksiPoints leaderboard */
    .statsbar{background:var(--s1);border:1px solid var(--b1);border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:28px}
    .stat{padding:20px 24px;border-right:1px solid var(--b1);text-align:center}
    .stat:last-child{border-right:none}
    .stat-lbl{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
    .stat-val{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:.01em;color:#fff;line-height:1}

    .podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;align-items:end}
    .pcard{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;position:relative;overflow:hidden}
    .pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--pline)}
    .pcard.p1{--pline:rgba(212,175,90,.6);border-color:rgba(212,175,90,.2);padding-top:24px;padding-bottom:24px}
    .pcard.p2{--pline:rgba(154,170,184,.4);border-color:rgba(154,170,184,.15)}
    .pcard.p3{--pline:rgba(160,113,74,.4);border-color:rgba(160,113,74,.15)}
    .prank{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
    .p1 .prank{color:var(--gold)}.p2 .prank{color:var(--silver)}.p3 .prank{color:var(--bronze)}
    .pavatar{width:48px;height:48px;border-radius:50%;background:var(--s3);border:2px solid var(--b2);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--mu);text-transform:uppercase}
    .p1 .pavatar{width:64px;height:64px;font-size:16px}
    .puname{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ppts{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;line-height:1}
    .p1 .ppts{color:var(--gold);font-size:24px}.p2 .ppts{color:var(--silver)}.p3 .ppts{color:var(--bronze)}
    .ppts-lbl{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}

    .sdiv{display:flex;align-items:center;gap:14px;margin:28px 0 18px}
    .sdl{flex:1;height:1px;background:var(--b2)}
    .sdlbl{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);white-space:nowrap}

    .lbtable{border:1px solid var(--b1);border-radius:12px;overflow:hidden;margin-bottom:56px}
    .lbhead{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:10px 20px;background:var(--s2);border-bottom:1px solid var(--b1)}
    .lbh{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
    .lbrow{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px 20px;background:var(--s1);border-bottom:1px solid var(--b1);transition:background .15s}
    .lbrow:last-child{border-bottom:none}
    .lbrow:hover{background:var(--s2)}
    .lbrk{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em;text-align:center;color:var(--mu)}
    .lbnm{font-size:13px;font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .lbpts{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--gold);text-align:right;white-space:nowrap}

    .check-section{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:20px 24px;margin-bottom:28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .check-label{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);flex-shrink:0}
    .check-row{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
    .check-input{background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:9px 14px;font-family:'Inter',sans-serif;font-size:13px;color:#fff;outline:none;flex:1;transition:border-color .15s}
    .check-input:focus{border-color:var(--b3)}
    .check-input::placeholder{color:var(--mu)}
    .check-btn{background:#fff;color:#07080c;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:9px 18px;border-radius:8px;border:none;cursor:pointer;white-space:nowrap;transition:opacity .15s;flex-shrink:0}
    .check-btn:hover{opacity:.82}
    .check-result{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--gold);flex-shrink:0}

    

    /* Leaderboard header */
    .lb-header{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:32px;margin-bottom:24px;text-align:center}
    .lb-header-left{display:flex;flex-direction:column;align-items:center;gap:8px}
    .lb-platform-img{height:40px;object-fit:contain}
    .lb-code{font-size:12px;color:var(--mu)}
    .lb-code strong{color:#fff;letter-spacing:.06em}
    .lb-prize-big{text-align:center}
    .lb-prize-amt{font-family:'Barlow Condensed',sans-serif;font-size:80px;font-weight:800;line-height:1}
    .lb-prize-lbl{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);margin-top:2px}
    .lb-meta{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:28px;flex-wrap:wrap}
    .live-badge{display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--ac)}
    .live-dot{width:6px;height:6px;border-radius:50%;background:var(--ac);animation:pu 1.2s ease-in-out infinite}
    .lb-meta-item{font-size:12px;color:var(--mu)}
    .lb-meta-item strong{color:#fff}

    /* Countdown */
    .countdown{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin-top:32px;margin-bottom:40px}
    .countdown-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
    .countdown-lbl{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
    .cd-unit{display:flex;flex-direction:column;align-items:center;min-width:52px}
    .cd-num{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;color:#fff;line-height:1;background:rgba(255,255,255,.05);border:1px solid var(--b2);border-radius:8px;padding:6px 0;width:62px;text-align:center;font-variant-numeric:tabular-nums}
    .cd-label{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-top:5px}
    .cd-sep{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:rgba(255,255,255,.2);padding-bottom:18px}

    /* Podium */
    .lb-podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-bottom:0}
    .podium-card{display:flex;flex-direction:column;align-items:center;padding:36px 28px;border-radius:18px;border:none;background:var(--s1);position:relative;width:268px;transition:transform .2s}
    .podium-card::before{content:'';position:absolute;inset:0;border-radius:18px;padding:1px;background:linear-gradient(to bottom,transparent 0%,rgba(255,255,255,.12) 70%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude;pointer-events:none}
    .podium-card:hover{transform:translateY(-4px)}
    .podium-card.first{background:linear-gradient(180deg,rgba(212,175,90,.06) 0%,var(--s1) 100%);width:300px;padding-bottom:40px}
    .podium-card.first::before{background:linear-gradient(to bottom,transparent 0%,rgba(212,175,90,.9) 65%);padding:2px}
    .podium-card.second::before{background:linear-gradient(to bottom,transparent 0%,rgba(180,190,210,.6) 65%);padding:1px}
    .podium-card.third::before{background:linear-gradient(to bottom,transparent 0%,rgba(160,100,50,.7) 65%);padding:1px}
    .rank-badge{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;color:#000}
    .rank-badge.r1{background:var(--gold);width:38px;height:38px;font-size:19px}
    .rank-badge.r2{background:#c0c0c8}
    .rank-badge.r3{background:#cd7f32;color:#fff}
    .crown{font-size:26px;margin-bottom:8px}
    .pod-avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;background:var(--s2);border:3px solid var(--b2);margin-bottom:16px}
    .pod-avatar.first{width:118px;height:118px;border-color:rgba(212,175,90,.45)}
    .pod-name{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;color:#fff;margin-bottom:18px;text-align:center;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pod-name.first{font-size:26px}
    .pod-stats-row{width:100%;background:rgba(0,0,0,.45);border-radius:8px;overflow:hidden;margin-bottom:6px}
    .pod-stat{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 13px;gap:4px}
    .pod-stat.full{border-top:1px solid rgba(255,255,255,.07)}
    .pod-stat-divider{height:1px;background:rgba(255,255,255,.07)}
    .pod-stat-lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#fff}
    .pod-stat-lbl.muted{color:rgba(255,255,255,.45)}
    .pod-stat-val{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#fff;display:flex;align-items:center;gap:4px}
    .pod-stat-val.muted{color:rgba(255,255,255,.45)}
    .pod-stat-green{color:#22c55e}

    /* Table */
    .lb-table{width:100%;border-collapse:collapse;margin-bottom:32px}
    .lb-table th{font-family:'Inter',sans-serif;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);padding:10px 16px;border-bottom:1px solid var(--b1);text-align:left}
    .lb-table th:last-child{text-align:right}
    .lb-table td{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--tx);vertical-align:middle}
    .lb-table tr:last-child td{border-bottom:none}
    .lb-table tr:hover td{background:rgba(255,255,255,.02)}
    .lb-table td:last-child{text-align:right}
    .tr-rank{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--mu);min-width:36px}
    .tr-av{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--s2)}
    .tr-name{font-weight:600;font-size:13px;color:#fff}
    .tr-wager{font-size:13px;color:#fff}
    .tr-prize{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700}
    .np-mobile{display:none;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:#fff;margin-top:1px}

    /* CTA */
    .lb-cta-row{display:flex;justify-content:center;gap:10px;margin-bottom:48px;flex-wrap:wrap}
    .lb-cta-btn{display:inline-flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:12px 28px;border-radius:9px;text-decoration:none;transition:opacity .15s}
    .lb-cta-btn:hover{opacity:.8}
    .lb-cta-gamba{background:var(--ac);color:#fff}
    .lb-cta-gamba-sec{background:transparent;border:1px solid rgba(74,158,255,.4);color:var(--ac)}
    .lb-cta-gamba-sec:hover{background:rgba(74,158,255,.08);opacity:1}
    .lb-cta-chicken{background:var(--chicken);color:#1a1100}
    .lb-cta-chicken-sec{background:transparent;border:1px solid rgba(242,169,59,.4);color:var(--chicken)}
    .lb-cta-chicken-sec:hover{background:rgba(242,169,59,.08);opacity:1}
    .lb-cta-csgowin{background:#f59e0b;color:#1a0e00}
    .lb-cta-csgowin-sec{background:transparent;border:1px solid rgba(245,158,11,.4);color:#f59e0b}
    .lb-cta-csgowin-sec:hover{background:rgba(245,158,11,.08);opacity:1}
    .lb-coin-icon{height:.75em;width:.75em;object-fit:contain;vertical-align:-0.05em;margin-right:6px;display:inline-block}
    .lb-coin-icon-sm{height:1em;width:1em;object-fit:contain;vertical-align:-0.15em;margin-right:4px;display:inline-block}

    /* Wager race progress bars */
    .race-section{margin-top:8px;margin-bottom:48px}
    .race-winner{background:rgba(242,169,59,.1);border:1px solid rgba(242,169,59,.35);border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px}
    .race-winner-badge{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--chicken)}
    .race-winner-name{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:#fff}
    .race-row{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--b1)}
    .race-row:last-child{border-bottom:none}
    .race-name{width:160px;flex-shrink:0;font-size:13px;font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .race-bar-wrap{flex:1;height:22px;background:var(--s1);border:1px solid var(--b1);border-radius:8px;overflow:hidden}
    .race-bar-fill{height:100%;background:linear-gradient(90deg,#f2a93b,#ffd24a);border-radius:8px;transition:width .4s ease}
    .race-bar-fill-csgowin{height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:8px;transition:width .4s ease}
    .race-amt{width:140px;flex-shrink:0;text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
    .lb-cta-krush{background:var(--krush);color:#fff}
    .lb-cta-cs2skin{background:var(--cs2skin);color:#fff}

    /* Prize structure */
    .prize-section{margin-bottom:48px}
    .prize-title{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);margin-bottom:14px}
    .prize-tiers{display:flex;gap:10px;flex-wrap:wrap}
    .announce-bar{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:10px;padding:12px 20px;margin-bottom:10px;font-size:13px;font-weight:600;letter-spacing:.04em}
    .announce-bar svg{flex-shrink:0}
    .announce-bar.blue{background:rgba(0,178,245,.1);border:1px solid rgba(0,178,245,.3);color:#00b2f5}
    .announce-bar.green{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);color:var(--green)}
    .prize-tier{display:flex;flex-direction:column;align-items:center;background:var(--s1);border:1px solid var(--b2);border-radius:10px;padding:12px 18px;min-width:80px}
    .prize-tier-pos{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:4px}
    .prize-tier-amt{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:#fff}
    .prize-tier-amt.p1{color:var(--gold)}
    .prize-tier-amt.p2{color:#c0c0c8}
    .prize-tier-amt.p3{color:#cd7f32}

    footer{border-top:1px solid var(--b1);padding:22px 0;position:relative;z-index:1}
    .ftw{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .ftd{font-size:11px;color:rgba(221,227,239,.35);line-height:1.6;max-width:520px}
    .ftc{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);white-space:nowrap}

    .loading{text-align:center;padding:60px 0;font-size:13px;color:var(--mu);letter-spacing:.06em}

    /* Leaderboard meta bar */
    .lb-meta-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
    .lb-prev-btn{display:inline-flex;align-items:center;gap:7px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:8px 16px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--b2);color:var(--mu);cursor:pointer;transition:all .15s}
    .lb-prev-btn:hover{background:rgba(255,255,255,.09);border-color:var(--b3);color:#fff}
    .lb-updated{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:rgba(221,227,239,.4);letter-spacing:.04em}

    /* History modal */
    .lb-modal-overlay{position:fixed;inset:0;background:rgba(2,3,8,.75);backdrop-filter:blur(3px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;animation:fu .18s ease both}
    .lb-modal{background:var(--bg);border:1px solid var(--b2);border-radius:16px;width:100%;max-width:880px;max-height:86vh;overflow-y:auto;padding:26px 28px 30px;position:relative}
    .lb-modal-close{position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:8px;border:1px solid var(--b2);background:rgba(255,255,255,.04);color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .lb-modal-close:hover{color:#fff;border-color:var(--b3)}
    .lb-modal-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:.04em;margin-bottom:18px}
    .lb-hist-list{display:flex;flex-direction:column;gap:8px}
    .lb-hist-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-radius:10px;border:1px solid var(--b2);background:var(--s1);cursor:pointer;transition:all .15s;text-align:left}
    .lb-hist-item:hover{border-color:rgba(74,158,255,.4);background:rgba(74,158,255,.06)}
    .lb-hist-label{font-weight:600;color:#fff;font-size:14px;margin-bottom:3px}
    .lb-hist-period{font-size:11px;color:var(--mu)}
    .lb-hist-stats{display:flex;gap:18px;flex-shrink:0}
    .lb-hist-stat{text-align:right}
    .lb-hist-stat-val{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:#fff}
    .lb-hist-stat-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-top:2px}
    .lb-hist-empty{text-align:center;padding:50px 0;color:var(--mu);font-size:13px}
    .lb-back-btn{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);background:none;border:none;cursor:pointer;margin-bottom:18px;padding:0}
    .lb-back-btn:hover{color:#fff}


    
  
/* ---- StorePage ---- */

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#080808;--s1:#0e0e0e;--s2:#131313;--s3:#111828;--b1:rgba(255,255,255,.04);--b2:rgba(255,255,255,.08);--b3:rgba(255,255,255,.14);--tx:#dde3ef;--mu:rgba(221,227,239,.65);--mu2:rgba(221,227,239,.85);--ac:#4a9eff;--rd:#e03535;--gold:#d4af5a}
    html,body{background-color:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
    @keyframes pu{0%,100%{opacity:1}50%{opacity:.15}}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .f1{animation:fu .5s ease both}.f2{animation:fu .5s .1s ease both}.f3{animation:fu .5s .22s ease both}.f4{animation:fu .5s .34s ease both}

    nav{background:rgba(8,8,8,.96);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:50}
    .ni{max-width:1020px;margin:0 auto;padding:0 28px;display:flex;align-items:center;height:68px;gap:0;position:relative}
    .nlogo{display:flex;align-items:center;gap:10px;padding-right:22px;border-right:1px solid var(--b2);margin-right:18px;flex-shrink:0;text-decoration:none}
    .nlogo img{height:28px;width:28px;border-radius:50%;object-fit:cover}
    .nname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.16em;color:#fff;text-transform:uppercase}
    .nlinks{display:flex;align-items:center;position:absolute;left:50%;transform:translateX(-50%)}
    .nlinks a{font-family:'Inter',sans-serif;font-size:14px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:0 13px;height:68px;display:flex;align-items:center;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;margin-bottom:-1px}
    .nlinks a:hover{color:rgba(255,255,255,.9)}
    .nlinks a.on{color:#fff;border-bottom-color:rgba(255,255,255,.5)}
    .nsoc{display:flex;align-items:center;gap:2px;padding-left:16px;border-left:1px solid var(--b2)}

    .drawer a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--b1);transition:color .15s}
    .drawer a:last-of-type{border-bottom:none}
    .drawer a.on,.drawer a:hover{color:#fff}

    .wrap{width:100%;max-width:1020px;margin:0 auto;padding:0 28px;position:relative;z-index:1}

    footer{border-top:1px solid var(--b1);padding:22px 0}
    .ftw{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .ftd{font-size:11px;color:rgba(221,227,239,.35);line-height:1.6;max-width:520px}
    .ftc{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);white-space:nowrap}

    /* ── PAGE ── */
    .phead{padding:44px 0 32px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
    .phead-eyebrow{display:inline-flex;align-items:center;gap:7px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);border:1px solid rgba(184,204,232,.15);padding:4px 12px;border-radius:100px}
    .pdot{width:5px;height:5px;border-radius:50%;background:var(--ac);animation:pu 2s ease-in-out infinite;flex-shrink:0}
    .phead h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(36px,6vw,60px);font-weight:800;letter-spacing:-.01em;text-transform:uppercase;color:#fff;line-height:.92}
    .phead p{font-size:13px;color:var(--mu);max-width:440px;line-height:1.7}

    .card{background:var(--s1);border:1px solid var(--b2);border-radius:14px;padding:24px;margin-bottom:16px}
    .card-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);margin-bottom:18px}

    /* Status badge */
    .badge{display:inline-flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:100px}
    .badge-open{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#22c55e}
    .badge-closed{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);color:#fbbf24}
    .badge-resolved{background:rgba(74,158,255,.1);border:1px solid rgba(74,158,255,.2);color:var(--ac)}
    .badge-dot{width:4px;height:4px;border-radius:50%;background:currentColor;animation:pu 1.2s ease-in-out infinite}

    /* Hunt info */
    .hunt-meta{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:24px;text-align:center}
    .hunt-bal{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;color:#fff;line-height:1}
    .hunt-bal-lbl{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:4px}

    /* Split bar */
    .split-wrap{margin-bottom:20px}
    .split-labels{display:flex;justify-content:space-between;margin-bottom:8px}
    .split-lbl{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
    .split-lbl.profit{color:var(--green)}
    .split-lbl.noprofit{color:var(--red)}
    .split-bar{height:10px;border-radius:99px;background:rgba(239,68,68,.25);overflow:hidden;position:relative}
    .split-fill{height:100%;border-radius:99px;background:var(--green);transition:width .6s ease}
    .split-counts{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--mu)}

    /* Pot stat */
    .pot-stat{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);margin-bottom:4px}
    .pot-val{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:#fff}

    /* Prediction form */
    .side-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    .side-btn{padding:16px 12px;border-radius:10px;border:2px solid var(--b2);background:transparent;cursor:pointer;transition:all .15s;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
    .side-btn:hover{border-color:var(--b3);color:#fff}
    .side-btn.sel-profit{border-color:var(--green);background:rgba(34,197,94,.1);color:var(--green)}
    .side-btn.sel-noprofit{border-color:var(--red);background:rgba(239,68,68,.1);color:var(--red)}
    .wager-row{display:flex;gap:8px;align-items:stretch;margin-bottom:14px}
    .wager-input{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:10px 14px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#fff;outline:none;transition:border-color .15s}
    .wager-input:focus{border-color:var(--ac)}
    .quick-btns{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
    .quick-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--b2);background:transparent;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--mu);cursor:pointer;transition:all .15s}
    .quick-btn:hover{border-color:var(--b3);color:#fff;background:rgba(255,255,255,.04)}
    .submit-btn{width:100%;padding:13px;border-radius:9px;border:none;background:var(--ac);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:opacity .15s}
    .submit-btn:hover:not(:disabled){opacity:.85}
    .submit-btn:disabled{opacity:.4;cursor:not-allowed}
    .submit-btn.green{background:var(--green)}
    .err{font-size:12px;color:var(--red);margin-top:8px;text-align:center}
    .ok{font-size:12px;color:var(--green);margin-top:8px;text-align:center}

    /* My prediction */
    .my-pred{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;text-align:center}
    .my-pred-side{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;text-transform:uppercase}
    .my-pred-side.profit{color:var(--green)}
    .my-pred-side.noprofit{color:var(--red)}
    .my-pred-amt{font-size:13px;color:var(--mu)}
    .my-pred-payout{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;text-align:center}
    .payout-win{color:var(--green)}
    .payout-loss{color:var(--red)}

    /* Admin panel */
    .admin-panel{background:rgba(217,79,79,.04);border:1px solid rgba(217,79,79,.15);border-radius:14px;padding:24px;margin-bottom:16px;text-align:center}
    .admin-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(217,79,79,.8);margin-bottom:18px}
    .admin-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
    .admin-input{width:200px;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:9px 13px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:#fff;outline:none;transition:border-color .15s;text-align:center}
    .admin-input:focus{border-color:var(--ac)}
    .admin-input-lbl{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
    .admin-btn{padding:9px 18px;border-radius:8px;border:none;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:opacity .15s;white-space:nowrap}
    .admin-btn:hover:not(:disabled){opacity:.8}
    .admin-btn:disabled{opacity:.35;cursor:not-allowed}
    .btn-create{background:var(--green);color:#fff}
    .btn-close{background:#fbbf24;color:#000}
    .btn-resolve{background:var(--ac);color:#fff}

    /* Predictions list */
    .pred-list{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
    .pred-list th{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);padding:8px 12px;border-bottom:1px solid var(--b1);text-align:left}
    .pred-list td{padding:9px 12px;border-bottom:1px solid var(--b1);color:var(--tx)}
    .pred-list tr:last-child td{border-bottom:none}
    .pred-list tr.winner-row td{background:rgba(34,197,94,.06)}
    .pred-winner-badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);border-radius:100px;padding:1px 7px;margin-left:6px}

    /* History */
    .hist-table{width:100%;border-collapse:collapse;font-size:13px}
    .hist-table th{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);padding:8px 12px;border-bottom:1px solid var(--b1);text-align:left}
    .hist-table td{padding:10px 12px;border-bottom:1px solid var(--b1);color:var(--tx)}
    .hist-table tr:last-child td{border-bottom:none}
    .hist-result-profit{color:var(--green);font-weight:700;font-family:'Barlow Condensed',sans-serif;font-size:15px}
    .hist-result-noprofit{color:var(--red);font-weight:700;font-family:'Barlow Condensed',sans-serif;font-size:15px}

    .no-hunt{text-align:center;padding:56px 0;color:var(--mu);font-size:13px;letter-spacing:.06em}
    .no-hunt strong{display:block;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:rgba(221,227,239,.4);text-transform:uppercase;margin-bottom:6px}

    .login-prompt{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:22px;text-align:center;margin-bottom:16px}
    .login-prompt p{font-size:13px;color:var(--mu);margin-bottom:14px;line-height:1.6}

    
  
    #constellation{position:fixed;inset:0;z-index:0;pointer-events:none}
  
    
    }}
    
    
  
/* ---- AdminPage ---- */

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#080808;--s1:#0e0e0e;--s2:#131313;--b1:rgba(255,255,255,.04);--b2:rgba(255,255,255,.08);--b3:rgba(255,255,255,.14);--tx:#dde3ef;--mu:rgba(221,227,239,.65);--ac:#4a9eff;--rd:#e03535;--gold:#d4af5a}
    html,body{background-color:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .f1{animation:fu .5s ease both}.f2{animation:fu .5s .1s ease both}
    nav{background:rgba(8,8,8,.96);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:50}

    .nlogo img{height:28px;width:28px;border-radius:50%;object-fit:cover}
    .nname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.16em;color:#fff;text-transform:uppercase}
    .nlinks{display:flex;align-items:center;position:absolute;left:50%;transform:translateX(-50%)}
    .nlinks a{font-family:'Inter',sans-serif;font-size:14px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:0 13px;height:68px;display:flex;align-items:center;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;margin-bottom:-1px}
    .nlinks a:hover{color:rgba(255,255,255,.9)}
    .nlinks a.on{color:#fff;border-bottom-color:rgba(255,255,255,.5)}

    .page-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}

    .stat-card{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:20px 24px}

    .stat-val{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;color:#fff;line-height:1}
    .search-bar{background:var(--s1);border:1px solid var(--b2);border-radius:10px;padding:10px 16px;font-family:'Inter',sans-serif;font-size:13px;color:#fff;outline:none;width:100%;max-width:320px;transition:border-color .15s;margin-bottom:16px}
    .search-bar:focus{border-color:var(--b3)}
    .search-bar::placeholder{color:var(--mu)}
    .table-wrap{background:var(--s1);border:1px solid var(--b2);border-radius:14px;overflow:hidden}
    table{width:100%;border-collapse:collapse}
    thead th{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);padding:14px 20px;text-align:left;border-bottom:1px solid var(--b2);white-space:nowrap}
    tbody tr{border-bottom:1px solid var(--b1);transition:background .1s}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:rgba(255,255,255,.02)}
    tbody td{padding:14px 20px;font-size:13px;vertical-align:middle}
    .user-cell{display:flex;align-items:center;gap:10px}
    .user-kick-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--s2);flex-shrink:0}
    .user-kick-name{font-weight:600;color:#fff}
    .discord-cell{display:flex;align-items:center;gap:8px}
    .discord-mini-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .discord-name{color:rgba(136,145,242,.9);font-size:12px}
    .not-linked{color:var(--mu);font-size:12px;font-style:italic}

    .date-cell{font-size:11px;color:var(--mu)}
    .badge-linked{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:100px;background:rgba(88,101,242,.15);color:#5865F2}
    .badge-unlinked{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:100px;background:rgba(255,255,255,.05);color:var(--mu)}

    .ce-inp{background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:7px 10px;color:#fff;font-size:12px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s}

    .ce-sel{background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:7px 10px;color:#fff;font-size:12px;font-family:'Inter',sans-serif;outline:none;cursor:pointer}
    .ce-lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:5px}
    .ce-table{width:100%;border-collapse:collapse}
    .ce-table th{padding:8px 10px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:left;border-bottom:1px solid var(--b2);white-space:nowrap}

    .ce-table tbody tr:last-child td{border-bottom:none}
    .btn-remove{background:rgba(217,79,79,.12);border:1px solid rgba(217,79,79,.25);color:#d94f4f;border-radius:5px;padding:4px 10px;cursor:pointer;font-size:11px;font-weight:600}

    .btn-save{padding:10px 28px;border-radius:8px;background:#22c55e;color:#fff;border:none;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.06em}
    .btn-save:disabled{opacity:.5;cursor:not-allowed}
    
  
    #constellation{position:fixed;inset:0;z-index:0;pointer-events:none}
  
    
    }}

// ====== ROUTER ======
var RouterCtx = React.createContext({ path: '/', navigate: function(){} });
function usePath(){ return React.useContext(RouterCtx).path; }
function useNavigate(){ return React.useContext(RouterCtx).navigate; }

function RouterProvider({ children }) {
  const [path, setPath] = React.useState(window.location.pathname);
  React.useEffect(function() {
    function h(){ setPath(window.location.pathname); }
    window.addEventListener('popstate', h);
    return function(){ window.removeEventListener('popstate', h); };
  }, []);
  function navigate(to) {
    window.history.pushState({}, '', to);
    setPath(to);
    window.scrollTo(0, 0);
  }
  window.__spaNavigate = navigate;
  return React.createElement(RouterCtx.Provider, { value: { path: path, navigate: navigate } }, children);
}

// ====== SESSION ======
var SessionCtx = React.createContext({ user: null, sessionId: null, loading: true, logout: function(){} });
function useUser(){ return React.useContext(SessionCtx); }

function useSession() {
  const [user, setUser] = React.useState(() => {
    try { const c = localStorage.getItem('kick_user'); return c ? JSON.parse(c) : null; } catch { return null; }
  });
  const [sessionId, setSessionId] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  React.useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const sid = params.get('session') || localStorage.getItem('kick_session');
    if (sid) {
      localStorage.setItem('kick_session', sid);
      setSessionId(sid);
      fetch('/auth/me?session=' + sid)
        .then(r => r.ok ? r.json() : null)
        .then(d => {
          if (d) { setUser(d); localStorage.setItem('kick_user', JSON.stringify(d)); }
          else { localStorage.removeItem('kick_session'); localStorage.removeItem('kick_user'); setUser(null); }
        })
        .catch(() => {})
        .finally(() => setLoading(false));
      if (params.get('session')) window.history.replaceState({}, '', window.location.pathname);
    } else {
      setLoading(false);
    }
  }, []);
  function logout() {
    const sid = localStorage.getItem('kick_session');
    if (sid) fetch('/auth/logout?session=' + sid);
    localStorage.removeItem('kick_session');
    localStorage.removeItem('kick_user');
    setUser(null);
    setSessionId(null);
  }
  return { user, sessionId, loading, logout };
}

function Countdown({ endDate }) {
  const calc = () => {
    const diff = Math.max(0, new Date(endDate) - Date.now());
    return {
      d: Math.floor(diff / 86400000),
      h: Math.floor((diff % 86400000) / 3600000),
      m: Math.floor((diff % 3600000) / 60000),
      s: Math.floor((diff % 60000) / 1000)
    };
  };
  const [t, setT] = React.useState(calc);
  React.useEffect(() => {
    const iv = setInterval(() => setT(calc()), 1000);
    return () => clearInterval(iv);
  }, [endDate]);
  const pad = n => String(n).padStart(2, '0');
  return (
    <div className="countdown">
      <div className="countdown-lbl">Ends in</div>
      <div className="countdown-row">
        {[['d','Days'],['h','Hours'],['m','Mins'],['s','Secs']].map(([k,lbl],i) => (
          <React.Fragment key={k}>
            {i > 0 && <span className="cd-sep">:</span>}
            <div className="cd-unit">
              <div className="cd-num">{pad(t[k])}</div>
              <div className="cd-label">{lbl}</div>
            </div>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

function Amt({ s }) {
  if (!s || s[0] !== '$') return <span>{s}</span>;
  return <><span style={{color:'var(--green)'}}>$</span><span style={{color:'#fff'}}>{s.slice(1)}</span></>;
}

function Avatar({ src, className }) {
  const [err, setErr] = React.useState(false);
  if (err || !src) return <div className={className} style={{background:'#1a2740',borderRadius:'50%'}}/>;
  return <img className={className} src={src} alt="" onError={() => setErr(true)}/>;
}

  const cls = rank === 1 ? 'podium-card first' : rank === 2 ? 'podium-card second' : 'podium-card third';

  return (

function useLastUpdated() {
  const [ts, setTs] = React.useState(null);
  React.useEffect(() => {
    fetch('/lb-meta').then(r => r.json()).then(d => setTs(d.lastUpdated)).catch(() => {});
  }, []);
  if (!ts) return 'Loading...';
  const diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 10) return 'Updated just now';
  if (diff < 60) return `Updated ${diff}s ago`;
  if (diff < 3600) return `Updated ${Math.floor(diff/60)}m ago`;
  return `Updated ${Math.floor(diff/3600)}h ago`;
}

function CsgowinLeaderboard() {

  React.useEffect(() => {
    fetch('/csgowin-leaderboard?limit=10').then(r => r.json()).then(d => setRows(d.leaderboard || [])).catch(() => setRows([]));
    fetch('/csgowin-meta').then(r => r.json()).then(setMeta).catch(() => {});
  }, []);

  const fmtPrize = p => (p.prize > 0 ? Number(p.prize).toLocaleString('en-US') : '-');
  const fmtWager = p => (p.wager > 0 ? Number(p.wager).toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2}) : '-');
  const maskName = name => {
    if (!name || name.length <= 4) return name;
    return name.slice(0,2) + '*'.repeat(name.length - 4) + name.slice(-2);
  };

  if (rows === null) return <div className="loading">Loading...</div>;

  const prizes = (meta && meta.prizes) || [250,125,55,30,17.5,10,7.5,5];
  const displayRows = prizes.map((amt, i) => {
    const existing = rows.find(r => r.position === i + 1);
    if (existing) return { ...existing, username: maskName(existing.username) };
    return { position: i + 1, username: 'No active player yet', avatar: null, wager: 0, prize: amt, placeholder: true };
  });

  const top3 = displayRows.slice(0, 3);
  const rest = displayRows.slice(3);
  const podiumOrder = top3.length >= 3 ? [top3[1], top3[0], top3[2]] : top3;

      </div>

        <div className="lb-podium">
          {podiumOrder.map((p, i) => {

function AdminPanel({ sessionId, hunt, onRefresh }) {
  const [startBal, setStartBal] = React.useState('');
  const [endBal, setEndBal] = React.useState('');
  const [msg, setMsg] = React.useState('');
  const [busy, setBusy] = React.useState(false);

  const headers = { 'Content-Type': 'application/json', 'x-session-id': sessionId };

  const create = async () => {
    if (!startBal) return;
    setBusy(true); setMsg('');
    const r = await fetch('/predictor/create', { method:'POST', headers, body: JSON.stringify({ startingBalance: Number(startBal.replace(/,/g,'')) }) }).then(x=>x.json());
    setBusy(false);
    setMsg(r.ok ? 'Hunt created - predictions open!' : (r.error || 'Error'));
    if (r.ok) { setStartBal(''); onRefresh(); }
  };
  const close = async () => {
    setBusy(true); setMsg('');
    const r = await fetch('/predictor/close', { method:'POST', headers, body: '{}' }).then(x=>x.json());
    setBusy(false);
    setMsg(r.ok ? 'Predictions closed.' : (r.error || 'Error'));
    if (r.ok) onRefresh();
  };
  const cancel = async () => {
    if (!confirm('Cancel this hunt? All wagers will be refunded.')) return;
    setBusy(true); setMsg('');
    const r = await fetch('/predictor/cancel', { method:'POST', headers, body: '{}' }).then(x=>x.json());
    setBusy(false);
    setMsg(r.ok ? `Hunt cancelled - ${r.refundCount} wager(s) refunded.` : (r.error || 'Error'));
    if (r.ok) onRefresh();
  };
  const resolve = async () => {
    if (!endBal) return;
    setBusy(true); setMsg('');
    const r = await fetch('/predictor/resolve', { method:'POST', headers, body: JSON.stringify({ endingBalance: Number(endBal.replace(/,/g,'')) }) }).then(x=>x.json());
    setBusy(false);
    setMsg(r.ok ? `Resolved! Ending: $${Number(r.endingBalance).toLocaleString()} - Pot: ${r.totalPot?.toLocaleString()} NP - Winners: ${r.winnerCount}` : (r.error || 'Error'));
    if (r.ok) { setEndBal(''); onRefresh(); }
  };

  return (
    <div className="admin-panel">
      <div className="admin-title">Admin Controls</div>
      {(!hunt || hunt.status === 'resolved') && (
        <div>
          <div className="admin-input-lbl">Starting Balance ($)</div>
          <div className="admin-row">
            <input className="admin-input" value={startBal} onChange={e=>setStartBal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&create()} disabled={busy}/>
            <button className="admin-btn btn-create" onClick={create} disabled={busy||!startBal}>Create Hunt</button>
          </div>
        </div>
      )}
      {hunt && hunt.status === 'open' && (
        <div className="admin-row">
          <button className="admin-btn btn-close" onClick={close} disabled={busy}>Lock Predictions</button>
        </div>
      )}
      {hunt && (hunt.status === 'open' || hunt.status === 'closed') && (
        <div style={{marginTop:14}}>
          <div className="admin-input-lbl">Ending Balance in $ (resolves hunt)</div>
          <div className="admin-row">
            <input className="admin-input" value={endBal} onChange={e=>setEndBal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&resolve()} disabled={busy}/>
            <button className="admin-btn btn-resolve" onClick={resolve} disabled={busy||!endBal}>Resolve</button>
          </div>
        </div>
      )}
      {hunt && (hunt.status === 'open' || hunt.status === 'closed') && (
        <div className="admin-row" style={{marginTop:14}}>
          <button className="admin-btn" style={{background:'rgba(217,79,79,.15)',border:'1px solid rgba(217,79,79,.3)',color:'rgba(217,79,79,.9)'}} onClick={cancel} disabled={busy}>Cancel Hunt &amp; Refund</button>
        </div>
      )}
      {msg && <div style={{marginTop:12,fontSize:12,color:'var(--mu)'}}>{msg}</div>}
    </div>
  );
}

function PredictForm({ user, sessionId, hunt, onDone }) {
  const [guess, setGuess] = React.useState('');
  const [wager, setWager] = React.useState('');
  const [err, setErr] = React.useState('');
  const [ok, setOk] = React.useState('');
  const [busy, setBusy] = React.useState(false);

  const quicks = [5, 10, 20, 25, 50];

  const submit = async () => {
    setErr(''); setOk('');
    const g = Math.floor(Number(guess));
    if (!g || g < 1) { setErr('Enter a valid ending balance guess ($).'); return; }
    const w = Math.floor(Number(wager));
    if (!w || w < 1) { setErr('Enter a valid wager amount.'); return; }
    setBusy(true);
    const r = await fetch('/predictor/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-session-id': sessionId },
      body: JSON.stringify({ guess: g, wager: w })
    }).then(x => x.json());
    setBusy(false);
    if (r.ok) {
      setOk(`Locked in! Guessed $${g.toLocaleString()} with ${w.toLocaleString()} NP. Balance: ${r.newBalance.toLocaleString()} NP`);
      onDone();
    } else { setErr(r.error || 'Something went wrong.'); }
  };

  return (
    <div className="card f2">
      <div className="card-title">Place Your Prediction</div>
      <div style={{marginBottom:16}}>
        <div className="admin-input-lbl" style={{marginBottom:8}}>Your Guess - Ending Balance ($)</div>
        <div className="wager-row">
          <input
            className="wager-input"
            style={{textAlign:'center'}}
            value={guess}
            onChange={e => setGuess(e.target.value.replace(/[^0-9]/g,''))}
            onKeyDown={e => e.key==='Enter' && submit()}
            disabled={busy}
          />
        </div>
        {guess && Number(guess) > 0 && <div style={{fontSize:11,color:'var(--mu)',textAlign:'center',marginTop:4}}>Starting balance: ${hunt?.startingBalance?.toLocaleString()}</div>}
      </div>
      <div style={{marginBottom:16}}>
        <div className="admin-input-lbl" style={{marginBottom:8}}>Wager (NP) - win and get 2x back</div>
        <div className="quick-btns">
          {quicks.map(q => (
            <button key={q} className="quick-btn" onClick={() => setWager(String(Math.min(q, user?.points||0)))}>{q}</button>
          ))}
          <button className="quick-btn" onClick={() => setWager(String(user?.points||0))}>All In</button>
        </div>
        <div className="wager-row">
          <input
            className="wager-input"
            style={{textAlign:'center'}}
            value={wager}
            onChange={e => setWager(e.target.value.replace(/[^0-9]/g,''))}
            onKeyDown={e => e.key==='Enter' && submit()}
            disabled={busy}
          />
        </div>
        {wager && Number(wager) > 0 && <div style={{fontSize:11,color:'var(--mu)',textAlign:'center',marginTop:4}}>Balance: {(user?.points||0).toLocaleString()} NP - after wager: {Math.max(0,(user?.points||0)-Number(wager)).toLocaleString()} NP</div>}
      </div>
      <button className="submit-btn" onClick={submit} disabled={busy||!guess||!wager}>
        {busy ? 'Locking in...' : 'Lock In Prediction'}
      </button>
      {err && <div className="err">{err}</div>}
      {ok && <div className="ok">{ok}</div>}
    </div>
  );
}

  function CasesEditor({sessionId}){
    const [cases,setCases]=React.useState(null);
    const [activeIdx,setActiveIdx]=React.useState(0);
    const [saving,setSaving]=React.useState(false);
    const [msg,setMsg]=React.useState('');

    function injectPcts(d){
      d.forEach(cas=>{
        // Main pool: _pct = within-pool %
        const mainTW=(cas.items||[]).reduce((s,i)=>s+Number(i.weight||0),0);
        (cas.items||[]).forEach(item=>{item._pct=mainTW>0?parseFloat((item.weight/mainTW*100).toFixed(2)):0;});
        // Golden pool: _pct = OVERALL probability (golden_trigger_pct * within_pool_pct)
        const goldenTriggerPct=mainTW>0?(cas.items||[]).filter(i=>i.isGolden).reduce((s,i)=>s+i.weight,0)/mainTW*100:5;
        const goldenTW=(cas.goldenItems||[]).reduce((s,i)=>s+Number(i.weight||0),0);
        (cas.goldenItems||[]).forEach(item=>{
          item._pct=goldenTW>0?parseFloat(((item.weight/goldenTW)*goldenTriggerPct).toFixed(4)):0;
        });
      });
      return d;
    }

    React.useEffect(()=>{
      fetch('/admin/cases',{headers:{'x-session-id':sessionId}})
        .then(r=>r.json())
        .then(d=>{if(Array.isArray(d))setCases(injectPcts(JSON.parse(JSON.stringify(d))));});
    },[sessionId]);

    function setField(cIdx,field,val){
      setCases(prev=>{const n=JSON.parse(JSON.stringify(prev));n[cIdx][field]=val;return n;});
    }
    function setItem(cIdx,pool,iIdx,field,val){
      setCases(prev=>{const n=JSON.parse(JSON.stringify(prev));n[cIdx][pool][iIdx][field]=val;return n;});
    }
    function addItem(cIdx,pool){
      setCases(prev=>{const n=JSON.parse(JSON.stringify(prev));n[cIdx][pool].push({name:'New Item',points:0,weight:10,rarity:'bust',_pct:0});return n;});
    }
    function removeItem(cIdx,pool,iIdx){
      setCases(prev=>{const n=JSON.parse(JSON.stringify(prev));n[cIdx][pool].splice(iIdx,1);return n;});
    }
    function moveItem(cIdx,pool,fromIdx,toIdx){
      setCases(prev=>{
        const n=JSON.parse(JSON.stringify(prev));
        const arr=n[cIdx][pool];
        if(toIdx<0||toIdx>=arr.length)return n;
        const tmp=arr[fromIdx];arr[fromIdx]=arr[toIdx];arr[toIdx]=tmp;
        return n;
      });
    }

    async function save(){
      setSaving(true);setMsg('');
      try{
        // Convert _pct → weight, strip _pct before sending
        const cleaned=JSON.parse(JSON.stringify(cases));
        cleaned.forEach(cas=>{
          // Main pool: weights from within-pool %
          if(cas.items){
            const sum=cas.items.reduce((s,i)=>s+Number(i._pct||0),0);
            cas.items.forEach(item=>{item.weight=sum>0?Math.round(Number(item._pct||0)/sum*1000):item.weight;delete item._pct;});
          }
          // Golden pool: overall % back to within-pool weight
          if(cas.goldenItems&&cas.goldenItems.length){
            const mainTW=(cas.items||[]).reduce((s,i)=>s+i.weight,0);
            const goldenTriggerPct=mainTW>0?(cas.items||[]).filter(i=>i.isGolden).reduce((s,i)=>s+i.weight,0)/mainTW*100:5;
            const sumOverall=cas.goldenItems.reduce((s,i)=>s+Number(i._pct||0),0);
            cas.goldenItems.forEach(item=>{
              const withinPool=sumOverall>0?Number(item._pct||0)/sumOverall:0;
              item.weight=Math.round(withinPool*1000);
              delete item._pct;
            });
          }
        });
        const r=await fetch('/admin/cases',{method:'POST',headers:{'Content-Type':'application/json','x-session-id':sessionId},body:JSON.stringify({cases:cleaned,session:sessionId})});
        const d=await r.json();
        if(r.ok){setCases(injectPcts(JSON.parse(JSON.stringify(cleaned))));}
        setMsg(r.ok?'✓ Saved':d.error||'Error');
      }catch(e){setMsg('Network error');}
      setSaving(false);
      setTimeout(()=>setMsg(''),3000);
    }

    if(!cases)return <div style={{padding:'40px 0',textAlign:'center',color:'var(--mu)'}}>Loading cases...</div>;
    const c=cases[activeIdx];

    return(
      <div className="f2">
        {/* Case selector tabs */}
        <div style={{display:'flex',gap:8,marginBottom:24,flexWrap:'wrap'}}>
          {cases.map((cas,i)=>{
            const t=CASE_THEMES[cas.id]||CASE_THEMES.starter;
            return(
              <button key={i} onClick={()=>setActiveIdx(i)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,padding:'12px 20px',borderRadius:10,border:'1px solid',borderColor:activeIdx===i?t.accent:'var(--b2)',background:activeIdx===i?`rgba(${t.accent.replace(/[^,\d]/g,'').slice(0,-1)},.08)`:'transparent',cursor:'pointer',transition:'all .15s'}}>
                <CaseGraphic id={cas.id} size={60}/>
                <span style={{fontSize:12,fontWeight:700,color:activeIdx===i?'#fff':'var(--mu)',letterSpacing:'.06em',textTransform:'uppercase'}}>{cas.name}</span>
              </button>
            );
          })}
        </div>

        {/* Case header fields */}
        <div style={{background:'var(--s1)',border:'1px solid var(--b2)',borderRadius:12,padding:'20px',marginBottom:24}}>
          <div style={{display:'flex',gap:16,flexWrap:'wrap',alignItems:'flex-end'}}>
            <div><div className="ce-lbl">Case Name</div><input className="ce-inp" value={c.name} onChange={e=>setField(activeIdx,'name',e.target.value)} style={{width:180}}/></div>
            <div><div className="ce-lbl">Cost (NP)</div><input className="ce-inp" type="number" value={c.cost} onChange={e=>setField(activeIdx,'cost',Number(e.target.value))} style={{width:100}}/></div>
            <div><div className="ce-lbl">Emoji</div><input className="ce-inp" value={c.emoji||''} onChange={e=>setField(activeIdx,'emoji',e.target.value)} style={{width:60}}/></div>
          </div>
        </div>

        {/* Item tables */}
        <div style={{background:'var(--s1)',border:'1px solid var(--b2)',borderRadius:12,padding:'20px',marginBottom:24}}>
          <ItemsTable items={c.items} pool="items" showIsGolden={true} showStoreItem={false}
            onUpdate={(i,f,v)=>setItem(activeIdx,'items',i,f,v)}
            onAdd={()=>addItem(activeIdx,'items')}
            onRemove={i=>removeItem(activeIdx,'items',i)}
            onMove={(f,t)=>moveItem(activeIdx,'items',f,t)}/>
          {(c.goldenItems&&c.goldenItems.length>0)&&(()=>{
            const mainTW=(c.items||[]).reduce((s,i)=>s+Number(i.weight||0),0);
            const goldenTriggerPct=mainTW>0?(c.items||[]).filter(i=>i.isGolden).reduce((s,i)=>s+Number(i.weight||0),0)/mainTW*100:5;
            return<ItemsTable items={c.goldenItems} pool="goldenItems" showIsGolden={false} showStoreItem={true}
              goldenTriggerPct={goldenTriggerPct}
              onUpdate={(i,f,v)=>setItem(activeIdx,'goldenItems',i,f,v)}
              onAdd={()=>addItem(activeIdx,'goldenItems')}
              onRemove={i=>removeItem(activeIdx,'goldenItems',i)}
              onMove={(f,t)=>moveItem(activeIdx,'goldenItems',f,t)}/>;
          })()}
        </div>

        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <button className="btn-save" onClick={save} disabled={saving}>{saving?'Saving...':'Save All Cases'}</button>
          {msg&&<span style={{fontSize:13,color:msg.includes('✓')?'#22c55e':'#ef4444'}}>{msg}</span>}
        </div>
      </div>
    );
  }

  function PointsManager({sessionId}){
    const [username,setUsername]=React.useState('');
    const [amount,setAmount]=React.useState('');
    const [action,setAction]=React.useState('add');
    const [msg,setMsg]=React.useState('');
    const [err,setErr]=React.useState('');
    const [loading,setLoading]=React.useState(false);

    async function submit(){
      if(!username.trim()||!amount.trim())return;
      setLoading(true);setMsg('');setErr('');
      try{
        const r=await fetch('/admin/points',{
          method:'POST',
          headers:{'Content-Type':'application/json','x-session-id':sessionId},
          body:JSON.stringify({username:username.trim().toLowerCase(),amount:Number(amount),action,session:sessionId})
        });
        const d=await r.json();
        if(!r.ok){setErr(d.error||'Error');}
        else{setMsg(`${action==='add'?'Added':'Removed'} ${amount} NP - ${d.username} now has ${d.newBalance.toLocaleString()} NP`);}
      }catch{setErr('Connection error');}
      setLoading(false);
    }

    return(
      <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          <label style={{fontSize:11,color:'var(--mu)',letterSpacing:'.1em',textTransform:'uppercase'}}>Username (Kick)</label>
          <input className="search-bar" style={{marginBottom:0,width:200}} placeholder="" value={username} onChange={e=>setUsername(e.target.value)} autoComplete="nope"/>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          <label style={{fontSize:11,color:'var(--mu)',letterSpacing:'.1em',textTransform:'uppercase'}}>Amount</label>
          <input className="search-bar" style={{marginBottom:0,width:120}} type="number" min="1" placeholder="" value={amount} onChange={e=>setAmount(e.target.value)} autoComplete="nope"/>
        </div>
        <div style={{display:'flex',gap:8}}>
          {['add','remove','set'].map(a=>(
            <button key={a} onClick={()=>setAction(a)} style={{padding:'10px 16px',borderRadius:8,border:`1px solid ${action===a?'rgba(255,255,255,.3)':'rgba(255,255,255,.1)'}`,background:action===a?'rgba(255,255,255,.12)':'rgba(255,255,255,.04)',color:action===a?'#fff':'var(--mu)',cursor:'pointer',fontSize:12,fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',transition:'all .15s'}}>
              {a}
            </button>
          ))}
        </div>
        <button onClick={submit} disabled={loading||!username||!amount} style={{padding:'10px 24px',borderRadius:8,border:'none',background:'#22c55e',color:'#fff',cursor:'pointer',fontSize:13,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',opacity:loading||!username||!amount?0.4:1}}>
          {loading?'...':'Apply'}
        </button>
        {msg&&<div style={{fontSize:12,color:'#22c55e',marginTop:4,width:'100%'}}>{msg}</div>}
        {err&&<div style={{fontSize:12,color:'var(--rd)',marginTop:4,width:'100%'}}>{err}</div>}
      </div>
    );
  }
