<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIKSI CHANCER LEADERBOARD</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-[#0f172a] text-white min-h-screen flex flex-col">
  <div id="root" class="flex-grow"></div>

  <script type="text/babel">
    function App() {
      const [players, setPlayers] = React.useState([]);
      const [timeLeft, setTimeLeft] = React.useState("");
      const [displayAmount, setDisplayAmount] = React.useState(0);

      const customPrizes = {
        1: 1000,
        2: 400,
        3: 300,
        4: 120,
        5: 80,
        6: 60,
        7: 40,
      };

      const normalizeIncoming = (payload) => {
        if (Array.isArray(payload)) return payload;
        if (payload && Array.isArray(payload.rows)) return payload.rows;
        if (payload && Array.isArray(payload.leaderboard)) return payload.leaderboard;
        if (payload && Array.isArray(payload.data)) return payload.data;
        if (payload && Array.isArray(payload.results)) return payload.results;
        return [];
      };

      const formatMoney = (value, wholeOnly = false) => {
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          maximumFractionDigits: wholeOnly ? 0 : 2,
        }).format(Number(value) || 0);
      };

      const raceEnd = React.useMemo(() => new Date("2026-05-13T14:00:00Z"), []);

      React.useEffect(() => {
        const startTime = Date.now();
        const duration = 1500;
        const endAmount = 2000;

        const timer = setInterval(() => {
          const now = Date.now();
          const progress = Math.min((now - startTime) / duration, 1);
          setDisplayAmount(Math.floor(progress * endAmount));

          if (progress >= 1) {
            clearInterval(timer);
          }
        }, 16);

        return () => clearInterval(timer);
      }, []);

      React.useEffect(() => {
        const updateTimer = () => {
          const now = Date.now();
          const diff = raceEnd.getTime() - now;

          if (diff <= 0) {
            setTimeLeft("Race Ended");
            return;
          }

          const d = Math.floor(diff / (1000 * 60 * 60 * 24));
          const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const m = Math.floor((diff / (1000 * 60)) % 60);
          const s = Math.floor((diff / 1000) % 60);

          const dd = String(d).padStart(2, "0");
          const hh = String(h).padStart(2, "0");
          const mm = String(m).padStart(2, "0");
          const ss = String(s).padStart(2, "0");

          setTimeLeft(`${dd}:${hh}:${mm}:${ss}`);
        };

        updateTimer();
        const timer = setInterval(updateTimer, 1000);
        return () => clearInterval(timer);
      }, [raceEnd]);

      const fetchPlayers = async () => {
        try {
          const res = await fetch("/chancer-players");
          if (!res.ok) throw new Error("Failed to fetch players");
      
          const data = await res.json();
          console.log("CHANCER FRONTEND DATA:", data);
      
          setPlayers(
            Array.isArray(data?.normalized) ? data.normalized : normalizeIncoming(data)
          );
        } catch (err) {
          console.error("Chancer fetch error:", err);
          setPlayers([]);
        }
      };

      React.useEffect(() => {
        fetchPlayers();
        const interval = setInterval(fetchPlayers, 10000);
        return () => clearInterval(interval);
      }, []);

      const seededPlayers = React.useMemo(() => {
        const byPosition = {};
        const safePlayers = Array.isArray(players) ? players : [];

        safePlayers.forEach((p) => {
          const position = Number(p.position);
          if (!isNaN(position)) {
            byPosition[position] = p;
          }
        });

        return Array.from({ length: 7 }, (_, idx) => {
          const position = idx + 1;
          const player = byPosition[position] || {};

          return {
            id: player.id || `placeholder-${position}`,
            username: player.username || `Player #${position}`,
            wager: Number(player.wager || 0),
            position: position,
            avatar: player.avatar || `https://api.dicebear.com/7.x/big-ears/svg?seed=${player.id || position}`
          };
        });
      }, [players]);

      const topThree = seededPlayers.slice(0, 3);

      const podiumOrder = [
        { player: topThree[1], rank: 2 },
        { player: topThree[0], rank: 1 },
        { player: topThree[2], rank: 3 },
      ].filter((item) => item.player);

      const restPlayers = seededPlayers.slice(3, 7);

      return (
        <div>
          <div className="fixed top-0 left-0 w-full z-50 flex justify-center py-4">
            <div className="flex items-center gap-8 px-8 py-3 bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.5)]">
              <a href="/" className="flex items-center">
                <img
                  src="/assets/niksi.png"
                  alt="Niksi logo"
                  className="h-8 object-contain opacity-90 hover:opacity-100 transition"
                />
              </a>

              <a href="/" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
                HOME
              </a>

              <a href="/leaderboards.html" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
                LEADERBOARDS
              </a>

              <a href="/giveaway.html" className="text-sm font-medium tracking-wide text-white/70 hover:text-white transition">
                GIVEAWAY
              </a>

              <div className="flex items-center gap-4 ml-2">
                <a
                  href="https://kick.com/niksi777"
                  target="_blank"
                  rel="noreferrer"
                  className="hover:scale-110 transition duration-300"
                >
                  <img
                    src="https://cdn.simpleicons.org/kick/22c55e"
                    alt="Kick"
                    className="h-5 opacity-70 hover:opacity-100"
                  />
                </a>

                <a
                  href="https://discord.com/invite/Gnyv25SHg7"
                  target="_blank"
                  rel="noreferrer"
                  className="hover:scale-110 transition duration-300"
                >
                  <img
                    src="https://cdn.simpleicons.org/discord/5865F2"
                    alt="Discord"
                    className="h-5 opacity-70 hover:opacity-100"
                  />
                </a>

                <a
                  href="https://x.com/code_niksi777"
                  target="_blank"
                  rel="noreferrer"
                  className="hover:scale-110 transition duration-300"
                >
                  <img
                    src="https://cdn.simpleicons.org/x/ffffff"
                    alt="X"
                    className="h-5 opacity-70 hover:opacity-100"
                  />
                </a>
              </div>
            </div>
          </div>

          <div className="max-w-5xl mx-auto px-6 pt-28 pb-10">
            <div className="bg-[#111827] border border-white/10 rounded-3xl p-10 shadow-2xl relative">
              <div className="text-center mb-8">
                <div className="text-3xl md:text-4xl font-black tracking-widest text-yellow-400">
                  $2,000 CHANCER LEADERBOARD
                </div>
              </div>

              <div className="absolute top-5 left-5">
                <a
                  href="https://go.chancer.bet/visit/?bta=35694&nci=5350"
                  target="_blank"
                  rel="noreferrer"
                  className="bg-yellow-400 text-black px-4 py-2 rounded-xl text-sm"
                >
                  Sign Up
                </a>
              </div>

              <div className="mb-10 text-center">
                <div className="text-sm text-gray-400 tracking-widest mb-2">
                  TOTAL PRIZE POOL
                </div>

                <div className="text-5xl font-bold text-yellow-400 font-mono">
                  ${displayAmount.toLocaleString("en-US")}
                </div>
              </div>

              <div className="grid md:grid-cols-3 gap-4 mb-10 items-end">
                {podiumOrder.map(({ player, rank }) => {
                  const isFirst = rank === 1;

                  const glow =
                    rank === 1
                      ? "border-yellow-400/70 shadow-[0_0_30px_rgba(250,204,21,0.30)]"
                      : rank === 2
                      ? "border-amber-300/45 shadow-[0_0_24px_rgba(252,211,77,0.22)]"
                      : "border-yellow-200/35 shadow-[0_0_22px_rgba(254,240,138,0.18)]";

                  return (
                    <div
                      key={player.id}
                      className={`bg-black/25 border rounded-2xl p-4 ${glow} ${
                        isFirst ? "md:scale-[1.06] z-10" : "md:scale-[0.95]"
                      }`}
                    >
                      <div
                        className={`text-center font-black italic text-yellow-400 mb-3 ${
                          isFirst ? "text-4xl" : "text-3xl"
                        }`}
                      >
                        #{rank}
                      </div>

                      <img
                        src={player.avatar}
                        alt={player.username}
                        className={`${
                          isFirst ? "w-20 h-20" : "w-16 h-16"
                        } rounded-2xl mx-auto object-cover border border-white/20 mb-3`}
                      />

                      <div
                        className={`text-center font-bold tracking-wide truncate mb-3 ${
                          isFirst ? "text-base" : "text-sm"
                        }`}
                      >
                        {player.username}
                      </div>

                      <div className="rounded-xl bg-white/5 border border-white/10 p-3 text-center mb-2">
                        <div className="text-[10px] tracking-[0.2em] text-gray-400 mb-1">
                          WAGERED
                        </div>
                        <div className={`${isFirst ? "text-lg" : "text-base"} font-semibold`}>
                          {formatMoney(player.wager)}
                        </div>
                      </div>

                      <div className="rounded-xl bg-white/5 border border-white/10 p-3 text-center">
                        <div className="text-[10px] tracking-[0.2em] text-gray-500 mb-1">
                          PRIZE
                        </div>
                        <div className={`${isFirst ? "text-2xl" : "text-xl"} font-black text-yellow-400`}>
                          {formatMoney(customPrizes[rank] || 0, true)}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="mb-8 rounded-2xl bg-black/20 border border-white/10 p-4 text-center">
  <div className="text-xs tracking-[0.2em] text-gray-400 mb-1">ENDS IN</div>

  <div className="text-3xl font-black text-yellow-400 font-mono">
    {timeLeft}
  </div>

  <div className="mt-3 flex items-center justify-center">
    <div className="relative group">
      <div className="w-6 h-6 rounded-full border border-white/20 bg-white/5 text-white/80 text-sm font-bold flex items-center justify-center cursor-default select-none">
        i
      </div>

      <div className="absolute left-1/2 -translate-x-1/2 mt-3 w-80 max-w-[90vw] rounded-xl border border-white/10 bg-[#0b1220] px-4 py-3 text-xs text-gray-200 leading-relaxed shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition duration-200 z-50">
        Wager abuse is NOT allowed for this leaderboard and your prize will be forfeited!
        To claim your prize, you will need to DEPOSIT your receiving prize by 3x in order to claim it: Example, you're set to win $100, you will need to have a total deposit of $300
      </div>
    </div>
  </div>
</div>

              <div className="space-y-3">
                <div className="grid grid-cols-3 text-gray-400 text-sm border-b border-white/10 pb-3">
                  <div>USER</div>
                  <div className="text-center">WAGERED</div>
                  <div className="text-right">PRIZE</div>
                </div>

                {restPlayers.map((p, idx) => (
                  <div
                    key={p.id}
                    className="grid grid-cols-3 items-center bg-black/20 border border-white/10 rounded-xl px-5 py-4"
                  >
                    <div className="flex items-center gap-3 min-w-0">
                      <div className="text-yellow-400 font-bold w-7 shrink-0">
                        #{idx + 4}
                      </div>

                      <img
                        src={p.avatar}
                        alt={p.username}
                        className="w-8 h-8 rounded-full object-cover border border-white/20 shrink-0"
                      />

                      <span className="truncate font-semibold">{p.username}</span>
                    </div>

                    <div className="text-center text-gray-200">
                      {formatMoney(p.wager)}
                    </div>

                    <div className="text-right text-yellow-400 font-bold">
                      {formatMoney(customPrizes[idx + 4] || 0, true)}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="border-t border-white/10 py-6 text-center px-6">
            <div className="max-w-4xl mx-auto mb-6 bg-[#062f2f]/60 border border-green-400/20 rounded-xl px-6 py-3 text-xs text-gray-300 flex items-center gap-4">
              <div className="text-green-400 text-lg">18+</div>

              <div className="text-left leading-relaxed">
                We are not responsible for any losses incurred from gambling on casino or betting
                platforms that may be linked or promoted on this website. All users participate at
                their own risk and are solely responsible for their actions and bets.
              </div>
            </div>

            <div className="text-gray-400 text-xs">
              © 2026 NIKSI777. All Rights Reserved.
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
