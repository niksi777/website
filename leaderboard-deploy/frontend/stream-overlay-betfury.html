<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:1920px;height:1080px;overflow:hidden;
      background:transparent;font-family:'Inter',sans-serif;
    }

    /* ── TOP BAR ──────────────────────────────── */
    .topbar{
      position:fixed;top:0;left:0;right:0;height:54px;
      background:#07050e;
      z-index:30;display:flex;align-items:center;
    }
    .topbar::after{
      content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,
        transparent 0%,#7c3aed 20%,#ec4899 50%,#06b6d4 80%,transparent 100%);
    }

    .tb-left{flex:1;display:flex;align-items:center;gap:14px;padding:0 26px}
    .tb-center{
      position:absolute;left:50%;transform:translateX(-50%);
      display:flex;align-items:center;gap:18px;
    }
    .tb-right{flex:1}

    .live-badge{
      display:flex;align-items:center;gap:7px;
      background:rgba(124,58,237,0.15);
      border:1px solid rgba(124,58,237,0.45);
      border-radius:100px;padding:5px 14px;flex-shrink:0;
    }
    .live-dot{
      width:7px;height:7px;border-radius:50%;background:#7c3aed;
      box-shadow:0 0 6px rgba(124,58,237,1),0 0 14px rgba(124,58,237,0.6);
      animation:blink 1.4s ease-in-out infinite;flex-shrink:0;
    }
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
    .live-txt{font-size:11px;font-weight:700;letter-spacing:.18em;color:#c4b5fd;text-transform:uppercase}

    .tb-sep{width:1px;height:26px;background:rgba(124,58,237,0.3);flex-shrink:0}
    .tb-soc{display:flex;align-items:center;gap:8px}
    .tb-soc svg{width:15px;height:15px;flex-shrink:0}
    .tb-soc span{font-size:13px;font-weight:500;color:rgba(196,181,253,0.72);letter-spacing:.02em;white-space:nowrap}
    .tb-logo{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(124,58,237,0.6))}

    /* ── LEFT EDGE ─────────────────────────────── */
    .edge-left{
      position:fixed;top:54px;left:0;width:6px;height:896px;
      background:#07050e;
      border-right:1px solid rgba(124,58,237,0.22);
      z-index:10;
    }

    /* ── SIDEBAR ───────────────────────────────── */
    .sidebar{
      position:fixed;top:54px;right:0;
      width:390px;height:896px;
      background:#07050e;
      z-index:20;display:flex;flex-direction:column;overflow:hidden;
    }
    .sidebar::before{
      content:'';position:absolute;top:0;left:0;bottom:0;width:1px;
      background:linear-gradient(to bottom,
        transparent 0%,#7c3aed 15%,#ec4899 50%,#06b6d4 85%,transparent 100%);
      pointer-events:none;
    }
    .sidebar::after{
      content:'';position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(ellipse 300px 400px at 100% 50%, rgba(124,58,237,0.05) 0%, transparent 70%);
    }

    .brk{position:absolute;width:16px;height:16px}
    .brk.tl{top:12px;left:12px;border-top:2px solid rgba(124,58,237,0.6);border-left:2px solid rgba(124,58,237,0.6)}
    .brk.tr{top:12px;right:12px;border-top:2px solid rgba(124,58,237,0.6);border-right:2px solid rgba(124,58,237,0.6)}
    .brk.bl{bottom:12px;left:12px;border-bottom:2px solid rgba(6,182,212,0.5);border-left:2px solid rgba(6,182,212,0.5)}
    .brk.br{bottom:12px;right:12px;border-bottom:2px solid rgba(6,182,212,0.5);border-right:2px solid rgba(6,182,212,0.5)}

    .panel-hdr{
      display:flex;align-items:center;justify-content:center;gap:6px;
      padding:5px 12px;flex-shrink:0;
      border-bottom:1px solid rgba(124,58,237,0.18);
      background:linear-gradient(to right,transparent,rgba(124,58,237,0.07),transparent);
    }
    .panel-dot{width:4px;height:4px;border-radius:50%;background:#7c3aed;box-shadow:0 0 5px rgba(124,58,237,0.9);flex-shrink:0}
    .panel-lbl{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(196,181,253,0.5)}

    .chat-body{flex:1;background:transparent}

    canvas.bg-canvas{
      position:absolute;inset:0;width:100%;height:100%;
      pointer-events:none;z-index:0;
    }
    .panel-hdr,.brk,.chat-body,.bottom-inner{position:relative;z-index:1}

    /* ── BOTTOM STRIP ──────────────────────────── */
    .bottom{
      position:fixed;bottom:0;left:0;right:0;height:130px;
      background:#07050e;
      z-index:20;display:flex;align-items:center;
    }
    .bottom::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,
        transparent 0%,#7c3aed 20%,#ec4899 50%,#06b6d4 80%,transparent 100%);
    }

    .bottom-inner{
      width:100%;display:flex;align-items:center;
      padding:0 42px 0 36px;gap:0;
    }

    .use-code{display:flex;flex-direction:column;gap:1px;flex-shrink:0;margin-right:36px}
    .use-lbl{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(196,181,253,0.45)}
    .use-val{
      font-family:'Barlow Condensed',sans-serif;
      font-size:56px;font-weight:800;font-style:italic;
      letter-spacing:.05em;color:#fff;line-height:1;
      text-shadow:0 0 28px rgba(124,58,237,0.7),0 0 60px rgba(236,72,153,0.35);
    }

    .bot-div{width:1px;height:70px;background:rgba(124,58,237,0.25);flex-shrink:0;margin-right:36px}

    .partner{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
    .partner-lbl{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(196,181,253,0.4)}
    .partner-val{
      font-family:'Barlow Condensed',sans-serif;
      font-size:28px;font-weight:800;font-style:italic;
      letter-spacing:.04em;color:rgba(196,181,253,0.85);line-height:1;
    }

    .bot-socials{margin-left:auto;display:flex;align-items:center;gap:22px}
    .bot-soc{display:flex;align-items:center;gap:9px}
    .bot-soc svg{width:19px;height:19px;flex-shrink:0}
    .bot-soc span{font-size:14px;font-weight:600;letter-spacing:.04em;color:rgba(196,181,253,0.65)}
    .bot-sep{width:1px;height:28px;background:rgba(124,58,237,0.25)}
  </style>
</head>

      <span>discord.gg/Gnyv25SHg7</span>

    <div class="tb-sep"></div>
    <img class="tb-logo" src="/assets/niksi.png" alt="NIKSI777"/>

    <div class="tb-soc">
      <svg viewBox="0 0 24 24" fill="rgba(196,181,253,0.8)"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63z"/></svg>

      <div class="bot-soc">

<script>
function makeOrbs(canvas, W, H, orbDefs) {
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  const orbs = orbDefs.map(o => ({...o}));

  function frame() {
    ctx.clearRect(0, 0, W, H);

    for (const o of orbs) {
      o.x += o.vx;
      o.y += o.vy;
      // wrap around softly
      if (o.x - o.r > W) o.x = -o.r;
      if (o.x + o.r < 0) o.x = W + o.r;
      if (o.y - o.r > H) o.y = -o.r;
      if (o.y + o.r < 0) o.y = H + o.r;

      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
      g.addColorStop(0,   o.color.replace('$', '0.13'));
      g.addColorStop(0.5, o.color.replace('$', '0.06'));
      g.addColorStop(1,   o.color.replace('$', '0'));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// sidebar orbs
makeOrbs(document.getElementById('cvs-side'), 390, 896, [
  { x:120, y:200, r:240, vx:0.18,  vy:0.12,  color:'rgba(124,58,237,$)' },

]);

// bottom strip orbs

  { x:400,  y:65, r:220, vx:0.22,  vy:0.05,  color:'rgba(124,58,237,$)' },
  { x:900,  y:65, r:200, vx:-0.18, vy:-0.04, color:'rgba(236,72,153,$)' },
  { x:1400, y:65, r:220, vx:0.15,  vy:0.06,  color:'rgba(6,182,212,$)'  },
  { x:1750, y:65, r:180, vx:-0.12, vy:-0.05, color:'rgba(124,58,237,$)' },

</script>
