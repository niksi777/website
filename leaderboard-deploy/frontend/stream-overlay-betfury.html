<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:1920px;height:1080px;overflow:hidden;
      background:transparent;font-family:'Inter',sans-serif;
    }

    /* ── TOP BAR ──────────────────────────────── */
    .topbar{
      position:fixed;top:0;left:0;right:0;height:54px;
      background:rgba(9,1,2,0.97);
      z-index:30;display:flex;align-items:center;
    }
    .topbar::after{
      content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,
        transparent 0%,
        rgba(210,30,45,0.9) 15%,
        rgba(210,30,45,0.5) 50%,
        rgba(210,30,45,0.9) 85%,
        transparent 100%);
    }
    .topbar-underglow{
      position:absolute;bottom:-10px;left:0;right:0;height:18px;
      background:linear-gradient(to bottom,rgba(210,30,45,0.1),transparent);
      pointer-events:none;z-index:1;
    }

    .tb-left{flex:1;display:flex;align-items:center;gap:14px;padding:0 26px}
    .tb-center{
      position:absolute;left:50%;transform:translateX(-50%);
      display:flex;align-items:center;gap:18px;
    }
    .tb-right{flex:1;display:flex;align-items:center;justify-content:flex-end;padding:0 26px}

    .live-badge{
      display:flex;align-items:center;gap:7px;
      background:rgba(210,30,45,0.14);
      border:1px solid rgba(210,30,45,0.42);
      border-radius:100px;padding:5px 14px;flex-shrink:0;
    }
    .live-dot{
      width:7px;height:7px;border-radius:50%;background:#e42535;
      box-shadow:0 0 6px rgba(210,30,45,1),0 0 14px rgba(210,30,45,0.6);
      animation:blink 1.4s ease-in-out infinite;flex-shrink:0;
    }
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
    .live-txt{font-size:11px;font-weight:700;letter-spacing:.18em;color:#f87171;text-transform:uppercase}

    .tb-sep{width:1px;height:26px;background:rgba(210,30,45,0.28);flex-shrink:0}
    .tb-soc{display:flex;align-items:center;gap:8px}
    .tb-soc svg{width:15px;height:15px;flex-shrink:0}
    .tb-soc span{font-size:13px;font-weight:500;color:rgba(255,185,190,0.72);letter-spacing:.02em;white-space:nowrap}
    .tb-logo{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(210,30,45,0.55))}

    /* ── LEFT EDGE ─────────────────────────────── */
    .edge-left{
      position:fixed;top:54px;left:0;width:6px;height:896px;
      background:rgba(9,1,2,0.97);
      border-right:1px solid rgba(210,30,45,0.22);
      z-index:10;
    }

    /* ── SIDEBAR ───────────────────────────────── */
    .sidebar{
      position:fixed;top:54px;right:0;
      width:390px;height:896px;
      background:rgba(9,1,2,0.97);
      z-index:20;display:flex;flex-direction:column;overflow:hidden;
    }
    /* left glow border */
    .sidebar::before{
      content:'';position:absolute;top:0;left:0;bottom:0;width:1px;
      background:linear-gradient(to bottom,
        transparent 0%,
        rgba(210,30,45,0.7) 15%,
        rgba(210,30,45,0.45) 85%,
        transparent 100%);
      pointer-events:none;
    }
    /* subtle right inner shadow */
    .sidebar::after{
      content:'';position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(ellipse 300px 400px at 100% 50%, rgba(210,30,45,0.06) 0%, transparent 70%);
    }

    /* scan line */
    .scan{
      position:absolute;left:0;right:0;height:1px;
      background:linear-gradient(to right,transparent,rgba(210,30,45,0.25),transparent);
      animation:scan 10s linear infinite;pointer-events:none;z-index:5;
    }
    @keyframes scan{
      0%{top:-2px;opacity:0}5%{opacity:1}95%{opacity:1}100%{top:900px;opacity:0}
    }

    /* corner brackets */
    .brk{position:absolute;width:16px;height:16px}
    .brk.tl{top:12px;left:12px;border-top:2px solid rgba(210,30,45,0.6);border-left:2px solid rgba(210,30,45,0.6)}
    .brk.tr{top:12px;right:12px;border-top:2px solid rgba(210,30,45,0.6);border-right:2px solid rgba(210,30,45,0.6)}
    .brk.bl{bottom:12px;left:12px;border-bottom:2px solid rgba(210,30,45,0.6);border-left:2px solid rgba(210,30,45,0.6)}
    .brk.br{bottom:12px;right:12px;border-bottom:2px solid rgba(210,30,45,0.6);border-right:2px solid rgba(210,30,45,0.6)}

    .panel-hdr{
      display:flex;align-items:center;justify-content:center;gap:8px;
      padding:10px 16px;flex-shrink:0;
      border-bottom:1px solid rgba(210,30,45,0.18);
      background:linear-gradient(to right,transparent,rgba(210,30,45,0.07),transparent);
    }
    .panel-dot{width:5px;height:5px;border-radius:50%;background:#d21e2d;box-shadow:0 0 6px rgba(210,30,45,0.9);flex-shrink:0}
    .panel-lbl{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,165,175,0.55)}

    .chat-body{flex:1}

    /* ── BOTTOM STRIP ──────────────────────────── */
    .bottom{
      position:fixed;bottom:0;left:0;right:0;height:130px;
      background:rgba(9,1,2,0.97);
      z-index:20;display:flex;align-items:center;
    }
    .bottom::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,
        transparent 0%,
        rgba(210,30,45,0.9) 15%,
        rgba(210,30,45,0.5) 50%,
        rgba(210,30,45,0.9) 85%,
        transparent 100%);
    }
    .bottom-overglow{
      position:absolute;top:-12px;left:0;right:0;height:20px;
      background:linear-gradient(to top,rgba(210,30,45,0.09),transparent);
      pointer-events:none;
    }

    .bottom-inner{
      width:100%;display:flex;align-items:center;
      padding:0 42px 0 36px;gap:0;
    }

    /* use code */
    .use-code{display:flex;flex-direction:column;gap:1px;flex-shrink:0;margin-right:36px}
    .use-lbl{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,165,175,0.45)}
    .use-val{
      font-family:'Barlow Condensed',sans-serif;
      font-size:56px;font-weight:800;font-style:italic;
      letter-spacing:.05em;color:#fff;line-height:1;
      text-shadow:0 0 28px rgba(210,30,45,0.65),0 0 60px rgba(210,30,45,0.3);
    }

    .bot-div{width:1px;height:70px;background:rgba(210,30,45,0.22);flex-shrink:0;margin-right:36px}

    /* partner block */
    .partner{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
    .partner-lbl{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,165,175,0.4)}
    .partner-val{
      font-family:'Barlow Condensed',sans-serif;
      font-size:28px;font-weight:800;font-style:italic;
      letter-spacing:.04em;color:rgba(255,185,190,0.8);line-height:1;
    }

    /* socials on right */
    .bot-socials{margin-left:auto;display:flex;align-items:center;gap:22px}
    .bot-soc{display:flex;align-items:center;gap:9px}
    .bot-soc svg{width:19px;height:19px;flex-shrink:0}
    .bot-soc span{font-size:14px;font-weight:600;letter-spacing:.04em;color:rgba(255,185,190,0.65)}
    .bot-sep{width:1px;height:28px;background:rgba(210,30,45,0.22)}

    /* ── SMOOTH EDGE BLEEDS ────────────────────── */
    /* fades the left inner edge of the sidebar */
    .sidebar-bleed{
      position:fixed;top:54px;right:390px;
      width:70px;height:896px;
      background:linear-gradient(to right,transparent,rgba(9,1,2,0.97));
      z-index:19;pointer-events:none;
    }
    /* fades the top inner edge of the bottom strip */
    .bottom-bleed{
      position:fixed;bottom:130px;left:0;right:390px;
      height:55px;
      background:linear-gradient(to bottom,transparent,rgba(9,1,2,0.97));
      z-index:19;pointer-events:none;
    }
    /* fades the bottom of the top bar into the game */
    .topbar-bleed{
      position:fixed;top:54px;left:6px;right:390px;
      height:40px;
      background:linear-gradient(to bottom,rgba(9,1,2,0.55),transparent);
      z-index:18;pointer-events:none;
    }
    /* fades right of the left edge into the game */
    .edge-bleed{
      position:fixed;top:54px;left:6px;
      width:40px;height:896px;
      background:linear-gradient(to right,rgba(9,1,2,0.9),transparent);
      z-index:9;pointer-events:none;
    }
  </style>
</head>
<body>

  <div class="brk tr"></div>
