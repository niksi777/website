<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:1920px;height:1080px;overflow:hidden;
      background:transparent;
      font-family:'Inter',sans-serif;
    }

    /* top bar */
    .topbar{
      position:fixed;top:0;left:0;right:0;height:58px;
      background:#0a1f3d;
      border-bottom:1px solid rgba(6,182,212,0.38);
      display:flex;align-items:center;
      z-index:30;
      overflow:hidden;
    }
    .topbar::after{
      content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(6,182,212,0.95),rgba(2,132,199,0.55),transparent);
    }

    /* bottom bar — same height as topbar */
    .bottom-strip{
      position:fixed;bottom:0;left:0;right:0;height:58px;
      background:#0a1f3d;
      border-top:1px solid rgba(6,182,212,0.38);
      z-index:30;
      overflow:hidden;
    }
    .bottom-strip::after{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(6,182,212,0.95),rgba(2,132,199,0.55),transparent);
    }

    .tb-left{flex:1;display:flex;align-items:center;gap:14px;padding:0 22px;position:relative;z-index:1}
    .tb-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:18px;z-index:1}
    .tb-right{display:none}

    .tb-logo{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(6,182,212,0.72))}

    .tb-soc{display:flex;align-items:center;gap:8px}
    .tb-soc svg{width:16px;height:16px;flex-shrink:0;opacity:.9}
    .tb-soc span{font-size:14px;font-weight:500;color:rgba(180,235,245,0.8);letter-spacing:.02em;white-space:nowrap}

    .tb-deco{font-size:22px;font-weight:300;color:rgba(6,182,212,0.52);line-height:1}

    /* subtle glow on top and bottom edges */
    .frame-glow{
      position:fixed;inset:0;pointer-events:none;z-index:19;
      background:
        radial-gradient(ellipse 1400px 180px at 50% 0%, rgba(6,182,212,0.14) 0%, transparent 70%),
        radial-gradient(ellipse 1400px 180px at 50% 100%, rgba(6,182,212,0.14) 0%, transparent 70%);
    }

    canvas#sparks{
      position:fixed;inset:0;
      pointer-events:none;z-index:25;
      width:1920px;height:1080px;
    }
  </style>
</head>
<body>

<canvas id="sparks" width="1920" height="1080"></canvas>
<div class="frame-glow"></div>

<div class="topbar">
  <div class="tb-left"></div>
  <div class="tb-center">
    <div class="tb-soc">
      <svg viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.464-.674.86-1.339 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128c.126-.094.247-.192.372-.292a.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg>
      <span>discord.gg/Gnyv25SHg7</span>
    </div>
    <span class="tb-deco">|</span>
    <img class="tb-logo" src="/assets/niksi.png" alt="NIKSI777"/>
    <span class="tb-deco">|</span>
    <div class="tb-soc">
      <svg viewBox="0 0 24 24" fill="rgba(180,235,245,0.85)"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63z"/></svg>
      <span>@niksigamba</span>
    </div>
  </div>
  <div class="tb-right"></div>
</div>

<div class="bottom-strip"></div>

<script>
const cnv = document.getElementById('sparks');
const ctx = cnv.getContext('2d');

// top bar and bottom bar only
const REGIONS = [
  {x1:0, y1:0,    x2:1920, y2:58,   w:1},
  {x1:0, y1:1022, x2:1920, y2:1080, w:1},
];

function pickRegion() {
  const total = REGIONS.reduce((s,r)=>s+r.w,0);
  let rand = Math.random()*total;
  for (const r of REGIONS) { rand -= r.w; if (rand<=0) return r; }
  return REGIONS[REGIONS.length-1];
}

function rnd(min, max) { return min + Math.random() * (max - min); }

function makeParticle() {
  const r = pickRegion();
  const angle = -Math.PI/2 + rnd(-0.9, 0.9);
  const spd = rnd(0.05, 0.55);
  return {
    x: rnd(r.x1, r.x2),
    y: rnd(r.y1, r.y2),
    r,
    sz: rnd(0.3, 3.2),
    phase: rnd(0, Math.PI * 2),
    pulseSpeed: rnd(0.008, 0.06),
    vx: Math.cos(angle) * spd,
    vy: Math.sin(angle) * spd,
    maxA: rnd(0.15, 0.85),
    wobble: rnd(0, Math.PI * 2),
    wobbleSpeed: rnd(0.01, 0.04),
    wobbleAmp: rnd(0, 0.18),
  };
}

const SPARKS = Array.from({length: 80}, makeParticle);

function frame() {
  ctx.clearRect(0, 0, 1920, 1080);
  for (const s of SPARKS) {
    s.phase += s.pulseSpeed;
    s.wobble += s.wobbleSpeed;
    s.x += s.vx + Math.sin(s.wobble) * s.wobbleAmp;
    s.y += s.vy;
    if (s.y < s.r.y1 - 6 || s.y > s.r.y2 + 6 || s.x < s.r.x1 - 6 || s.x > s.r.x2 + 6) {
      Object.assign(s, makeParticle());
      continue;
    }
    const a = s.maxA * (0.25 + 0.75 * Math.abs(Math.sin(s.phase)));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.sz, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(6,182,212,${a.toFixed(2)})`;
    ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
