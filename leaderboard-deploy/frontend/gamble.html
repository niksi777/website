<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>NIKSI777 - Cases</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#050709;--s1:#0a0c10;--s2:#0e1016;--b1:rgba(255,255,255,.04);--b2:rgba(255,255,255,.08);--b3:rgba(255,255,255,.15);--tx:#dde3ef;--mu:rgba(221,227,239,.6);--ac:#b8cce8;--gold:#d4af5a}
    html,body{background-color:var(--bg);background-image:radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px;color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 1200px 600px at 50% 0%,rgba(20,30,50,.6),transparent 70%)}
    @keyframes pu{0%,100%{opacity:1}50%{opacity:.15}}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes winnerPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,164,39,0)}40%{box-shadow:0 0 24px 4px rgba(232,164,39,.4)}}
    @keyframes goldenGlow{0%,100%{box-shadow:0 0 40px rgba(255,180,0,.2)}50%{box-shadow:0 0 80px rgba(255,180,0,.5)}}
    @keyframes rainbow{0%{background-position:0% center}100%{background-position:200% center}}
    @keyframes goldenFlash{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes pop{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
    .f1{animation:fu .4s ease both}.f2{animation:fu .4s .08s ease both}.f3{animation:fu .4s .16s ease both}

    nav{background:rgba(7,8,12,.97);border-bottom:1px solid var(--b2);position:sticky;top:0;z-index:50}
    .ni{max-width:1020px;margin:0 auto;padding:0 28px;display:flex;align-items:center;height:56px}
    .nlogo{display:flex;align-items:center;gap:10px;padding-right:22px;border-right:1px solid var(--b2);margin-right:18px;flex-shrink:0;text-decoration:none}
    .nlogo img{height:28px;width:28px;border-radius:50%;object-fit:cover}
    .nname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.16em;color:#fff;text-transform:uppercase}
    .nlinks{display:flex;align-items:center;flex:1}
    .nlinks a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:0 13px;height:56px;display:flex;align-items:center;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;margin-bottom:-1px}
    .nlinks a:hover{color:rgba(255,255,255,.9)}
    .nlinks a.on{color:#fff;border-bottom-color:rgba(255,255,255,.5)}
    .nauth{display:flex;align-items:center;gap:8px;padding-left:12px;margin-left:auto}
    .nlogin-btn{display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:7px;background:#22c55e;color:#fff;border:none;cursor:pointer;transition:opacity .15s;text-decoration:none;white-space:nowrap}
    .nlogin-btn:hover{opacity:.85}
    .nuser{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:7px;background:var(--s1);border:1px solid var(--b2)}
    .nuser-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover}
    .nuser-name{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--tx)}
    .nuser-pts{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--gold)}
    .ndrop{position:relative}
    .ndrop-menu{display:none;position:absolute;top:100%;right:0;padding-top:6px;z-index:200;min-width:150px}
    .ndrop:hover .ndrop-menu{display:block}
    .ndrop-box{background:rgba(7,8,12,.97);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
    .ndrop-item{display:block;width:100%;text-align:left;padding:9px 14px;font-size:12px;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(221,227,239,.75);text-decoration:none;background:none;border:none;cursor:pointer;border-radius:6px;transition:background .1s;box-sizing:border-box}
    .ndrop-item:hover{background:rgba(255,255,255,.06)}
    .ndrop-logout{color:rgba(217,79,79,.8)}

    .wrap{max-width:1020px;margin:0 auto;padding:0 28px}

    /* CASE LIST */
    .page-head{padding:48px 0 32px;text-align:center}
    .page-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(36px,6vw,64px);font-weight:800;text-transform:uppercase;color:#fff;letter-spacing:-.01em;line-height:.92;margin-bottom:8px}
    .page-sub{font-size:13px;color:var(--mu)}
    .cases-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:60px}
    .case-card{background:linear-gradient(160deg,#0e1018,#090b0f);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;text-decoration:none;display:block;color:inherit}
    .case-card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.16);box-shadow:0 24px 48px rgba(0,0,0,.6)}
    .case-top{height:170px;display:flex;align-items:center;justify-content:center;font-size:80px;background:linear-gradient(160deg,#111420,#0a0c12);border-bottom:1px solid rgba(255,255,255,.06);position:relative}
    .case-golden-badge{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,#e8a427,#f5d080);color:#07080c;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:100px}
    .case-body{padding:16px 18px 18px;text-align:center}
    .case-name{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;text-transform:uppercase;color:#fff;letter-spacing:.04em;margin-bottom:4px}
    .case-cost{font-size:12px;color:var(--mu)}

    /* CASE PAGE */
    .case-page{max-width:1020px;margin:0 auto;padding:28px 28px 60px}
    .case-page-back{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;margin-bottom:20px;transition:color .15s}
    .case-page-back:hover{color:#fff}
    .open-btn{padding:14px 40px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border:none;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;transition:opacity .15s,transform .1s;box-shadow:0 4px 20px rgba(34,197,94,.3)}
    .open-btn:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 6px 28px rgba(34,197,94,.4)}
    .open-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
    .speed-btn{display:flex;align-items:center;gap:5px;padding:10px 14px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--mu);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .15s}
    .speed-btn:hover{background:rgba(255,255,255,.1);color:#fff}
    .speed-btn.active{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}
    .demo-btn-sm{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:var(--mu);cursor:pointer;font-size:12px;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:.06em;text-transform:uppercase;transition:all .15s;white-space:nowrap}
    .demo-btn-sm:hover{background:rgba(255,255,255,.1);color:#fff}
    .demo-btn{padding:10px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border:1px solid rgba(232,164,39,.4);background:rgba(232,164,39,.06);color:#e8a427;transition:all .15s}
    .demo-btn:hover{background:rgba(232,164,39,.12);border-color:rgba(232,164,39,.7)}

    /* ROLLER */
    .roller-section{margin-bottom:0}
    .roller-placeholder{height:130px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:0}
    .roller-stage-wrap{position:relative;margin-bottom:0}
    .rptr{position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:16px solid #4a90d9;z-index:10;filter:drop-shadow(0 0 6px rgba(74,144,217,.6))}
    .rptb{position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:16px solid #4a90d9;z-index:10;filter:drop-shadow(0 0 6px rgba(74,144,217,.6))}
    .rptr.g{border-top-color:#e8a427;filter:drop-shadow(0 0 10px rgba(232,164,39,.9))}
    .rptb.g{border-bottom-color:#e8a427;filter:drop-shadow(0 0 10px rgba(232,164,39,.9))}
    .rstage{position:relative;height:130px;overflow:hidden;border-radius:0;background:#080a0e;border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06)}
    .rstage.gstage{border-color:rgba(232,164,39,.3);animation:goldenGlow 2s ease-in-out infinite}
    .rstage::before{content:'';position:absolute;left:0;top:0;bottom:0;width:120px;background:linear-gradient(to right,#080a0e,transparent);z-index:4;pointer-events:none}
    .rstage::after{content:'';position:absolute;right:0;top:0;bottom:0;width:120px;background:linear-gradient(to left,#080a0e,transparent);z-index:4;pointer-events:none}
    .rwin{position:absolute;left:50%;top:0;bottom:0;width:154px;transform:translateX(-50%);z-index:3;pointer-events:none}
    .rtrack{display:flex;align-items:center;gap:4px;position:absolute;top:0;height:100%;padding:0 4px;transform:translateZ(0)}
    .rc{flex-shrink:0;width:140px;height:122px;border-radius:6px;background:linear-gradient(160deg,#0f1218,#0a0c10);border:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transform:translateZ(0);position:relative;overflow:hidden}
    .rc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.08)}
    .rc.r-bust{border-color:rgba(60,60,80,.3)}.rc.r-bust::after{background:rgba(80,80,100,.3)}
    .rc.r-blue{border-color:rgba(74,144,217,.25)}.rc.r-blue::after{background:#4a90d9}.rc.r-blue .rpts{color:#9bbde0}
    .rc.r-purple{border-color:rgba(155,89,217,.25)}.rc.r-purple::after{background:#9b59d9}.rc.r-purple .rpts{color:#c4a0e8}
    .rc.r-pink{border-color:rgba(217,79,155,.25)}.rc.r-pink::after{background:#d94f9b}.rc.r-pink .rpts{color:#f0a0cc}
    .rc.r-golden-trigger{border-color:rgba(232,164,39,.5);background:linear-gradient(160deg,#141006,#0d0c0a);animation:winnerPulse 2s ease-in-out infinite}.rc.r-golden-trigger::after{background:#e8a427}.rc.r-golden-trigger .rpts{color:#e8a427}
    .rc.r-store{border-color:rgba(34,197,94,.2)}.rc.r-store::after{background:#22c55e}.rc.r-store .rpts{color:#22c55e}
    .rc.r-gold{border-color:rgba(232,164,39,.3)}.rc.r-gold::after{background:#e8a427}.rc.r-gold .rpts{color:#f0c060}
    .rc.r-jackpot{border-color:rgba(217,79,155,.3)}.rc.r-jackpot::after{background:#d94f9b}.rc.r-jackpot .rpts{color:#f080c0}
    .rc.r-ultra{border-color:#ff64c8;animation:goldenGlow 1.5s ease-in-out infinite}.rc.r-ultra::after{background:linear-gradient(90deg,#ff64c8,#a064ff)}.rc.r-ultra .rpts{background:linear-gradient(90deg,#ff64c8,#a064ff,#64c8ff,#ff64c8);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbow 1.5s linear infinite}
    .rc.winner{border-color:#e8a427 !important;animation:winnerPulse 1.8s ease-in-out infinite !important}
    .rname{font-size:9px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:rgba(200,205,216,.35)}
    .rpts{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:#fff;line-height:1}

    /* GOLDEN ANNOUNCE */
    .g-announce{text-align:center;padding:20px 0;animation:pop .5s ease both}
    .g-icon{font-size:48px;margin-bottom:6px;animation:goldenFlash 1s ease-in-out infinite}
    .g-text{font-family:'Barlow Condensed',sans-serif;font-size:clamp(28px,5vw,48px);font-weight:800;text-transform:uppercase;background:linear-gradient(90deg,#e8a427,#fff,#f5d080,#e8a427);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbow 1.5s linear infinite;letter-spacing:.04em}
    .g-sub{font-size:12px;color:rgba(232,164,39,.6);margin-top:4px;letter-spacing:.1em;text-transform:uppercase}

    /* RESULT */
    .result-strip{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:20px;text-align:center;animation:pop .4s ease both;margin-bottom:12px}
    .result-lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
    .result-name{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;text-transform:uppercase;color:#fff;margin-bottom:4px}
    .result-pts{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:800;line-height:1;color:#22c55e}
    .result-pts.u{background:linear-gradient(90deg,#ff64c8,#a064ff,#64c8ff,#ff64c8);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbow 1.5s linear infinite}

    /* ITEMS GRID */
    .items-section{margin-bottom:32px}
    .items-section-title{font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(221,227,239,.35);margin-bottom:14px;text-align:center}
    .items-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
    .item-card{border-radius:8px;padding:0;text-align:center;display:flex;flex-direction:column;align-items:center;border:1px solid transparent;transition:transform .15s,box-shadow .15s;cursor:default;position:relative;overflow:hidden;min-height:130px;justify-content:flex-end;width:140px;flex-shrink:0}
    .item-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.5)}
    .item-card-inner{padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;position:relative;z-index:1}
    .item-bg{position:absolute;inset:0;opacity:.15;transition:opacity .15s}
    .item-card:hover .item-bg{opacity:.22}
    .item-pct-badge{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;letter-spacing:.04em;z-index:2;background:rgba(0,0,0,.5);padding:3px 6px;border-radius:4px}
    .item-icon{font-size:36px;line-height:1}
    .item-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
    .item-pts{font-size:11px;opacity:.6}
    .item-prob{font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.8}

    footer{border-top:1px solid var(--b1);padding:22px 0;margin-top:40px}
    .ftw{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .ftd{font-size:12px;color:var(--mu)}
    .ftc{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
    @media(max-width:700px){
      .nlinks{display:none}
      .cases-grid{grid-template-columns:1fr 1fr}
      .case-page{padding:16px 16px 48px}
      .case-big-emoji{font-size:64px}
      .case-big-name{font-size:28px}
      .items-grid{grid-template-columns:repeat(3,1fr)!important}
      .open-btn{font-size:16px;padding:14px}
    }
    @media(max-width:480px){
      .cases-grid{grid-template-columns:1fr 1fr}
      .items-grid{grid-template-columns:repeat(2,1fr)!important}
      .demo-btn{width:100%}
    }
    @media(max-width:360px){
      .cases-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

  function useSession(){
    const[user,setUser]=React.useState(null);
    const[sessionId,setSessionId]=React.useState(null);
    const[loading,setLoading]=React.useState(true);
    React.useEffect(()=>{
      const params=new URLSearchParams(window.location.search);
      const sid=params.get('session')||localStorage.getItem('kick_session');
      if(sid){
        localStorage.setItem('kick_session',sid);setSessionId(sid);
        fetch(`/auth/me?session=${sid}`).then(r=>r.ok?r.json():null).then(d=>{if(d)setUser(d);else localStorage.removeItem('kick_session');}).finally(()=>setLoading(false));
        if(params.get('session'))window.history.replaceState({},'',window.location.pathname);
      }else setLoading(false);
    },[]);
    function logout(){const sid=localStorage.getItem('kick_session');if(sid)fetch(`/auth/logout?session=${sid}`);localStorage.removeItem('kick_session');setUser(null);setSessionId(null);}
    return{user,setUser,sessionId,loading,logout};
  }

  const SOCIALS=<>
    <a href="https://kick.com/niksi777" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" fill="none"><path d="M3 3h4v5.5L11 3h5l-5.5 6.5L16 15h-5l-4-4.5V15H3V3z" fill="#22c55e"/></svg></a>
    <a href="https://discord.com/invite/Gnyv25SHg7" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.464-.674.86-1.339 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128c.126-.094.247-.192.372-.292a.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg></a>
    <a href="https://x.com/code_niksi777" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63z"/></svg></a>
  </>;

  function Navbar({user,logout,activeCaseId}){
    return(<nav><div className="ni">
      <a href="/" className="nlogo"><img src="/assets/niksi.png" alt=""/><span className="nname">NIKSI777</span></a>
      <div className="nlinks">
        <a href="/">HOME</a><a href="/leaderboards">LEADERBOARDS</a><a href="/points">POINTS</a><a href="/store">STORE</a>
        <a href="/cases" className={activeCaseId?'':'on'}>CASES</a>
        {user&&user.isAdmin&&<><a href="/giveaway">GIVEAWAY</a><a href="/admin">ADMIN</a></>}
      </div>
      <div className="nauth">
        {user?(
          <div className="ndrop">
            <div className="nuser" style={{cursor:'default'}}>
              {user.avatar&&<img className="nuser-avatar" src={user.avatar} alt=""/>}
              <span className="nuser-name">{user.displayName}</span>
              <span className="nuser-pts">{(user.points||0).toLocaleString()} pts</span>
            </div>
            <div className="ndrop-menu"><div className="ndrop-box">
              <a href="/settings" className="ndrop-item">Settings</a>
              <button onClick={logout} className="ndrop-item ndrop-logout">Logout</button>
            </div></div>
          </div>
        ):(<a href="/auth/login" className="nlogin-btn">Login with Kick</a>)}
      </div>
    </div></nav>);
  }

  // Rarity config
  const RARITIES={
    bust:          {bg:'linear-gradient(135deg,#0d0f16,#13151e)',border:'rgba(100,100,130,.2)',color:'#8888aa',icon:'💨'},
    blue:          {bg:'linear-gradient(135deg,#0a1628,#0d2240)',border:'rgba(74,144,217,.35)',color:'#9bbde0',icon:'💠'},
    purple:        {bg:'linear-gradient(135deg,#140d28,#231040)',border:'rgba(155,89,217,.35)',color:'#c4a0e8',icon:'🔮'},
    pink:          {bg:'linear-gradient(135deg,#280d1a,#401028)',border:'rgba(217,79,155,.35)',color:'#f0a0cc',icon:'💎'},

  function CaseGraphic({id,size=120}){

            <stop offset="100%" stopColor={t.stripe} stopOpacity="0"/>

        <rect x="2" y="2" width={w-4} height={lid} rx="5" fill={t.lid} stroke={t.accent} strokeWidth="1" strokeOpacity=".5"/>
        {/* Stripe overlay */}

  const TILE=144; // 140px card + 4px gap

  let _audioCtx=null;
  function playCelebration(vol){
    if(!vol)return;
    try{
      if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      if(_audioCtx.state==='suspended')_audioCtx.resume();
      const notes=[523,659,784,1047]; // C5 E5 G5 C6
      notes.forEach((freq,i)=>{
        const t=_audioCtx.currentTime+i*0.09;
        const osc=_audioCtx.createOscillator();
        const gain=_audioCtx.createGain();
        osc.connect(gain);gain.connect(_audioCtx.destination);
        osc.type='sine';
        osc.frequency.setValueAtTime(freq,t);
        gain.gain.setValueAtTime(0,t);
        gain.gain.linearRampToValueAtTime(vol*0.38,t+0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
        osc.start(t);osc.stop(t+0.46);
      });
    }catch(e){}
  }
  function playTick(vol){
    if(!vol)return;
    try{
      if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      if(_audioCtx.state==='suspended')_audioCtx.resume();
      const now=_audioCtx.currentTime;
      const osc=_audioCtx.createOscillator();
      const gain=_audioCtx.createGain();
      osc.connect(gain);gain.connect(_audioCtx.destination);
      osc.type='sine';
      osc.frequency.setValueAtTime(1100,now);
      osc.frequency.exponentialRampToValueAtTime(520,now+0.055);
      gain.gain.setValueAtTime(vol*0.28,now);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+0.055);
      osc.start(now);osc.stop(now+0.06);
    }catch(e){}
  }

  function buildDeck(items,winnerItem){
    const totalW=items.reduce((s,i)=>s+i.weight,0);
    const deck=[];
    for(let i=0;i<40;i++){
      let r=Math.floor(Math.random()*totalW);
      for(const item of items){r-=item.weight;if(r<0){deck.push(item);break;}}
    }
    const landIdx=32;
    // Bait: near-miss golden triggers
    if(!winnerItem.isGolden){
      const golden=items.find(i=>i.isGolden);
      if(golden){
        if(Math.random()<0.7)deck[landIdx-1]=golden;
        if(Math.random()<0.4)deck[landIdx-3]=golden;
      }
    }
    deck.splice(landIdx,0,winnerItem);
    return{deck,landIdx};
  }

  const GOLD_LOGO=`<img src="/assets/niksi.png" style="width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #e8a427;box-shadow:0 0 10px rgba(232,164,39,.7);filter:sepia(.4) saturate(2) hue-rotate(5deg) brightness(1.15)"/>`;
  function makeCard(item){
    if(item.isGolden) return GOLD_LOGO;
    if(item.rarity==='bust') return `<span style="font-size:28px;line-height:1">🗑️</span>`;
    if(item.storeItem) return `<img src="/assets/gamba.png" style="width:32px;height:32px;object-fit:contain"/><div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:#22c55e;letter-spacing:.04em;margin-top:2px">${item.name}</div>`;
    if(item.points>0) return `<div style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:#fff;line-height:1">${item.points.toLocaleString()}</div><div style="font-size:9px;color:rgba(221,227,239,.4);letter-spacing:.06em;text-transform:uppercase">pts</div>`;
    return '';
  }

  function Roller({items,winner,isGolden,onDone,fast,volume}){
    const trackRef=React.useRef(null);
    const stageRef=React.useRef(null);
    const doneRef=React.useRef(false);
    const volRef=React.useRef(volume);
    React.useEffect(()=>{volRef.current=volume;});
    React.useEffect(()=>{
      if(!items||!winner||!trackRef.current||!stageRef.current)return;
      doneRef.current=false;
      const track=trackRef.current;
      const stage=stageRef.current;
      const{deck,landIdx}=buildDeck(items,winner);
      track.style.transition='none';
      track.style.transform='translateX(0) translateZ(0)';
      track.innerHTML='';
      deck.forEach(item=>{
        const d=document.createElement('div');
        d.className=`rc r-${item.isGolden?'golden-trigger':item.rarity}`;
        d.innerHTML=makeCard(item);
        track.appendChild(d);
      });
      const stageW=stage.offsetWidth;
      const center=stageW/2-TILE/2;
      const targetX=-(landIdx*TILE)+center;
      const animDuration=fast?1400:5800;
      // Evaluate the same cubic-bezier used by the CSS transition
      const[bx1,by1,bx2,by2]=fast?[.2,.95,.35,1]:[.08,.92,.2,1];
      function evalBezier(t){
        const cx=3*bx1,bx=3*(bx2-bx1)-cx,ax=1-cx-bx;
        const cy=3*by1,by=3*(by2-by1)-cy,ay=1-cy-by;
        let u=t;
        for(let i=0;i<8;i++){const err=((ax*u+bx)*u+cx)*u-t;const d=(3*ax*u+2*bx)*u+cx;if(Math.abs(d)<1e-6)break;u-=err/d;}
        return((ay*u+by)*u+cy)*u;
      }
      const rafRef={current:null};
      requestAnimationFrame(()=>{
        track.style.transition=`transform ${fast?'1.4s cubic-bezier(.2,.95,.35,1)':'5.8s cubic-bezier(.08,.92,.2,1)'}`;
        track.style.transform=`translateX(${targetX}px) translateZ(0)`;
        const startTime=performance.now();
        const deckLen=deck.length;
        let lastCardIdx=-1;
        function trackTick(){
          const elapsed=performance.now()-startTime;
          const t=Math.min(elapsed/animDuration,1);
          const tx=targetX*evalBezier(t);
          const cardIdx=Math.round((-tx+stageW/2-TILE/2)/TILE);
          if(cardIdx!==lastCardIdx&&cardIdx>=0&&cardIdx<deckLen){lastCardIdx=cardIdx;playTick(volRef.current);}
          if(elapsed<animDuration+200)rafRef.current=requestAnimationFrame(trackTick);
        }
        rafRef.current=requestAnimationFrame(trackTick);
      });
      const t=setTimeout(()=>{
        if(rafRef.current)cancelAnimationFrame(rafRef.current);
        const cards=track.children;
        if(cards[landIdx])cards[landIdx].classList.add('winner');
        if(!doneRef.current){doneRef.current=true;if(onDone)onDone();}
      },fast?1600:6000);
      return()=>{clearTimeout(t);if(rafRef.current)cancelAnimationFrame(rafRef.current);};
    },[items,winner]);
    return(
      <div className="roller-section">
        <div className="roller-stage-wrap">
          <div className={`rptr${isGolden?' g':''}`}/>
          <div className={`rptb${isGolden?' g':''}`}/>
          <div className={`rstage${isGolden?' gstage':''}`} ref={stageRef}>
            <div className={`rwin${isGolden?' g':''}`}/>
            <div className="rtrack" ref={trackRef} style={{transform:'translateX(0) translateZ(0)',left:0,top:0}}/>
          </div>
        </div>
      </div>
    );
  }

  function ItemCard({item,prob}){
    const r=RARITIES[item.rarity]||RARITIES.bust;
    const icon=item.storeItem?<img src="/assets/gamba.png" style={{width:32,height:32,objectFit:'contain'}}/>:item.isGolden&&item.rarity!=='golden-trigger'?'✨':item.rarity==='bust'?'🗑️':r.icon;
    const gTrigger=RARITIES['golden-trigger'];
    const displayR=item.isGolden&&item.rarity!=='golden-trigger'?gTrigger:r;
    return(
      <div className="item-card" style={{borderColor:displayR.border}}>
        <div className="item-bg" style={{background:displayR.bg.replace('linear-gradient','linear-gradient'),filter:'saturate(1.5)'}}/>
        <div className="item-pct-badge" style={{color:displayR.color}}>{prob}%</div>
        <div className="item-card-inner">
          <div className="item-icon">{icon}</div>
          {item.isGolden
            ?<div className="item-name" style={{color:displayR.color}}>Golden Spin</div>
            :item.storeItem
              ?<div className="item-name" style={{color:displayR.color,fontSize:12}}>{item.name}</div>
              :item.points>0
                ?<div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:18,fontWeight:800,color:displayR.color,lineHeight:1}}>{item.points.toLocaleString()} pts</div>
                :<div className="item-name" style={{color:'rgba(150,150,180,.6)'}}>Nothing</div>
          }
        </div>
      </div>
    );
  }

  function CasePage({caseData,user,setUser,sessionId}){
    const[phase,setPhase]=React.useState('idle');
    const[result,setResult]=React.useState(null);
    const[showProof,setShowProof]=React.useState(false);
    const[err,setErr]=React.useState('');
    const[fastMode,setFastMode]=React.useState(false);
    const[volume,setVolume]=React.useState(0.5);

    const regTW=caseData.items.reduce((s,i)=>s+i.weight,0);
    const golTW=(caseData.goldenItems||[]).reduce((s,i)=>s+i.weight,0);

    function demoGolden(){
      if(phase!=='idle')return;
      const items=caseData.goldenItems||[];
      if(!items.length)return;
      const tw=items.reduce((s,i)=>s+i.weight,0);
      let r=Math.floor(Math.random()*tw),demoItem=items[items.length-1];
      for(const item of items){r-=item.weight;if(r<0){demoItem=item;break;}}
      setResult({regularItem:{name:'Golden Spin',points:0,rarity:'golden-trigger',isGolden:true},goldenItem:demoItem,pointsWon:0,storeWin:demoItem.storeItem?{title:demoItem.title}:null,newPoints:user?.points||0,isDemo:true});
      setShowProof(false);
      setPhase('golden-ready');
    }

    async function openCase(){
      if(phase!=='idle'||!user)return;
      setPhase('spinning');setErr('');setResult(null);setShowProof(false);
      try{
        const r=await fetch('/gamble/open',{method:'POST',headers:{'Content-Type':'application/json','x-session-id':sessionId},body:JSON.stringify({caseId:caseData.id,session:sessionId})});
        const d=await r.json();
        if(!r.ok){setErr(d.error||'Error');setPhase('idle');return;}
        setResult(d);
        // Balance updates after spin completes, not here
      }catch{setErr('Connection error');setPhase('idle');}
    }

    const WIN_RARITIES=['gold','gold-ultra','ultra','jackpot','store'];
    function onRegularDone(){
      if(!result||result.isDemo)return;
      if(result.goldenItem){setPhase('golden-ready');}
      else{
        setPhase('done');
        if(WIN_RARITIES.includes(result.regularItem?.rarity))playCelebration(volume);
        if(setUser&&result.newPoints!=null)setUser(u=>({...u,points:result.newPoints}));
      }
    }
    function triggerGoldenSpin(){
      setPhase('golden-announce');
      setTimeout(()=>setPhase('golden-spinning'),2200);
    }
    function onGoldenDone(){
      setPhase('done');
      playCelebration(volume);
      if(setUser&&result.newPoints!=null)setUser(u=>({...u,points:result.newPoints}));
    }

    const finalItem=result?.goldenItem||result?.regularItem;
    const canOpen=user&&(user.points||0)>=caseData.cost;

    return(
      <div className="case-page">
        {/* Top bar */}
        <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:20,flexWrap:'wrap',position:'relative'}}>
          <a href="/cases" className="case-page-back">← All Cases</a>
          <div style={{position:'absolute',left:'50%',transform:'translateX(-50%)',textAlign:'center'}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:800,textTransform:'uppercase',color:'#fff',letterSpacing:'.04em',lineHeight:1}}>{caseData.name}</div>
          </div>
          {user&&<div style={{background:'var(--s1)',border:'1px solid var(--b2)',borderRadius:8,padding:'7px 14px',fontSize:12,color:'var(--mu)',flexShrink:0,marginLeft:'auto'}}>Balance: <strong style={{color:'var(--gold)'}}>{(user.points||0).toLocaleString()} pts</strong></div>}
        </div>

        {/* Case graphic centered above spinner */}
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'20px 0 8px',gap:8}}>
          <CaseGraphic id={caseData.id} size={150}/>
        </div>

        {/* Golden ready - user must click to spin */}
        {phase==='golden-ready'&&(
          <div className="g-announce" style={{marginBottom:8}}>
            <img src="/assets/niksi.png" style={{width:64,height:64,borderRadius:'50%',objectFit:'cover',border:'3px solid #e8a427',boxShadow:'0 0 24px rgba(232,164,39,.8)',filter:'sepia(.4) saturate(2) hue-rotate(5deg) brightness(1.15)',marginBottom:8,animation:'goldenFlash 1.5s ease-in-out infinite'}}/>
            <div className="g-text">Golden Spin!</div>
            <div className="g-sub" style={{marginBottom:16}}>You triggered the bonus round - click below to spin for free</div>
            <button onClick={triggerGoldenSpin} style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,letterSpacing:'.12em',textTransform:'uppercase',padding:'14px 48px',borderRadius:10,border:'none',cursor:'pointer',background:'linear-gradient(135deg,#e8a427,#f5d080)',color:'#07080c',animation:'goldenFlash 2s ease-in-out infinite'}}>
              ✨ Spin Now
            </button>
          </div>
        )}

        {/* Golden announce */}
        {phase==='golden-announce'&&(
          <div className="g-announce">
            <img src="/assets/niksi.png" style={{width:56,height:56,borderRadius:'50%',objectFit:'cover',border:'3px solid #e8a427',boxShadow:'0 0 24px rgba(232,164,39,.8)',filter:'sepia(.4) saturate(2) hue-rotate(5deg) brightness(1.15)',marginBottom:8}}/>
            <div className="g-text">Golden Spin!</div>
            <div className="g-sub">Bonus round triggered</div>
          </div>
        )}

        {/* Regular roller */}
        {!result?.isDemo&&(phase==='spinning'||phase==='golden-ready'||phase==='golden-announce'||(phase==='done'&&!result?.goldenItem))&&result&&(
          <Roller items={caseData.items} winner={result.regularItem} isGolden={false} onDone={onRegularDone} fast={fastMode} volume={volume}/>
        )}
        {/* Golden roller */}
        {(phase==='golden-spinning'||(phase==='done'&&!!result?.goldenItem))&&result?.goldenItem&&(
          <Roller items={caseData.goldenItems} winner={result.goldenItem} isGolden={true} onDone={onGoldenDone} fast={fastMode} volume={volume}/>
        )}
        {phase==='idle'&&(
          <div style={{height:96,background:'var(--s2)',border:'1px solid var(--b1)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16}}>
            <span style={{fontSize:11,letterSpacing:'.14em',textTransform:'uppercase',color:'rgba(221,227,239,.18)'}}>Open a case to spin</span>
          </div>
        )}

        {/* Action buttons - true center layout using position:relative trick */}
        <div style={{position:'relative',display:'flex',alignItems:'center',justifyContent:'center',padding:'16px 0'}}>
          {/* Absolutely positioned side controls - don't affect centering */}
          <div style={{position:'absolute',left:0,display:'flex',gap:8,alignItems:'center'}}>
            {phase==='idle'&&(
              <button className="speed-btn" onClick={()=>setFastMode(p=>!p)}
                style={fastMode?{background:'rgba(255,255,255,.12)',color:'#fff',borderColor:'rgba(255,255,255,.2)'}:{}}>
                <svg viewBox="0 0 16 16" fill="none" style={{width:12,height:12}}><path d="M13 8H3M13 8l-3-3M13 8l-3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                {fastMode?'Fast':'Speed'}
              </button>
            )}
            <div style={{display:'flex',alignItems:'center',gap:5,color:'var(--mu)'}}>
              <svg viewBox="0 0 16 16" fill="none" style={{width:13,height:13,flexShrink:0}}>
                <path d="M3 6v4h2.5L9 12V4L5.5 6H3z" fill="currentColor"/>
                {volume>0&&<path d="M11 5.5a3 3 0 010 5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>}
                {volume>0.5&&<path d="M12.5 3.5a5.5 5.5 0 010 9" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>}
              </svg>
              <input type="range" min="0" max="1" step="0.05" value={volume}
                onChange={e=>setVolume(Number(e.target.value))}
                style={{width:64,accentColor:'rgba(255,255,255,.7)',cursor:'pointer',opacity:.7}}/>
            </div>
          </div>
          {phase==='idle'&&caseData.goldenItems&&(
            <div style={{position:'absolute',right:0,display:'flex',gap:8}}>
              <button className="demo-btn-sm" onClick={demoGolden}>
                <svg viewBox="0 0 16 16" fill="none" style={{width:12,height:12,flexShrink:0}}><path d="M13.5 8A5.5 5.5 0 112.5 8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/><path d="M13.5 4v4h-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                Demo Spin
              </button>
            </div>
          )}
          {/* Centered open button */}
          {phase!=='golden-ready'&&(
            <button className="open-btn"
              onClick={(phase==='idle'||phase==='done')?
                (phase==='done'?()=>{setPhase('idle');setResult(null);setShowProof(false);}:openCase)
                :undefined}
              disabled={!(phase==='idle'||phase==='done')||!user||(!canOpen&&phase==='idle')}>
              {!user?'Login to Open'
                :!canOpen&&phase==='idle'?`Need ${caseData.cost.toLocaleString()} pts`
                :phase==='done'?'Open Again'
                :phase!=='idle'?'Spinning...'
                :`Open for ${caseData.cost.toLocaleString()} pts`}
            </button>
          )}
        </div>

        {/* Result */}
        {phase==='done'&&finalItem&&(
          <div className="result-strip" style={{marginBottom:20}}>
            {result.isDemo&&<div style={{fontSize:10,color:'#e8a427',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:6}}>DEMO</div>}
            <div className="result-lbl">{result.goldenItem?'Golden Spin Result':'Result'}</div>
            <div className="result-name" style={{color:finalItem.rarity==='bust'?'rgba(221,227,239,.5)':(RARITIES[finalItem.rarity]?.color||'#fff')}}>{finalItem.name}</div>
            {result.storeWin&&<div style={{color:'#22c55e',fontFamily:"'Barlow Condensed',sans-serif",fontSize:24,fontWeight:800}}>🎁 Check Discord!</div>}
            {!result.storeWin&&result.pointsWon>0&&<div className={`result-pts${finalItem.rarity==='ultra'?' u':''}`}>+{result.pointsWon.toLocaleString()} pts</div>}
            {!result.isDemo&&result.proof&&<button onClick={()=>setShowProof(p=>!p)} style={{marginTop:8,background:'none',border:'1px solid var(--b2)',color:'var(--mu)',padding:'4px 12px',borderRadius:6,cursor:'pointer',fontSize:10,letterSpacing:'.08em',textTransform:'uppercase'}}>{showProof?'Hide Proof':'Verify (Provably Fair)'}</button>}
            {showProof&&result.proof&&(
              <div style={{marginTop:8,background:'var(--s2)',border:'1px solid var(--b1)',borderRadius:8,padding:'10px 14px',fontSize:10,color:'var(--mu)',lineHeight:2,wordBreak:'break-all',textAlign:'left'}}>
                <div><strong>Server Seed:</strong> {result.proof.serverSeed}</div>
                <div><strong>Hash:</strong> {result.proof.resultHash}</div>
                <div><strong>Roll:</strong> {result.proof.roll1}/{result.proof.tw1}{result.proof.roll2!=null?` → ${result.proof.roll2}/${result.proof.tw2}`:''}</div>
              </div>
            )}
          </div>
        )}

        {err&&<div style={{color:'rgba(217,79,79,.9)',fontSize:13,marginBottom:12}}>{err}</div>}

        {/* Items grid - full width below everything */}
        <div className="items-section">
          <div className="items-section-title">Main Pool - Items in this Case</div>
          <div className="items-grid" style={{}}>
            {(() => {
              // Merge all isGolden items into one "Golden Spin" entry
              let goldenWeight = 0;
              const merged = [];
              caseData.items.forEach((item, i) => {
                if (item.isGolden) { goldenWeight += item.weight; }
                else { merged.push({item, key: i}); }
              });
              if (goldenWeight > 0) {
                merged.push({item: {name:'Golden Spin',points:0,rarity:'golden-trigger',isGolden:true,weight:goldenWeight}, key:'g'});
              }
              return merged.map(({item,key}) => {
                const pct = ((item.weight/regTW)*100).toFixed(1);
                return <ItemCard key={key} item={item} prob={pct}/>;
              });
            })()}
          </div>
        </div>
        {caseData.goldenItems&&(
          <div className="items-section">
            <div className="items-section-title" style={{color:'#e8a427'}}>✨ Golden Spin prizes - triggers at 5%</div>
            <div className="items-grid" style={{}}>
              {caseData.goldenItems.map((item,i)=>{
                const overall=((item.weight/golTW)*0.01*100).toFixed(4);
                return <ItemCard key={i} item={item} prob={overall}/>;
              })}
            </div>
          </div>
        )}
      </div>
    );
  }

  function App(){
    const{user,setUser,sessionId,loading,logout}=useSession();
    const[cases,setCases]=React.useState([]);
    const caseId=window.location.pathname.match(/\/cases\/(\w+)/)?.[1]||null;
    const activeCaseData=cases.find(c=>c.id===caseId)||null;

    React.useEffect(()=>{
      fetch('/gamble/cases').then(r=>r.json()).then(setCases).catch(()=>{});
    },[]);

    if(loading)return<Navbar user={null} logout={logout} activeCaseId={caseId}/>;

    // CASE DETAIL PAGE
    if(caseId){
      return(<>
        <Navbar user={user} logout={logout} activeCaseId={caseId}/>
        {activeCaseData
          ?<CasePage caseData={activeCaseData} user={user} setUser={setUser} sessionId={sessionId}/>
          :<div style={{textAlign:'center',padding:80,color:'var(--mu)'}}>Loading...</div>
        }
        <footer><div className="wrap"><div className="ftw">
          <p className="ftd"><strong>18+</strong> - Gamble responsibly. All outcomes are provably fair.</p>
          <div style={{display:'flex',alignItems:'center',gap:4}}><div style={{display:'flex',gap:4}}>{SOCIALS}</div><span className="ftc" style={{marginLeft:8}}>© 2026 NIKSI777</span></div>
        </div></div></footer>
      </>);
    }

    // CASE LIST
    return(<>
      <Navbar user={user} logout={logout} activeCaseId={null}/>
      <div className="wrap">
        <div className="page-head f1">
          <div className="page-title">Cases</div>
          <p className="page-sub">Open cases with your points - provably fair - 1% chance for the Golden Spin</p>
        </div>
        {!user&&(
          <div style={{textAlign:'center',padding:'60px 0'}}>
            <div style={{fontSize:48,marginBottom:16}}>🎁</div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:800,textTransform:'uppercase',color:'#fff',marginBottom:8}}>Login to Play</div>
            <p style={{fontSize:13,color:'var(--mu)',marginBottom:24}}>Connect your Kick account to open cases with your points.</p>
            <a href="/auth/login" className="nlogin-btn" style={{display:'inline-flex',justifyContent:'center',padding:'12px 32px',borderRadius:8,fontSize:13}}>Login with Kick</a>
          </div>
        )}
        <div className="cases-grid f2">
          {cases.map(c=>(
            <a key={c.id} href={`/gamble/${c.id}`} className="case-card">
              <div className="case-top">
                <CaseGraphic id={c.id} size={110}/>
                <span className="case-golden-badge">5% GOLDEN</span>
              </div>
              <div className="case-body">
                <div className="case-name">{c.name}</div>
                <div className="case-cost">Cost to open: {c.cost.toLocaleString()} pts</div>
              </div>
            </a>
          ))}
        </div>
      </div>
      <footer><div className="wrap"><div className="ftw">
        <p className="ftd"><strong>18+</strong> - Gamble responsibly. All outcomes are provably fair.</p>
        <div style={{display:'flex',alignItems:'center',gap:4}}><div style={{display:'flex',gap:4}}>{SOCIALS}</div><span className="ftc" style={{marginLeft:8}}>© 2026 NIKSI777</span></div>
      </div></div></footer>
    </>);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
