<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIKSI777 - Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#07080e;--s1:#0c1020;--s2:#101828;--b1:rgba(255,255,255,.04);--b2:rgba(255,255,255,.08);--b3:rgba(255,255,255,.14);--tx:#dde3ef;--mu:rgba(221,227,239,.65);--ac:#4a9eff;--rd:#e03535;--gold:#d4af5a}
    html,body{background-color:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .f1{animation:fu .5s ease both}.f2{animation:fu .5s .1s ease both}
    nav{background:rgba(6,13,26,.97);border-bottom:1px solid var(--b2);position:sticky;top:0;z-index:50}
    .ni{max-width:1200px;margin:0 auto;padding:0 28px;display:flex;align-items:center;height:56px}
    .nlogo{display:flex;align-items:center;gap:10px;padding-right:22px;border-right:1px solid var(--b2);margin-right:18px;flex-shrink:0;text-decoration:none}
    .nlogo img{height:28px;width:28px;border-radius:50%;object-fit:cover}
    .nname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.16em;color:#fff;text-transform:uppercase}
    .nlinks{display:flex;align-items:center;flex:1}
    .nlinks a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:0 13px;height:56px;display:flex;align-items:center;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;margin-bottom:-1px}
    .nlinks a:hover{color:rgba(255,255,255,.9)}
    .nlinks a.on{color:#fff;border-bottom-color:rgba(255,255,255,.5)}
    .nauth{display:flex;align-items:center;gap:8px;padding-left:12px;margin-left:auto}
    .nuser{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:7px;background:var(--s1);border:1px solid var(--b2)}
    .nuser-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover}
    .nuser-name{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--tx)}
    .nuser-NP{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--gold)}
    .wrap{max-width:1200px;margin:0 auto;padding:40px 28px 80px;position:relative;z-index:1}
    .page-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
    .page-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(28px,5vw,40px);font-weight:800;text-transform:uppercase;color:#fff;letter-spacing:-.01em}
    .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
    .stat-card{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:20px 24px}
    .stat-lbl{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
    .stat-val{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;color:#fff;line-height:1}
    .search-bar{background:var(--s1);border:1px solid var(--b2);border-radius:10px;padding:10px 16px;font-family:'Inter',sans-serif;font-size:13px;color:#fff;outline:none;width:100%;max-width:320px;transition:border-color .15s;margin-bottom:16px}
    .search-bar:focus{border-color:var(--b3)}
    .search-bar::placeholder{color:var(--mu)}
    .table-wrap{background:var(--s1);border:1px solid var(--b2);border-radius:14px;overflow:hidden}
    table{width:100%;border-collapse:collapse}
    thead th{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);padding:14px 20px;text-align:left;border-bottom:1px solid var(--b2);white-space:nowrap}
    tbody tr{border-bottom:1px solid var(--b1);transition:background .1s}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:rgba(255,255,255,.02)}
    tbody td{padding:14px 20px;font-size:13px;vertical-align:middle}
    .user-cell{display:flex;align-items:center;gap:10px}
    .user-kick-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--s2);flex-shrink:0}
    .user-kick-name{font-weight:600;color:#fff}
    .discord-cell{display:flex;align-items:center;gap:8px}
    .discord-mini-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .discord-name{color:rgba(136,145,242,.9);font-size:12px}
    .not-linked{color:var(--mu);font-size:12px;font-style:italic}
    .NP-cell{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--gold)}
    .date-cell{font-size:11px;color:var(--mu)}
    .badge-linked{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:100px;background:rgba(88,101,242,.15);color:#5865F2}
    .badge-unlinked{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:100px;background:rgba(255,255,255,.05);color:var(--mu)}
    .forbidden{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center}
    .forbidden-box{text-align:center;max-width:320px}
    .forbidden-box h2{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;text-transform:uppercase;color:var(--rd);margin-bottom:10px}
    .forbidden-box p{font-size:13px;color:var(--mu);line-height:1.6}
    .tab-bar{display:flex;gap:4px;background:var(--s1);border-radius:10px;padding:4px;border:1px solid var(--b2);width:fit-content;margin-bottom:28px}
    .tab-btn{padding:7px 22px;border-radius:7px;border:none;cursor:pointer;background:transparent;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;transition:all .15s}
    .tab-btn.on{background:rgba(255,255,255,.1);color:#fff}
    .ce-inp{background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:7px 10px;color:#fff;font-size:12px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s}
    .ce-inp:focus{border-color:var(--b3)}
    .ce-sel{background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:7px 10px;color:#fff;font-size:12px;font-family:'Inter',sans-serif;outline:none;cursor:pointer}
    .ce-lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:5px}
    .ce-table{width:100%;border-collapse:collapse}
    .ce-table th{padding:8px 10px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:left;border-bottom:1px solid var(--b2);white-space:nowrap}
    .ce-table td{padding:7px 10px;border-bottom:1px solid var(--b1);vertical-align:middle}
    .ce-table tbody tr:last-child td{border-bottom:none}
    .btn-remove{background:rgba(217,79,79,.12);border:1px solid rgba(217,79,79,.25);color:#d94f4f;border-radius:5px;padding:4px 10px;cursor:pointer;font-size:11px;font-weight:600}
    .btn-add{background:rgba(255,255,255,.05);border:1px solid var(--b2);color:var(--mu);border-radius:7px;padding:7px 14px;cursor:pointer;font-size:11px;font-weight:600;margin-top:8px}
    .btn-save{padding:10px 28px;border-radius:8px;background:#22c55e;color:#fff;border:none;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.06em}
    .btn-save:disabled{opacity:.5;cursor:not-allowed}
    @media(max-width:700px){.stat-row{grid-template-columns:1fr 1fr}.nlinks{display:none}}
  
    #constellation{position:fixed;inset:0;z-index:0;pointer-events:none}
  
    @view-transition{navigation:auto}
    @keyframes vt-out{to{opacity:0}}@keyframes vt-in{from{opacity:0}}
    ::view-transition-old(root){animation:180ms ease vt-out}
    ::view-transition-new(root){animation:180ms ease vt-in}
  </style>
</head>
<body>
<canvas id="constellation"></canvas>

<div id="root"></div>
<script type="text/babel">

  function useSession() {
    const [user, setUser] = React.useState(() => { try { const c = localStorage.getItem('kick_user'); return c ? JSON.parse(c) : null; } catch { return null; } });
    const [sessionId, setSessionId] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    React.useEffect(() => {
      const params = new URLSearchParams(window.location.search);
      const sid = params.get('session') || localStorage.getItem('kick_session');
      if (sid) {
        localStorage.setItem('kick_session', sid);
        setSessionId(sid);
        fetch(`/auth/me?session=${sid}`)
          .then(r => r.ok ? r.json() : null)
          .then(d => { if (d) { setUser(d); localStorage.setItem('kick_user', JSON.stringify(d)); } else { localStorage.removeItem('kick_session'); localStorage.removeItem('kick_user'); setUser(null); } })
          .finally(() => setLoading(false));
        if (params.get('session')) window.history.replaceState({}, '', '/admin');
      } else { setLoading(false); }
    }, []);
    return { user, sessionId, loading };
  }

  function Navbar({ user }) {
    return (
      <nav>
        <div className="ni">
          <a href="/" className="nlogo"><img src="/assets/niksi.png" alt="NIKSI777"/><span className="nname">NIKSI777</span></a>
          <div className="nlinks">
            <a href="/">HOME</a>
            <a href="/leaderboards">LEADERBOARDS</a>
            <a href="/points">POINTS</a>
            <a href="/store">STORE</a><a href="/cases">CASES</a><a href="/predict">PREDICT</a>
            
            {user && user.isAdmin && <a href="/admin" className="on">ADMIN</a>}
            <a href="/settings">SETTINGS</a>
          </div>
          <div className="nauth">
            {user && (
              <div className="nuser">
                {user.avatar && <img className="nuser-avatar" src={user.avatar} alt={user.displayName}/>}
                <span className="nuser-name">{user.displayName}</span>
                <span className="nuser-NP">{(user.points||0).toLocaleString()} NP</span>
              </div>
            )}
          </div>
        </div>
      </nav>
    );
  }

  function fmtDate(iso) {
    if (!iso) return '-';
    return new Date(iso).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }

  function App() {
    const { user, sessionId, loading } = useSession();
    const [tab, setTab] = React.useState('users');
    const [accounts, setAccounts] = React.useState([]);
    const [fetching, setFetching] = React.useState(false);
    const [search, setSearch] = React.useState('');

    React.useEffect(() => {
      if (!user || !user.isAdmin || !sessionId) return;
      setFetching(true);
      fetch(`/admin/accounts?session=${sessionId}`)
        .then(r => r.json())
        .then(data => { if (Array.isArray(data)) setAccounts(data); })
        .finally(() => setFetching(false));
    }, [user, sessionId]);

    if (loading) return <Navbar user={null}/>;

    if (!user || !user.isAdmin) return (
      <>
        <Navbar user={user}/>
        <div className="forbidden">
          <div className="forbidden-box">
            <h2>Access Denied</h2>
            <p>This page is restricted to admins only.</p>
          </div>
        </div>
      </>
    );

    const filtered = accounts.filter(a =>
      !search ||
      a.kickUsername?.toLowerCase().includes(search.toLowerCase()) ||
      a.discordName?.toLowerCase().includes(search.toLowerCase())
    );
    const linkedCount = accounts.filter(a => a.discordId).length;
    const totalPts = accounts.reduce((s, a) => s + (a.points || 0), 0);

    return (
      <>
        <Navbar user={user}/>
        <div className="wrap">
          <div className="page-header f1">
            <div className="page-title">Admin Panel</div>
          </div>

          {/* Tab bar */}
          <div className="tab-bar f1">
            <button className={`tab-btn${tab==='users'?' on':''}`} onClick={()=>setTab('users')}>Users</button>
            <button className={`tab-btn${tab==='cases'?' on':''}`} onClick={()=>setTab('cases')}>Cases</button>
            <button className={`tab-btn${tab==='leaderboard'?' on':''}`} onClick={()=>setTab('leaderboard')}>Leaderboard</button>
          </div>

          {tab==='cases' ? <CasesEditor sessionId={sessionId}/> : tab==='leaderboard' ? <LeaderboardManager sessionId={sessionId}/> : <>

          {/* Points Manager - top bar */}
          <div style={{background:'var(--s1)',border:'1px solid var(--b2)',borderRadius:12,padding:'16px 20px',marginBottom:24}} className="f1">
            <PointsManager sessionId={sessionId}/>
          </div>

          <div className="stat-row f1">
            <div className="stat-card">
              <div className="stat-lbl">Total Accounts</div>
              <div className="stat-val">{accounts.length}</div>
            </div>
            <div className="stat-card">
              <div className="stat-lbl">Discord Linked</div>
              <div className="stat-val">{linkedCount}</div>
            </div>
            <div className="stat-card">
              <div className="stat-lbl">Total NiksiPoints</div>
              <div className="stat-val">{totalPts.toLocaleString()}</div>
            </div>
          </div>

          <input
            className="search-bar f2"
            placeholder="Search by Kick or Discord username..."
            value={search}
            onChange={e => setSearch(e.target.value)}
          />

          <div className="table-wrap f2">
            {fetching ? (
              <div style={{padding:40,textAlign:'center',color:'var(--mu)'}}>Loading accounts...</div>
            ) : filtered.length === 0 ? (
              <div style={{padding:40,textAlign:'center',color:'var(--mu)'}}>No accounts found.</div>
            ) : (
              <table>
                <thead>
                  <tr>
                    <th>Kick Account</th>
                    <th>Discord</th>
                    <th>Status</th>
                    <th>NiksiPoints</th>
                    <th>First Seen</th>
                    <th>Last Seen</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((a, i) => (
                    <tr key={i}>
                      <td>
                        <div className="user-cell">
                          {a.kickAvatar && <img className="user-kick-avatar" src={a.kickAvatar} alt={a.kickDisplayName}/>}
                          <div>
                            <div className="user-kick-name">{a.kickDisplayName || a.kickUsername}</div>
                            <div style={{fontSize:11,color:'var(--mu)'}}>@{a.kickUsername}</div>
                          </div>
                        </div>
                      </td>
                      <td>
                        {a.discordId ? (
                          <div className="discord-cell">
                            {a.discordAvatar && <img className="discord-mini-avatar" src={a.discordAvatar} alt={a.discordName}/>}
                            <span className="discord-name">{a.discordName}</span>
                          </div>
                        ) : (
                          <span className="not-linked">Not linked</span>
                        )}
                      </td>
                      <td>
                        {a.discordId
                          ? <span className="badge-linked">✓ Linked</span>
                          : <span className="badge-unlinked">Unlinked</span>
                        }
                      </td>
                      <td><span className="NP-cell">{(a.points||0).toLocaleString()}</span></td>
                      <td><span className="date-cell">{fmtDate(a.firstSeen)}</span></td>
                      <td><span className="date-cell">{fmtDate(a.lastSeen)}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>

        </>}
        </div>
      </>
    );
  }

  const RARITIES=['bust','blue','purple','pink','gold','gold-ultra','golden-trigger'];

  const CASE_THEMES={
    starter:{lid:'#1a3a6a',body:'#0d1e38',accent:'#4a90d9',glow:'rgba(74,144,217,.5)',stars:1,stripe:'rgba(74,144,217,.15)'},
    premium:{lid:'#2a1a5a',body:'#150d2e',accent:'#9b59d9',glow:'rgba(155,89,217,.5)',stars:2,stripe:'rgba(155,89,217,.15)'},
    elite:  {lid:'#0d2a3a',body:'#061520',accent:'#00bcd4',glow:'rgba(0,188,212,.5)',stars:3,stripe:'rgba(0,188,212,.15)'},
    mega:   {lid:'#3a2000',body:'#1e1000',accent:'#e8a427',glow:'rgba(232,164,39,.6)',stars:4,stripe:'rgba(232,164,39,.15)'},
    flip:   {lid:'#003a1a',body:'#001810',accent:'#22c55e',glow:'rgba(34,197,94,.5)', stars:0,stripe:'rgba(34,197,94,.12)'},
    lucky:  {lid:'#2a0030',body:'#160018',accent:'#cc44ff',glow:'rgba(200,64,255,.6)', stars:0,stripe:'rgba(200,64,255,.1)'},
  };
  function CaseGraphic({id,size=120}){
    const t=CASE_THEMES[id]||CASE_THEMES.starter;
    const FW=84,FH=70,LID=24,DX=26,DY=16;
    const VW=FW+DX,VH=FH+DY;
    const cx=FW/2,lidY=DY+LID;
    const logoR=13,logoCX=cx,logoCY=lidY+(FH-LID)/2;
    const a=t.accent;
    
    return(
      <svg viewBox={`0 0 ${VW} ${VH}`} width={size} height={Math.round(size*VH/VW)}
           style={{display:'block',filter:`drop-shadow(0 8px 20px ${t.glow})`}}>
        <defs>
          <linearGradient id={`gf-${id}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={t.lid}/><stop offset="100%" stopColor={t.body}/></linearGradient>
          <linearGradient id={`gl-${id}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={t.lid} stopOpacity=".9"/><stop offset="100%" stopColor={t.lid} stopOpacity=".6"/></linearGradient>
          <clipPath id={`lc-${id}`}><circle cx={logoCX} cy={logoCY} r={logoR}/></clipPath>
        </defs>
        <polygon points={`0,${DY} ${DX},0 ${VW},0 ${FW},${DY}`} fill={t.lid}/>
        <polygon points={`0,${DY} ${DX},0 ${VW},0 ${FW},${DY}`} fill="rgba(255,255,255,.13)"/>
        <polygon points={`${FW},${DY} ${VW},0 ${VW},${LID} ${FW},${lidY}`} fill={t.body}/>
        <polygon points={`${FW},${DY} ${VW},0 ${VW},${LID} ${FW},${lidY}`} fill="rgba(0,0,0,.4)"/>
        <polygon points={`${FW},${lidY} ${VW},${LID} ${VW},${FH} ${FW},${FH+DY}`} fill={t.body}/>
        <polygon points={`${FW},${lidY} ${VW},${LID} ${VW},${FH} ${FW},${FH+DY}`} fill="rgba(0,0,0,.55)"/>
        <rect x="0" y={DY} width={FW} height={LID} fill={`url(#gl-${id})`}/>
        <rect x="0" y={lidY} width={FW} height={FH-LID} fill={`url(#gf-${id})`}/>
        <rect x="0" y={lidY} width={FW} height={FH-LID} fill={t.stripe} opacity=".5"/>
        <polygon points={`0,${DY} ${FW},${DY} ${FW},${FH+DY} 0,${FH+DY}`} fill="none" stroke={a} strokeWidth=".8" strokeOpacity=".5"/>
        <polygon points={`0,${DY} ${DX},0 ${VW},0 ${FW},${DY}`} fill="none" stroke={a} strokeWidth=".8" strokeOpacity=".4"/>
        <polygon points={`${FW},${DY} ${VW},0 ${VW},${FH} ${FW},${FH+DY}`} fill="none" stroke={a} strokeWidth=".8" strokeOpacity=".4"/>
        <line x1="0" y1={lidY} x2={FW} y2={lidY} stroke={a} strokeWidth="2" strokeOpacity=".8"/>
        <line x1={FW} y1={lidY} x2={VW} y2={LID} stroke={a} strokeWidth="1.5" strokeOpacity=".6"/>
        <polyline points={`0,${DY+11} 0,${DY} 11,${DY}`} fill="none" stroke={a} strokeWidth="3" strokeLinecap="square" strokeOpacity=".85"/>
        <polyline points={`${FW-11},${DY} ${FW},${DY} ${FW},${DY+11}`} fill="none" stroke={a} strokeWidth="3" strokeLinecap="square" strokeOpacity=".85"/>
        <polyline points={`0,${FH+DY-11} 0,${FH+DY} 11,${FH+DY}`} fill="none" stroke={a} strokeWidth="3" strokeLinecap="square" strokeOpacity=".85"/>
        <polyline points={`${FW-11},${FH+DY} ${FW},${FH+DY} ${FW},${FH+DY-11}`} fill="none" stroke={a} strokeWidth="3" strokeLinecap="square" strokeOpacity=".85"/>
        <line x1={FW} y1={DY} x2={VW} y2="0" stroke={a} strokeWidth="2.5" strokeLinecap="round" strokeOpacity=".7"/>
        <line x1={FW} y1={FH+DY} x2={VW} y2={FH} stroke={a} strokeWidth="2.5" strokeLinecap="round" strokeOpacity=".6"/>
        <rect x={cx-9} y={lidY-7} width="18" height="13" rx="3" fill={t.body} stroke={a} strokeWidth="1.5"/>
        <path d={`M ${cx-5} ${lidY-7} a5 5 0 0 1 10 0`} fill="none" stroke={a} strokeWidth="1.8" strokeLinecap="round"/>
        <circle cx={cx} cy={lidY} r="2.5" fill={a} opacity=".9"/>
        <circle cx={logoCX} cy={logoCY} r={logoR+3} fill="rgba(0,0,0,.3)" stroke={a} strokeWidth="1.5" strokeOpacity=".7"/>
        <image href="/assets/niksi.png" x={logoCX-logoR} y={logoCY-logoR} width={logoR*2} height={logoR*2} clipPath={`url(#lc-${id})`}/>
      </svg>
    );
  }

  function ItemsTable({items,pool,showIsGolden,showStoreItem,onUpdate,onAdd,onRemove,onMove,goldenTriggerPct}){
    const isGoldenPool = pool==='goldenItems';
    const totalPct=items.reduce((s,i)=>s+Number(i._pct||0),0);
    const target = isGoldenPool ? (goldenTriggerPct||5) : 100;
    const pctOk=Math.abs(totalPct-target)<0.05;
    const displayed = items.map((item,origIdx)=>({item,origIdx}));
    return(
      <div style={{marginBottom:24}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:8}}>
          <div className="ce-lbl" style={{marginBottom:0}}>{isGoldenPool?'Golden Spin Pool (% = actual overall chance)':'Main Pool'}</div>
          <div style={{fontSize:12,fontWeight:700,color:pctOk?'#22c55e':'#e8a427'}}>
            {totalPct.toFixed(isGoldenPool?4:2)}% total {pctOk?'✓':isGoldenPool?`— should equal ${target.toFixed(2)}%`:'— must equal 100%'}
          </div>
        </div>
        <div style={{background:'var(--s2)',borderRadius:10,overflow:'auto',border:'1px solid var(--b1)'}}>
          <table className="ce-table">
            <thead>
              <tr>
                <th></th><th>Name</th><th>NiksiPoints</th><th>%</th><th>Rarity</th>
                {showIsGolden&&<th>Golden?</th>}
                {showStoreItem&&<th>Store item?</th>}
                <th></th>
              </tr>
            </thead>
            <tbody>
              {displayed.map(({item,origIdx})=>(
                <tr key={origIdx}>
                  <td style={{padding:'4px 6px'}}>
                    <div style={{display:'flex',flexDirection:'column',gap:2}}>
                      <button onClick={()=>onMove(origIdx,origIdx-1)} disabled={origIdx===0} style={{background:'none',border:'1px solid var(--b2)',color:'var(--mu)',borderRadius:4,cursor:'pointer',padding:'1px 5px',fontSize:11,lineHeight:1}}>↑</button>
                      <button onClick={()=>onMove(origIdx,origIdx+1)} disabled={origIdx===items.length-1} style={{background:'none',border:'1px solid var(--b2)',color:'var(--mu)',borderRadius:4,cursor:'pointer',padding:'1px 5px',fontSize:11,lineHeight:1}}>↓</button>
                    </div>
                  </td>
                  <td><input className="ce-inp" value={item.name} onChange={e=>onUpdate(origIdx,'name',e.target.value)} style={{width:150}}/></td>
                  <td><input className="ce-inp" type="number" value={item.points} onChange={e=>onUpdate(origIdx,'points',Number(e.target.value))} style={{width:80}}/></td>
                  <td><input className="ce-inp" type="number" step={isGoldenPool?'0.0001':'0.01'} value={item._pct??0} onChange={e=>onUpdate(origIdx,'_pct',parseFloat(e.target.value)||0)} style={{width:90}}/></td>
                  <td>
                    <select className="ce-sel" value={item.rarity} onChange={e=>onUpdate(origIdx,'rarity',e.target.value)}>
                      {RARITIES.map(r=><option key={r} value={r}>{r}</option>)}
                    </select>
                  </td>
                  {showIsGolden&&<td style={{textAlign:'center'}}><input type="checkbox" checked={!!item.isGolden} onChange={e=>onUpdate(origIdx,'isGolden',e.target.checked)}/></td>}
                  {showStoreItem&&<td style={{textAlign:'center'}}><input type="checkbox" checked={!!item.storeItem} onChange={e=>onUpdate(origIdx,'storeItem',e.target.checked)}/></td>}
                  <td><button className="btn-remove" onClick={()=>onRemove(origIdx)}>Remove</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <button className="btn-add" onClick={onAdd}>+ Add Item</button>
      </div>
    );
  }

  function CasesEditor({sessionId}){
    const [cases,setCases]=React.useState(null);
    const [activeIdx,setActiveIdx]=React.useState(0);
    const [saving,setSaving]=React.useState(false);
    const [msg,setMsg]=React.useState('');

    function injectPcts(d){
      d.forEach(cas=>{
        // Main pool: _pct = within-pool %
        const mainTW=(cas.items||[]).reduce((s,i)=>s+Number(i.weight||0),0);
        (cas.items||[]).forEach(item=>{item._pct=mainTW>0?parseFloat((item.weight/mainTW*100).toFixed(2)):0;});
        // Golden pool: _pct = OVERALL probability (golden_trigger_pct * within_pool_pct)
        const goldenTriggerPct=mainTW>0?(cas.items||[]).filter(i=>i.isGolden).reduce((s,i)=>s+i.weight,0)/mainTW*100:5;
        const goldenTW=(cas.goldenItems||[]).reduce((s,i)=>s+Number(i.weight||0),0);
        (cas.goldenItems||[]).forEach(item=>{
          item._pct=goldenTW>0?parseFloat(((item.weight/goldenTW)*goldenTriggerPct).toFixed(4)):0;
        });
      });
      return d;
    }

    React.useEffect(()=>{
      fetch('/admin/cases',{headers:{'x-session-id':sessionId}})
        .then(r=>r.json())
        .then(d=>{if(Array.isArray(d))setCases(injectPcts(JSON.parse(JSON.stringify(d))));});
    },[sessionId]);

    function setField(cIdx,field,val){
      setCases(prev=>{const n=JSON.parse(JSON.stringify(prev));n[cIdx][field]=val;return n;});
    }
    function setItem(cIdx,pool,iIdx,field,val){
      setCases(prev=>{const n=JSON.parse(JSON.stringify(prev));n[cIdx][pool][iIdx][field]=val;return n;});
    }
    function addItem(cIdx,pool){
      setCases(prev=>{const n=JSON.parse(JSON.stringify(prev));n[cIdx][pool].push({name:'New Item',points:0,weight:10,rarity:'bust',_pct:0});return n;});
    }
    function removeItem(cIdx,pool,iIdx){
      setCases(prev=>{const n=JSON.parse(JSON.stringify(prev));n[cIdx][pool].splice(iIdx,1);return n;});
    }
    function moveItem(cIdx,pool,fromIdx,toIdx){
      setCases(prev=>{
        const n=JSON.parse(JSON.stringify(prev));
        const arr=n[cIdx][pool];
        if(toIdx<0||toIdx>=arr.length)return n;
        const tmp=arr[fromIdx];arr[fromIdx]=arr[toIdx];arr[toIdx]=tmp;
        return n;
      });
    }

    async function save(){
      setSaving(true);setMsg('');
      try{
        // Convert _pct → weight, strip _pct before sending
        const cleaned=JSON.parse(JSON.stringify(cases));
        cleaned.forEach(cas=>{
          // Main pool: weights from within-pool %
          if(cas.items){
            const sum=cas.items.reduce((s,i)=>s+Number(i._pct||0),0);
            cas.items.forEach(item=>{item.weight=sum>0?Math.round(Number(item._pct||0)/sum*1000):item.weight;delete item._pct;});
          }
          // Golden pool: overall % back to within-pool weight
          if(cas.goldenItems&&cas.goldenItems.length){
            const mainTW=(cas.items||[]).reduce((s,i)=>s+i.weight,0);
            const goldenTriggerPct=mainTW>0?(cas.items||[]).filter(i=>i.isGolden).reduce((s,i)=>s+i.weight,0)/mainTW*100:5;
            const sumOverall=cas.goldenItems.reduce((s,i)=>s+Number(i._pct||0),0);
            cas.goldenItems.forEach(item=>{
              const withinPool=sumOverall>0?Number(item._pct||0)/sumOverall:0;
              item.weight=Math.round(withinPool*1000);
              delete item._pct;
            });
          }
        });
        const r=await fetch('/admin/cases',{method:'POST',headers:{'Content-Type':'application/json','x-session-id':sessionId},body:JSON.stringify({cases:cleaned,session:sessionId})});
        const d=await r.json();
        if(r.ok){setCases(injectPcts(JSON.parse(JSON.stringify(cleaned))));}
        setMsg(r.ok?'✓ Saved':d.error||'Error');
      }catch(e){setMsg('Network error');}
      setSaving(false);
      setTimeout(()=>setMsg(''),3000);
    }

    if(!cases)return <div style={{padding:'40px 0',textAlign:'center',color:'var(--mu)'}}>Loading cases...</div>;
    const c=cases[activeIdx];

    return(
      <div className="f2">
        {/* Case selector tabs */}
        <div style={{display:'flex',gap:8,marginBottom:24,flexWrap:'wrap'}}>
          {cases.map((cas,i)=>{
            const t=CASE_THEMES[cas.id]||CASE_THEMES.starter;
            return(
              <button key={i} onClick={()=>setActiveIdx(i)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,padding:'12px 20px',borderRadius:10,border:'1px solid',borderColor:activeIdx===i?t.accent:'var(--b2)',background:activeIdx===i?`rgba(${t.accent.replace(/[^,\d]/g,'').slice(0,-1)},.08)`:'transparent',cursor:'pointer',transition:'all .15s'}}>
                <CaseGraphic id={cas.id} size={60}/>
                <span style={{fontSize:12,fontWeight:700,color:activeIdx===i?'#fff':'var(--mu)',letterSpacing:'.06em',textTransform:'uppercase'}}>{cas.name}</span>
              </button>
            );
          })}
        </div>

        {/* Case header fields */}
        <div style={{background:'var(--s1)',border:'1px solid var(--b2)',borderRadius:12,padding:'20px',marginBottom:24}}>
          <div style={{display:'flex',gap:16,flexWrap:'wrap',alignItems:'flex-end'}}>
            <div><div className="ce-lbl">Case Name</div><input className="ce-inp" value={c.name} onChange={e=>setField(activeIdx,'name',e.target.value)} style={{width:180}}/></div>
            <div><div className="ce-lbl">Cost (NP)</div><input className="ce-inp" type="number" value={c.cost} onChange={e=>setField(activeIdx,'cost',Number(e.target.value))} style={{width:100}}/></div>
            <div><div className="ce-lbl">Emoji</div><input className="ce-inp" value={c.emoji||''} onChange={e=>setField(activeIdx,'emoji',e.target.value)} style={{width:60}}/></div>
          </div>
        </div>

        {/* Item tables */}
        <div style={{background:'var(--s1)',border:'1px solid var(--b2)',borderRadius:12,padding:'20px',marginBottom:24}}>
          <ItemsTable items={c.items} pool="items" showIsGolden={true} showStoreItem={false}
            onUpdate={(i,f,v)=>setItem(activeIdx,'items',i,f,v)}
            onAdd={()=>addItem(activeIdx,'items')}
            onRemove={i=>removeItem(activeIdx,'items',i)}
            onMove={(f,t)=>moveItem(activeIdx,'items',f,t)}/>
          {(c.goldenItems&&c.goldenItems.length>0)&&(()=>{
            const mainTW=(c.items||[]).reduce((s,i)=>s+Number(i.weight||0),0);
            const goldenTriggerPct=mainTW>0?(c.items||[]).filter(i=>i.isGolden).reduce((s,i)=>s+Number(i.weight||0),0)/mainTW*100:5;
            return<ItemsTable items={c.goldenItems} pool="goldenItems" showIsGolden={false} showStoreItem={true}
              goldenTriggerPct={goldenTriggerPct}
              onUpdate={(i,f,v)=>setItem(activeIdx,'goldenItems',i,f,v)}
              onAdd={()=>addItem(activeIdx,'goldenItems')}
              onRemove={i=>removeItem(activeIdx,'goldenItems',i)}
              onMove={(f,t)=>moveItem(activeIdx,'goldenItems',f,t)}/>;
          })()}
        </div>

        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <button className="btn-save" onClick={save} disabled={saving}>{saving?'Saving...':'Save All Cases'}</button>
          {msg&&<span style={{fontSize:13,color:msg.includes('✓')?'#22c55e':'#ef4444'}}>{msg}</span>}
        </div>
      </div>
    );
  }

  function PointsManager({sessionId}){
    const [username,setUsername]=React.useState('');
    const [amount,setAmount]=React.useState('');
    const [action,setAction]=React.useState('add');
    const [msg,setMsg]=React.useState('');
    const [err,setErr]=React.useState('');
    const [loading,setLoading]=React.useState(false);

    async function submit(){
      if(!username.trim()||!amount.trim())return;
      setLoading(true);setMsg('');setErr('');
      try{
        const r=await fetch('/admin/points',{
          method:'POST',
          headers:{'Content-Type':'application/json','x-session-id':sessionId},
          body:JSON.stringify({username:username.trim().toLowerCase(),amount:Number(amount),action,session:sessionId})
        });
        const d=await r.json();
        if(!r.ok){setErr(d.error||'Error');}
        else{setMsg(`${action==='add'?'Added':'Removed'} ${amount} NP - ${d.username} now has ${d.newBalance.toLocaleString()} NP`);}
      }catch{setErr('Connection error');}
      setLoading(false);
    }

    return(
      <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          <label style={{fontSize:11,color:'var(--mu)',letterSpacing:'.1em',textTransform:'uppercase'}}>Username (Kick)</label>
          <input className="search-bar" style={{marginBottom:0,width:200}} placeholder="" value={username} onChange={e=>setUsername(e.target.value)} autoComplete="nope"/>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          <label style={{fontSize:11,color:'var(--mu)',letterSpacing:'.1em',textTransform:'uppercase'}}>Amount</label>
          <input className="search-bar" style={{marginBottom:0,width:120}} type="number" min="1" placeholder="" value={amount} onChange={e=>setAmount(e.target.value)} autoComplete="nope"/>
        </div>
        <div style={{display:'flex',gap:8}}>
          {['add','remove','set'].map(a=>(
            <button key={a} onClick={()=>setAction(a)} style={{padding:'10px 16px',borderRadius:8,border:`1px solid ${action===a?'rgba(255,255,255,.3)':'rgba(255,255,255,.1)'}`,background:action===a?'rgba(255,255,255,.12)':'rgba(255,255,255,.04)',color:action===a?'#fff':'var(--mu)',cursor:'pointer',fontSize:12,fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',transition:'all .15s'}}>
              {a}
            </button>
          ))}
        </div>
        <button onClick={submit} disabled={loading||!username||!amount} style={{padding:'10px 24px',borderRadius:8,border:'none',background:'#22c55e',color:'#fff',cursor:'pointer',fontSize:13,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',opacity:loading||!username||!amount?0.4:1}}>
          {loading?'...':'Apply'}
        </button>
        {msg&&<div style={{fontSize:12,color:'#22c55e',marginTop:4,width:'100%'}}>{msg}</div>}
        {err&&<div style={{fontSize:12,color:'var(--rd)',marginTop:4,width:'100%'}}>{err}</div>}
      </div>
    );
  }

  function LeaderboardManager({sessionId}){
    const [history,setHistory]=React.useState([]);
    const [label,setLabel]=React.useState('');
    const [loading,setLoading]=React.useState(false);
    const [fetching,setFetching]=React.useState(true);
    const [msg,setMsg]=React.useState('');
    const [err,setErr]=React.useState('');

    const [krushMeta,setKrushMeta]=React.useState(null);
    const [krushLoading,setKrushLoading]=React.useState(false);
    const [krushMsg,setKrushMsg]=React.useState('');

    function loadKrushMeta(){
      fetch('/krush-meta').then(r=>r.json()).then(setKrushMeta).catch(()=>{});
    }
    React.useEffect(()=>{ loadKrushMeta(); },[]);

    async function startKrush(){
      if(krushMeta && krushMeta.active && !window.confirm('A Krush.gg race is already active. Start a new 30-day race now? This resets the current standings.')) return;
      setKrushLoading(true);setKrushMsg('');
      try{
        const r=await fetch(`/admin/krush/start?session=${sessionId}`,{
          method:'POST',
          headers:{'Content-Type':'application/json','x-session-id':sessionId},
          body:JSON.stringify({session:sessionId})
        });
        const d=await r.json();
        if(!r.ok){setKrushMsg(d.error||'Error');}
        else{setKrushMsg(`Race started! Ends ${new Date(d.end).toLocaleDateString()}`);loadKrushMeta();}
      }catch{setKrushMsg('Connection error');}
      setKrushLoading(false);
    }

    function loadHistory(){
      setFetching(true);
      fetch('/lb-history').then(r=>r.json()).then(d=>setHistory(Array.isArray(d)?d.slice().reverse():[])).finally(()=>setFetching(false));
    }
    React.useEffect(()=>{ loadHistory(); },[]);

    async function snapshot(){
      setLoading(true);setMsg('');setErr('');
      try{
        const r=await fetch(`/admin/leaderboard/snapshot?session=${sessionId}`,{
          method:'POST',
          headers:{'Content-Type':'application/json','x-session-id':sessionId},
          body:JSON.stringify({label:label.trim()||undefined,session:sessionId})
        });
        const d=await r.json();
        if(!r.ok){setErr(d.error||'Error');}
        else{setMsg(`Saved "${d.entry.label}" - ${d.entry.totalUsers} players, $${Number(d.entry.totalWagered).toLocaleString('en-US',{maximumFractionDigits:2})} wagered`);setLabel('');loadHistory();}
      }catch{setErr('Connection error');}
      setLoading(false);
    }

    return(
      <div>
        <div style={{background:'var(--s1)',border:'1px solid rgba(155,92,255,.3)',borderRadius:12,padding:'16px 20px',marginBottom:24}} className="f1">
          <div style={{fontSize:13,color:'var(--mu)',marginBottom:12,lineHeight:1.5}}>
            Krush.gg 30-day wager race - $1,000 prize pool (50/20/10/6/4/3/2.5/2/1.5/1%). Starting it locks in "now" as day 1; it'll auto-stop accepting new data after 30 days.
          </div>
          {krushMeta && krushMeta.active ? (
            <div style={{fontSize:13,color:'#9b5cff',marginBottom:12}}>
              Active - started {new Date(krushMeta.start).toLocaleDateString()}, ends {new Date(krushMeta.end).toLocaleDateString()}
            </div>
          ) : (
            <div style={{fontSize:13,color:'var(--mu)',marginBottom:12}}>Not started yet.</div>
          )}
          <button onClick={startKrush} disabled={krushLoading} style={{padding:'10px 24px',borderRadius:8,border:'none',background:'#9b5cff',color:'#fff',cursor:'pointer',fontSize:13,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',opacity:krushLoading?0.4:1}}>
            {krushLoading?'Starting...':(krushMeta&&krushMeta.active?'Restart 30-Day Race':'Start 30-Day Race')}
          </button>
          {krushMsg&&<div style={{fontSize:12,color:'#9b5cff',marginTop:10}}>{krushMsg}</div>}
        </div>

        <div style={{background:'var(--s1)',border:'1px solid var(--b2)',borderRadius:12,padding:'16px 20px',marginBottom:24}} className="f1">
          <div style={{fontSize:13,color:'var(--mu)',marginBottom:12,lineHeight:1.5}}>
            Paste a Gamba leaderboard URL (e.g. gamba.com/promotions/exclusive-leaderboards/13300) to pull that exact race's players, wagers and prizes straight from Gamba and archive it. Leave it blank to just snapshot whatever's currently live. The "Previous Leaderboards" popup on the site pulls from every entry saved here.
          </div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              <label style={{fontSize:11,color:'var(--mu)',letterSpacing:'.1em',textTransform:'uppercase'}}>Gamba Leaderboard URL or Label</label>
              <input className="search-bar" style={{marginBottom:0,width:340}} placeholder="https://gamba.com/promotions/exclusive-leaderboards/13300" value={label} onChange={e=>setLabel(e.target.value)} autoComplete="nope"/>
            </div>
            <button onClick={snapshot} disabled={loading} style={{padding:'10px 24px',borderRadius:8,border:'none',background:'#22c55e',color:'#fff',cursor:'pointer',fontSize:13,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',opacity:loading?0.4:1}}>
              {loading?'Saving...':'Save Leaderboard'}
            </button>
          </div>
          {msg&&<div style={{fontSize:12,color:'#22c55e',marginTop:10}}>{msg}</div>}
          {err&&<div style={{fontSize:12,color:'var(--rd)',marginTop:10}}>{err}</div>}
        </div>

        <div className="table-wrap f2">
          {fetching ? (
            <div style={{padding:40,textAlign:'center',color:'var(--mu)'}}>Loading history...</div>
          ) : history.length===0 ? (
            <div style={{padding:40,textAlign:'center',color:'var(--mu)'}}>No recorded leaderboards yet.</div>
          ) : (
            <table>
              <thead>
                <tr>
                  <th>Label</th>
                  <th>Period</th>
                  <th>Prize Pool</th>
                  <th>Total Wagered</th>
                  <th>Players</th>
                </tr>
              </thead>
              <tbody>
                {history.map((h,i)=>(
                  <tr key={h.id||i}>
                    <td style={{fontWeight:600,color:'#fff'}}>{h.label}</td>
                    <td style={{color:'var(--mu)',fontSize:12}}>{h.start||'?'} → {h.end||'?'}</td>
                    <td>${Number(h.prizePool||0).toLocaleString('en-US')}</td>
                    <td>${Number(h.totalWagered||0).toLocaleString('en-US',{maximumFractionDigits:2})}</td>
                    <td>{h.totalUsers??(h.entries?h.entries.length:0)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
(function(){
  var canvas = document.getElementById('constellation');
  var ctx = canvas.getContext('2d');
  var N = 110, DIST = 140;
  var W, H, pts = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  function mkPt(){ return { x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25, r:Math.random()*1.2+.4, o:Math.random()*.45+.1 }; }
  function init(){ resize(); pts=[]; for(var i=0;i<N;i++) pts.push(mkPt()); }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<N;i++){
      var a=pts[i];
      for(var j=i+1;j<N;j++){
        var b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<DIST){ ctx.beginPath(); ctx.strokeStyle='rgba(130,170,255,'+((1-d/DIST)*.12)+')'; ctx.lineWidth=.6; ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      }
    }
    for(var i=0;i<N;i++){
      var p=pts[i]; p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='rgba(160,190,255,'+p.o+')'; ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  init(); window.addEventListener('resize', resize); tick();
})();
</script>
