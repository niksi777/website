<script>
(function(){
  const canvas = document.getElementById('constellation');
  const ctx = canvas.getContext('2d');
  const N = 110, DIST = 140;
  let W, H, pts = [];

  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }

  function mkPt(){
    return { x: Math.random()*W, y: Math.random()*H,
             vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25,
             r: Math.random()*1.2+.4, o: Math.random()*.45+.1 };
  }

  function init(){ resize(); pts = Array.from({length:N}, mkPt); }

  function tick(){
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<N;i++){
      const a = pts[i];
      for(let j=i+1;j<N;j++){
        const b = pts[j];
        const dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<DIST){
          ctx.beginPath();
          ctx.strokeStyle=`rgba(130,170,255,${(1-d/DIST)*.12})`;
          ctx.lineWidth=.6;
          ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(160,190,255,${p.o})`;
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }

  init();
  window.addEventListener('resize', resize);
  tick();
})();
</script>

function useSession() {
  const [user, setUser] = React.useState(null);
  const [sessionId, setSessionId] = React.useState(null);
  React.useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const sid = params.get('session') || localStorage.getItem('kick_session');
    if (sid) {
      localStorage.setItem('kick_session', sid);
      setSessionId(sid);
      fetch('/auth/me?session=' + sid).then(r => r.ok ? r.json() : null)
        .then(d => { if (d) setUser(d); else localStorage.removeItem('kick_session'); }).catch(() => {});
      if (params.get('session')) window.history.replaceState({}, '', window.location.pathname);
    }
  }, []);
  function logout() {
    const sid = localStorage.getItem('kick_session');
    if (sid) fetch('/auth/logout?session=' + sid);
    localStorage.removeItem('kick_session'); setUser(null);
  }
  return { user, sessionId, logout };
}

function Countdown({ endDate }) {
  const calc = () => {
    const diff = Math.max(0, new Date(endDate) - Date.now());
    return {
      d: Math.floor(diff / 86400000),
      h: Math.floor((diff % 86400000) / 3600000),
      m: Math.floor((diff % 3600000) / 60000),
      s: Math.floor((diff % 60000) / 1000)
    };
  };
  const [t, setT] = React.useState(calc);
  React.useEffect(() => {
    const iv = setInterval(() => setT(calc()), 1000);
    return () => clearInterval(iv);
  }, [endDate]);
  const pad = n => String(n).padStart(2, '0');
  return (
    <div className="countdown">
      <span className="countdown-lbl">Ends in</span>
      {[['d','Days'],['h','Hours'],['m','Mins'],['s','Secs']].map(([k,lbl],i) => (
        <React.Fragment key={k}>
          {i > 0 && <span className="cd-sep">:</span>}
          <div className="cd-unit">
            <div className="cd-num">{pad(t[k])}</div>
            <div className="cd-label">{lbl}</div>
          </div>
        </React.Fragment>
      ))}
    </div>
  );
}

function Avatar({ src, className }) {
  const [err, setErr] = React.useState(false);
  if (err || !src) return <div className={className} style={{background:'#1a2740',borderRadius:'50%'}}/>;
  return <img className={className} src={src} alt="" onError={() => setErr(true)}/>;
}

function PodiumCard({ player, rank, accentColor, fmtPrize, fmtWager }) {
  const cls = rank === 1 ? 'podium-card first' : rank === 2 ? 'podium-card second' : 'podium-card third';
  const badgeCls = `rank-badge r${rank}`;
  return (
    <div className={cls}>
      <div className={badgeCls}>{rank}</div>
      {rank === 1 && <div className="crown">👑</div>}
      <Avatar src={player.avatar || player.image_url} className={`pod-avatar${rank===1?' first':''}`}/>
      <div className={`pod-name${rank===1?' first':''}`} style={rank===1?{color:accentColor}:{}}>{player.username || player.display_name || 'Hidden'}</div>
      <div className="pod-stat">
        <div className="pod-stat-lbl">Wagered</div>
        <div className="pod-stat-val" style={{color:accentColor}}>{fmtWager(player)}</div>
      </div>
      <div className="pod-stat">
        <div className="pod-stat-lbl">Prize</div>
        <div className="pod-stat-val prize" style={{color:accentColor}}>{fmtPrize(player, rank)}</div>
      </div>
    </div>
  );
}

  const top3 = players.slice(0, 3);

  return (
    <div className="f2">
      <div style={{textAlign:'center',marginBottom:24}}>
        <div className="lb-prize-amt" style={{color:'var(--green)'}}>$1,500</div>
        <div className="lb-prize-lbl">Bi-Weekly Prize</div>

      </div>
      <div className="lb-meta">
        <div className="live-badge"><span className="live-dot"/>&nbsp;LIVE</div>

      {top3.length > 0 && (

          })}

      <div className="announce-bar green">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="16" height="16"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>

      {rest.length > 0 && (

          </tr></thead>
          <tbody>
            {rest.map((p, i) => (
              <tr key={p.id || i}>

                <td><span className="tr-prize" style={{color:'var(--green)'}}>{fmtPrize(p, p.position || i+4)}</span></td>
              </tr>

      <div className="lb-cta-row">

  const prize = Number(data.total_prize_usd || 1000);

  const top3 = entries.slice(0, 3);

  const podiumOrder = top3.length >= 3 ? [top3[1], top3[0], top3[2]] : top3;

          })}

      )}

      <div className="announce-bar blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="16" height="16"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Get a 5% bonus on your first deposit

      {rest.length > 0 && (
        <table className="lb-table">
          <thead><tr>
            <th>Place</th><th></th><th>Player</th><th>Wagered</th><th>Prize</th>
          </tr></thead>
          <tbody>
            {rest.map((p, i) => (
              <tr key={i}>
                <td><span className="tr-rank">#{p.rank || i + 4}</span></td>
                <td><Avatar src={p.image_url} className="tr-av"/></td>
                <td><span className="tr-name">{p.username || 'Hidden'}</span></td>
                <td><span className="tr-wager">{fmtWager(p)}</span></td>
                <td><span className="tr-prize" style={{color:'var(--packy)'}}>{fmtPrize(p, p.rank || i+4)}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      <div className="lb-cta-row">
        <a href="https://packy.gg?ref=NIKSI" target="_blank" rel="noreferrer" className="lb-cta-btn lb-cta-packy">
          Play on Packy.gg
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{width:11,height:11}}><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>

      <div className="prize-section">
        <div className="prize-title">// Prize Structure</div>
        <div className="prize-tiers">
          {(data.prize_tiers || []).map((t, i) => (
            <div key={t.position} className="prize-tier">
