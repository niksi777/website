<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Niksi $500 GAMBA leaderboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body class="bg-[#0f172a] text-white">
<div id="root"></div>

<script type="text/babel">

function App() {
  const [players, setPlayers] = React.useState([]);

  const fetchPlayers = async () => {
    const res = await fetch("/players");
    const data = await res.json();
    setPlayers(data);
  };

  React.useEffect(() => {
    fetchPlayers();
    const interval = setInterval(fetchPlayers, 10000);
    return () => clearInterval(interval);
  }, []);

  return (
    <div className="min-h-screen">

      {/* HERO SECTION */}
      <div className="text-center py-20 px-6 bg-gradient-to-b from-[#111827] to-[#0f172a]">

        <h1 className="text-5xl font-bold tracking-tight">
          Welcome to NIKSI777!
        </h1>

        <div className="mt-8">
  <img 
    src="/assets/gamba2.png"
    className="h-12 mx-auto object-contain opacity-90"
  />
</div>
        

      </div>
      <p className="mt6 text-gray-400 max-w-2x1 mx-auto text-1g">
        
      </p>

{/* GAMBA SECTION */}
<div className="max-w-5xl mx-auto px-6 pb-24">

  {/* SIGN UP BUTTON */}
  <div className="flex justify-center mb-12">
    <a
      href="https://gamba.com?c=niksi"
      target="_blank"
      rel="noopener noreferrer"
      className="bg-white text-black px-10 py-4 rounded-2xl font-semibold tracking-wide hover:scale-105 transition-all duration-200 shadow-xl"
    >
      Sign Up Here
    </a>
  </div>

  {/* Leaderboard Card */}
  <div className="bg-[#111827] border border-white/10 rounded-3xl p-10 shadow-2xl relative">

  {/* Small Top-Right Button */}
  <div className="absolute top-8 right-10">
    <a
      href="https://gamba.com/promotions/exclusive-leaderboards/8682"
      target="_blank"
      rel="noopener noreferrer"
      className="bg-white text-black px-4 py-2 rounded-xl text-sm font-medium hover:scale-105 transition-all duration-200 shadow"
    >
      View on Gamba
    </a>
  </div>

  {/* Centered Prize Section */}
  <div className="mb-12 text-center">
    <h2 className="text-2xl font-semibold tracking-wide">
      Total Prizepool{" "}
      <span className="text-green-400 drop-shadow-[0_0_12px_rgba(34,197,94,0.9)]">
        $500
      </span>
    </h2>

    <p className="text-gray-500 text-sm mt-2">
      All wager counts for this leaderboard
    </p>
  </div>


    {/* Leaderboard Table */}
    <div className="space-y-4">

      {/* Header Row */}
      <div className="grid grid-cols-3 text-gray-400 text-sm uppercase tracking-wider border-b border-white/10 pb-3">
        <div>Name</div>
        <div className="text-center">Reward</div>
        <div className="text-right">Wager</div>
      </div>

      {players.slice(0, 15).map((p, i) => (
        <div
          key={p.id}
          className="grid grid-cols-3 items-center bg-white/5 hover:bg-white/10 transition rounded-xl px-5 py-4 border border-white/5"
        >
          <div className="flex items-center gap-3 font-medium">
            <span className="text-gray-400 w-6">
              {i + 1}.
            </span>
            {p.username}
          </div>

          <div className="text-center font-semibold">
            {new Intl.NumberFormat("en-US", {
              style: "currency",
              currency: "USD",
              minimumFractionDigits: 2
            }).format(p.reward)}
          </div>

          <div className="text-right font-semibold">
            {new Intl.NumberFormat("en-US", {
              style: "currency",
              currency: "USD",
              minimumFractionDigits: 2
            }).format(p.wager)}
          </div>
        </div>
      ))}

    </div>

  </div>

</div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
